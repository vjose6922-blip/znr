<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Z&R · Reportes de usuarios</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#1f2330;--mut:#6b7280;--bd:#dde0e8;--ac:#7c3aed}
@media(prefers-color-scheme:dark){:root{--bg:#12141c;--card:#1a1d27;--tx:#e8eaf0;--mut:#9aa0ae;--bd:#2c3040}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:14px;max-width:820px;margin-inline:auto}
h1{font-size:1.25rem;margin:4px 0 12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar select,.bar button,input,textarea,select.f{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 11px;font-size:.9rem;font-family:inherit}
button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700;cursor:pointer}
button.s{cursor:pointer}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.card h3{margin:0 0 4px;font-size:.95rem}
.card p{margin:0;font-size:.85rem;color:var(--mut);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta{font-size:.75rem;color:var(--mut);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.7rem;font-weight:700;background:rgba(124,58,237,.12);color:var(--ac)}
.tag.nuevo{background:rgba(220,38,38,.12);color:#dc2626}.tag.resuelto{background:rgba(22,163,74,.14);color:#16a34a}.tag.descartado{background:rgba(107,114,128,.2);color:var(--mut)}
#detail{display:none}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.sec h4{margin:0 0 6px;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.sec div,.sec pre{font-size:.9rem;white-space:pre-wrap;word-break:break-word;margin:0;font-family:inherit}
.sec pre{font-family:ui-monospace,monospace;font-size:.76rem}
img.cap{max-width:100%;border-radius:10px;border:1px solid var(--bd)}
textarea{width:100%;min-height:70px}
#login{max-width:360px;margin:60px auto;text-align:center}
#login input{width:100%;margin:10px 0}
.err{color:#dc2626;font-size:.85rem;min-height:18px}
</style>
</head>
<body>

<div id="login" style="display:none">
  <h1>Reportes de usuarios</h1>
  <input type="password" id="tok" placeholder="Token de administrador">
  <button class="p" id="tok-ok" style="width:100%">Entrar</button>
  <p class="err" id="login-err"></p>
</div>

<div id="app" style="display:none">
  <div id="list-view">
    <h1>Reportes de usuarios</h1>
    <div class="bar">
      <select id="filtro">
        <option value="">Todos los estados</option>
        <option value="nuevo">Nuevos</option>
        <option value="en_revision">En revisión</option>
        <option value="resuelto">Resueltos</option>
        <option value="descartado">Descartados</option>
      </select>
      <button class="s" id="refrescar">Actualizar</button>
    </div>
    <div id="items"></div>
  </div>

  <div id="detail">
    <button class="s" id="volver" style="margin-bottom:10px">← Volver</button>
    <div id="detail-body"></div>
  </div>
</div>

<script>
const API = 'https://ventas-api-1038143238323.us-central1.run.app';
const TIPOS = { error: 'Error', inesperado: 'No funciona como esperaba', sugerencia: 'Sugerencia', otro: 'Otro' };
const ESTADOS = { nuevo: 'Nuevo', en_revision: 'En revisión', resuelto: 'Resuelto', descartado: 'Descartado' };
let TOKEN = sessionStorage.getItem('admin_token') || '';
let ITEMS = [];
let CUR = null;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fecha = iso => iso ? new Date(iso).toLocaleString('es-MX', { dateStyle: 'short', timeStyle: 'short' }) : '';

async function get(params) {
  const r = await fetch(API + '?' + new URLSearchParams({ token: TOKEN, ...params }));
  return r.json();
}
async function post(params) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams({ token: TOKEN, ...params }).toString() });
  return r.json();
}

async function cargarLista() {
  $('items').innerHTML = '<p>Cargando…</p>';
  const j = await get({ action: 'listarFeedback', estado: $('filtro').value });
  if (!j.ok) {
    sessionStorage.removeItem('admin_token');
    $('app').style.display = 'none'; $('login').style.display = 'block';
    $('login-err').textContent = j.error || 'No autorizado';
    return false;
  }
  $('login').style.display = 'none'; $('app').style.display = 'block';
  ITEMS = j.items;
  $('items').innerHTML = ITEMS.length ? ITEMS.map(i => `
    <div class="card" data-id="${esc(i.id)}">
      <h3><span class="tag ${esc(i.estado)}">${esc(ESTADOS[i.estado] || i.estado)}</span> ${esc(TIPOS[i.tipo] || i.tipo)}${i.tieneCaptura ? ' 📎' : ''}</h3>
      <p>${esc(i.mensaje)}</p>
      <div class="meta"><span>${i.rol === 'vendedor' ? 'Vendedor' : 'Comprador'}: ${esc(i.reporter.nombre || (i.reporter.telefono ? '+' + i.reporter.telefono : 'Anónimo'))}</span><span>${esc(i.pagina)}</span><span>${fecha(i.fecha)}</span></div>
    </div>`).join('') : '<p>No hay reportes.</p>';
  return true;
}

function textoReporte(i) {
  return [
    `REPORTE ${i.id} — ${TIPOS[i.tipo] || i.tipo}`,
    `Fecha: ${fecha(i.fecha)} | Reporta: ${i.rol} ${i.reporter.nombre || ''} ${i.reporter.telefono ? '+' + i.reporter.telefono : ''}${i.reporter.verificado ? ' (verificado)' : ''}`,
    `Página: ${i.pagina} | Área: ${i.area || '-'}`,
    '', 'QUÉ PASÓ:', i.mensaje,
    i.pasos ? '\nPASOS PARA REPETIRLO:\n' + i.pasos : '',
    i.esperado ? '\nQUÉ ESPERABA:\n' + i.esperado : '',
    '', 'INFO TÉCNICA:', JSON.stringify(i.tecnico || {}, null, 2)
  ].filter(x => x !== '').join('\n');
}

async function abrir(id) {
  const j = await get({ action: 'obtenerFeedback', id });
  if (!j.ok) return alert(j.error || 'No se pudo abrir');
  CUR = j.item;
  const i = CUR;
  $('list-view').style.display = 'none'; $('detail').style.display = 'block';
  $('detail-body').innerHTML = `
    <h1>${esc(TIPOS[i.tipo] || i.tipo)} <span class="tag ${esc(i.estado)}">${esc(ESTADOS[i.estado] || i.estado)}</span></h1>
    <div class="sec"><h4>Quién reporta</h4><div>${i.rol === 'vendedor' ? 'Vendedor' : 'Comprador'} · ${esc(i.reporter.nombre || 'Sin nombre')} ${i.reporter.telefono ? '· +' + esc(i.reporter.telefono) : ''} ${i.reporter.verificado ? '(verificado)' : '(teléfono sin verificar)'}<br>${fecha(i.fecha)} · página: ${esc(i.pagina)} · área: ${esc(i.area || '-')}</div></div>
    <div class="sec"><h4>Qué pasó</h4><div>${esc(i.mensaje)}</div></div>
    ${i.pasos ? `<div class="sec"><h4>Pasos para repetirlo</h4><div>${esc(i.pasos)}</div></div>` : ''}
    ${i.esperado ? `<div class="sec"><h4>Qué esperaba</h4><div>${esc(i.esperado)}</div></div>` : ''}
    ${i.captura ? `<div class="sec"><h4>Captura</h4><img class="cap" src="${esc(i.captura)}" alt="Captura del usuario"></div>` : ''}
    <div class="sec"><h4>Información técnica</h4><pre>${esc(JSON.stringify(i.tecnico || {}, null, 2))}</pre></div>
    <div class="sec"><h4>Gestión</h4>
      <select class="f" id="d-estado">${Object.keys(ESTADOS).map(k => `<option value="${k}" ${k === i.estado ? 'selected' : ''}>${ESTADOS[k]}</option>`).join('')}</select>
      <textarea id="d-nota" placeholder="Nota interna (qué encontraste, qué se corrigió…)" style="margin-top:8px">${esc(i.notaAdmin)}</textarea>
      <div style="display:flex;gap:8px;margin-top:8px"><button class="p" id="d-guardar">Guardar</button><button class="s" id="d-copiar">Copiar reporte</button></div>
      <p class="err" id="d-msg"></p>
    </div>`;
  $('d-guardar').onclick = async () => {
    const r = await post({ action: 'actualizarFeedback', id: i.id, estado: $('d-estado').value, notaAdmin: $('d-nota').value });
    $('d-msg').style.color = r.ok ? '#16a34a' : '#dc2626';
    $('d-msg').textContent = r.ok ? 'Guardado' : (r.error || 'No se pudo guardar');
  };
  $('d-copiar').onclick = async () => {
    try { await navigator.clipboard.writeText(textoReporte(i)); $('d-msg').style.color = '#16a34a'; $('d-msg').textContent = 'Copiado: pégalo donde quieras analizar el error'; }
    catch (_) { $('d-msg').style.color = '#dc2626'; $('d-msg').textContent = 'No se pudo copiar'; }
  };
}

$('items').addEventListener('click', e => { const c = e.target.closest('.card'); if (c) abrir(c.dataset.id); });
$('volver').onclick = () => { $('detail').style.display = 'none'; $('list-view').style.display = 'block'; cargarLista(); };
$('filtro').onchange = cargarLista;
$('refrescar').onclick = cargarLista;
$('tok-ok').onclick = async () => {
  TOKEN = $('tok').value.trim();
  if (!TOKEN) return;
  if (await cargarLista()) { sessionStorage.setItem('admin_token', TOKEN); const id = new URLSearchParams(location.search).get('id'); if (id) abrir(id); }
};

(async function init() {
  if (TOKEN && await cargarLista()) {
    const id = new URLSearchParams(location.search).get('id');
    if (id) abrir(id);
  } else {
    $('login').style.display = 'block';
  }
})();
</script>
</body>
</html>
