<style>
  body { margin: 0; }
  .track-wrap { max-width: 640px; margin: 0 auto; padding: 16px; padding-bottom: 40px; }

  .track-header { text-align: center; margin-bottom: 14px; }
  .track-header h1 { font-size: 17px; margin: 0 0 4px; color: var(--color-text-primary); }
  .track-header p { font-size: 13px; color: var(--color-text-soft); margin: 0; }

  .estado-banner {
    text-align: center; padding: 10px; border-radius: var(--radius-md);
    font-size: 13px; font-weight: 700; margin-bottom: 14px;
  }
  .estado-banner.entregado { background: rgba(74,222,128,.15); color: #4ade80; }
  .estado-banner.en-camino { background: rgba(59,130,246,.15); color: #60a5fa; }
  .estado-banner.esperando { background: rgba(251,191,36,.15); color: #fbbf24; }
  .estado-banner.preparando { background: rgba(251,146,60,.15); color: #fb923c; }
  .estado-banner.cerca { background: rgba(192,132,252,.15); color: #c084fc; }

  .eta-note {
    text-align: center; font-size: 13px; color: var(--color-text-soft);
    margin: -6px 0 14px;
  }

  #map {
    width: 100%; aspect-ratio: 4/5; max-height: 70vh; border-radius: var(--radius-lg);
    border: 1px solid var(--color-border-subtle); background: var(--color-surface-2);
  }

  .track-note {
    font-size: 12px; color: var(--color-text-soft); text-align: center;
    margin-top: 12px; line-height: 1.5;
  }

  .track-error {
    text-align: center; padding: 40px 20px; color: var(--color-text-soft);
  }

  /* ── Pagar mi pedido ── */
  #pago-zone:empty { display: none; }
  #pago-zone { margin-bottom: 14px; }
  .btn-pagar, .pago-btn {
    width: 100%; border: none; border-radius: var(--radius-pill, 999px);
    padding: 13px; font-size: 14px; font-weight: 700; cursor: pointer;
    background: var(--gradient-accent, #7c3aed); color: #fff; font-family: inherit;
  }
  .btn-pagar:disabled, .pago-btn:disabled { opacity: .6; cursor: default; }
  .pago-btn.sec {
    background: var(--color-surface-2); color: var(--color-text-primary);
    border: 1px solid var(--color-border-subtle);
  }
  .pago-panel {
    background: var(--color-surface-2); border: 1px solid var(--color-border-subtle);
    border-radius: var(--radius-lg); padding: 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .pago-titulo { font-size: 15px; font-weight: 700; color: var(--color-text-primary); }
  .pago-total { font-size: 18px; font-weight: 800; color: var(--color-text-primary); }
  .pago-resumen { font-size: 12.5px; color: var(--color-text-soft); margin-top: -6px; }
  .pago-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--color-text-soft); }
  .pago-clabe {
    font-family: 'Courier New', monospace; font-size: 17px; font-weight: 700; letter-spacing: .05em;
    word-break: break-all; color: var(--color-text-primary);
  }
  a.pago-btn { display: block; text-align: center; text-decoration: none; box-sizing: border-box; }
  .pago-nota { font-size: 11.5px; color: var(--color-text-soft); text-align: center; margin: 0; }

  .pago-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 300;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .pago-modal {
    background: var(--color-surface); border-radius: var(--radius-lg); padding: 20px;
    width: 100%; max-width: 380px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px;
  }
  .pago-modal h2 { margin: 0; font-size: 16px; color: var(--color-text-primary); }
  .pago-modal p { margin: 0; font-size: 13px; color: var(--color-text-soft); }
  .pago-modal input {
    width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: var(--radius-md);
    border: 1px solid var(--color-border-subtle); background: var(--color-surface-2);
    color: var(--color-text-primary); font-size: 14px; font-family: inherit;
  }
  .pago-err { color: #f87171; font-size: 12.5px; min-height: 1.1em; }
  .pago-link { color: var(--color-accent-solid, #a78bfa); font-size: 12.5px; cursor: pointer; text-align: center; }

<body>

<div class="track-wrap">
  <div class="track-header">
    <h1 id="th-titulo">Seguimiento de tu pedido</h1>
    <p id="th-sub"></p>
  </div>
  <div id="banner"></div>
  <p class="eta-note" id="eta-note"></p>
  <div id="pago-zone"></div>
  <div id="map"></div>
  <p class="track-note">El mapa se actualiza solo cada pocos segundos mientras tengas esta página abierta — no hace falta que la recargues.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API_BASE = "https://live-api-1038143238323.us-central1.run.app"; // TODO: pegar la URL real tras el deploy
const VENDEDORES_API = "https://vendedores-api-1038143238323.us-central1.run.app";
const VENTAS_API = "https://ventas-api-1038143238323.us-central1.run.app";

const params = new URLSearchParams(location.search);
const liveId = params.get('live');
const compradorKey = params.get('key');

const wrap = document.querySelector('.track-wrap');
const bannerEl = document.getElementById('banner');
const etaEl = document.getElementById('eta-note');
const tituloEl = document.getElementById('th-titulo');
const subEl = document.getElementById('th-sub');

const VELOCIDAD_PROMEDIO_KMH = 30; // estimado, no hay tráfico real sin Directions API (de pago)

let map = null;
let destinoMarker = null;
let repartidorMarker = null;
let pollTimer = null;
let followMode = true; // true = el mapa sigue al repartidor solo; se apaga si arrastras el mapa a mano

async function apiFetch(action, extra) {
  const p = new URLSearchParams({ action, liveId, compradorKey, ...extra });
  const res = await fetch(`${API_BASE}?${p.toString()}`);
  return res.json();
}

function renderError(msg) {
  if (pollTimer) clearInterval(pollTimer);
  wrap.innerHTML = `<div class="track-error">${msg}</div>`;
}

function initMap(lat, lng) {
  map = L.map('map', { zoomControl: true }).setView([lat, lng], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap',
    maxZoom: 19
  }).addTo(map);
  // Si el comprador arrastra el mapa a mano, soltamos el seguimiento
  // automático hasta que vuelva a pulsar el botón "◎".
  map.on('dragstart', () => { followMode = false; });
}

function actualizarMapa(entrega) {
  const puntos = [];

  if (typeof entrega.lat === 'number' && typeof entrega.lng === 'number') {
    if (!map) initMap(entrega.lat, entrega.lng);
    if (!destinoMarker) {
      destinoMarker = L.marker([entrega.lat, entrega.lng], {
        title: 'Tu dirección'
      }).addTo(map).bindPopup('Tu dirección');
    }
    puntos.push([entrega.lat, entrega.lng]);
  }

  if (typeof entrega.repartidorLat === 'number' && typeof entrega.repartidorLng === 'number') {
    if (!map) initMap(entrega.repartidorLat, entrega.repartidorLng);
    const pos = [entrega.repartidorLat, entrega.repartidorLng];
    if (!repartidorMarker) {
      const icon = L.divIcon({
        className: '', html: '<div style="width:16px;height:16px;border-radius:50%;background:#c084fc;border:3px solid #fff;box-shadow:0 0 0 2px #c084fc;"></div>',
        iconSize: [16, 16], iconAnchor: [8, 8]
      });
      repartidorMarker = L.marker(pos, { icon, title: 'Repartidor' }).addTo(map).bindPopup('Repartidor');
    } else {
      repartidorMarker.setLatLng(pos);
      // Modo "seguir": se recentra en el repartidor sin tocar tu zoom,
      // pero solo mientras followMode siga activo.
      if (followMode && map._znrFitInicial) map.panTo(pos, { animate: true, duration: 0.5 });
    }
    puntos.push(pos);
  }

  // Solo ajustamos el zoom/encuadre automáticamente la PRIMERA vez que
  // tenemos ambos puntos. Después, cada poll solo mueve los marcadores
  // (arriba) sin tocar la vista, para respetar el zoom manual del usuario.
  if (map && puntos.length === 2 && !map._znrFitInicial) {
    map._znrFitInicial = true;
    map.fitBounds(puntos, { padding: [40, 40] });
    mostrarBotonRecentrar();
  } else if (map && !map._znrCentradoInicial && puntos.length === 1) {
    map._znrCentradoInicial = true;
  }
}

let btnRecentrar = null;
function mostrarBotonRecentrar() {
  if (btnRecentrar || !map) return;
  const Control = L.Control.extend({
    onAdd: function() {
      const btn = L.DomUtil.create('button', '');
      btn.innerHTML = '◎';
      btn.title = 'Centrar y reactivar seguimiento';
      Object.assign(btn.style, {
        width: '38px', height: '38px', fontSize: '18px',
        background: 'var(--color-surface-2, #1e2128)',
        color: 'var(--color-text-primary, #fff)',
        border: '1px solid var(--color-border-subtle, #333)',
        borderRadius: '8px', cursor: 'pointer'
      });
      L.DomEvent.disableClickPropagation(btn);
      btn.onclick = () => {
        followMode = true;
        const puntos = [];
        if (destinoMarker) puntos.push(destinoMarker.getLatLng());
        if (repartidorMarker) puntos.push(repartidorMarker.getLatLng());
        if (puntos.length) map.fitBounds(puntos, { padding: [40, 40] });
      };
      return btn;
    },
    onRemove: function() {}
  });
  btnRecentrar = new Control({ position: 'topright' });
  btnRecentrar.addTo(map);
}

// Distancia en línea recta (haversine) — la misma fórmula que usa el
// backend para decidir "cerca". El ETA es un estimado con velocidad
// promedio fija, no tráfico real (eso necesitaría la API de Directions
// de Google, que es de pago).
function distanciaMetros(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function actualizarETA(entrega) {
  const tieneAmbos = typeof entrega.lat === 'number' && typeof entrega.lng === 'number'
    && typeof entrega.repartidorLat === 'number' && typeof entrega.repartidorLng === 'number';
  const enCamino = entrega.estado === 'en-ruta' || entrega.estado === 'cerca';

  if (!enCamino || !tieneAmbos) { etaEl.textContent = ''; return; }

  const metros = distanciaMetros(entrega.repartidorLat, entrega.repartidorLng, entrega.lat, entrega.lng);
  const minutos = Math.max(1, Math.round((metros / 1000) / VELOCIDAD_PROMEDIO_KMH * 60));
  etaEl.textContent = entrega.estado === 'cerca'
    ? '📍 Está a solo unos metros de tu ubicación'
    : `⏱️ Llega en aproximadamente ${minutos} minuto${minutos === 1 ? '' : 's'} (estimado)`;
}

const ESTADO_BANNER = {
  pendiente: ['esperando', '⏳ Esperando confirmación del vendedor'],
  preparando: ['preparando', '📦 El vendedor está preparando tu pedido'],
  'en-ruta': ['en-camino', '🛵 El repartidor va en camino'],
  cerca: ['cerca', '📍 El repartidor está cerca de tu ubicación'],
  entregado: ['entregado', '✅ ¡Tu pedido ya fue entregado! 🎉'],
};

function actualizarBanner(entrega) {
  let [clase, texto] = ESTADO_BANNER[entrega.estado] || ESTADO_BANNER.pendiente;
  // El estado de entrega sigue en "pendiente" aunque el vendedor ya confirmó
  // el stock — ese aviso ya no debe decir "esperando confirmación".
  if ((entrega.estado || 'pendiente') === 'pendiente' && entrega.pedidoConfirmado) {
    clase = 'preparando';
    texto = '✅ El vendedor confirmó tu pedido — pronto saldrá a entregarse';
  }

  if (entrega.estado === 'en-ruta' && typeof entrega.repartidorLat === 'number') {
    bannerEl.innerHTML = `<div class="estado-banner en-camino">🛵 El repartidor está en camino – puedes ver su ubicación en el mapa</div>`;
  } else {
    bannerEl.innerHTML = `<div class="estado-banner ${clase}">${texto}</div>`;
  }

  if (entrega.estado === 'entregado' && pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

// ── Pagar mi pedido ──────────────────────────────────────────────────
// El botón solo aparece cuando el vendedor ya confirmó el stock, tiene al
// menos una forma de pago y el pedido no está entregado (lo decide el
// backend con un booleano). Los datos reales de pago (CLABE, link, tarjeta)
// SOLO se piden con la sesión del comprador (teléfono + contraseña): tener
// el link de seguimiento no basta para verlos.
const pagoZone = document.getElementById('pago-zone');
let pagoUI = null;          // null | 'boton' | 'panel'
let pagoDescartado = false; // el backend dijo que ya no hay nada que pagar

async function postForm(base, data) {
  const res = await fetch(base, {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams(data).toString()
  });
  return res.json();
}

function pedirMetodosPago() {
  return postForm(API_BASE, {
    action: 'obtenerMetodosPagoEntrega', liveId, compradorKey,
    compradorToken: localStorage.getItem('comprador_token') || ''
  });
}

function limpiarPago() { pagoZone.innerHTML = ''; pagoUI = null; }

function actualizarPago(entrega) {
  const debeMostrar = !pagoDescartado && entrega.pagoDisponible === true && entrega.estado !== 'entregado';
  if (!debeMostrar) { limpiarPago(); return; }
  if (pagoUI) return; // ya está el botón (o el panel abierto): el poll no lo repinta
  pintarBotonPagar();
}

function pintarBotonPagar() {
  pagoZone.innerHTML = '';
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'btn-pagar';
  btn.textContent = '💳 Pagar mi pedido';
  btn.addEventListener('click', () => abrirPago(btn));
  pagoZone.appendChild(btn);
  pagoUI = 'boton';
}

async function abrirPago(btn) {
  const textoOriginal = btn.textContent;
  btn.disabled = true; btn.textContent = 'Cargando…';
  try {
    let r = await pedirMetodosPago();
    if (r.requiereLogin) {
      btn.disabled = false; btn.textContent = textoOriginal;
      if (!(await pedirLoginComprador())) return;
      btn.disabled = true; btn.textContent = 'Cargando…';
      r = await pedirMetodosPago();
    }
    if (!r.ok) { alert(r.error || 'No se pudieron cargar las formas de pago.'); btn.disabled = false; btn.textContent = textoOriginal; return; }
    if (!r.mostrar) { pagoDescartado = true; limpiarPago(); return; } // nada que pagar: se oculta todo
    pintarPanelPago(r);
  } catch (err) {
    console.error('abrirPago falló:', err);
    alert('No se pudieron cargar las formas de pago. Intenta de nuevo.');
    btn.disabled = false; btn.textContent = textoOriginal;
  }
}

function elPago(tag, cls, texto) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (texto != null) el.textContent = texto;
  return el;
}

function pintarPanelPago(r) {
  pagoZone.innerHTML = '';
  const panel = elPago('div', 'pago-panel');
  panel.appendChild(elPago('div', 'pago-titulo', r.vendedorNombre ? `Pagar a ${r.vendedorNombre}` : 'Pagar mi pedido'));
  panel.appendChild(elPago('div', 'pago-total', `Total: $${Number(r.total || 0).toLocaleString()} MXN`));
  if (r.resumen) panel.appendChild(elPago('div', 'pago-resumen', r.resumen));

  const m = r.metodos || {};
  if (m.clabe) {
    panel.appendChild(elPago('div', 'pago-label', 'Transferencia (CLABE)'));
    panel.appendChild(elPago('div', 'pago-clabe', m.clabe));
    const copiar = elPago('button', 'pago-btn sec', 'Copiar CLABE');
    copiar.type = 'button';
    copiar.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(m.clabe); copiar.textContent = '¡Copiada!'; }
      catch (_) { copiar.textContent = 'Copia la CLABE de arriba'; }
      setTimeout(() => { copiar.textContent = 'Copiar CLABE'; }, 1800);
    });
    panel.appendChild(copiar);
  }
  if (m.linkPago && /^https?:\/\//i.test(m.linkPago)) {
    const a = elPago('a', 'pago-btn sec', 'Ir al link de pago del vendedor');
    a.href = m.linkPago; a.target = '_blank'; a.rel = 'noopener noreferrer';
    panel.appendChild(a);
  }
  if (m.tarjeta) {
    const t = elPago('button', 'pago-btn', '💳 Pagar con tarjeta');
    t.type = 'button';
    t.addEventListener('click', async () => {
      t.disabled = true; t.textContent = 'Generando link de pago…';
      try {
        const res = await postForm(VENTAS_API, { action: 'crearPreferenciaComunidad', requestId: r.requestId, vendedor_uid: r.vendedorUid });
        if (res.ok && res.url) { window.location.href = res.url; return; }
        alert(res.error || 'No se pudo generar el link de pago');
      } catch (_) { alert('No se pudo generar el link de pago'); }
      t.disabled = false; t.textContent = '💳 Pagar con tarjeta';
    });
    panel.appendChild(t);
  }
  panel.appendChild(elPago('p', 'pago-nota', 'Estos datos solo los ves tú, con tu sesión.'));
  const cerrar = elPago('button', 'pago-btn sec', 'Cerrar');
  cerrar.type = 'button';
  cerrar.addEventListener('click', () => { limpiarPago(); pintarBotonPagar(); });
  panel.appendChild(cerrar);
  pagoZone.appendChild(panel);
  pagoUI = 'panel';
}

// Login mínimo (teléfono del pedido + contraseña de comprador). Devuelve
// true si quedó una sesión válida guardada en localStorage.
function pedirLoginComprador() {
  return new Promise((resolve) => {
    const tel = /^\d{10}$/.test(compradorKey)
      ? compradorKey
      : String(localStorage.getItem('client_phone') || '').replace(/\D/g, '');
    const overlay = elPago('div', 'pago-overlay');
    const modal = elPago('div', 'pago-modal');
    modal.appendChild(elPago('h2', null, 'Inicia sesión para pagar'));
    modal.appendChild(elPago('p', null, 'Por seguridad, las formas de pago solo se muestran con tu contraseña de comprador.'));
    const inTel = elPago('input'); inTel.type = 'tel'; inTel.inputMode = 'numeric'; inTel.maxLength = 10;
    inTel.placeholder = 'Tu teléfono (10 dígitos)'; inTel.value = tel; inTel.autocomplete = 'tel';
    const inPw = elPago('input'); inPw.type = 'password'; inPw.placeholder = 'Tu contraseña'; inPw.autocomplete = 'current-password';
    const err = elPago('div', 'pago-err');
    const ok = elPago('button', 'pago-btn', 'Continuar'); ok.type = 'button';
    const olv = elPago('div', 'pago-link', '¿Olvidaste tu contraseña?');
    const cancel = elPago('button', 'pago-btn sec', 'Cancelar'); cancel.type = 'button';
    [inTel, inPw, err, ok, olv, cancel].forEach(n => modal.appendChild(n));
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
    setTimeout(() => (inTel.value ? inPw : inTel).focus(), 50);

    const cerrar = (v) => { overlay.remove(); resolve(v); };
    cancel.addEventListener('click', () => cerrar(false));
    inPw.addEventListener('keydown', (e) => { if (e.key === 'Enter') ok.click(); });
    olv.addEventListener('click', async () => {
      const t = inTel.value.replace(/\D/g, '');
      if (t.length !== 10) { err.style.color = '#f87171'; err.textContent = 'Escribe primero tu número de 10 dígitos.'; return; }
      await postForm(VENDEDORES_API, { action: 'solicitarResetComprador', telefono: t }).catch(() => {});
      err.style.color = '#4ade80';
      err.textContent = 'Listo. El administrador te contactará por WhatsApp con un código nuevo.';
    });
    ok.addEventListener('click', async () => {
      const t = inTel.value.replace(/\D/g, '');
      err.style.color = '#f87171';
      if (t.length !== 10) { err.textContent = 'Número inválido. Debe tener 10 dígitos.'; return; }
      if (!inPw.value) { err.textContent = 'Escribe tu contraseña.'; return; }
      ok.disabled = true; err.textContent = '';
      const r = await postForm(VENDEDORES_API, { action: 'loginComprador', telefono: t, password: inPw.value })
        .catch(() => ({ error: 'Sin conexión. Intenta de nuevo.' }));
      ok.disabled = false;
      if (r.ok && r.token) {
        localStorage.setItem('client_phone', t);
        localStorage.setItem('comprador_token', r.token);
        cerrar(true);
        return;
      }
      err.textContent = r.error || 'No se pudo iniciar sesión.';
    });
  });
}

async function cargar() {
  try {
    const resp = await apiFetch('obtenerEntregaPorClave');
    if (!resp.ok) { renderError('No se encontró esta entrega. Puede que el link haya caducado.'); return; }
    const e = resp.entrega;
    tituloEl.textContent = 'Seguimiento de tu pedido';
    subEl.textContent = e.vendedorNombre ? `De ${e.vendedorNombre}` : '';
    actualizarBanner(e);
    actualizarPago(e);
    actualizarETA(e);
    actualizarMapa(e);
  } catch (err) {
    console.error('Error cargando seguimiento:', err);
  }
}

if (!liveId || !compradorKey) {
  renderError('Este link no es válido.');
} else {
  cargar();
  pollTimer = setInterval(cargar, 5000);
}
</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js', { scope: '/' });</script>
</body>
</html>
