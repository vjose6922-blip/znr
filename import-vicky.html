const API_URL = "https://catalogo-api-1038143238323.us-central1.run.app";

document.getElementById('btn').addEventListener('click', async () => {
  const token = document.getElementById('token').value.trim();
  const btn = document.getElementById('btn');
  const log = document.getElementById('log');
  if (!token) { alert('Pega tu token de admin primero.'); return; }
  btn.disabled = true;
  btn.textContent = 'Importando...';
  log.textContent = 'Enviando ' + PRODUCTOS.length + ' productos...';
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ action: 'importarProductosComunidad', token, productos: JSON.stringify(PRODUCTOS) }).toString()
    });
    const data = await res.json();
    if (data.ok) {
      log.innerHTML = '<span class="ok">Listo: ' + data.importados + ' productos importados a Firestore.</span>' +
        (data.fallidosAlgolia && data.fallidosAlgolia.length
          ? '\n\nOJO: estos IDs se guardaron en Firestore pero fallaron al sincronizar con Algolia (puedes correr "Resincronizar Comunidad con Algolia" desde el admin después para arreglarlo):\n' + data.fallidosAlgolia.join(', ')
          : '\nTodos se sincronizaron con Algolia sin problema.');
    } else {
      log.innerHTML = '<span class="err">Error: ' + (data.error || 'desconocido') + '</span>';
    }
  } catch (err) {
    log.innerHTML = '<span class="err">Error de red: ' + err.message + '</span>';
  }
  btn.disabled = false;
  btn.textContent = 'Importar 129 productos';
});
</script>
