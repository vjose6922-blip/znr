# Una sola vez: descarga los fondos del clima de Google Drive a img/clima/<nombre>.webp y los sube a esta rama.
name: Fondos del clima
on:
  push:
    branches: [claude/busy-turing-3kwzsb]
    paths: [.github/workflows/fondos-clima.yml]
permissions:
  contents: write
jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y -qq webp
      - name: Descargar y convertir
        run: |
          mkdir -p img/clima
          while read -r nombre id; do
            curl -fsSL "https://lh3.googleusercontent.com/d/${id}=w800" -o /tmp/f
            cwebp -quiet -q 78 /tmp/f -o "img/clima/${nombre}.webp"
