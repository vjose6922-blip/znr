<script>
  // Alto real de la pantalla visible (evita el bug de 100vh/100dvh en
  // navegadores Android que no lo calculan bien con la barra de
  // direcciones/gestos presente). Se usa como var(--app-vh) en el CSS
  // de body.live-active.
  (function () {
    function setAppVh() {
      const h = (window.visualViewport && window.visualViewport.height)
        ? window.visualViewport.height
        : window.innerHeight;
      document.documentElement.style.setProperty('--app-vh', h + 'px');
    }
    setAppVh();
    window.addEventListener('resize', setAppVh);
    window.addEventListener('orientationchange', setAppVh);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', setAppVh);
    }
  })();
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getDatabase, ref, push, onValue, query, limitToLast, update, get } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";
import {
  initializeAuth,
  getAuth,
  indexedDBLocalPersistence,
  browserLocalPersistence,
  browserSessionPersistence,
  signInAnonymously
} from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAaOe_lxLdQtTFCtw2BDR8KZRSafEMkkes",
  authDomain: "znr-live.firebaseapp.com",
  databaseURL: "https://znr-live-default-rtdb.firebaseio.com",
  projectId: "znr-live",
  storageBucket: "znr-live.firebasestorage.app",
  messagingSenderId: "1038143238323",
  appId: "1:1038143238323:web:5171b9dd8823628086c0c6"
};
const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);

// Solo usamos signInAnonymously aquí, nunca signInWithPopup/Redirect, así
// que inicializamos Auth SIN popupRedirectResolver para que el SDK no
// intente cargar https://apis.google.com/js/api.js en Safari/iOS/móvil.
let auth;
try {
  auth = initializeAuth(fbApp, {
    persistence: [indexedDBLocalPersistence, browserLocalPersistence, browserSessionPersistence]
  });
} catch (e) {
  auth = getAuth(fbApp);
}

// ── Autenticación anónima + certificación de vendedor en RTDB ──
let authUid = null;
let authReadyResolve;
const authReady = new Promise((resolve) => { authReadyResolve = resolve; });
signInAnonymously(auth).catch(err => console.error('signInAnonymously falló:', err));
auth.onAuthStateChanged((user) => {
  if (user) {
    authUid = user.uid;
    authReadyResolve();
  }
});

// Certifica ante el backend que este uid anónimo es el dueño real de
// la liveId, para que las reglas de RTDB permitan isVendor:true / vendido:true.
// Se llama UNA vez por sesión live, justo antes de iniciar el chat.
const liveIdsCertificados = new Set();

async function certificarVendedorEnLive(liveId) {
  if (liveIdsCertificados.has(liveId)) return true;

  try {
    await authReady;
  } catch (authErr) {
    console.error('❌ authReady falló:', authErr);
    return false;
  }

  if (!authUid) {
    console.error('❌ authUid no definido');
    return false;
  }

  try {
    const resp = await apiFetch({
      action: 'certificarVendedorLive',
      vendorToken: vendorSession.token,
      liveId,
      uid: authUid
    });

    console.log('📦 Respuesta completa del servidor:', resp); // 👈 Agrega esto

    if (resp.ok) {
      liveIdsCertificados.add(liveId);
      return true;
    }
    console.error('❌ certificarVendedorLive API falló:', resp);
    return false;
  } catch (err) {
    console.error('❌ Error en apiFetch:', err);
    return false;
  }
}

// ── apiFetch mínimo, igual al de vendedor-unificado.js ──
const CATALOGO_API_URL_VLIVE = "https://catalogo-api-1038143238323.us-central1.run.app";
const LIVE_API_URL_VLIVE = "https://live-api-1038143238323.us-central1.run.app"; // TODO: pegar la URL real tras el deploy
async function apiFetch(data, method = 'POST') {
  const API_BASE = (data && data.action === 'misProductosComunidad') ? CATALOGO_API_URL_VLIVE : LIVE_API_URL_VLIVE;
  const params = new URLSearchParams();
  Object.entries(data || {}).forEach(([k, v]) => {
    if (v !== undefined && v !== null) params.append(k, v);
  });
  let res;
  if (method === 'GET') {
    res = await fetch(`${API_BASE}?${params.toString()}`, { method: 'GET' });
  } else {
    res = await fetch(API_BASE, {
      method: 'POST',
      body: params
    });
  }
  return JSON.parse(await res.text());
}

function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))
  ]);
}

const wrap = document.getElementById('live-wrap');
const subtitle = document.getElementById('header-subtitle');
let vendorSession = null;
let currentSesion = null;
let selectedProductIds = new Set();

let presenceUnsub = null;

function hace(ts) {

// ── Transmisión dentro de ZNR: cámara + WHIP (Cloudflare Stream) ──
// El vendedor publica su cámara por WebRTC (WHIP) a un live input de
// Cloudflare; los compradores lo ven por WHEP en comprador-live.html.
// Cloudflare NO graba las transmisiones WebRTC, así que además se guarda
// una copia de baja calidad en segmentos (ver "Respaldo de video") que
// el backend usa para armar el clip de un reporte.

let localStream = null;
let pcActual = null;
let whipUrl = null;
let transmitiendo = false;
let camaraFacing = 'environment'; // primero la trasera: lo normal es mostrar productos
let cambiandoCamara = false;
let reconectando = false;
let discTimer = null;
let wakeLock = null;
let segmentoMs = 30000;

function videoConstraints(facing) {
  const vertical = currentSesion && currentSesion.orientacion === 'vertical';
  return {
    facingMode: { ideal: facing },
    width: { ideal: vertical ? 720 : 1280 },
    height: { ideal: vertical ? 1280 : 720 },
    frameRate: { ideal: 24, max: 30 }
  };
}

function errorCamara(e) {
  const n = e && e.name;
  if (n === 'NotAllowedError' || n === 'SecurityError') return new Error('Permite el acceso a la cámara y al micrófono en tu navegador para poder transmitir.');
  if (n === 'NotFoundError' || n === 'OverconstrainedError') return new Error('No encontramos una cámara o micrófono disponible en este dispositivo.');
  if (n === 'NotReadableError' || n === 'AbortError') return new Error('La cámara o el micrófono están siendo usados por otra app. Ciérrala e intenta de nuevo.');
  return new Error('No se pudo abrir la cámara: ' + ((e && e.message) || 'error desconocido'));
}

async function pedirCamara(facing) {
  try {
    return await navigator.mediaDevices.getUserMedia({
      video: videoConstraints(facing),
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
  } catch (e) {
    throw errorCamara(e);
  }
}

async function pedirVideoTrack(facing) {
  const s = await navigator.mediaDevices.getUserMedia({ video: videoConstraints(facing), audio: false });
  return s.getVideoTracks()[0];
}

function ligarPreview() {
  const v = document.getElementById('vendor-preview');
  if (!v || !localStream) return;
  v.srcObject = localStream;
  v.muted = true;
  v.playsInline = true;
  v.play().catch(() => {});
  v.style.transform = camaraFacing === 'user' ? 'scaleX(-1)' : 'none'; // la frontal se ve como espejo
}

function avisoVideo(msg, onClick) {
  const el = document.getElementById('conn-aviso');
  if (!el) return;
  if (!msg) { el.style.display = 'none'; el.textContent = ''; el.onclick = null; el.style.cursor = ''; return; }
  el.textContent = msg;
  el.style.display = 'block';
  el.onclick = onClick || null;
  el.style.cursor = onClick ? 'pointer' : '';
}

function esperarIce(pc, ms) {
  return new Promise((resolve) => {
    if (pc.iceGatheringState === 'complete') { resolve(); return; }
    const fin = () => { clearTimeout(t); pc.removeEventListener('icegatheringstatechange', check); resolve(); };
    const check = () => { if (pc.iceGatheringState === 'complete') fin(); };
    const t = setTimeout(fin, ms);
    pc.addEventListener('icegatheringstatechange', check);
  });
}

function esperarConexion(pc, ms) {
  return new Promise((resolve, reject) => {
    if (pc.connectionState === 'connected') { resolve(); return; }
    const t = setTimeout(() => { pc.removeEventListener('connectionstatechange', check); reject(new Error('timeout')); }, ms);
    const check = () => {
      const st = pc.connectionState;
      if (st === 'connected') { clearTimeout(t); pc.removeEventListener('connectionstatechange', check); resolve(); }
      else if (st === 'failed' || st === 'closed') { clearTimeout(t); pc.removeEventListener('connectionstatechange', check); reject(new Error('conexión ' + st)); }
    };
    pc.addEventListener('connectionstatechange', check);
  });
}

function cerrarPC() {
  if (!pcActual) return;
  try { pcActual.onconnectionstatechange = null; pcActual.close(); } catch (e) { /* ya estaba cerrada */ }
  pcActual = null;
}

function limitarBitrate(pc) {
  // Tope de 1.5 Mbps al video en vivo para que no compita de más con la
  // subida del respaldo. No es crítico: si el navegador no lo permite, sigue.
  try {
    pc.getSenders().forEach((sender) => {
      if (!sender.track || sender.track.kind !== 'video') return;
      const params = sender.getParameters();
      if (!params.encodings || !params.encodings.length) params.encodings = [{}];
      params.encodings[0].maxBitrate = 1500000;
      sender.setParameters(params).catch(() => {});
    });
  } catch (e) { /* no crítico */ }
}

// Publica localStream a Cloudflare por WHIP (offer SDP -> answer SDP).
async function conectarWHIP() {
  cerrarPC();
  const pc = new RTCPeerConnection({
    iceServers: [{ urls: 'stun:stun.cloudflare.com:3478' }],
    bundlePolicy: 'max-bundle'
  });
  pcActual = pc;
  const h264 = (RTCRtpSender.getCapabilities('video')?.codecs || [])
    .filter((c) => c.mimeType === 'video/H264' && /profile-level-id=42e01f/.test(c.sdpFmtpLine));
  localStream.getTracks().forEach((track) => {
    const t = pc.addTransceiver(track, { direction: 'sendonly', streams: [localStream] });
    if (track.kind === 'video' && h264.length) t.setCodecPreferences(h264);
  });
  try {
    await pc.setLocalDescription(await pc.createOffer());
    await esperarIce(pc, 4000);
    const res = await fetch(whipUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/sdp' },
      body: pc.localDescription.sdp
    });
    if (!res.ok) throw new Error('El servidor de video respondió ' + res.status);
    await pc.setRemoteDescription({ type: 'answer', sdp: await res.text() });
    await esperarConexion(pc, 12000);
  } catch (err) {
    if (pcActual === pc) cerrarPC();
    throw err;
  }
  limitarBitrate(pc);
  vigilarPC(pc);
  const dbg = setInterval(async () => { // temporal: quitar cuando funcione
  if (pc !== pcActual) return clearInterval(dbg);
  const st = await pc.getStats();
  const s = [...st.values()].find((r) => r.type === 'outbound-rtp' && r.kind === 'video');
  const c = s && st.get(s.codecId);
  const r = [...st.values()].find((x) => x.type === 'remote-inbound-rtp' && x.kind === 'video');
  avisoVideo(s ? `${c?.sdpFmtpLine?.match(/profile-level-id=\w+/)} sent:${s.bytesSent} rtt:${r?.roundTripTime ?? 'sin respuesta'} lost:${r?.packetsLost ?? '-'}` : 'sin outbound-rtp');
}, 3000);
}

function vigilarPC(pc) {
  pc.onconnectionstatechange = () => {
    if (pc !== pcActual || !transmitiendo) return;
    const st = pc.connectionState;
    if (st === 'connected') {
      clearTimeout(discTimer);
      avisoVideo(null);
    } else if (st === 'disconnected') {
      avisoVideo('Conexión inestable… reconectando el video.');
      clearTimeout(discTimer);
      discTimer = setTimeout(() => {
        if (pc === pcActual && pc.connectionState !== 'connected') reconectar();
      }, 5000);
    } else if (st === 'failed') {
      reconectar();
    }
  };
}

// Si se cae el WiFi o los datos, vuelve a publicar a la MISMA url de
// Cloudflare. La cámara y el respaldo siguen corriendo mientras tanto.
async function reconectar() {
  if (reconectando || !transmitiendo) return;
  reconectando = true;
  avisoVideo('Reconectando el video…');
  for (let i = 0; i < 6 && transmitiendo; i++) {
    try {
      await conectarWHIP();
      avisoVideo(null);
      reconectando = false;
      return;
    } catch (e) {
      console.error('reconectar: intento ' + (i + 1) + ' falló', e);
      await new Promise((r) => setTimeout(r, 2000 * (i + 1)));
    }
  }
  reconectando = false;
  if (transmitiendo) avisoVideo('Se perdió la conexión del video. Toca aquí para reintentar.', reconectar);
}

async function pedirWakeLock() {
  try {
    if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
  } catch (e) { /* no todos los navegadores lo permiten */ }
}

// Camera + credenciales + WHIP. Lanza Error con mensaje listo para mostrar.
async function iniciarMedios() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.RTCPeerConnection) {
    throw new Error('Este navegador no permite transmitir desde ZNR. Usa Chrome en Android o un Safari actualizado en iPhone.');
  }
  const stream = await pedirCamara(camaraFacing); // primero la cámara: si la niegan, no se gasta nada en el servidor
  let cred;
  try {
    cred = await apiFetch({ action: 'obtenerCredencialesTransmision', vendorToken: vendorSession.token, id: currentSesion.id });
  } catch (e) {
    stream.getTracks().forEach((t) => t.stop());
    throw new Error('Error de conexión. Intenta de nuevo.');
  }
  if (!cred.ok) {
    stream.getTracks().forEach((t) => t.stop());
    throw new Error(cred.error || 'No se pudo preparar la transmisión.');
  }
  whipUrl = cred.whipUrl;
  segmentoMs = (Number(cred.segmentoSegundos) || 30) * 1000;
  localStream = stream;
  try {
    await conectarWHIP();
  } catch (e) {
    console.error('conectarWHIP falló:', e);
    liberarMedios();
    throw new Error('No se pudo conectar el video. Revisa tu internet e intenta de nuevo.');
  }
  transmitiendo = true;
  pedirWakeLock();
  return true;
}

function liberarMedios() {
  transmitiendo = false;
  clearTimeout(discTimer);
  cerrarPC();
  if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
}

// Cierra todo: corta el respaldo (esperando hasta 8 s a que termine de
// subir el último segmento), la conexión a Cloudflare y la cámara.
async function detenerTransmision() {
  transmitiendo = false;
  respaldoActivo = false;
  clearTimeout(discTimer);
  try { await withTimeout(detenerRecorderActual(), 3000); } catch (e) { /* se sigue igual */ }
  if (subidasPendientes.size) {
    try { await withTimeout(Promise.allSettled([...subidasPendientes]), 8000); } catch (e) { /* se sigue sin esperar más */ }
  }
  liberarMedios();
  if (wakeLock) { try { await wakeLock.release(); } catch (e) { /* ya liberado */ } wakeLock = null; }
  const v = document.getElementById('vendor-preview');
  if (v) v.srcObject = null;
}

function cambiarTracksEnPC(nuevoStream) {
  if (!pcActual) return;
  pcActual.getSenders().forEach((sender) => {
    const kind = sender.track && sender.track.kind;
    if (!kind) return;
    const t = nuevoStream.getTracks().find((x) => x.kind === kind);
    if (t) sender.replaceTrack(t).catch((e) => console.error('replaceTrack falló:', e));
  });
}

// Frontal <-> trasera sin cortar la transmisión. En muchos Android hay que
// soltar la cámara actual antes de abrir la otra.
async function cambiarCamara() {
  if (!transmitiendo || !localStream || cambiandoCamara) return;
  cambiandoCamara = true;
  const btn = document.getElementById('btn-camara');
  if (btn) btn.disabled = true;
  const destino = camaraFacing === 'user' ? 'environment' : 'user';
  await pausarRespaldo();
  const viejoVideo = localStream.getVideoTracks()[0];
  if (viejoVideo) viejoVideo.stop();
  let video = null;
  try {
    video = await pedirVideoTrack(destino);
    camaraFacing = destino;
  } catch (e) {
    try { video = await pedirVideoTrack(camaraFacing); }
    catch (e2) { avisoVideo('No se pudo cambiar de cámara. Toca 🔄 Cámara para reintentar.'); }
  }
  if (video) {
    localStream = new MediaStream([video, ...localStream.getAudioTracks()]);
    cambiarTracksEnPC(localStream);
    ligarPreview();
    avisoVideo(null);
  }
  reanudarRespaldo();
  cambiandoCamara = false;
  if (btn) btn.disabled = false;
}

// Algunos celulares cortan la cámara si la pestaña pasa a segundo plano.
// Al volver, si las pistas murieron, se vuelve a abrir.
async function reabrirCamara() {
  if (!transmitiendo || !localStream || cambiandoCamara) return;
  const v = localStream.getVideoTracks()[0];
  const a = localStream.getAudioTracks()[0];
  if (v && v.readyState === 'live' && (!a || a.readyState === 'live')) return;
  cambiandoCamara = true;
  try {
    await pausarRespaldo();
    const nuevo = await pedirCamara(camaraFacing);
    const viejo = localStream;
    localStream = nuevo;
    cambiarTracksEnPC(nuevo);
    ligarPreview();
    viejo.getTracks().forEach((t) => t.stop());
    avisoVideo(null);
  } catch (e) {
    avisoVideo('No se pudo reactivar la cámara. Toca 🔄 Cámara para reintentar.');
  }
  reanudarRespaldo();
  cambiandoCamara = false;
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !transmitiendo) return;
  pedirWakeLock();
  reabrirCamara();
});

window.addEventListener('beforeunload', (e) => {
  if (transmitiendo) { e.preventDefault(); e.returnValue = ''; }
});

// ── Respaldo de video para reportes ──
// Copia de baja calidad (~500 kbps) grabada en el celular, partida en
// segmentos de 30 s que se suben a un bucket privado con URLs firmadas.
// Cada segmento es un archivo independiente (se reinicia el MediaRecorder
// en cada corte), así el backend puede sacar la ventana de unos minutos
// alrededor de un reporte. Si algo falla aquí, la transmisión sigue.

let respaldoActivo = false;
let recTimer = null;
let recActual = null; // { rec, cerrado: Promise }
let mimeRespaldo = null;
let tipoRespaldo = null; // 'video/webm' | 'video/mp4'
let ultimaSeq = -1;
const subidasPendientes = new Set();

function elegirMimeRespaldo() {
  if (typeof MediaRecorder === 'undefined') return null;
  const candidatos = [
    'video/webm;codecs=vp8,opus', 'video/webm;codecs=vp9,opus', 'video/webm',
    'video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4'
  ];
  for (const c of candidatos) {
    try { if (MediaRecorder.isTypeSupported(c)) return c; } catch (e) { /* siguiente */ }
  }
  return null;
}

// Número de segmento = segundos desde el inicio del live, y nunca menor
// al último que se usó (se guarda en este navegador por si la vendedora
// recarga y reanuda: así no se pisa un segmento ya subido).
function siguienteSeq() {
  const clave = 'znr_live_seq_' + (currentSesion && currentSesion.id);
  const inicio = currentSesion && currentSesion.fecha_inicio ? new Date(currentSesion.fecha_inicio).getTime() : NaN;
  const base = Number.isFinite(inicio) ? Math.floor((Date.now() - inicio) / 1000) : 0;
  let guardada = -1;
  try {
    const raw = localStorage.getItem(clave);
    if (raw !== null && Number.isFinite(Number(raw))) guardada = Number(raw);
  } catch (e) { /* sin storage: se usa solo el tiempo transcurrido */ }
  ultimaSeq = Math.max(base, ultimaSeq + 1, guardada + 1, 0);
  try { localStorage.setItem(clave, String(ultimaSeq)); } catch (e) { /* sin storage */ }
  return ultimaSeq;
}

async function pedirUrlSubida(seq) {
  try {
    const resp = await apiFetch({
      action: 'obtenerUrlSubidaSegmento',
      vendorToken: vendorSession.token,
      liveId: currentSesion.id,
      seq,
      contentType: tipoRespaldo
    });
    return resp.ok ? resp.uploadUrl : null;
  } catch (e) {
    return null;
  }
}

function encolarSubida(seq, urlPromise, blob) {
  if (subidasPendientes.size >= 20) {
    console.warn('Respaldo: cola de subida llena, se descarta el segmento', seq);
    return;
  }
  const p = (async () => {
    let url = await urlPromise;
    for (let intento = 0; intento < 4; intento++) {
      try {
        if (!url) url = await pedirUrlSubida(seq);
        if (!url) throw new Error('sin URL de subida');
        const res = await fetch(url, { method: 'PUT', headers: { 'Content-Type': tipoRespaldo }, body: blob });
        if (res.ok) return true;
        throw new Error('PUT ' + res.status);
      } catch (e) {
        url = null; // si la URL falló o caducó, se pide una nueva
        await new Promise((r) => setTimeout(r, 1500 * (intento + 1)));
      }
    }
    console.warn('Respaldo: no se pudo subir el segmento', seq);
    return false;
  })().finally(() => subidasPendientes.delete(p));
  subidasPendientes.add(p);
}

function iniciarCicloSegmento() {
  if (!respaldoActivo || !localStream || !mimeRespaldo) return;
  const seq = siguienteSeq();
  let rec;
  try {
    rec = new MediaRecorder(localStream, { mimeType: mimeRespaldo, videoBitsPerSecond: 500000, audioBitsPerSecond: 32000 });
  } catch (e) {
    console.error('Respaldo: no se pudo crear el MediaRecorder', e);
    respaldoActivo = false;
    return;
  }
  const chunks = [];
  const urlPromise = pedirUrlSubida(seq); // en paralelo: la hora que anota el servidor ≈ inicio de la grabación
  const cerrado = new Promise((resolve) => {
    rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      if (chunks.length) encolarSubida(seq, urlPromise, new Blob(chunks, { type: tipoRespaldo }));
      resolve();
    };
    rec.onerror = (e) => { console.error('Respaldo: error del MediaRecorder', e); };
  });
  rec.start();
  recActual = { rec, cerrado };
  recTimer = setTimeout(() => { detenerRecorderActual(); iniciarCicloSegmento(); }, segmentoMs);
}

// Detiene el segmento en curso (dispara el encolado de su subida).
function detenerRecorderActual() {
  clearTimeout(recTimer);
  recTimer = null;
  const actual = recActual;
  recActual = null;
  if (!actual) return Promise.resolve();
  try { if (actual.rec.state !== 'inactive') actual.rec.stop(); } catch (e) { /* ya estaba detenido */ }
  return actual.cerrado;
}

function pausarRespaldo() { return detenerRecorderActual(); }
function reanudarRespaldo() { if (respaldoActivo) iniciarCicloSegmento(); }

function iniciarRespaldo() {
  mimeRespaldo = elegirMimeRespaldo();
  if (!mimeRespaldo) {
    alert('Ojo: este navegador no puede guardar el respaldo de video que se usa para revisar reportes. La transmisión funciona normal.');
    return;
  }
  tipoRespaldo = mimeRespaldo.indexOf('video/mp4') === 0 ? 'video/mp4' : 'video/webm';
  respaldoActivo = true;
  iniciarCicloSegmento();
}

// Pantalla sobre el video cuando la página se recargó (o se cerró) con el
// live todavía "en vivo": la cámara hay que volver a abrirla.
function mostrarPanelReanudar() {
  const panel = document.getElementById('resume-panel');
  const btn = document.getElementById('btn-reanudar');
  if (!panel || !btn) return;
  panel.style.display = 'flex';
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    btn.textContent = 'Conectando…';
    try {
      await iniciarMedios();
      panel.style.display = 'none';
      ligarPreview();
      iniciarRespaldo();
    } catch (err) {
      alert(err.message);
      btn.disabled = false;
      btn.textContent = 'Reanudar transmisión';
    }
  });
}

async function fetchAllProducts() {
  try {
    const resp = await apiFetch({
      action: 'misProductosComunidad',
      vendorToken: vendorSession.token,
      limit: 50
    }, 'GET');
    if (resp.ok && resp.products) allProducts = resp.products;
  } catch (err) {
    // se reintenta la próxima vez que se necesite
  }
}

async function loadProductGrid() {
  const grid = document.getElementById('product-grid');
  try {
    await fetchAllProducts();
    if (!allProducts.length) {
      grid.innerHTML = `<div class="chat-empty">Aún no tienes productos en tu catálogo de comunidad.</div>`;
      return;
    }
    grid.innerHTML = allProducts.map(p => `
      <div class="product-chip" data-id="${esc(p.id)}">
        <img src="${esc(p.imagen1 || 'https://placehold.co/200x200')}" alt="${esc(p.nombre)}" loading="lazy">
        <div class="chip-name">${esc(p.nombre)}</div>
      </div>
    `).join('');

    grid.querySelectorAll('.product-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const id = chip.dataset.id;
        if (selectedProductIds.has(id)) {
          selectedProductIds.delete(id);
          chip.classList.remove('selected');
        } else {
          selectedProductIds.add(id);
          chip.classList.add('selected');
        }
      });
    });
  } catch (err) {
    grid.innerHTML = `<div class="chat-empty">No se pudo cargar tu catálogo.</div>`;
  }
}

async function crearSesion() {
  const titulo = document.getElementById('f-titulo').value.trim();
  const desc = document.getElementById('f-desc').value.trim();
  const btn = document.getElementById('btn-crear-sesion');
  const genError = document.getElementById('f-general-error');
  genError.style.display = 'none';

  if (!titulo) { genError.textContent = 'Ponle un título a tu transmisión.'; genError.style.display = 'block'; return; }
  btn.disabled = true;
  btn.textContent = 'Creando…';

  try {
    const resp = await apiFetch({
      action: 'crearSesionLive',
      vendorToken: vendorSession.token,
      titulo, descripcion: desc,
      tipo: tipoSeleccionado,
      orientacion: orientacionSeleccionada,
      productos_ids: Array.from(selectedProductIds).join(';')
    });

    if (!resp.ok) {
      genError.textContent = resp.error || 'No se pudo crear la transmisión.';
      genError.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Crear transmisión';
      return;
    }

    await cargarSesionActual();
  } catch (err) {
    genError.textContent = 'Error de conexión. Intenta de nuevo.';
    genError.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Crear transmisión';
  }
}

// ── Cierre de transmisión: registra ventas, genera la página de
// entregas (100% local, sin backend) y guarda un historial liviano
// en este navegador para poder volver a abrirla después. ──
async function finalizarTransmision(finBtn) {
  if (finBtn) { finBtn.disabled = true; finBtn.textContent = 'Finalizando…'; }
  await detenerTransmision(); // corta cámara y Cloudflare, y sube el último segmento del respaldo
  try { localStorage.removeItem('znr_live_seq_' + currentSesion.id); } catch (e) { /* sin storage */ }

  let entregaUrl = null;

  try {
    const snap = await withTimeout(get(ref(db, `chats/${currentSesion.id}/messages`)), 5000);
    const data = snap.val() || {};
    const vendidos = Object.values(data).filter(m => m.vendido && !m.isVendor);

    // El teléfono/dirección/horario/GPS ya no viajan en el mensaje de
    // chat — se piden en bloque al backend (que lee contactos/{liveId}
    // en RTDB con credenciales de servidor y deja auditoría), y solo
    // para los uid que realmente tienen algo marcado como vendido.
    const uidsConVenta = [...new Set(vendidos.map(m => m.uid).filter(Boolean))];
    let contactosPorUid = {};
    if (uidsConVenta.length > 0) {
      try {
        const respContactos = await withTimeout(apiFetch({
          action: 'obtenerContactosParaCierre',
          vendorToken: vendorSession.token,
          liveId: currentSesion.id,
          uids: JSON.stringify(uidsConVenta)
        }), 8000);
        if (respContactos.ok) contactosPorUid = respContactos.contactos || {};
        else console.error('obtenerContactosParaCierre falló:', respContactos.error);
      } catch (errContactos) {
        console.error('obtenerContactosParaCierre falló:', errContactos);
      }
    }

    const ventas = vendidos.map(m => {
      const c = contactosPorUid[m.uid] || {};
      return {
        productId: m.producto_id || '',
        comprador_nombre: m.author || '',
        comprador_telefono: c.telefono || '',
        comprador_nota: c.nota || '',
        comprador_horario: c.horario || '',
        comprador_lat: (typeof c.lat === 'number') ? c.lat : null,
        comprador_lng: (typeof c.lng === 'number') ? c.lng : null,
        comprador_direccion: '' // se llena abajo con lo que regrese cerrarVentasLive
      };
    });

    if (ventas.length > 0) {
      // El reverse geocoding (coords -> dirección legible) tarda ~1.1s
      // por comprador distinto (política de Nominatim) — el timeout
      // fijo de 8s no alcanza si hay varios, así que crece con la
      // cantidad de compradores únicos.
      const timeoutCierre = Math.max(8000, 3000 + uidsConVenta.length * 1300);
      const resp = await withTimeout(apiFetch({
        action: 'cerrarVentasLive',
        vendorToken: vendorSession.token,
        ventas: JSON.stringify(ventas)
      }), timeoutCierre);
      if (resp.ok) {
        alert(`${resp.added} venta(s) de ${resp.compradores} comprador(es) enviadas a tus notificaciones para confirmar.`);
        // La dirección legible ya se calculó una sola vez adentro de
        // cerrarVentasLive (reverse geocoding) — se reutiliza aquí para
        // no volver a llamar a Nominatim al armar la página de entregas.
        const direcciones = resp.direcciones || {};
        ventas.forEach(v => {
          v.comprador_direccion = direcciones[v.comprador_telefono || ''] || '';
        });
      } else {
        alert('No se pudieron registrar las ventas: ' + (resp.error || 'error desconocido') + '. Puedes revisarlas manualmente en el chat.');
      }
      entregaUrl = await crearPaginaEntregas(ventas);
    }
  } catch (err) {
    console.error('finalizarTransmision: no se pudieron leer los "vendidos" (revisa las reglas de Firebase):', err);
    alert('No se pudieron leer los "vendidos" del chat (puede ser tu conexión). Se va a cerrar de todos modos — revísalos manualmente si hace falta.');
  }

  try {
    await withTimeout(apiFetch({ action: 'actualizarEstadoLive', vendorToken: vendorSession.token, id: currentSesion.id, estado: 'terminado' }), 8000);
  } catch (err) {
    console.error('actualizarEstadoLive (terminado) falló:', err);
    alert('Ojo: no se pudo confirmar el cierre con el servidor (revisa tu conexión). Si al recargar la página sigue apareciendo como "en vivo", entra de nuevo y dale Finalizar otra vez.');
  }

  if (chatUnsub) chatUnsub();
  if (presenceUnsub) { presenceUnsub(); presenceUnsub = null; }
  renderEnded(entregaUrl);
}

// ── Arma el paquete de entrega (agrupado por comprador) y lo guarda
// en el backend (hoja Entregas_Live). El link que se comparte solo
// lleva el id del 00000
// y el estado ENTREGADO/PENDIENTE queda guardado, no solo local. ──
async function crearPaginaEntregas(ventas) {
  try {
    const grupos = {};
    ventas.forEach(v => {
      const key = v.comprador_telefono || ('sin_tel_' + v.comprador_nombre);
      if (!grupos[key]) {
        grupos[key] = {
          key: key,
          nombre: v.comprador_nombre || 'Comprador',
          telefono: v.comprador_telefono || '',
          direccion: v.comprador_direccion || '', // ya viene reverse-geocodificada desde cerrarVentasLive
          nota: v.comprador_nota || '',
          horario: v.comprador_horario || '',
          lat: (typeof v.comprador_lat === 'number') ? v.comprador_lat : null,
          lng: (typeof v.comprador_lng === 'number') ? v.comprador_lng : null,
          items: [],
          total: 0
        };
      }
      const prod = allProducts.find(p => String(p.id) === String(v.productId));
      const precio = prod ? (Number(prod.precio) || 0) : 0;
      grupos[key].items.push({ nombre: (prod && prod.nombre) || 'Producto', precio });
      grupos[key].total += precio;
    });

    const gruposArr = Object.values(grupos);
    if (!gruposArr.length) return null;

    // Normalmente cada grupo ya trae "direccion" pre-calculada (ver
    // finalizarTransmision), así que esto no debería necesitar
    // geocodificar de nuevo — el margen extra es solo por si algún
    // grupo llegó sin ella y el backend tiene que hacerlo de respaldo.
    const timeoutEntregas = Math.max(8000, 3000 + gruposArr.length * 1300);
    const resp = await withTimeout(apiFetch({
      action: 'guardarEntregasLive',
      vendorToken: vendorSession.token,
      liveId: currentSesion.id,
      liveTitulo: currentSesion.titulo || '',
      grupos: JSON.stringify(gruposArr)
    }), timeoutEntregas);

    if (!resp.ok) {
      console.error('guardarEntregasLive falló:', resp.error);
      return null;
    }

    return `${location.origin}${location.pathname.replace('vendedor-live.html', 'entregas-live.html')}?id=${encodeURIComponent(currentSesion.id)}`;
  } catch (err) {
    console.error('crearPaginaEntregas falló:', err);
    return null;
  }
}

function renderEnded(entregaUrl) {
  document.body.classList.remove('live-active');
  subtitle.textContent = 'Finalizada';
  wrap.innerHTML = `
    <div class="live-card center-text">
      <div class="upsell-icon"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" aria-hidden="true"><use href="#ic-check"/></svg></div>
      <h2>Transmisión finalizada</h2>
      <p class="hint">¡Buen trabajo! Cuando quieras, puedes crear una nueva transmisión.</p>
      ${entregaUrl ? `
        <p class="hint" style="text-align:left;">${Icon('box')} Ya puedes coordinar las entregas de esta transmisión. Comparte este link con tu repartidor si lo necesitas:</p>
        <div class="share-box">
          <input type="text" readonly value="${esc(entregaUrl)}" id="entrega-url">
          <button id="btn-copy-entrega">Copiar</button>
        </div>
        <button class="btn-live primary" id="btn-abrir-entregas">${Icon('box')} Ver página de entregas</button>
        <div style="height:8px;"></div>
      ` : ''}
      <button class="btn-live ${entregaUrl ? 'ghost' : 'primary'}" id="btn-nueva">Crear nueva transmisión</button>
    </div>`;

  if (entregaUrl) {
    document.getElementById('btn-copy-entrega').addEventListener('click', () => {
      navigator.clipboard.writeText(entregaUrl).catch(() => {});
      const btn = document.getElementById('btn-copy-entrega');
      btn.textContent = '¡Copiado!';
      setTimeout(() => { btn.textContent = 'Copiar'; }, 1500);
    });
    document.getElementById('btn-abrir-entregas').addEventListener('click', () => {
      window.open(entregaUrl, '_blank');
    });
  }

  document.getElementById('btn-nueva').addEventListener('click', () => {
    currentSesion = null;
    selectedProductIds = new Set();
    renderCreateForm();
  });
}

function marcarVendido(liveId, key, msg) {
  if (msg.vendido) {
    if (confirm(`¿Quitar el marcado de vendido a "${msg.text}" de ${msg.author}?`)) {
      update(ref(db, `chats/${liveId}/messages/${key}`), { vendido: false }).catch(err => {
        console.error('marcarVendido (quitar) falló:', err);
        alert('No se pudo quitar el marcado de vendido: ' + err.message);
      });
    }
    return;
  }
  if (confirm(`¿Marcar "${msg.text}" de ${msg.author} como vendido?`)) {
    update(ref(db, `chats/${liveId}/messages/${key}`), { vendido: true }).catch(err => {
      console.error('marcarVendido falló:', err);
      alert('No se pudo marcar como vendido: ' + err.message);
    });
  }
}

// ── Chat con Firebase Realtime Database ──
function setupChat(liveId, myName, isVendor) {
  const messagesEl = document.getElementById('chat-messages');
  const inputEl = document.getElementById('chat-input');
  const sendBtn = document.getElementById('chat-send');
  const chatRef = query(ref(db, `chats/${liveId}/messages`), limitToLast(100));

  chatUnsub = onValue(chatRef, (snapshot) => {
    const data = snapshot.val();
    if (!data) { messagesEl.innerHTML = '<div class="chat-empty">Aún no hay mensajes.</div>'; return; }
    const entries = Object.entries(data).sort((a, b) => (a[1].ts || 0) - (b[1].ts || 0));
    messagesEl.innerHTML = entries.map(([key, m]) => {
      const prod = m.producto_id ? allProducts.find(p => String(p.id) === String(m.producto_id)) : null;
      const prodTag = prod ? `
        <div style="display:flex; align-items:center; gap:5px; margin-top:3px; opacity:.8;">
          <img src="${esc(prod.imagen1 || 'https://placehold.co/40x40')}" style="width:16px;height:16px;border-radius:4px;object-fit:cover;">
          <span style="font-size:10px; color:var(--color-text-soft);">${esc(prod.nombre)}</span>
        </div>` : '';
      return `
      <div class="chat-msg ${m.author === myName ? 'mine' : ''}" data-key="${esc(key)}" style="${!m.isVendor ? 'cursor:pointer;' : ''}">
        <span class="author">${esc(m.author)}${m.isVendor ? ' ' + Icon('shopping-bag') : ''}:</span>
        <span class="text">${esc(m.text)}</span>
        ${m.vendido ? `<span class="vendido-tag" style="display:inline-block;margin-left:6px;font-size:10px;font-weight:700;background:rgba(74,222,128,.15);color:#4ade80;padding:2px 7px;border-radius:999px;">${Icon('check')} Vendido</span>` : ''}
        ${prodTag}
      </div>`;
    }).join('');
    messagesEl.scrollTop = messagesEl.scrollHeight;

    if (isVendor) {
      messagesEl.querySelectorAll('.chat-msg[data-key]').forEach(el => {
        const key = el.dataset.key;
        const msg = data[key];
        if (msg.isVendor) return;
        el.addEventListener('click', () => marcarVendido(liveId, key, msg));
      });
    }
  }, (err) => {
    console.error('setupChat onValue falló (revisa las reglas de Firebase):', err);
    messagesEl.innerHTML = `<div class="chat-empty">No se pudo cargar el chat: ${esc(err.message)}</div>`;
  });

  function send() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    push(ref(db, `chats/${liveId}/messages`), {
      uid: authUid, author: myName, text, isVendor, ts: Date.now(),
      producto_id: String(currentSesion.producto_actual_id || '')
    }).catch(err => {
      console.error('send (chat vendedor) falló (revisa las reglas de Firebase):', err);
      alert('No se pudo enviar el mensaje: ' + err.message);
      inputEl.value = text;
    });
  }
  sendBtn.addEventListener('click', send);
  inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
}

// ── Carga inicia45
async function cargarSesionActual() {
  wrap.innerHTML = '<div class="loading-spinner"></div>';
  try {
    const resp = await apiFetch({ action: 'obtenerMisSesionesLive', vendorToken: vendorSession.token }, 'GET');
    if (!resp.ok) {
      renderCreateForm();
      const genError = document.getElementById('f-general-error');
      if (genError) { genError.textContent = 'No se pudo cargar tu sesión: ' + (resp.error || 'error desconocido'); genError.style.display = 'block'; }
      return;
    }
    if (resp.sesiones && resp.sesiones.length) {
      const activa = resp.sesiones.find(s => s.estado === 'programado' || s.estado === 'en_vivo');
      if (activa) {
        currentSesion = activa;
        if (!allProducts.length) await fetchAllProducts();
        if (activa.estado === 'en_vivo') renderLive();
        else renderScheduled();
        return;
      }
    }
    renderCreateForm();
  } catch (err) {
    renderCreateForm();
    const genError = document.getElementById('f-general-error');
    if (genError) { genError.textContent = 'No se pudo cargar tu sesión: ' + err.message; genError.style.display = 'block'; }
  }
}

async function init() {
  const raw = localStorage.getItem('vendor_session');
  if (!raw) { renderNoSession(); return; }
  try { vendorSession = JSON.parse(raw); } catch (e) { renderNoSession(); return; }
  if (!vendorSession || !vendorSession.token) { renderNoSession(); return; }

  if (vendorSession.plan !== 'plus') { renderNoPlus(); return; }

  await cargarSesionActual();
}

init();
