<style>
  .live-wrap { max-width: 640px; margin: 0 auto; padding: 16px; padding-bottom: 100px; }

  .live-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border-subtle);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-bottom: 16px;
  }

  .live-card h2 { margin: 0 0 6px; font-size: 17px; color: var(--color-text-primary); }
  .live-card p.hint { margin: 0 0 16px; font-size: 13px; color: var(--color-text-soft); line-height: 1.5; }

  .field-group { margin-bottom: 14px; }
  .field-group label {
    display: block; font-size: 12px; font-weight: 600;
    color: var(--color-text-soft); text-transform: uppercase;
    letter-spacing: .05em; margin-bottom: 6px;
  }
  .field-group input, .field-group textarea {
    width: 100%; box-sizing: border-box;
    padding: 12px 14px; border-radius: var(--radius-md);
    border: 1px solid var(--color-border-subtle);
    background: var(--color-surface-2);
    color: var(--color-text-primary);
    font-size: 14px; font-family: inherit;
  }
  .field-group textarea { resize: vertical; min-height: 70px; }
  .field-group input:focus, .field-group textarea:focus {
    outline: none; border-color: var(--color-primary);
  }

  .tipo-options { display: flex; flex-direction: column; gap: 8px; }
  .tipo-option {
    border: 1px solid var(--color-border-subtle); border-radius: var(--radius-md);
    padding: 12px 14px; background: var(--color-surface-2);
  }
  .tipo-option.selected { border-color: var(--color-accent-solid); background: rgba(var(--color-accent-rgb, 236,72,153), .08); }
  .tipo-option-header { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
  .tipo-option-header input { width: auto; margin-top: 3px; flex-shrink: 0; }
  .tipo-option .tipo-text strong { display: block; font-size: 13px; color: var(--color-text-primary); }
  .tipo-option .badge-recomendado {
    display: inline-block; font-size: 10px; font-weight: 700; color: #4ade80;
    background: rgba(74,222,128,.15); padding: 2px 7px; border-radius: var(--radius-pill);
    margin-left: 6px; vertical-align: middle;
  }
  .tipo-detalle { margin: 8px 0 0 26px; }
  .tipo-detalle summary {
    font-size: 11px; font-weight: 700; color: var(--color-accent-solid);
    cursor: pointer; user-select: none;
  }
  .tipo-detalle p { margin: 6px 0 0; font-size: 12px; color: var(--color-text-soft); line-height: 1.4; }
  .tipo-detalle ul { margin: 6px 0 0; padding-left: 18px; font-size: 12px; color: var(--color-text-soft); line-height: 1.5; }
  .tipo-detalle.no-indent { margin-left: 0; }

  .orient-options { display: flex; gap: 8px; }
  .orient-chip {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid var(--color-border-subtle); border-radius: var(--radius-md);
    padding: 10px; font-size: 13px; font-weight: 600; color: var(--color-text-primary);
    cursor: pointer; background: var(--color-surface-2);
  }
  .orient-chip input { width: auto; margin: 0; }
  .orient-chip.selected { border-color: var(--color-accent-solid); background: rgba(var(--color-accent-rgb, 236,72,153), .08); }

  .product-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    max-height: 260px; overflow-y: auto; padding: 4px 0;
  }
  .product-chip {
    position: relative; border-radius: var(--radius-md); overflow: hidden;
    border: 2px solid transparent; cursor: pointer; aspect-ratio: 1;
    background: var(--color-surface-2);
  }
  .product-chip img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .product-chip.selected { border-color: var(--color-accent-solid); }
  .product-chip.selected::after {
    content: "✓"; position: absolute; top: 4px; right: 4px;
    background: var(--color-accent-solid); color: #fff;
    width: 20px; height: 20px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
  }
  .product-chip .chip-name {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,.75));
    color: #fff; font-size: 10px; padding: 10px 6px 4px; line-height: 1.2;
  }

  .faq-item {
    border: 1px solid var(--color-border-subtle); border-radius: var(--radius-md);
    background: var(--color-surface-2); padding: 10px 12px; margin-bottom: 8px;
  }
  .faq-item.activa { border-color: var(--color-accent-solid); }
  .faq-head { display: flex; align-items: center; gap: 10px; }
  .field-group .faq-head input[type="checkbox"] {
    width: 18px; height: 18px; padding: 0; margin: 0; flex-shrink: 0;
    accent-color: var(--color-accent-solid);
  }
  .faq-head .faq-q {
    flex: 1; font-size: 13px; font-weight: 600; line-height: 1.35;
    color: var(--color-text-primary); cursor: pointer;
  }
  .field-group .faq-head input.faq-q-input { flex: 1; width: auto; padding: 8px 10px; font-size: 13px; }
  .faq-quitar {
    background: none; border: none; color: var(--color-text-soft);
    font-size: 20px; line-height: 1; padding: 0 4px; cursor: pointer;
  }
  .faq-resp { display: none; margin-top: 8px; }
  .faq-item.activa .faq-resp { display: block; }
  .field-group .faq-resp textarea { min-height: 56px; font-size: 13px; }

  .btn-live {
    width: 100%; border: none; border-radius: var(--radius-pill);
    padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer;
    transition: transform .15s ease, opacity .15s ease;
  }
  .btn-live:active { transform: scale(0.98); }
  .btn-live:disabled { opacity: .5; cursor: not-allowed; }
  .btn-live.primary { background: var(--gradient-accent); color: #fff; }
  .btn-live.danger { background: #ef4444; color: #fff; }
  .btn-live.ghost {
    background: var(--color-surface-2); color: var(--color-text-primary);
    border: 1px solid var(--color-border-subtle);
  }

  .status-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: var(--radius-pill);
    font-size: 12px; font-weight: 700; letter-spacing: .03em;
  }
  .status-badge.live { background: rgba(239,68,68,.15); color: #f87171; }
  .status-badge.scheduled { background: rgba(96,165,250,.15); color: #60a5fa; }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #f87171;
    animation: pulse-dot 1.4s infinite;
  }
  @keyframes pulse-dot { 0%,100%{opacity:1;} 50%{opacity:.3;} }

  .viewer-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; font-weight: 700; color: var(--color-text-primary);
    background: var(--color-surface-2); border: 1px solid var(--color-border-subtle);
    padding: 6px 12px; border-radius: var(--radius-pill);
    margin-left: 6px; cursor: pointer;
  }

  .sheet-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.7);
    display: flex; align-items: flex-end; z-index: var(--z-modal, 300);
  }
  .sheet-panel {
    background: var(--color-surface); border-radius: 20px 20px 0 0;
    padding: 20px; width: 100%; box-sizing: border-box;
    max-height: 70vh; overflow-y: auto;
  }
  .sheet-panel h2 { margin: 0 0 12px; color: var(--color-text-primary); font-size: 17px; }
  .viewer-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 4px; border-bottom: 1px solid var(--color-border-subtle);
    font-size: 14px; color: var(--color-text-primary);
  }
  .viewer-row:last-child { border-bottom: none; }
  .viewer-row .hace { font-size: 11px; color: var(--color-text-soft); }
  .sheet-panel button.cerrar {
    width: 100%; border: none; border-radius: var(--radius-pill);
    padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer;
    background: var(--color-surface-2); color: var(--color-text-primary);
    border: 1px solid var(--color-border-subtle); margin-top: 12px;
  }

  .video-box {
    position: relative; width: 100%; aspect-ratio: 16/9; background: #000;
    border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 12px;
  }
  .video-box iframe { width: 100%; height: 100%; border: 0; display: block; }
  .video-box video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
  .vid-aviso {
    display: none; position: absolute; left: 8px; right: 8px; top: 44px; z-index: 2;
    background: rgba(0,0,0,.72); color: #fff; font-size: 11px; line-height: 1.35;
    padding: 6px 10px; border-radius: 8px; text-align: center;
  }
  .vid-btns {
    position: absolute; right: 8px; bottom: 8px; z-index: 2; display: flex; gap: 6px;
    flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 16px);
  }
  .vu { display: none; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.15); z-index: 2; }
  .vu i { display: block; height: 100%; width: 0; background: #4ade80; transition: width .12s; }
  .btn-camara {
    border: none;
    border-radius: var(--radius-pill); padding: 6px 10px; font-size: 11px; font-weight: 700;
    background: rgba(0,0,0,.6); color: #fff; cursor: pointer; white-space: nowrap;
  }
  .btn-camara:disabled { opacity: .5; }
  .resume-panel {
    display: none; position: absolute; inset: 0; z-index: 3; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; padding: 12px; text-align: center;
    background: rgba(0,0,0,.85); color: #fff; font-size: 12px; line-height: 1.4;
  }
  .resume-panel .btn-live { width: auto; padding: 10px 18px; font-size: 13px; }
  .sync-note {
    font-size: 11px; color: var(--color-text-soft); text-align: center;
    margin: -6px 0 14px;
  }

  .share-box {
    display: flex; gap: 8px; align-items: center;
    background: var(--color-surface-2); border-radius: var(--radius-md);
    padding: 10px 12px; margin: 12px 0;
  }
  .share-box input {
    flex: 1; background: none; border: none; color: var(--color-text-primary);
    font-size: 12px; font-family: monospace;
  }
  .share-box button {
    background: var(--color-primary); color: #fff; border: none;
    border-radius: var(--radius-md); padding: 8px 12px; font-size: 12px;
    font-weight: 600; cursor: pointer; white-space: nowrap;
  }

  .chat-panel {
    background: var(--color-surface-2); border-radius: var(--radius-md);
    height: 280px; display: flex; flex-direction: column; overflow: hidden;
  }
  .chat-messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .chat-msg { font-size: 13px; line-height: 1.4; }
  .chat-msg .author { font-weight: 700; color: var(--color-accent); margin-right: 6px; }
  .chat-msg .text { color: var(--color-text-primary); }
  .chat-msg.mine .author { color: var(--color-primary); }
  .chat-msg.faq { border-left: 2px solid var(--color-accent); padding-left: 8px; }
  .chat-empty { text-align: center; color: var(--color-text-soft); font-size: 12px; margin-top: auto; margin-bottom: auto; }
  .chat-input-row { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--color-border-subtle); flex-shrink: 0; }
  .chat-input-row input {
    flex: 1; min-width: 0; background: var(--color-surface); border: 1px solid var(--color-border-subtle);
    border-radius: var(--radius-pill); padding: 9px 12px; color: var(--color-text-primary); font-size: 13px;
  }
  .chat-input-row button {
    background: var(--gradient-accent); border: none; color: #fff;
    border-radius: 50%; width: 38px; height: 38px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }

  .upsell-icon { font-size: 40px; text-align: center; margin-bottom: 10px; }
  .center-text { text-align: center; }
  .loading-spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid var(--color-border-subtle); border-top-color: var(--color-accent-solid);
    animation: spin 0.8s linear infinite; margin: 40px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-msg { color: var(--color-error); font-size: 13px; margin-top: 8px; }

  /* ── Layout fijo durante la transmisión: video+info arriba,
     chat abajo, todo visible sin necesidad de hacer scroll ──
     Usamos --app-vh (calculado en JS con window.innerHeight /
     visualViewport) en vez de 100vh/100dvh, porque en varios
     navegadores de Android (Samsung Internet, WebViews viejos)
     100vh/100dvh miden más alto que lo realmente visible cuando
     la barra de direcciones está presente, y como el body tiene
     overflow:hidden, el contenido de abajo (botón de enviar,
     última fila de productos) queda fuera de la vista sin poder
     hacer scroll para alcanzarlo. ── */
  html:has(body.live-active) { overflow: hidden; width: 100%; }
  body.live-active {
    position: fixed; top: 0; left: 0; right: 0;
    width: 100%; max-width: 100%; margin: 0;
    height: 100vh; height: 100dvh; height: var(--app-vh, 100dvh);
    overflow: hidden;
    display: flex; flex-direction: column;
  }
  body.live-active > * { min-width: 0; max-width: 100%; }
  body.live-active .app-header { flex-shrink: 0; }
  body.live-active .live-wrap {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    padding: 0; overflow: hidden;
    width: 100%; min-width: 0; max-width: none; margin: 0; /* sin esto el carrusel estira toda la pantalla */
  }

  body.live-active .live-wrap > * { min-width: 0; max-width: 100%; box-sizing: border-box; }
  .live-top-fixed { flex-shrink: 0; }
  .live-top-fixed .video-box { border-radius: 0; margin-bottom: 0; }
  .live-middle-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px; }
  .live-bottom-fixed { flex-shrink: 0; padding: 0 12px 10px; }
  .live-bottom-fixed .chat-panel { height: 30vh; min-height: 180px; max-height: 300px; }

  /* ── Pantalla del live: video arriba (con los controles encima), carrusel
     de productos en una fila, y el chat ocupando todo el ancho abajo ── */
  .live-video {
    border-radius: 0; margin-bottom: 0; flex-shrink: 0; cursor: pointer;
    width: 100%; max-width: 100%; min-width: 0; min-height: 0;
    aspect-ratio: 16 / 9; height: auto;
    max-height: calc(var(--app-vh, 100dvh) * .40); /* tope: 40% del alto real visible */
  }
  .live-video video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .vid-top { position: absolute; left: 8px; top: 8px; z-index: 2; display: flex; align-items: center; gap: 6px; }
  .vid-top .status-dot { margin: 0 2px; }
  .vid-info {
    display: none; position: absolute; left: 0; right: 0; top: 0; z-index: 1; padding: 44px 12px 24px;
    background: linear-gradient(rgba(0,0,0,.8), transparent); color: #fff; pointer-events: none;
  }
  .vid-info.on { display: block; }
  .vid-info strong { display: block; font-size: 15px; }
  .vid-info span { font-size: 12px; opacity: .85; }
  .carrusel {
    flex-shrink: 0; min-width: 0; display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x proximity;
    padding: 8px 12px; border-bottom: 1px solid var(--color-border-subtle);
  }
  .carrusel { touch-action: pan-x pan-y; -webkit-overflow-scrolling: touch; }
  .carrusel .product-chip { flex: 0 0 clamp(60px, 18vw, 92px); width: clamp(60px, 18vw, 92px); scroll-snap-align: start; }
  .live-chat-col { flex: 1; min-height: 0; display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom, 0px); }
  body.live-active .chat-input-row input { font-size: 16px; }
  .live-chat-col .chat-panel { flex: 1; min-height: 0; height: auto; border-radius: 0; }

  .live-info-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; background: var(--color-surface);
    border-bottom: 1px solid var(--color-border-subtle);
  }
  .live-info-text { flex: 1; min-width: 0; }
  .li-title-line { display: flex; align-items: center; gap: 6px; }
  .li-title-line .status-dot { flex-shrink: 0; }
  .li-title {
    font-size: 13px; font-weight: 700; color: var(--color-text-primary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .li-sub-line { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
  .li-desc {
    font-size: 11px; color: var(--color-text-soft); flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .li-views {
    font-size: 11px; font-weight: 700; color: var(--color-text-soft);
    white-space: nowrap; flex-shrink: 0; background: none; border: none; cursor: pointer;
    padding: 0;
  }
  .btn-copy-icon {
    flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--color-border-subtle); background: var(--color-surface-2);
    color: var(--color-text-primary); font-size: 14px; cursor: pointer;
  }

  .chat-panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; font-size: 12px; font-weight: 700; color: var(--color-text-primary);
    border-bottom: 1px solid var(--color-border-subtle); flex-shrink: 0;
  }
  body.live-active .app-header .header-left { min-width: 0; max-width: 100%; }
  body.live-active .app-header .header-text { min-width: 0; }
  body.live-active .app-header .app-title,
  body.live-active .app-header .app-subtitle { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn-finalizar-mini {
    background: rgba(239,68,68,.15); color: #f87171; border: none;
    border-radius: var(--radius-pill); padding: 5px 12px; font-size: 11px;
    font-weight: 700; cursor: pointer;
  }

  /* ── Responsivo ── */
  body.live-active { touch-action: pan-y; overscroll-behavior: none; }
  body.live-active .live-chat-col .chat-messages { padding: 10px max(12px, env(safe-area-inset-left, 0px)); }

  /* Tablet / escritorio: columna centrada, no estirada */
  @media (min-width: 720px) {
    body.live-active .live-wrap { max-width: 720px; margin: 0 auto; border-left: 1px solid var(--color-border-subtle); border-right: 1px solid var(--color-border-subtle); }
  }

  /* Celulares muy bajitos: video un poco más chico para que el chat respire */
  @media (max-height: 640px) and (orientation: portrait) {
    .live-video { max-height: calc(var(--app-vh, 100dvh) * .32); }
  }

  /* Celular en horizontal: video + productos a la izquierda, chat a la derecha */
  @media (orientation: landscape) and (max-height: 560px) {
    body.live-active .live-wrap {
      display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) auto; max-width: none;
      padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
    }
    .live-video { grid-column: 1; grid-row: 1; aspect-ratio: auto; height: 100%; max-height: none; }
    .carrusel { grid-column: 1; grid-row: 2; }
    .live-chat-col { grid-column: 2; grid-row: 1 / span 2; border-left: 1px solid var(--color-border-subtle); }
  }
</style>
</head>
<body>
<header class="app-header">
  <div class="header-left">
    <a href="vendedor.html" class="logo-touch-area" style="text-decoration:none;">
      <span class="logo-mark"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" aria-hidden="true"><use href="#ic-arrow-left"/></svg></span>
    </a>
    <div class="header-text">
      <h1 class="app-title">Transmitir en vivo</h1>

  // navegadores Android que no lo calculan bien con la barra de
  // direcciones/gestos presente). Se usa como var(--app-vh) en el CSS
  // de body.live-active.
  (function () {
    function setAppVh() {
      const h = (window.visualViewport && window.visualViewport.height)
        ? window.visualViewport.height
        : window.innerHeight;
      document.documentElement.style.setProperty('--app-vh', h + 'px');
    }
    setAppVh();
    window.addEventListener('resize', setAppVh);
    window.addEventListener('orientationchange', setAppVh);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', setAppVh);

<script>

  // la regresa al origen mientras dura la transmisión.
  (function () {
    function reset() {
      if (!document.body.classList.contains('live-active')) return;
      if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
      document.documentElement.scrollLeft = 0;
      document.body.scrollLeft = 0;
    }
    window.addEventListener('scroll', reset, { passive: true });
    if (window.visualViewport) window.visualViewport.addEventListener('scroll', reset);
    window.addEventListener('resize', reset);
    document.addEventListener('focusin', () => setTimeout(reset, 50));
  })();

const LIVE_API_URL_VLIVE = "https://live-api-1038143238323.us-central1.run.app"; // TODO: pegar la URL real tras el deploy
async function apiFetch(data, method = 'POST') {
  const API_BASE = (data && data.action === 'misProductosComunidad') ? CATALOGO_API_URL_VLIVE : LIVE_API_URL_VLIVE;
  const params = new URLSearchParams();
  Object.entries(data || {}).forEach(([k, v]) => {
    if (v !== undefined && v !== null) params.append(k, v);
  });
  let res;
  if (method === 'GET') {
    res = await fetch(`${API_BASE}?${params.toString()}`, { method: 'GET' });
  } else {
    res = await fetch(API_BASE, {
      method: 'POST',
      body: params
    });
  }
  return JSON.parse(await res.text());
}

function hace(ts) {
  if (!ts) return '';
  const seg = Math.max(0, Math.floor((Date.now() - ts) / 1000));
  if (seg < 60) return 'justo ahora';
  const min = Math.floor(seg / 60);
  if (min < 60) return `hace ${min} min`;
  const hr = Math.floor(min / 60);
  return `hace ${hr} h`;
}

function renderFaqList() {
  const list = document.getElementById('faq-list');
  if (!list) return;
  list.innerHTML = faqItems.map(f => `
    <div class="faq-item ${f.activa ? 'activa' : ''}" data-uid="${f.uid}">
      <div class="faq-head">
        <input type="checkbox" class="faq-check" ${f.activa ? 'checked' : ''} aria-label="Habilitar esta pregunta">
        ${f.custom
          ? `<input type="text" class="faq-q-input" maxlength="80" placeholder="Escribe tu pregunta">`
          : `<span class="faq-q">${esc(f.pregunta)}</span>`}
        ${f.custom ? '<button type="button" class="faq-quitar" aria-label="Quitar pregunta">×</button>' : ''}
      </div>
      <div class="faq-resp">
        <textarea maxlength="250" placeholder="Tu respuesta">${esc(f.respuesta)}</textarea>
      </div>
    </div>`).join('');

  list.querySelectorAll('.faq-item').forEach(el => {
    const f = faqItems.find(x => x.uid === el.dataset.uid);
    if (!f) return;
    const check = el.querySelector('.faq-check');
    const setActiva = (v) => { f.activa = v; check.checked = v; el.classList.toggle('activa', v); };
    check.addEventListener('change', () => setActiva(check.checked));
    const qSpan = el.querySelector('.faq-q');
    if (qSpan) qSpan.addEventListener('click', () => setActiva(!f.activa));
    const qInput = el.querySelector('.faq-q-input');
    if (qInput) {
      qInput.value = f.pregunta; // por propiedad: esc() no escapa comillas dobles
      qInput.addEventListener('input', () => { f.pregunta = qInput.value; });
    }
    el.querySelector('textarea').addEventListener('input', (e) => { f.respuesta = e.target.value; });
    const quitar = el.querySelector('.faq-quitar');
    if (quitar) quitar.addEventListener('click', () => {
      faqItems = faqItems.filter(x => x.uid !== f.uid);
      renderFaqList();
    });
  });

  const addBtn = document.getElementById('btn-faq-add');
  if (addBtn) addBtn.disabled = faqItems.length >= FAQ_MAX;
}

async function fetchAllProducts() {

    const resp = await apiFetch({
      action: 'misProductosComunidad',
      vendorToken: vendorSession.token,
      estado: 'aprobado',
      limit: 200
    }, 'GET');
    if (resp.ok && resp.products) allProducts = resp.products;
  } catch (err) {

  }
}

async function loadProductGrid() {
  const grid = document.getElementById('product-grid');
  try {
    await fetchAllProducts();
    if (!allProducts.length) {
      grid.innerHTML = `<div class="chat-empty">Aún no tienes productos en tu catálogo de comunidad.</div>`;
      return;
    }
    grid.innerHTML = allProducts.map(p => `
      <div class="product-chip" data-id="${esc(p.id)}">
        <img src="${esc(p.imagen1 || 'https://placehold.co/200x200')}" alt="${esc(p.nombre)}" loading="lazy">
        <div class="chip-name">${esc(p.nombre)}</div>
      </div>
    `).join('');

    grid.querySelectorAll('.product-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const id = chip.dataset.id;
        if (selectedProductIds.has(id)) {
          selectedProductIds.delete(id);
          chip.classList.remove('selected');
        } else {
          selectedProductIds.add(id);
          chip.classList.add('selected');
        }
      });
    });
  } catch (err) {
    grid.innerHTML = `<div class="chat-empty">No se pudo cargar tu catálogo.</div>`;
  }
}

async function crearSesion() {
  const titulo = document.getElementById('f-titulo').value.trim();
  const desc = document.getElementById('f-desc').value.trim();
  const btn = document.getElementById('btn-crear-sesion');
  const genError = document.getElementById('f-general-error');
  genError.style.display = 'none';

  if (!titulo) { genError.textContent = 'Ponle un título a tu transmisión.'; genError.style.display = 'block'; return; }

  const faqActivas = faqItems.filter(f => f.activa);
  for (const f of faqActivas) {
    if (!f.pregunta.trim()) {
      genError.textContent = 'Escribe el texto de la pregunta que agregaste, o quítala.';
      genError.style.display = 'block';
      return;
    }
    if (!f.respuesta.trim()) {
      genError.textContent = `Escribe tu respuesta a "${f.pregunta.trim()}" o desactiva la pregunta.`;
      genError.style.display = 'block';
      return;
    }
  }
  btn.disabled = true;
  btn.textContent = 'Creando…';

  try {
    const resp = await apiFetch({
      action: 'crearSesionLive',
      vendorToken: vendorSession.token,
      titulo, descripcion: desc,
      tipo: tipoSeleccionado,
      orientacion: orientacionSeleccionada,
      productos_ids: Array.from(selectedProductIds).join(';'),
      faq: JSON.stringify(faqActivas.map(f => ({ pregunta: f.pregunta.trim(), respuesta: f.respuesta.trim() })))
    });

    if (!resp.ok) {
      genError.textContent = resp.error || 'No se pudo crear la transmisión.';
      genError.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Crear transmisión';
      return;
    }

    await cargarSesionActual();
  } catch (err) {
    genError.textContent = 'Error de conexión. Intenta de nuevo.';
    genError.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Crear transmisión';
  }
}

    btn.disabled = true;
    btn.textContent = 'Conectando cámara…';
    const restaurar = () => { btn.disabled = false; btn.innerHTML = textoOriginal; };

    try {
      await iniciarMedios();
    } catch (err) {
      alert(err.message);
      restaurar();
      return;
    }

    try {
      const resp = await apiFetch({ action: 'actualizarEstadoLive', vendorToken: vendorSession.token, id: currentSesion.id, estado: 'en_vivo' });
      if (resp.ok) {
        currentSesion.estado = 'en_vivo';
        currentSesion.fecha_inicio = resp.fecha_inicio || new Date().toISOString();
        if (!allProducts.length) await fetchAllProducts();
        renderLive();
        iniciarRespaldo();
      } else {
        await detenerTransmision();
        alert('No se pudo iniciar: ' + (resp.error || 'error desconocido'));
        restaurar();
      }
    } catch (err) {
      await detenerTransmision();
      alert('Error de conexión al iniciar. Intenta de nuevo.');
      restaurar();
    }
  });

  document.getElementById('btn-cancelar').addEventListener('click', async () => {
    if (!confirm('¿Cancelar esta transmisión programada?')) return;
    await apiFetch({ action: 'actualizarEstadoLive', vendorToken: vendorSession.token, id: currentSesion.id, estado: 'terminado' });
    currentSesion = null;
    renderCreateForm();
  });
}

  let ultimoErrorRTDB = '';
  const publicarProductoRTDB = async (id, p, tsFijo) => {
    p = p || {};
    // Las reglas de RTDB exigen: nombre string ≤120, imagen1 string ≤600, precio número.
    // Se normaliza para que un nombre numérico, o una URL de imagen muy larga, no hagan
    // que Firebase rechace toda la escritura.
    const precio = Number(p.precio);
    const imagen = String(p.imagen1 || '');
    const payload = {
      id: String(id).slice(0, 100),
      nombre: String(p.nombre || '').slice(0, 120),
      precio: Number.isFinite(precio) ? precio : 0,
      imagen1: imagen.length <= 600 ? imagen : '',
      ts: tsFijo || Date.now()
    };
    const destino = () => ref(db, `live_producto/${currentSesion.id}`);
    try {
      await set(destino(), payload);
      ultimoErrorRTDB = '';
      return true;
    } catch (e) {

      console.error('❌ live_producto: set falló →', ultimoErrorRTDB, '| uid:', authUid, '| liveId:', currentSesion.id, '| payload:', payload);
      liveIdsCertificados.delete(currentSesion.id);
      if (await certificarVendedorEnLive(currentSesion.id)) {
        try { await set(destino(), { ...payload, ts: Date.now() }); ultimoErrorRTDB = ''; return true; }
        catch (e2) {
          ultimoErrorRTDB = (e2.code || '') + ' ' + (e2.message || '') + ' (tras re-certificar)';
          console.error('❌ live_producto: falló también tras re-certificar →', ultimoErrorRTDB);
        }
      } else {
        ultimoErrorRTDB += ' | certificarVendedorLive no devolvió ok';
      }
      return false;
    }
  };

  document.querySelectorAll('#live-product-grid .product-chip').forEach(chip => {
    chip.addEventListener('click', async () => {
      const anterior = currentSesion.producto_actual_id, id = chip.dataset.id;

      currentSesion.producto_actual_id = id; marcar(id);
      const p = misProductos.find(x => String(x.id) === String(id)) || {};
      const tsDestacado = Date.now();
      // Camino 1: el navegador escribe directo en RTDB (rápido).
      const rtdbOk = publicarProductoRTDB(id, p, tsDestacado);
      let r = null, motivo = '';
      // Camino 2: el servidor guarda el producto y TAMBIÉN lo publica en RTDB, sin
      // depender del uid anónimo de este navegador.
      try {

        if (r.rtdb === true) {

// ── 2º dispositivo que solo graba ──
// live_control/{liveId} (RTDB) coordina los dos equipos:
//   cam: 'pide' (el 2º quiere publicar) → 'libre' (este equipo soltó la cámara) → 'on' | 'off'
//   pedir: 'finalizar' (lo pide el 2º) | 'soltar' (lo pide este equipo) | 'terminado'
// Mientras el otro equipo graba, este se vuelve espectador (silencio por defecto).
let ctrlUnsub = null, verActivo = false, verPC = null, verTimer = null, detenerVU = null, volviendo = false, finalizando = false, modalCamara = null;
const ctrlRef = () => ref(db, `live_control/${currentSesion.id}`);

function setupControl() {
  if (ctrlUnsub) ctrlUnsub();
  ctrlUnsub = onValue(ctrlRef(), async (snap) => {
    const c = snap.val() || {};
    if (c.cam === 'pide') {
      await detenerTransmision(); // suelta cámara y Cloudflare antes de que el otro equipo publique
      update(ctrlRef(), { cam: 'libre', ts: Date.now() }).catch(() => {});
    } else if ((c.cam === 'libre' || c.cam === 'on') && !verActivo && !finalizando) {
      entrarModoVer();
    } else if (c.cam === 'off' && verActivo) {
      salirModoVer();
      mostrarPanelReanudar();
      if (volviendo) { volviendo = false; document.getElementById('btn-reanudar').click(); }
    }
    if (c.pedir === 'finalizar' && !finalizando && Date.now() - (c.ts || 0) < 60000) {
      update(ctrlRef(), { pedir: '' }).catch(() => {});
      finalizarTransmision(document.getElementById('btn-finalizar'));
    }
  });
}

async function entrarModoVer() {
  verActivo = true;
  if (modalCamara) { modalCamara.remove(); modalCamara = null; }
  const panel = document.getElementById('resume-panel');
  if (panel) panel.style.display = 'none';
  document.getElementById('btn-camara').textContent = '🔇 Sonido';
  document.getElementById('btn-otro').textContent = '📱 Grabar aquí';
  document.getElementById('vu').style.display = 'block';
  const v = document.getElementById('vendor-preview');
  v.style.transform = 'none';
  v.muted = true;
  let url;
  try { url = (await LP.credenciales()).playbackUrl; } catch (e) { return avisoVideo('No se pudo cargar la vista del live.'); }
  const conectar = async () => {
    if (!verActivo) return;
    clearTimeout(verTimer);
    if (verPC) verPC.close();
    const pc = verPC = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.cloudflare.com:3478' }], bundlePolicy: 'max-bundle' });
    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.addTransceiver('audio', { direction: 'recvonly' });
    const entrante = new MediaStream(); // video y audio juntos en el <video> (Chrome si no, el medidor de audio queda mudo)
    pc.ontrack = (e) => {
      entrante.addTrack(e.track);
      if (v.srcObject !== entrante) v.srcObject = entrante;
      v.play().catch(() => {});
      if (e.track.kind === 'video') avisoVideo(null);
      else { if (detenerVU) detenerVU(); detenerVU = medidorAudio(entrante, document.getElementById('vu-bar')); }
    };
    pc.onconnectionstatechange = () => {
      if (pc === verPC && ['failed', 'disconnected'].includes(pc.connectionState)) verTimer = setTimeout(conectar, 3000);
    };
    try {
      await pc.setLocalDescription(await pc.createOffer());
      await esperarIce(pc, 3000);
      const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/sdp' }, body: pc.localDescription.sdp });
      if (!res.ok) throw new Error('WHEP ' + res.status);
      await pc.setRemoteDescription({ type: 'answer', sdp: await res.text() });
    } catch (e) {
      avisoVideo('Esperando la señal del otro dispositivo…');
      verTimer = setTimeout(conectar, 3000);
    }
  };
  avisoVideo('Conectando con el otro dispositivo…');
  conectar();
}

function salirModoVer() {
  verActivo = false;
  clearTimeout(verTimer);
  if (verPC) { verPC.close(); verPC = null; }
  if (detenerVU) { detenerVU(); detenerVU = null; }
  const v = document.getElementById('vendor-preview');
  if (v) v.srcObject = null;
  const b = (id) => document.getElementById(id);
  if (!b('btn-camara')) return;
  b('btn-camara').textContent = '🔄 Cámara';
  b('btn-otro').textContent = '📱 Otro equipo';
  b('vu').style.display = 'none';
  avisoVideo(null);
}

function alternarSonido() {
  const v = document.getElementById('vendor-preview');
  v.muted = !v.muted;
  document.getElementById('btn-camara').textContent = v.muted ? '🔇 Sonido' : '🔊 Sonido';

function volverAGrabarAqui() {
  if (!confirm('El otro dispositivo dejará de grabar y este volverá a transmitir. ¿Continuar?')) return;

// Link + QR de un solo uso (10 min) para abrir camara-live.html en el otro equipo.
async function enlazarDispositivo() {
  const r = await apiFetch({ action: 'crearEnlaceCamara', vendorToken: vendorSession.token, id: currentSesion.id }).catch(() => null);
  if (!r || !r.ok) return alert((r && r.error) || 'No se pudo crear el enlace. Revisa tu conexión.');
  if (!window.qrcode) await new Promise((ok) => { const s = document.createElement('script'); s.src = 'qr.js'; s.onload = s.onerror = ok; document.head.appendChild(s); });
  const url = `${location.origin}${location.pathname.replace('vendedor-live.html', 'camara-live.html')}?id=${currentSesion.id}#${r.token}`;
  let qr = '';
  if (window.qrcode) { const q = qrcode(0, 'L'); q.addData(url); q.make(); qr = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); }
  modalCamara = document.createElement('div');
  modalCamara.className = 'sheet-overlay';
  modalCamara.innerHTML = `
    <div class="sheet-panel">
      <h2>📱 Grabar con otro dispositivo</h2>
      <p class="hint">Abre este link en el otro equipo (o escanea el QR). Este dispositivo pasará a ver la transmisión. El link sirve una vez y vence en 10 min.</p>
      <div style="width:180px;margin:0 auto 10px;background:#fff;padding:4px;border-radius:8px;">${qr}</div>
      <input type="text" id="cam-url" readonly value="${esc(url)}">
      <button class="btn-live primary" id="cam-copy">Copiar link</button>
      <button class="cerrar" id="cam-cerrar">Cerrar</button>
    </div>`;
  document.body.appendChild(modalCamara);
  const cerrar = () => { if (modalCamara) { modalCamara.remove(); modalCamara = null; } };
  document.getElementById('cam-cerrar').onclick = cerrar;
  document.getElementById('cam-copy').onclick = (e) => { navigator.clipboard.writeText(url).catch(() => {}); e.target.textContent = '¡Copiado!'; };
  modalCamara.onclick = (e) => { if (e.target === modalCamara) cerrar(); };
}

// ── Cierre de transmisión: registra ventas, genera la página de
// entregas (100% local, sin backend) y guarda un historial liviano
// en este navegador para poder volver a abrirla después. ──
async function finalizarTransmision(finBtn) {
  finalizando = true;
  salirModoVer();
  if (finBtn) { finBtn.disabled = true; finBtn.textContent = 'Finalizando…'; }
  await detenerTransmision(); // corta cámara y Cloudflare, y sube el último segmento del respaldo
  try { localStorage.removeItem('znr_live_seq_' + currentSesion.id); } catch (e) { /* sin storage */ }

  let entregaUrl = null;

  try {
    const snap = await withTimeout(get(ref(db, `chats/${currentSesion.id}/messages`)), 5000);
    const data = snap.val() || {};
    const vendidos = Object.values(data).filter(m => m.vendido && !m.isVendor && !m.faq);

    // El teléfono/dirección/horario/GPS ya no viajan en el mensaje de
    // chat — se piden en bloque al backend (que lee contactos/{liveId}
    // en RTDB con credenciales de servidor y deja auditoría), y solo
    // para los uid que realmente tienen algo marcado como vendido.
    const uidsConVenta = [...new Set(vendidos.map(m => m.uid).filter(Boolean))];
    let contactosPorUid = {};
    if (uidsConVenta.length > 0) {
      try {
        const respContactos = await withTimeout(apiFetch({
          action: 'obtenerContactosParaCierre',
          vendorToken: vendorSession.token,
          liveId: currentSesion.id,
          uids: JSON.stringify(uidsConVenta)
        }), 8000);
        if (respContactos.ok) contactosPorUid = respContactos.contactos || {};
        else console.error('obtenerContactosParaCierre falló:', respContactos.error);
      } catch (errContactos) {
        console.error('obtenerContactosParaCierre falló:', errContactos);
      }
    }

    const ventas = vendidos.map(m => {
      const c = contactosPorUid[m.uid] || {};
      return {
        productId: m.producto_id || '',
        comprador_nombre: m.author || '',
        comprador_telefono: c.telefono || '',
        comprador_nota: c.nota || '',
        comprador_horario: c.horario || '',
        comprador_lat: (typeof c.lat === 'number') ? c.lat : null,
        comprador_lng: (typeof c.lng === 'number') ? c.lng : null,
        comprador_direccion: '' // se llena abajo con lo que regrese cerrarVentasLive
      };
    });

    if (ventas.length > 0) {
      // El reverse geocoding (coords -> dirección legible) tarda ~1.1s
      // por comprador distinto (política de Nominatim) — el timeout
      // fijo de 8s no alcanza si hay varios, así que crece con la
      // cantidad de compradores únicos.
      const timeoutCierre = Math.max(8000, 3000 + uidsConVenta.length * 1300);
      const resp = await withTimeout(apiFetch({
        action: 'cerrarVentasLive',
        vendorToken: vendorSession.token,
        ventas: JSON.stringify(ventas)
      }), timeoutCierre);
      if (resp.ok) {
        alert(`${resp.added} venta(s) de ${resp.compradores} comprador(es) enviadas a tus notificaciones para confirmar.`);
        // La dirección legible ya se calculó una sola vez adentro de
        // cerrarVentasLive (reverse geocoding) — se reutiliza aquí para
        // no volver a llamar a Nominatim al armar la página de entregas.
        const direcciones = resp.direcciones || {};
        ventas.forEach(v => {
          v.comprador_direccion = direcciones[v.comprador_telefono || ''] || '';
        });
      } else {
        alert('No se pudieron registrar las ventas: ' + (resp.error || 'error desconocido') + '. Puedes revisarlas manualmente en el chat.');
      }
      entregaUrl = await crearPaginaEntregas(ventas);
    }
  } catch (err) {
    console.error('finalizarTransmision: no se pudieron leer los "vendidos" (revisa las reglas de Firebase):', err);
    alert('No se pudieron leer los "vendidos" del chat (puede ser tu conexión). Se va a cerrar de todos modos — revísalos manualmente si hace falta.');
  }

  try {
    await withTimeout(apiFetch({ action: 'actualizarEstadoLive', vendorToken: vendorSession.token, id: currentSesion.id, estado: 'terminado' }), 8000);
  } catch (err) {
    console.error('actualizarEstadoLive (terminado) falló:', err);
    alert('Ojo: no se pudo confirmar el cierre con el servidor (revisa tu conexión). Si al recargar la página sigue apareciendo como "en vivo", entra de nuevo y dale Finalizar otra vez.');
  }

  update(ctrlRef(), { pedir: 'terminado', ts: Date.now() }).catch(() => {}); // el 2º dispositivo se apaga solo
  if (chatUnsub) chatUnsub();
  if (presenceUnsub) { presenceUnsub(); presenceUnsub = null; }
  renderEnded(entregaUrl);
}

// ── Arma el paquete de entrega (agrupado por comprador) y lo guarda
// en el backend (hoja Entregas_Live). El link que se comparte solo
// lleva el id del 00000
// y el estado ENTREGADO/PENDIENTE queda guardado, no solo local. ──
async function crearPaginaEntregas(ventas) {
  try {
    const grupos = {};
    ventas.forEach(v => {
      const key = v.comprador_telefono || ('sin_tel_' + v.comprador_nombre);
      if (!grupos[key]) {
        grupos[key] = {
          key: key,
          nombre: v.comprador_nombre || 'Comprador',
          telefono: v.comprador_telefono || '',
          direccion: v.comprador_direccion || '', // ya viene reverse-geocodificada desde cerrarVentasLive
          nota: v.comprador_nota || '',
          horario: v.comprador_horario || '',
          lat: (typeof v.comprador_lat === 'number') ? v.comprador_lat : null,
          lng: (typeof v.comprador_lng === 'number') ? v.comprador_lng : null,
          items: [],
          total: 0
        };
      }
      const prod = allProducts.find(p => String(p.id) === String(v.productId));
      const precio = prod ? (Number(prod.precio) || 0) : 0;
      grupos[key].items.push({ nombre: (prod && prod.nombre) || 'Producto', precio });
      grupos[key].total += precio;
    });

    const gruposArr = Object.values(grupos);
    if (!gruposArr.length) return null;

    // Normalmente cada grupo ya trae "direccion" pre-calculada (ver
    // finalizarTransmision), así que esto no debería necesitar
    // geocodificar de nuevo — el margen extra es solo por si algún
    // grupo llegó sin ella y el backend tiene que hacerlo de respaldo.
    const timeoutEntregas = Math.max(8000, 3000 + gruposArr.length * 1300);
    const resp = await withTimeout(apiFetch({
      action: 'guardarEntregasLive',
      vendorToken: vendorSession.token,
      liveId: currentSesion.id,
      liveTitulo: currentSesion.titulo || '',
      grupos: JSON.stringify(gruposArr)
    }), timeoutEntregas);

    if (!resp.ok) {
      console.error('guardarEntregasLive falló:', resp.error);
      return null;
    }

    return `${location.origin}${location.pathname.replace('vendedor-live.html', 'entregas-live.html')}?id=${encodeURIComponent(currentSesion.id)}`;
  } catch (err) {
    console.error('crearPaginaEntregas falló:', err);
    return null;
  }
}

function renderEnded(entregaUrl) {
  document.body.classList.remove('live-active');
  subtitle.textContent = 'Finalizada';
  wrap.innerHTML = `
    <div class="live-card center-text">
      <div class="upsell-icon"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" aria-hidden="true"><use href="#ic-check"/></svg></div>
      <h2>Transmisión finalizada</h2>
      <p class="hint">¡Buen trabajo! Cuando quieras, puedes crear una nueva transmisión.</p>
      ${entregaUrl ? `
        <p class="hint" style="text-align:left;">${Icon('box')} Ya puedes coordinar las entregas de esta transmisión. Comparte este link con tu repartidor si lo necesitas:</p>
        <div class="share-box">
          <input type="text" readonly value="${esc(entregaUrl)}" id="entrega-url">
          <button id="btn-copy-entrega">Copiar</button>
        </div>
        <button class="btn-live primary" id="btn-abrir-entregas">${Icon('box')} Ver página de entregas</button>
        <div style="height:8px;"></div>
      ` : ''}
      <button class="btn-live ${entregaUrl ? 'ghost' : 'primary'}" id="btn-nueva">Crear nueva transmisión</button>
    </div>`;

  if (entregaUrl) {
    document.getElementById('btn-copy-entrega').addEventListener('click', () => {
      navigator.clipboard.writeText(entregaUrl).catch(() => {});
      const btn = document.getElementById('btn-copy-entrega');
      btn.textContent = '¡Copiado!';
      setTimeout(() => { btn.textContent = 'Copiar'; }, 1500);
    });
    document.getElementById('btn-abrir-entregas').addEventListener('click', () => {
      window.open(entregaUrl, '_blank');
    });
  }

  document.getElementById('btn-nueva').addEventListener('click', () => {
    currentSesion = null;
    selectedProductIds = new Set();
    renderCreateForm();
  });
}

function marcarVendido(liveId, key, msg) {
  if (msg.vendido) {
    if (confirm(`¿Quitar el marcado de vendido a "${msg.text}" de ${msg.author}?`)) {
      update(ref(db, `chats/${liveId}/messages/${key}`), { vendido: false }).catch(err => {
        console.error('marcarVendido (quitar) falló:', err);
        alert('No se pudo quitar el marcado de vendido: ' + err.message);
      });
    }
    return;
  }
  if (confirm(`¿Marcar "${msg.text}" de ${msg.author} como vendido?`)) {
    update(ref(db, `chats/${liveId}/messages/${key}`), { vendido: true }).catch(err => {
      console.error('marcarVendido falló:', err);
      alert('No se pudo marcar como vendido: ' + err.message);
    });
  }
}

// ── Chat con Firebase Realtime Database ──
function setupChat(liveId, myName, isVendor) {
  const messagesEl = document.getElementById('chat-messages');
  const inputEl = document.getElementById('chat-input');
  const sendBtn = document.getElementById('chat-send');
  const chatRef = query(ref(db, `chats/${liveId}/messages`), limitToLast(100));

  chatUnsub = onValue(chatRef, (snapshot) => {
    const data = snapshot.val();
    if (!data) { messagesEl.innerHTML = '<div class="chat-empty">Aún no hay mensajes.</div>'; return; }
    const entries = Object.entries(data).sort((a, b) => (a[1].ts || 0) - (b[1].ts || 0));
    messagesEl.innerHTML = entries.map(([key, m]) => {
      const prod = m.producto_id ? allProducts.find(p => String(p.id) === String(m.producto_id)) : null;
      const prodTag = prod ? `
        <div style="display:flex; align-items:center; gap:5px; margin-top:3px; opacity:.8;">
          <img src="${esc(prod.imagen1 || 'https://placehold.co/40x40')}" style="width:16px;height:16px;border-radius:4px;object-fit:cover;">
          <span style="font-size:10px; color:var(--color-text-soft);">${esc(prod.nombre)}</span>
        </div>` : '';
      return `
      <div class="chat-msg ${m.author === myName ? 'mine' : ''}${m.faq ? ' faq' : ''}" data-key="${esc(key)}" style="${!m.isVendor && !m.faq ? 'cursor:pointer;' : ''}">
        <span class="author">${esc(m.author)}${m.isVendor ? ' ' + Icon('shopping-bag') : ''}:</span>
        <span class="text">${esc(m.text)}</span>
        ${m.vendido ? `<span class="vendido-tag" style="display:inline-block;margin-left:6px;font-size:10px;font-weight:700;background:rgba(74,222,128,.15);color:#4ade80;padding:2px 7px;border-radius:999px;">${Icon('check')} Vendido</span>` : ''}
        ${prodTag}
      </div>`;
    }).join('');
    messagesEl.scrollTop = messagesEl.scrollHeight;

    if (isVendor) {
      messagesEl.querySelectorAll('.chat-msg[data-key]').forEach(el => {
        const key = el.dataset.key;
        const msg = data[key];
        if (msg.isVendor || msg.faq) return;
        el.addEventListener('click', () => marcarVendido(liveId, key, msg));
      });
    }
  }, (err) => {
    console.error('setupChat onValue falló (revisa las reglas de Firebase):', err);
    messagesEl.innerHTML = `<div class="chat-empty">No se pudo cargar el chat: ${esc(err.message)}</div>`;
  });

  function send() {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    push(ref(db, `chats/${liveId}/messages`), {
      uid: authUid, author: myName, text, isVendor, ts: Date.now(),
      producto_id: String(currentSesion.producto_actual_id || '')
    }).catch(err => {
      console.error('send (chat vendedor) falló (revisa las reglas de Firebase):', err);
      alert('No se pudo enviar el mensaje: ' + err.message);
      inputEl.value = text;
    });
  }
  sendBtn.addEventListener('click', send);
  inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
}

// ── Carga inicia45
async function cargarSesionActual() {
  wrap.innerHTML = '<div class="loading-spinner"></div>';
  try {
    const resp = await apiFetch({ action: 'obtenerMisSesionesLive', vendorToken: vendorSession.token }, 'GET');
    if (!resp.ok) {
      renderCreateForm();
      const genError = document.getElementById('f-general-error');
      if (genError) { genError.textContent = 'No se pudo cargar tu sesión: ' + (resp.error || 'error desconocido'); genError.style.display = 'block'; }
      return;
    }
    if (resp.sesiones && resp.sesiones.length) {
      const activa = resp.sesiones.find(s => s.estado === 'programado' || s.estado === 'en_vivo');
      if (activa) {
        currentSesion = activa;
        if (!allProducts.length) await fetchAllProducts();
        if (activa.estado === 'en_vivo') renderLive();
        else renderScheduled();
        return;
      }
    }
    renderCreateForm();
  } catch (err) {
    renderCreateForm();
    const genError = document.getElementById('f-general-error');
    if (genError) { genError.textContent = 'No se pudo cargar tu sesión: ' + err.message; genError.style.display = 'block'; }
  }
}

async function init() {
  const raw = localStorage.getItem('vendor_session');
  if (!raw) { renderNoSession(); return; }
  try { vendorSession = JSON.parse(raw); } catch (e) { renderNoSession(); return; }
  if (!vendorSession || !vendorSession.token) { renderNoSession(); return; }

  if (vendorSession.plan !== 'plus') { renderNoPlus(); return; }

  await cargarSesionActual();
}

init();
