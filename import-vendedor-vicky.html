<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Crear cuenta — Vicky AP</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; background:#111; color:#eee; }
  h1 { font-size: 20px; }
  .card { background:#1c1c1c; border:1px solid #333; border-radius:10px; padding:20px; margin-top:16px; }
  label { display:block; margin-bottom:6px; font-size:13px; color:#aaa; }
  input[type=text] { width:100%; box-sizing:border-box; padding:10px; border-radius:6px; border:1px solid #444; background:#000; color:#eee; font-size:14px; margin-bottom:14px; }
  button { width:100%; padding:12px; border:none; border-radius:8px; background:#ec4899; color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #log { white-space:pre-wrap; font-family:monospace; font-size:13px; background:#000; border-radius:8px; padding:12px; margin-top:14px; }
  .ok { color:#4ade80; } .err { color:#f87171; }
</style>
</head>
<body>
  <h1>Crear cuenta de vendedor — Vicky AP</h1>
  <div class="card">
    <p>uid: <code>v_1779036431879</code> (el mismo que ya usan sus 129 productos importados) · teléfono: <code>8671235045</code></p>
    <label for="token">Token de admin</label>
    <input type="text" id="token" placeholder="Pega aquí tu ADMIN_TOKEN">
    <button id="btn">Crear cuenta</button>
    <div id="log"></div>
  </div>

<script>
const VENDEDOR = { uid: "v_1779036431879", nombre: "Vicky AP", telefono: "8671235045" };
const API_URL = "https://vendedores-api-1038143238323.us-central1.run.app";

document.getElementById('btn').addEventListener('click', async () => {
  const token = document.getElementById('token').value.trim();
  const btn = document.getElementById('btn');
  const log = document.getElementById('log');
  if (!token) { alert('Pega tu token de admin primero.'); return; }
  btn.disabled = true;
  btn.textContent = 'Creando...';
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ action: 'importarVendedorLegacy', token, ...VENDEDOR }).toString()
    });
    const data = await res.json();
    if (data.ok) {
      log.innerHTML = '<span class="ok">Cuenta creada.</span>\n\nTeléfono: ' + data.telefono +
        '\nContraseña temporal: ' + data.codigo +
        '\n\nCompártele estos datos para que inicie sesión — puede cambiar la contraseña después desde su perfil.';
    } else {
      log.innerHTML = '<span class="err">Error: ' + (data.error || 'desconocido') + '</span>';
    }
  } catch (err) {
    log.innerHTML = '<span class="err">Error de red: ' + err.message + '</span>';
  }
  btn.disabled = false;
  btn.textContent = 'Crear cuenta';
});
</script>
</body>
</html>
