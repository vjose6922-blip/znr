<style>
  .entregas-wrap { max-width: 640px; margin: 0 auto; padding: 16px; padding-bottom: 80px; }

  .resumen-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .resumen-chip {
    text-align: center; padding: 8px 4px;
    border-radius: var(--radius-md); background: var(--color-surface);
    border: 1px solid var(--color-border-subtle);
  }
  .resumen-chip .num { font-size: 16px; font-weight: 800; color: var(--color-text-primary); display: block; }
  .resumen-chip .lbl { font-size: 9.5px; color: var(--color-text-soft); text-transform: uppercase; letter-spacing: .03em; }
  .resumen-chip.ok .num { color: #4ade80; }
  .resumen-chip.pend .num { color: #fbbf24; }
  .resumen-chip.ruta .num { color: #60a5fa; }

  .ruta-actions { display: flex; gap: 8px; margin-bottom: 14px; }
  .btn-ruta-accion {
    flex: 1; border: none; border-radius: var(--radius-md); cursor: pointer;
    background: var(--color-surface-2); color: var(--color-text-primary);
    border: 1px solid var(--color-border-subtle);
    padding: 10px 6px; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }

  .btn-refrescar {
    display: block; width: 100%; text-align: center; margin-bottom: 14px;
    background: var(--color-surface-2); color: var(--color-text-primary);
    border: 1px solid var(--color-border-subtle); border-radius: var(--radius-md);
    padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer;
  }

  .entrega-card {
    background: var(--color-surface); border: 1px solid var(--color-border-subtle);
    border-radius: var(--radius-lg); margin-bottom: 10px; overflow: hidden;
    transition: opacity .2s ease;
  }
  .entrega-card.is-entregado { opacity: .55; }

  .card-header {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer;
  }
  .card-header .ch-info { flex: 1; min-width: 0; }
  .card-header h2 { margin: 0; font-size: 14.5px; color: var(--color-text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-header .ch-total { font-size: 12px; color: var(--color-text-soft); }
  .card-header .chevron { color: var(--color-text-soft); transition: transform .2s ease; flex-shrink: 0; }
  .entrega-card.expanded .chevron { transform: rotate(180deg); }

  .card-body { padding: 0 14px 14px; }

  .entrega-card .tel-link { font-size: 13px; color: var(--color-accent); text-decoration: none; }

  .estado-pill {
    font-size: 9.5px; font-weight: 700; letter-spacing: .02em;
    padding: 4px 9px; border-radius: var(--radius-pill); white-space: nowrap; flex-shrink: 0;
  }
  .estado-pill.pendiente { background: rgba(251,191,36,.15); color: #fbbf24; }
  .estado-pill.preparando { background: rgba(251,146,60,.15); color: #fb923c; }
  .estado-pill.en-ruta { background: rgba(96,165,250,.15); color: #60a5fa; }
  .estado-pill.cerca { background: rgba(192,132,252,.15); color: #c084fc; }
  .estado-pill.entregado { background: rgba(74,222,128,.15); color: #4ade80; }

  .entrega-detail { font-size: 13px; color: var(--color-text-soft); margin: 2px 0; line-height: 1.4; }
  .entrega-detail b { color: var(--color-text-primary); font-weight: 600; }

  .items-list { margin: 10px 0; padding: 10px 12px; background: var(--color-surface-2); border-radius: var(--radius-md); }
  .items-list .item-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--color-text-primary); padding: 3px 0; }
  .items-list .item-row span:last-child { color: var(--color-text-soft); }
  .total-row { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--color-border-subtle); color: var(--color-text-primary); }

  .btn-maps {
    display: block; text-align: center; text-decoration: none;
    background: var(--color-surface-2); color: var(--color-text-primary);
    border: 1px solid var(--color-border-subtle); border-radius: var(--radius-md);
    padding: 10px; font-size: 13px; font-weight: 600; margin: 10px 0;
  }
  .btn-maps:active { opacity: .8; }

  .estado-actions { display: flex; gap: 8px; margin-top: 10px; }
  .estado-actions button {
    flex: 1; border: none; border-radius: var(--radius-pill);
    padding: 11px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .estado-actions button:disabled { opacity: .5; cursor: default; }
  .btn-entregado { background: rgba(74,222,128,.15); color: #4ade80; }
  .btn-entregado.active { background: #4ade80; color: #0a2e1a; }
  .btn-pendiente { background: rgba(251,191,36,.15); color: #fbbf24; }
  .btn-pendiente.active { background: #fbbf24; color: #3a2a04; }
  .btn-avisar { background: rgba(59,130,246,.15); color: #60a5fa; }
  .btn-avisar:disabled { opacity: .6; }

  .btn-tracking {
    border: none; border-radius: var(--radius-md); cursor: pointer;
    background: rgba(168,85,247,.15); color: #c084fc;
    padding: 10px; font-size: 12.5px; font-weight: 700;
  }
  .btn-tracking.active { background: #c084fc; color: #2a0a3a; }

  .drag-handle {
    cursor: grab; color: var(--color-text-soft); padding: 4px 6px;
    touch-action: none; user-select: none; font-size: 16px; line-height: 1; flex-shrink: 0;
  }
  .entrega-card.dragging { opacity: .4; }
  .orden-num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 50%; background: var(--color-surface-2);
    color: var(--color-text-soft); font-size: 10.5px; font-weight: 700; flex-shrink: 0;
  }

  .live-mini-map {
    width: 100%; height: 160px; border-radius: 12px; margin: 10px 0;
    background: var(--color-surface-2);
  }
  .live-mini-map-label {
    font-size: 11px; color: #c084fc; font-weight: 700; margin: 10px 0 4px;
    display: flex; align-items: center; gap: 5px;
  }

  .route-modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 200;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .route-modal {
    background: var(--color-surface); width: 100%; max-width: 640px;
    border-radius: 18px 18px 0 0; max-height: 92vh; display: flex; flex-direction: column;
    overflow: hidden;
  }
  .route-modal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px; border-bottom: 1px solid var(--color-border-subtle);
  }
  .route-modal-header h3 { margin: 0; font-size: 15px; color: var(--color-text-primary); }
  .route-modal-close { background: none; border: none; color: var(--color-text-soft); font-size: 20px; cursor: pointer; }
  #route-map { width: 100%; height: 45vh; }
  .route-list { overflow-y: auto; padding: 10px 16px 20px; }
  .route-list-item { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--color-border-subtle); }
  .route-list-item:last-child { border-bottom: none; }
  .route-list-item .rli-num {
    width: 22px; height: 22px; border-radius: 50%; background: var(--color-accent-solid, #ec4899);
    color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;
  }
  .route-list-item .rli-nombre { font-size: 13.5px; color: var(--color-text-primary); font-weight: 600; }
  .route-list-item .rli-dir { font-size: 12px; color: var(--color-text-soft); }

  .center-card { max-width: 480px; margin: 60px auto; padding: 0 20px; text-align: center; }
  .center-card .icon { font-size: 44px; margin-bottom: 12px; }
  .center-card h2 { color: var(--color-text-primary); margin: 0 0 8px; }
  .center-card p { color: var(--color-text-soft); font-size: 14px; line-height: 1.5; }

  .loading-spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid var(--color-border-subtle); border-top-color: var(--color-accent-solid);
    animation: spin 0.8s linear infinite; margin: 60px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .local-note {
    font-size: 11px; color: var(--color-text-soft); text-align: center;
    margin: 18px 0 4px; line-height: 1.5;
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <div class="header-text">
      <h1 class="app-title" id="header-title">Entregas</h1>
      <p class="app-subtitle" id="header-subtitle">Cargando…</p>
    </div>
  </div>
</header>

<main class="entregas-wrap" id="entregas-wrap"><div class="loading-spinner"></div></main>



<script src="znr-devconsole.js"></script>


 
<script>
(function() {
  'use strict';

  async function apiFetch(data, method = 'GET') {
    const API_BASE = "https://live-api-1038143238323.us-central1.run.app"; // TODO: pegar la URL real tras el deploy
    const params = new URLSearchParams();
    Object.entries(data || {}).forEach(([k, v]) => {
      if (v !== undefined && v !== null) params.append(k, v);
    });
    let res;
    if (method === 'GET') {
      res = await fetch(`${API_BASE}?${params.toString()}`, { method: 'GET' });
    } else {
      res = await fetch(API_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params.toString()
      });
    }
    return JSON.parse(await res.text());
  }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  const wrap = document.getElementById('entregas-wrap');
  const headerTitle = document.getElementById('header-title');
  const headerSubtitle = document.getElementById('header-subtitle');
  const params = new URLSearchParams(location.search);
  const liveId = params.get('id');

  let entrega = null;

  function renderInvalido(msg) {
    headerSubtitle.textContent = 'Enlace inválido';
    wrap.innerHTML = `
      <div class="center-card">
        <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" aria-hidden="true"><use href="#ic-link"/></svg></div>
        <h2>No pudimos cargar esta entrega</h2>
        <p>${esc(msg || 'Pide al vendedor que te comparta el link de nuevo.')}</p>
      </div>`;
}

  function mapsUrl(g) {
    if (typeof g.lat === 'number' && typeof g.lng === 'number') {
      return `https://www.google.com/maps?q=${g.lat},${g.lng}`;
    }
    if (g.direccion) {
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(g.direccion)}`;
    }
    return null;
  }

  function renderResumen() {
    const total = entrega.grupos.length;
    const entregados = entrega.grupos.filter(g => g.estado === 'entregado').length;
    const enRuta = entrega.grupos.filter(g => g.estado === 'en-ruta' || g.estado === 'cerca').length;
    const pendientes = total - entregados - enRuta;
    return `
      <button class="btn-refrescar" id="btn-refrescar"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" aria-hidden="true"><use href="#ic-refresh"/></svg> Actualizar</button>
      <div class="resumen-bar">
        <div class="resumen-chip"><span class="num">${total}</span><span class="lbl">Total</span></div>
        <div class="resumen-chip ruta"><span class="num">${enRuta}</span><span class="lbl">En ruta</span></div>
        <div class="resumen-chip ok"><span class="num">${entregados}</span><span class="lbl">Entregados</span></div>
        <div class="resumen-chip pend"><span class="num">${pendientes}</span><span class="lbl">Pendientes</span></div>
      </div>
      <div class="ruta-actions">
        <button class="btn-ruta-accion" id="btn-ver-ruta">${Icon('map-pin')} Ver ruta completa</button>
        <button class="btn-ruta-accion" id="btn-optimizar-ruta">${Icon('refresh')} Reordenar (más eficiente)</button>
      </div>`;
  }

  const ESTADOS_CONOCIDOS = ['pendiente', 'preparando', 'en-ruta', 'cerca', 'entregado'];

  function ESTADO_LABEL(estado) {
  return {
    pendiente: [Icon('clock'), 'PENDIENTE'],
    preparando: [Icon('box'), 'PREPARANDO'],
    'en-ruta': [Icon('map-pin'), 'EN RUTA'],
    cerca: [Icon('map-pin'), 'CERCA'],
    entregado: [Icon('check'), 'ENTREGADO'],
  }[estado];
}

  function renderGrupo(g, idx) {
  const estado = ESTADOS_CONOCIDOS.includes(g.estado) ? g.estado : 'pendiente';
  const url = mapsUrl(g);
  const compartiendo = !!watchers[g.compradorKey];
  const puedeEditar = estado !== 'entregado';
  const enCamino = estado === 'en-ruta' || estado === 'cerca';
  const [ico, label] = ESTADO_LABEL(estado);
  const abierta = expandedKeys.has(g.compradorKey);
  return `
    <div class="entrega-card ${estado === 'entregado' ? 'is-entregado' : ''} ${abierta ? 'expanded' : ''}" data-key="${esc(g.compradorKey)}" draggable="${estado === 'entregado' ? 'false' : 'true'}">
      <div class="card-header" data-action="toggle-card">
        ${estado !== 'entregado' ? `<span class="drag-handle" title="Arrastra para reordenar">⠿</span>` : `<span class="orden-num">${idx + 1}</span>`}
        <div class="ch-info">
          <h2>${esc(g.compradorNombre)}</h2>
          <span class="ch-total">$${Number(g.total || 0).toLocaleString()}</span>
        </div>
        <span class="estado-pill ${estado}">${ico} ${label}</span>
        <span class="chevron">${Icon('arrow-up-down', { size: 14 })}</span>
      </div>
      <div class="card-body" style="${abierta ? '' : 'display:none;'}">
        ${g.compradorTelefono ? `
          <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px;">
            <a class="tel-link" href="tel:${String(g.compradorTelefono)}">${Icon('phone-call')} ${esc(String(g.compradorTelefono))}</a>
            <a class="tel-link" href="https://wa.me/${encodeURIComponent(String(g.compradorTelefono).replace(/[\s()-]/g, ''))}" target="_blank" rel="noopener">${Icon('whatsapp')} WhatsApp</a>
          </div>
        ` : ''}
        ${g.compradorDireccion ? `<p class="entrega-detail"><b>Dirección:</b> ${esc(g.compradorDireccion)}</p>` : ''}
        ${g.compradorHorario ? `<p class="entrega-detail"><b>Horario:</b> ${esc(g.compradorHorario)}</p>` : ''}
        ${g.compradorNota ? `<p class="entrega-detail"><b>📝 Entregar en otra ubicación:</b> ${esc(g.compradorNota)}</p>` : ''}
        <div class="items-list">
          ${(g.items || []).map(it => `<div class="item-row"><span>${esc(it.nombre)}</span><span>$${Number(it.precio || 0).toLocaleString()}</span></div>`).join('')}
          <div class="total-row"><span>Total</span><span>$${Number(g.total || 0).toLocaleString()}</span></div>
        </div>
        ${url ? `<a class="btn-maps" href="${esc(url)}" target="_blank" rel="noopener">${Icon('map-pin')} Abrir en la app de Maps</a>` : ''}
        ${enCamino ? `
        <div class="live-mini-map-label">${Icon('map-pin')} Tu ruta en vivo hacia el destino</div>
        <div class="live-mini-map" id="mini-map-${esc(g.compradorKey)}"></div>` : ''}
        ${puedeEditar ? `
        <div style="display:flex; gap:8px; margin-top:8px;">
          <select class="btn-tracking" data-action="set-estado-manual" style="flex:1; ${enCamino ? 'display:none;' : ''}">
            <option value="pendiente" ${estado === 'pendiente' ? 'selected' : ''}>⏳ Pendiente</option>
            <option value="preparando" ${estado === 'preparando' ? 'selected' : ''}>📦 Preparando</option>
          </select>
        </div>
        <div class="tracking-row" style="display:flex; gap:8px; margin-top:8px;">
          <button class="btn-tracking ${compartiendo ? 'active' : ''}" data-action="toggle-ruta" style="flex:1;">${compartiendo ? Icon('clock') + ' Detener ruta' : Icon('map-pin') + ' Iniciar ruta / compartir ubicación'}</button>
        </div>` : ''}
        <div class="estado-actions">
          <button class="btn-entregado ${estado === 'entregado' ? 'active' : ''}" data-action="entregado" ${estado === 'entregado' ? 'disabled' : ''}>${Icon('check')} Entregado</button>
          <button class="btn-avisar" data-action="avisar">${Icon('map-pin')} Avisar llegada</button>
        </div>
      </div>
    </div>`;
}

  function gruposOrdenados() {
    return entrega.grupos.slice().sort((a, b) => (a.orden ?? 999) - (b.orden ?? 999));
  }

  const expandedKeys = new Set();
  const liveMaps = {}; // compradorKey -> {map, repMarker, line}
  const posActual = {}; // compradorKey -> {lat,lng} última posición conocida del repartidor

  function limpiarMiniMapas() {
    Object.values(liveMaps).forEach(lm => { try { lm.map.remove(); } catch (_) {} });
    for (const k in liveMaps) delete liveMaps[k];
  }

  function actualizarMiniMapa(key) {
    const g = entrega.grupos.find(x => x.compradorKey === key);
    const pos = posActual[key];
    if (!g || !pos || typeof g.lat !== 'number' || typeof g.lng !== 'number') return;
    const container = document.getElementById(`mini-map-${key}`);
    if (!container || typeof L === 'undefined') return;

    let lm = liveMaps[key];
    const destino = [g.lat, g.lng];
    const repartidor = [pos.lat, pos.lng];
    if (!lm) {
      const map = L.map(container, { zoomControl: false, attributionControl: false, dragging: true, scrollWheelZoom: false });
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
      L.marker(destino).addTo(map).bindPopup('Destino');
      const repIcon = L.divIcon({
        className: '', html: '<div style="width:14px;height:14px;border-radius:50%;background:#c084fc;border:2px solid #fff;box-shadow:0 0 0 2px #c084fc;"></div>',
        iconSize: [14, 14], iconAnchor: [7, 7]
      });
      const repMarker = L.marker(repartidor, { icon: repIcon }).addTo(map).bindPopup('Tú');
      const line = L.polyline([repartidor, destino], { color: '#c084fc', weight: 3, dashArray: '6 6' }).addTo(map);
      map.fitBounds([repartidor, destino], { padding: [24, 24] });
      liveMaps[key] = { map, repMarker, line };
    } else {
      lm.repMarker.setLatLng(repartidor);
      lm.line.setLatLngs([repartidor, destino]);
      lm.map.fitBounds([repartidor, destino], { padding: [24, 24] });
    }
  }

  function render() {
    headerTitle.textContent = entrega.liveTitulo ? `Entregas — ${entrega.liveTitulo}` : 'Entregas';
    headerSubtitle.textContent = entrega.vendedorNombre ? `De ${entrega.vendedorNombre}` : 'Coordinación de entregas';

    limpiarMiniMapas();
    wrap.innerHTML = renderResumen() +
      gruposOrdenados().map((g, i) => renderGrupo(g, i)).join('') +
      `<p class="local-note">Lo que marques aquí lo va a ver el vendedor desde su panel.</p>`;

    document.getElementById('btn-refrescar').addEventListener('click', cargar);
    document.getElementById('btn-ver-ruta').addEventListener('click', abrirMapaRuta);
    document.getElementById('btn-optimizar-ruta').addEventListener('click', optimizarRuta);

    wrap.querySelectorAll('.entrega-card').forEach(card => {
      const key = card.dataset.key;
      card.querySelector('[data-action="toggle-card"]').addEventListener('click', () => {
        if (expandedKeys.has(key)) expandedKeys.delete(key);
        else expandedKeys.add(key);
        render();
      });
      card.querySelectorAll('.estado-actions button').forEach(btn => {
        if (btn.dataset.action === 'avisar') {
          btn.addEventListener('click', () => avisarLlegada(key, btn));
        } else if (btn.dataset.action === 'entregado') {
          btn.addEventListener('click', () => toggleEstado(key, 'entregado'));
        }
      });
      const select = card.querySelector('[data-action="set-estado-manual"]');
      if (select) select.addEventListener('change', () => toggleEstado(key, select.value));
      const btnRuta = card.querySelector('[data-action="toggle-ruta"]');
      if (btnRuta) btnRuta.addEventListener('click', () => toggleRuta(key, btnRuta));

      if (card.getAttribute('draggable') === 'true') {
        card.addEventListener('dragstart', (e) => {
          if (e.target.closest('.card-body')) { e.preventDefault(); return; }
          card.classList.add('dragging'); dragKey = key;
        });
        card.addEventListener('dragend', () => { card.classList.remove('dragging'); dragKey = null; persistirOrden(); });
      }

      if (posActual[key]) actualizarMiniMapa(key);
    });

    wrap.addEventListener('dragover', onDragOver);
  }

  let dragKey = null;
  function onDragOver(e) {
    e.preventDefault();
    const dragging = wrap.querySelector('.entrega-card.dragging');
    if (!dragging) return;
    const siblings = [...wrap.querySelectorAll('.entrega-card:not(.dragging)')];
    const after = siblings.find(sib => {
      const box = sib.getBoundingClientRect();
      return e.clientY < box.top + box.height / 2;
    });
    if (after) wrap.insertBefore(dragging, after);
    else wrap.appendChild(dragging);
  }

  async function persistirOrden() {
    const keys = [...wrap.querySelectorAll('.entrega-card')].map(c => c.dataset.key);
    keys.forEach((key, i) => {
      const g = entrega.grupos.find(x => String(x.compradorKey) === String(key));
      if (g) g.orden = i;
    });
    const ordenes = JSON.stringify(keys.map((key, i) => ({ compradorKey: key, orden: i })));
    try {
      await apiFetch({ action: 'guardarOrdenEntregas', liveId, ordenes }, 'POST');
    } catch (err) {
      enqueue('guardarOrdenEntregas', { ordenes }, 'orden');
    }
  }

  // --- Distancia (haversine, mismo criterio que el backend) ---
  function distanciaMetros(lat1, lng1, lat2, lng2) {
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  // --- TSP: vecino más cercano, punto de partida = ubicación actual del repartidor ---
  function ordenarPorVecinoMasCercano(pendientes, origenLat, origenLng) {
    const conCoords = pendientes.filter(g => typeof g.lat === 'number' && typeof g.lng === 'number');
    const sinCoords = pendientes.filter(g => !(typeof g.lat === 'number' && typeof g.lng === 'number'));
    const restantes = conCoords.slice();
    const ruta = [];
    let curLat = origenLat, curLng = origenLng;
    if (curLat == null && restantes.length) {
      const primero = restantes.shift();
      ruta.push(primero);
      curLat = primero.lat; curLng = primero.lng;
    }
    while (restantes.length) {
      let idxMasCercano = 0, distMinima = Infinity;
      restantes.forEach((g, i) => {
        const d = distanciaMetros(curLat, curLng, g.lat, g.lng);
        if (d < distMinima) { distMinima = d; idxMasCercano = i; }
      });
      const siguiente = restantes.splice(idxMasCercano, 1)[0];
      ruta.push(siguiente);
      curLat = siguiente.lat; curLng = siguiente.lng;
    }
    return [...ruta, ...sinCoords];
  }

  function optimizarRuta() {
    const btn = document.getElementById('btn-optimizar-ruta');
    const pendientes = entrega.grupos.filter(g => g.estado !== 'entregado');
    const entregados = entrega.grupos.filter(g => g.estado === 'entregado');
    if (pendientes.length < 2) { alert('No hay suficientes entregas pendientes para reordenar.'); return; }

    const aplicar = (lat, lng) => {
      const ordenados = ordenarPorVecinoMasCercano(pendientes, lat, lng);
      [...ordenados, ...entregados].forEach((g, i) => { g.orden = i; });
      render();
      persistirOrden();
    };

    if (!('geolocation' in navigator)) { aplicar(null, null); return; }
    btn.innerHTML = Icon('clock') + ' Calculando…';
    navigator.geolocation.getCurrentPosition(
      pos => aplicar(pos.coords.latitude, pos.coords.longitude),
      () => aplicar(null, null),
      { enableHighAccuracy: true, timeout: 5000 }
    );
  }

  // --- Modal de ruta completa (Leaflet) ---
  function abrirMapaRuta() {
    const puntos = gruposOrdenados().filter(g => g.estado !== 'entregado' && typeof g.lat === 'number' && typeof g.lng === 'number');
    const overlay = document.createElement('div');
    overlay.className = 'route-modal-overlay';
    overlay.innerHTML = `
      <div class="route-modal">
        <div class="route-modal-header">
          <h3>${Icon('map-pin')} Ruta completa (${puntos.length} paradas)</h3>
          <button class="route-modal-close" id="route-modal-close">&times;</button>
        </div>
        <div id="route-map"></div>
        <div class="route-list">
          ${puntos.length ? puntos.map((g, i) => `
            <div class="route-list-item">
              <span class="rli-num">${i + 1}</span>
              <div><div class="rli-nombre">${esc(g.compradorNombre)}</div><div class="rli-dir">${esc(g.compradorDireccion || 'Sin dirección')}</div></div>
            </div>`).join('') : '<p style="color:var(--color-text-soft); text-align:center; padding:20px;">Ninguna entrega pendiente tiene ubicación guardada todavía.</p>'}
        </div>
      </div>`;
    document.body.appendChild(overlay);
    document.getElementById('route-modal-close').addEventListener('click', () => overlay.remove());
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });

    if (puntos.length && typeof L !== 'undefined') {
      setTimeout(() => {
        const map = L.map('route-map');
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap', maxZoom: 19 }).addTo(map);
        const latlngs = puntos.map(g => [g.lat, g.lng]);
        latlngs.forEach((ll, i) => {
          L.marker(ll).addTo(map).bindPopup(`${i + 1}. ${puntos[i].compradorNombre}`);
        });
        L.polyline(latlngs, { color: '#ec4899', weight: 3, dashArray: '6 6' }).addTo(map);
        map.fitBounds(latlngs, { padding: [30, 30] });
      }, 50);
    }
  }

  const watchers = {}; // compradorKey -> watchPosition id, mientras se comparte ubicación

  function linkSeguimiento(key) {
    return `${location.origin}/znr/seguimiento-entrega.html?live=${encodeURIComponent(liveId)}&key=${encodeURIComponent(key)}`;
  }

  function enviarLinkSeguimiento(key) {
    const trackUrl = linkSeguimiento(key);
    const g = entrega.grupos.find(x => x.compradorKey === key);
    const tel = g && g.compradorTelefono ? String(g.compradorTelefono).replace(/\D/g, '') : '';
    const texto = `¡Tu pedido va en camino! Sigue la ubicación del repartidor aquí: ${trackUrl}`;
    if (tel) {
      window.open(`https://wa.me/${tel}?text=${encodeURIComponent(texto)}`, '_blank', 'noopener');
    } else if (navigator.share) {
      navigator.share({ text: texto, url: trackUrl }).catch(() => {});
    }
  }

  // Botón unificado "Iniciar ruta / compartir ubicación": pone el
  // pedido en en-ruta, avisa al cliente (push + WhatsApp con el link
  // de seguimiento) y empieza a mandar la ubicación del repartidor
  // cada 5s (además de dibujarla al toque en el mini-mapa local, sin
  // esperar esos 5s — eso es aparte, nada más para no saturar el
  // servidor). Volver a darle click detiene todo y regresa a
  // pendiente (si no se marcó como entregado mientras tanto).
  async function toggleRuta(key, btn) {
    if (watchers[key]) {
      navigator.geolocation.clearWatch(watchers[key]);
      delete watchers[key];
      delete posActual[key];
      if (liveMaps[key]) { try { liveMaps[key].map.remove(); } catch (_) {} delete liveMaps[key]; }
      await toggleEstado(key, 'pendiente');
      return;
    }
    if (!('geolocation' in navigator)) {
      alert('Tu navegador no soporta geolocalización.');
      return;
    }
    expandedKeys.add(key); // para que vea su mini-mapa de inmediato
    await toggleEstado(key, 'en-ruta');
    enviarLinkSeguimiento(key);

    let ultimoEnvio = 0;
    watchers[key] = navigator.geolocation.watchPosition(
      (pos) => {
        posActual[key] = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        actualizarMiniMapa(key); // se dibuja al toque, no espera el throttle de red

        const ahora = Date.now();
        if (ahora - ultimoEnvio < 5000) return; // manda al servidor como máximo cada 5s
        ultimoEnvio = ahora;
        apiFetch({
          action: 'actualizarUbicacionRepartidor',
          liveId, compradorKey: key,
          lat: pos.coords.latitude, lng: pos.coords.longitude
        }, 'POST').then(resp => {
          if (resp.ok && resp.estado && resp.estado !== entrega.grupos.find(g => g.compradorKey === key)?.estado) {
            const g = entrega.grupos.find(x => x.compradorKey === key);
            if (g) { g.estado = resp.estado; render(); }
          }
        }).catch(() => {
          enqueue('actualizarUbicacionRepartidor', { compradorKey: key, lat: pos.coords.latitude, lng: pos.coords.longitude }, key + ':ubi');
        });
      },
      (err) => {
        console.error('Geolocalización falló:', err);
        alert('No se pudo obtener tu ubicación. Revisa que le diste permiso de ubicación a la página.');
        if (watchers[key]) { navigator.geolocation.clearWatch(watchers[key]); delete watchers[key]; }
      },
      { enableHighAccuracy: true, maximumAge: 5000 }
    );
  }

  async function avisarLlegada(key, btn) {
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = Icon('clock') + ' Enviando...';
    try {
      const resp = await apiFetch({
        action: 'notificarLlegadaEntrega',
        liveId,
        compradorKey: key
      }, 'POST');
      if (!resp.ok) throw new Error(resp.error || 'No se pudo enviar el aviso');
      if (resp.enviados > 0) {
        btn.innerHTML = Icon('check') + ' Avisado';
      } else {
        btn.innerHTML = Icon('error') + ' Sin notificaciones';
        alert('Este cliente no tiene notificaciones activadas. Contáctalo por WhatsApp o llamada.');
      }
    } catch (err) {
      btn.innerHTML = Icon('x') + ' Error';
      alert('No se pudo avisar al cliente: ' + err.message);
    } finally {
      setTimeout(() => { btn.innerHTML = original; btn.disabled = false; }, 2500);
    }
  }

  // --- Modo offline: cache del último listado + cola de cambios pendientes en localStorage.
  // La cola dedupea por "compradorKey:tipo" (estado/ubicación) así solo se guarda y
  // manda el último valor de cada uno, no un historial de cada click o cada GPS.
  const cacheKey = () => 'zr_entregas_cache_' + liveId;
  const queueKey = () => 'zr_entregas_queue_' + liveId;
  const loadQueue = () => { try { return JSON.parse(localStorage.getItem(queueKey())) || []; } catch (e) { return []; } };
  const saveQueue = (q) => localStorage.setItem(queueKey(), JSON.stringify(q));
  function enqueue(action, extra, dedupeKey) {
    const q = loadQueue().filter(x => x.dedupeKey !== dedupeKey);
    q.push({ action, extra, dedupeKey });
    saveQueue(q);
    headerSubtitle.textContent = `Sin conexión — ${q.length} cambio${q.length !== 1 ? 's' : ''} pendiente${q.length !== 1 ? 's' : ''}`;
    // Deja el reintento en manos del Service Worker (evento 'sync'): sigue
    // funcionando aunque la pestaña quede en segundo plano, no solo con
    // el evento 'online' del documento.
    navigator.serviceWorker?.ready.then(reg => reg.sync?.register('sync-entregas')).catch(() => {});
  }
  navigator.serviceWorker?.addEventListener('message', e => { if (e.data?.type === 'SYNC_ENTREGAS') sync(); });
  async function sync() {
    if (!navigator.onLine) return;
    let q = loadQueue();
    if (!q.length) return; // nada pendiente: no hay nada que sincronizar ni por qué recargar
    for (const item of q.slice()) {
      try {
        const resp = await apiFetch({ action: item.action, liveId, ...item.extra }, 'POST');
        if (resp.ok) { q = q.filter(x => x !== item); saveQueue(q); }
      } catch (err) { break; } // seguimos sin conexión, se reintenta después
    }
    if (!loadQueue().length) cargar(); // se vació la cola: refresca con datos reales del servidor
  }
  window.addEventListener('online', sync);

  async function toggleEstado(key, nuevoEstado) {
    const grupo = entrega.grupos.find(g => String(g.compradorKey) === String(key));
    if (!grupo || grupo.estado === nuevoEstado) return;

    grupo.estado = nuevoEstado; // optimista, se mantiene aunque falle: se encola
    render();

    try {
      const resp = await apiFetch({
        action: 'actualizarEstadoEntrega',
        liveId,
        compradorKey: key,
        estado: nuevoEstado
      }, 'POST');
      if (!resp.ok) throw new Error(resp.error || 'No se pudo guardar');
    } catch (err) {
      enqueue('actualizarEstadoEntrega', { compradorKey: key, estado: nuevoEstado }, key + ':estado');
    }
  }

  async function cargar() {
    if (!liveId) { renderInvalido('Este link no trae identificador de transmisión.'); return; }
    wrap.innerHTML = '<div class="loading-spinner"></div>';
    try {
        const resp = await apiFetch({ action: 'obtenerEntregasLive', liveId });
        if (!resp.ok) { renderInvalido(resp.error || 'Error al cargar los datos'); return; }
        entrega = resp;
        localStorage.setItem(cacheKey(), JSON.stringify(resp));
        render();
        sync();
    } catch (err) {
        const cached = localStorage.getItem(cacheKey());
        if (!cached) { renderInvalido('Hubo un problema de conexión.'); return; }
        entrega = JSON.parse(cached);
        render();
        const pendientes = loadQueue().length;
        headerSubtitle.textContent = pendientes ? `Sin conexión — ${pendientes} cambio(s) pendiente(s)` : 'Sin conexión — mostrando datos guardados';
    }
}

  cargar();
})();
</script>
