<style>
  .entregas-wrap { max-width: 640px; margin: 0 auto; padding: 16px; padding-bottom: 80px; }

  /* Barra de progreso global */
  .progress-bar {
    height: 6px; border-radius: 3px;
    background: var(--color-surface-2); overflow: hidden;
    margin-bottom: 12px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #4ade80, #22c55e);
    transition: width .4s ease;
  }

  .resumen-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .resumen-chip {
    text-align: center; padding: 8px 4px;
    border-radius: var(--radius-md); background: var(--color-surface);
    border: 1px solid var(--color-border-subtle);
  }
  .resumen-chip .num { font-size: 16px; font-weight: 800; color: var(--color-text-primary); display: block; }
  .resumen-chip .lbl { font-size: 9.5px; color: var(--color-text-soft); text-transform: uppercase; letter-spacing: .03em; }
  .resumen-chip.ok .num { color: #4ade80; }
  .resumen-chip.pend .num { color: #fbbf24; }
  .resumen-chip.ruta .num { color: #60a5fa; }

  .ruta-actions { display: flex; gap: 8px; margin-bottom: 14px; }
  .btn-ruta-accion {
    flex: 1; border: none; border-radius: var(--radius-md); cursor: pointer;
    background: var(--color-surface-2); color: var(--color-text-primary);
    border: 1px solid var(--color-border-subtle);
    padding: 10px 6px; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }

  .btn-refrescar {
    display: block; width: 100%; text-align: center; margin-bottom: 14px;
    background: var(--color-surface-2); color: var(--color-text-primary);
    border: 1px solid var(--color-border-subtle); border-radius: var(--radius-md);
    padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer;
  }

  .entrega-card {
    background: var(--color-surface); border: 1px solid var(--color-border-subtle);
    border-radius: var(--radius-lg); margin-bottom: 10px; overflow: hidden;
    transition: opacity .2s ease;
  }
  .entrega-card.is-entregado { opacity: .55; }

  .card-header {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer;
  }
  .card-header .ch-info { flex: 1; min-width: 0; }
  .card-header h2 { margin: 0; font-size: 15px; letter-spacing: -.01em; color: var(--color-text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-header .ch-total { font-size: 12px; color: var(--color-text-soft); }
  .card-header .chevron { color: var(--color-text-soft); transition: transform .2s ease; flex-shrink: 0; }
  .entrega-card.expanded .chevron { transform: rotate(180deg); }

  .card-body { padding: 0 14px 14px; }

  .entrega-card .tel-link { font-size: 13px; color: var(--color-accent); text-decoration: none; }

  /* Pastilla de estado con dot + pulso para en-ruta/cerca */
  .estado-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 9.5px; font-weight: 700; letter-spacing: .02em;
    padding: 4px 9px; border-radius: var(--radius-pill); white-space: nowrap; flex-shrink: 0;
  }
  .estado-pill::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 25%, transparent);
  }
  .estado-pill.pendiente { background: rgba(251,191,36,.15); color: #fbbf24; }
  .estado-pill.preparando { background: rgba(251,146,60,.15); color: #fb923c; }
  .estado-pill.en-ruta { background: rgba(96,165,250,.15); color: #60a5fa; }
  .estado-pill.cerca { background: rgba(192,132,252,.15); color: #c084fc; }
  .estado-pill.entregado { background: rgba(74,222,128,.15); color: #4ade80; }
  .estado-pill.cerca::before,
  .estado-pill.en-ruta::before { animation: pillPulse 1.6s ease-in-out infinite; }
  @keyframes pillPulse { 50% { opacity: .35; } }

  .entrega-detail { font-size: 13px; color: var(--color-text-soft); margin: 2px 0; line-height: 1.55; }
  .entrega-detail b { color: var(--color-text-primary); font-weight: 600; }

  .items-list { margin: 10px 0; padding: 10px 12px; background: var(--color-surface-2); border-radius: var(--radius-md); }
  .items-list .item-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--color-text-primary); padding: 3px 0; }
  .items-list .item-row span:last-child { color: var(--color-text-soft); }
  .total-row { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--color-border-subtle); color: var(--color-text-primary); }

  .btn-maps {
    display: block; text-align: center; text-decoration: none;
    background: var(--color-surface-2); color: var(--color-text-primary);
    border: 1px solid var(--color-border-subtle); border-radius: var(--radius-md);
    padding: 10px; font-size: 13px; font-weight: 600; margin: 10px 0;
  }
  .btn-maps:active { opacity: .8; }

  .estado-actions { display: flex; gap: 8px; margin-top: 10px; }
  .estado-actions button {
    flex: 1; border: none; border-radius: var(--radius-pill);
    padding: 11px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .estado-actions button:disabled { opacity: .5; cursor: default; }
  .btn-entregado { background: rgba(74,222,128,.15); color: #4ade80; }
  .btn-entregado.active { background: #4ade80; color: #0a2e1a; }
  .btn-pendiente { background: rgba(251,191,36,.15); color: #fbbf24; }
  .btn-pendiente.active { background: #fbbf24; color: #3a2a04; }
  .btn-avisar { background: rgba(59,130,246,.15); color: #60a5fa; }
  .btn-avisar:disabled { opacity: .6; }

  .btn-tracking {
    border: none; border-radius: var(--radius-md); cursor: pointer;
    background: rgba(168,85,247,.15); color: #c084fc;
    padding: 10px; font-size: 12.5px; font-weight: 700;
  }
  .btn-tracking.active { background: #c084fc; color: #2a0a3a; }

  .drag-handle {
    cursor: grab; color: var(--color-text-soft); padding: 4px 6px;
    touch-action: none; user-select: none; font-size: 16px; line-height: 1; flex-shrink: 0;
  }
  .entrega-card.dragging { opacity: .4; }
  .orden-num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--color-accent-solid, #ec4899);
    color: #fff; font-size: 12px; font-weight: 800; flex-shrink: 0;
  }

  /* ============================================================
     MODAL DE RUTA — PANTALLA COMPLETA + BOTTOM SHEET
     ============================================================ */
  .route-modal-overlay {
    position: fixed; inset: 0; background: #000; z-index: 200;
    display: flex; align-items: stretch; justify-content: center;
  }
  .route-modal {
    position: relative;
    width: 100%; max-width: 640px;
    background: var(--color-surface); overflow: hidden;
  }
  #route-map { position: absolute; inset: 0; z-index: 0; }

  .route-modal-header {
    position: absolute; top: 12px; left: 12px; right: 12px; z-index: 500;
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; margin: 0;
    background: color-mix(in srgb, var(--color-surface) 86%, transparent);
    backdrop-filter: blur(14px) saturate(1.6);
    -webkit-backdrop-filter: blur(14px) saturate(1.6);
    border: 1px solid var(--color-border-subtle);
    border-radius: 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,.22);
  }
  .route-modal-header h3 {
    margin: 0; font-size: 14.5px; color: var(--color-text-primary);
    display: flex; align-items: center; gap: 6px;
  }
  .route-modal-close {
    background: none; border: none; color: var(--color-text-soft);
    font-size: 22px; line-height: 1; cursor: pointer; padding: 0 4px;
  }

  .route-note {
    position: absolute; left: 12px; right: 12px; z-index: 500;
    margin: 0; padding: 8px 14px; font-size: 12px;
    background: color-mix(in srgb, var(--color-surface) 86%, transparent);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,.15);
  }
  .route-note-info { top: 68px; color: var(--color-text-soft); }
  #route-note { top: 108px; color: #3a2a04; background: rgba(251,191,36,.92); }

  /* Bottom sheet de paradas */
  .route-list-sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 500;
    background: var(--color-surface);
    border-radius: 18px 18px 0 0;
    box-shadow: 0 -10px 30px rgba(0,0,0,.25);
    max-height: 55vh;
    display: flex; flex-direction: column;
    transition: max-height .3s cubic-bezier(.2,.7,.3,1);
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .route-list-sheet.collapsed { max-height: 58px; }
  .sheet-handle {
    padding: 12px 0 8px; text-align: center; cursor: pointer;
    flex-shrink: 0; user-select: none; touch-action: manipulation;
  }
  .sheet-handle::before {
    content: ''; display: inline-block; width: 42px; height: 4px;
    border-radius: 2px;
    background: var(--color-text-soft); opacity: .45;
  }
  .sheet-title {
    font-size: 12px; font-weight: 600; color: var(--color-text-soft);
    text-align: center; padding: 0 16px 8px;
    text-transform: uppercase; letter-spacing: .04em;
  }
  .route-list-sheet.collapsed .sheet-title { padding-bottom: 4px; }
  .route-list { overflow-y: auto; padding: 0 16px 20px; }
  .route-list-item { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--color-border-subtle); }
  .route-list-item:last-child { border-bottom: none; }
  .route-list-item .rli-num {
    width: 22px; height: 22px; border-radius: 50%; background: var(--color-accent-solid, #ec4899);
    color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;
  }
  .route-list-item .rli-nombre { font-size: 13.5px; color: var(--color-text-primary); font-weight: 600; }
  .route-list-item .rli-dir { font-size: 12px; color: var(--color-text-soft); }

  /* Ajuste fino de controles Leaflet para que no choquen con el header */
  .route-modal .leaflet-top.leaflet-left { top: 70px; }
  .route-modal .leaflet-top.leaflet-right { top: 70px; }
  .route-modal .leaflet-bottom.leaflet-right { bottom: 62px; }

  .center-card { max-width: 480px; margin: 60px auto; padding: 0 20px; text-align: center; }
  .center-card .icon { font-size: 44px; margin-bottom: 12px; }
  .center-card h2 { color: var(--color-text-primary); margin: 0 0 8px; }
  .center-card p { color: var(--color-text-soft); font-size: 14px; line-height: 1.5; }

  .loading-spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid var(--color-border-subtle); border-top-color: var(--color-accent-solid);
    animation: spin 0.8s linear infinite; margin: 60px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .local-note {
    font-size: 11px; color: var(--color-text-soft); text-align: center;
    margin: 18px 0 4px; line-height: 1.5;
  }

  :root{--ok:#15803d;--warn:#b45309;--info:#1d4ed8;--cerca:#7e22ce}
  [data-theme="dark"]{--ok:#4ade80;--warn:#fbbf24;--info:#60a5fa;--cerca:#c084fc}
  body{font-family:var(--font-sans,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif)}
  .resumen-chip .lbl,.estado-pill{font-size:11px}
  .resumen-chip.ok .num{color:var(--ok)}.resumen-chip.pend .num{color:var(--warn)}.resumen-chip.ruta .num{color:var(--info)}
  .estado-pill.pendiente,.estado-pill.preparando{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
  .estado-pill.en-ruta{background:color-mix(in srgb,var(--info) 15%,transparent);color:var(--info)}
  .estado-pill.cerca{background:color-mix(in srgb,var(--cerca) 15%,transparent);color:var(--cerca)}
  .estado-pill.entregado{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
  .btn-entregado{background:var(--ok);color:#fff}
  .btn-avisar{background:color-mix(in srgb,var(--info) 15%,transparent);color:var(--info)}
  .btn-tracking{background:color-mix(in srgb,var(--cerca) 15%,transparent);color:var(--cerca)}
  .btn-tracking.active{background:var(--cerca);color:#fff}
  .estado-actions button,.btn-maps,.btn-tracking{min-height:48px;font-size:14px}
  button.btn-maps{width:100%;cursor:pointer}
  .chevron::before{content:'';display:block;width:8px;height:8px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .cobro{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;margin-bottom:10px;border-radius:var(--radius-md);background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);font-weight:800;font-size:16px}
  .nota{padding:8px 10px;border-left:4px solid var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent);border-radius:6px}
  .entrega-card.hero{border:2px solid var(--color-accent-solid,#ec4899)}
  .entrega-card.hero .card-header::before{content:'SIGUIENTE';font-size:11px;font-weight:800;color:var(--color-accent-solid,#ec4899)}
  .mover{display:flex;flex-direction:column;gap:2px}
  .mover button{background:var(--color-surface-2);border:1px solid var(--color-border-subtle);border-radius:6px;width:34px;height:26px;font-size:11px;color:var(--color-text-soft);cursor:pointer}
  .num-pin{width:26px;height:26px;border-radius:50%;background:#ec4899;color:#fff;border:2px solid #fff;font:800 12px/22px system-ui,sans-serif;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.35)}
  #toast{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:616px;margin:auto;display:none;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:#111;color:#fff;z-index:300;font-size:14px}
  #toast.show{display:flex}#toast button{background:none;border:none;color:#fbbf24;font-weight:800;font-size:14px;cursor:pointer}
</style>

<script>
(function() {
  'use strict';

  const params0 = new URLSearchParams(location.search);
  // Código de acceso del repartidor (?id=...&t=CODIGO): se guarda en el
  // dispositivo para que sobreviva a recargas, a la cola offline y a abrir la
  // página sin el parámetro. Si el vendedor lo cambia, el servidor lo rechaza
  // (requiereCodigo) y aquí se borra.
  const tokKey = 'zr_entregas_t_' + params0.get('id');
  if (params0.get('t')) { try { localStorage.setItem(tokKey, params0.get('t')); } catch (e) { /* sin storage */ } }
  const tokenEntregas = () => params0.get('t') || localStorage.getItem(tokKey) || '';
  async function apiFetch(data, method = 'GET') {
    const API_BASE = "https://live-api-1038143238323.us-central1.run.app";
    const params = new URLSearchParams();
    Object.entries({ ...data, token: tokenEntregas() }).forEach(([k, v]) => {
      if (v !== undefined && v !== null) params.append(k, v);
    });
    let res;
    if (method === 'GET') {
      res = await fetch(`${API_BASE}?${params.toString()}`, { method: 'GET' });
    } else {
      res = await fetch(API_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params.toString()
      });
    }
    return JSON.parse(await res.text());
  }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  const wrap = document.getElementById('entregas-wrap');
  const headerTitle = document.getElementById('header-title');
  const headerSubtitle = document.getElementById('header-subtitle');
  const params = new URLSearchParams(location.search);
  const liveId = params.get('id');

  let entrega = null;

  function renderInvalido(msg) {
    headerSubtitle.textContent = 'Enlace inválido';
    wrap.innerHTML = `
      <div class="center-card">
        <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" aria-hidden="true"><use href="#ic-link"/></svg></div>
        <h2>No pudimos cargar esta entrega</h2>
        <p>${esc(msg || 'Pide al vendedor que te comparta el link de nuevo.')}</p>
      </div>`;
  }

  function mapsUrl(g) {
    if (typeof g.lat === 'number' && typeof g.lng === 'number') {
      return `https://www.google.com/maps/dir/?api=1&destination=${g.lat},${g.lng}&travelmode=driving`;
    }
    if (g.direccion) {
      return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(g.direccion)}&travelmode=driving`;
    }
    return null;
  }

  function renderResumen() {
    const total = entrega.grupos.length;
    const entregados = entrega.grupos.filter(g => g.estado === 'entregado').length;
    const enRuta = entrega.grupos.filter(g => g.estado === 'en-ruta' || g.estado === 'cerca').length;
    const pendientes = total - entregados - enRuta;
    const pct = total ? (entregados / total) * 100 : 0;
    return `
      <button class="btn-refrescar" id="btn-refrescar"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" aria-hidden="true"><use href="#ic-refresh"/></svg> Actualizar</button>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="resumen-bar">
        <div class="resumen-chip"><span class="num">${total}</span><span class="lbl">Total</span></div>
        <div class="resumen-chip ruta"><span class="num">${enRuta}</span><span class="lbl">En ruta</span></div>
        <div class="resumen-chip ok"><span class="num">${entregados}</span><span class="lbl">Entregados</span></div>
        <div class="resumen-chip pend"><span class="num">${pendientes}</span><span class="lbl">Pendientes</span></div>
      </div>
      <div class="ruta-actions">
        <button class="btn-ruta-accion" id="btn-ver-ruta">${Icon('map-pin')} Ver ruta completa</button>
        <button class="btn-ruta-accion" id="btn-optimizar-ruta">${Icon('refresh')} Reordenar (más eficiente)</button>
      </div>`;
  }

  const ESTADOS_CONOCIDOS = ['pendiente', 'preparando', 'en-ruta', 'cerca', 'entregado'];

  function ESTADO_LABEL(estado) {
    return {
      pendiente: [Icon('clock'), 'PENDIENTE'],
      preparando: [Icon('box'), 'PREPARANDO'],
      'en-ruta': [Icon('map-pin'), 'EN RUTA'],
      cerca: [Icon('map-pin'), 'CERCA'],
      entregado: [Icon('check'), 'ENTREGADO'],
    }[estado];
  }

  function renderGrupo(g, idx) {
    const estado = ESTADOS_CONOCIDOS.includes(g.estado) ? g.estado : 'pendiente';
    const url = mapsUrl(g);
    const compartiendo = activos.has(g.compradorKey);
    const puedeEditar = estado !== 'entregado';
    const enCamino = estado === 'en-ruta' || estado === 'cerca';
    const [ico, label] = ESTADO_LABEL(estado);
    const hero = idx === 0 && estado !== 'entregado';
    const abierta = hero || expandedKeys.has(g.compradorKey);
    return `
    <div class="entrega-card ${estado === 'entregado' ? 'is-entregado' : ''} ${abierta ? 'expanded' : ''} ${hero ? 'hero' : ''}" data-key="${esc(g.compradorKey)}">
      <div class="card-header" data-action="toggle-card">
        ${estado !== 'entregado' ? `<span class="mover"><button data-mv="-1" aria-label="Subir">▲</button><button data-mv="1" aria-label="Bajar">▼</button></span>` : `<span class="orden-num">${idx + 1}</span>`}
        <div class="ch-info">
          <h2>${esc(g.compradorNombre)}</h2>
          <span class="ch-total">$${Number(g.total || 0).toLocaleString()}</span>
        </div>
        <span class="estado-pill ${estado}">${ico} ${label}</span>
        <span class="chevron"></span>
      </div>
      <div class="card-body" style="${abierta ? '' : 'display:none;'}">
        ${estado !== 'entregado' ? `<div class="cobro"><span>Cobrar en efectivo</span><span>$${Number(g.total || 0).toLocaleString()}</span></div>` : ''}
        ${g.compradorTelefono ? `
          <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px;">
            <a class="tel-link" href="tel:${esc(String(g.compradorTelefono))}">${Icon('phone-call')} ${esc(String(g.compradorTelefono))}</a>
            <a class="tel-link" href="https://wa.me/${waNum(g.compradorTelefono)}" target="_blank" rel="noopener">${Icon('whatsapp')} WhatsApp</a>
          </div>
        ` : ''}
        ${g.compradorDireccion ? `<p class="entrega-detail"><b>Dirección:</b> ${url ? `<a class="tel-link" href="${esc(url)}" target="_blank" rel="noopener">${esc(g.compradorDireccion)}</a>` : esc(g.compradorDireccion)}</p>` : ''}
        ${g.compradorHorario ? `<p class="entrega-detail"><b>Horario:</b> ${esc(g.compradorHorario)}</p>` : ''}
        ${g.compradorNota ? `<p class="entrega-detail nota"><b>Entregar en otra ubicación:</b> ${esc(g.compradorNota)}</p>` : ''}
        <div class="items-list">
          ${(g.items || []).map(it => `<div class="item-row"><span>${esc(it.nombre)}</span><span>$${Number(it.precio || 0).toLocaleString()}</span></div>`).join('')}
          <div class="total-row"><span>Total</span><span>$${Number(g.total || 0).toLocaleString()}</span></div>
        </div>
        ${typeof g.lat === 'number' ? `<button class="btn-maps" data-action="navegar">${Icon('map-pin')} Navegar en el mapa</button>` : ''}
        ${url ? `<a class="btn-maps" href="${esc(url)}" target="_blank" rel="noopener">${Icon('map-pin')} Abrir en Google Maps (pausa el seguimiento)</a>` : ''}
        ${puedeEditar ? `
        <div style="display:flex; gap:8px; margin-top:8px;">
          <select class="btn-tracking" data-action="set-estado-manual" style="flex:1; ${enCamino ? 'display:none;' : ''}">
            <option value="pendiente" ${estado === 'pendiente' ? 'selected' : ''}>⏳ Pendiente</option>
            <option value="preparando" ${estado === 'preparando' ? 'selected' : ''}>📦 Preparando</option>
          </select>
        </div>
        <div class="tracking-row" style="display:flex; gap:8px; margin-top:8px;">
          <button class="btn-tracking ${compartiendo ? 'active' : ''}" data-action="toggle-ruta" style="flex:1;">${compartiendo ? Icon('clock') + ' Detener ruta' : Icon('map-pin') + ' Iniciar ruta / compartir ubicación'}</button>${compartiendo && g.compradorTelefono ? `<a class="btn-tracking" style="display:flex;align-items:center;text-decoration:none" href="${waLink(g)}" target="_blank" rel="noopener">Enviar link</a>` : ''}
        </div>` : ''}
        <div class="estado-actions">
          <button class="btn-entregado ${estado === 'entregado' ? 'active' : ''}" data-action="entregado" ${estado === 'entregado' ? 'disabled' : ''}>${Icon('check')} Entregado</button>
          <button class="btn-avisar" data-action="avisar">${Icon('map-pin')} Avisar llegada</button>
        </div>
      </div>
    </div>`;
  }

  function gruposOrdenados() {
    return entrega.grupos.slice().sort((a, b) => (a.estado === 'entregado') - (b.estado === 'entregado') || (a.orden ?? 999) - (b.orden ?? 999));
  }
  const grupoDe = k => entrega?.grupos.find(g => String(g.compradorKey) === String(k));

  const expandedKeys = new Set();

  function render() {
    headerTitle.textContent = entrega.liveTitulo ? `Entregas — ${entrega.liveTitulo}` : 'Entregas';
    headerSubtitle.textContent = entrega.vendedorNombre ? `De ${entrega.vendedorNombre}` : 'Coordinación de entregas';

    wrap.innerHTML = renderResumen() +
      gruposOrdenados().map((g, i) => renderGrupo(g, i)).join('') +
      `<p class="local-note">Lo que marques aquí lo va a ver el vendedor desde su panel.</p>`;

    document.getElementById('btn-refrescar').addEventListener('click', () => cargar(true).then(() => toast('Actualizado')));
    document.getElementById('btn-ver-ruta').addEventListener('click', () => abrirMapaRuta());
    document.getElementById('btn-optimizar-ruta').addEventListener('click', optimizarRuta);

    wrap.querySelectorAll('.entrega-card').forEach(card => {
      const key = card.dataset.key;
      card.querySelector('[data-action="toggle-card"]').addEventListener('click', () => {
        if (expandedKeys.has(key)) expandedKeys.delete(key);
        else expandedKeys.add(key);
        render();
      });
      card.querySelectorAll('.estado-actions button').forEach(btn => {
        if (btn.dataset.action === 'avisar') {
          btn.addEventListener('click', () => avisarLlegada(key, btn));
        } else if (btn.dataset.action === 'entregado') {
          btn.addEventListener('click', () => entregar(key));
        }
      });
      card.querySelectorAll('[data-mv]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); mover(key, +b.dataset.mv); }));
      card.querySelector('[data-action="navegar"]')?.addEventListener('click', () => abrirMapaRuta(key));
      const select = card.querySelector('[data-action="set-estado-manual"]');
      if (select) select.addEventListener('change', () => toggleEstado(key, select.value));
      const btnRuta = card.querySelector('[data-action="toggle-ruta"]');
      if (btnRuta) btnRuta.addEventListener('click', () => toggleRuta(key, btnRuta));

    });
  }

  function mover(key, d) {
    const l = gruposOrdenados(), n = l.filter(g => g.estado !== 'entregado').length;
    const i = l.findIndex(g => g.compradorKey === key), j = i + d;
    if (j < 0 || j >= n) return;
    [l[i], l[j]] = [l[j], l[i]];
    l.forEach((g, k) => { g.orden = k; });
    render(); persistirOrden();
  }

  async function persistirOrden() {
    const ordenes = JSON.stringify(gruposOrdenados().map((g, i) => ({ compradorKey: g.compradorKey, orden: i })));
    try { await apiFetch({ action: 'guardarOrdenEntregas', liveId, ordenes }, 'POST'); }
    catch (err) { enqueue('guardarOrdenEntregas', { ordenes }, 'orden'); }
  }

  const OSRM = 'https://router.project-osrm.org';
  const tieneGeo = g => typeof g.lat === 'number' && typeof g.lng === 'number';

  async function optimizarRuta() {
    const todos = gruposOrdenados(), previo = todos.map(g => g.orden);
    const pend = todos.filter(g => g.estado !== 'entregado'), geo = pend.filter(tieneGeo);
    if (geo.length < 2) { toast('No hay suficientes entregas con ubicación para reordenar.'); return; }
    const pos = await new Promise(r => navigator.geolocation ? navigator.geolocation.getCurrentPosition(p => r([p.coords.latitude, p.coords.longitude]), () => r(null), { enableHighAccuracy: true, timeout: 5000 }) : r(null));
    const pts = (pos ? [pos] : []).concat(geo.map(g => [g.lat, g.lng]));
    try {
      const d = await (await fetch(`${OSRM}/trip/v1/driving/${pts.map(([a, b]) => `${b},${a}`).join(';')}?source=first&destination=any&roundtrip=false&overview=false`)).json();
      if (d.code !== 'Ok') throw new Error(d.code);
      const off = pos ? 1 : 0;
      const orden = geo.map((g, i) => [g, d.waypoints[i + off].waypoint_index]).sort((a, b) => a[1] - b[1]).map(x => x[0]);
      [...orden, ...pend.filter(g => !tieneGeo(g)), ...todos.filter(g => g.estado === 'entregado')].forEach((g, i) => { g.orden = i; });
      render(); persistirOrden();
      toast('Ruta reordenada', { undo: () => { todos.forEach((g, i) => { g.orden = previo[i]; }); render(); persistirOrden(); } });
    } catch (err) { toast('No se pudo optimizar la ruta. Intenta de nuevo.'); }
  }

  // --- Modal de ruta completa (pantalla completa + bottom-sheet + OSRM) ---
  async function trazarRutaCalles(latlngs) {
    if (latlngs.length < 2) return null;
    const CHUNK = 25;
    const tramosCoords = [];
    for (let i = 0; i < latlngs.length - 1; i += CHUNK - 1) tramosCoords.push(latlngs.slice(i, i + CHUNK));
    try {
      const tramos = await Promise.all(tramosCoords.map(async (tramo) => {
        const coordsStr = tramo.map(([lat, lng]) => `${lng},${lat}`).join(';');
        const resp = await fetch(`https://router.project-osrm.org/route/v1/driving/${coordsStr}?overview=full&geometries=geojson`);
        const data = await resp.json();
        if (data.code !== 'Ok') throw new Error(data.message || 'OSRM error');
        return data.routes[0].geometry.coordinates.map(([lng, lat]) => [lat, lng]);
      }));
      return tramos.reduce((acc, tramo, i) => i === 0 ? tramo : acc.concat(tramo.slice(1)), []);
    } catch (err) {
      return null;
    }
  }

  function abrirMapaRuta(soloKey) {
    const puntos = gruposOrdenados().filter(g => g.estado !== 'entregado' && tieneGeo(g) && (!soloKey || g.compradorKey === soloKey));
    const overlay = document.createElement('div');
    overlay.className = 'route-modal-overlay';
    overlay.innerHTML = `
      <div class="route-modal">
        <div id="route-map"></div>
        <div class="route-modal-header">
          <h3>${Icon('map-pin')} Ruta (${puntos.length} parada${puntos.length === 1 ? '' : 's'})</h3>
          <button class="route-modal-close" id="route-modal-close" aria-label="Cerrar">&times;</button>
        </div>
        <p class="route-note route-note-info" id="route-gps-note">Buscando tu ubicación…</p>
        <p class="route-note" id="route-note" style="display:none;"></p>
        <div class="route-list-sheet" id="route-sheet">
          <div class="sheet-handle" id="sheet-handle" role="button" aria-label="Mostrar u ocultar paradas"></div>
          <div class="sheet-title">${puntos.length} parada${puntos.length === 1 ? '' : 's'} · toca para expandir</div>
          <div class="route-list">
            ${puntos.length ? puntos.map((g, i) => `
              <div class="route-list-item">
                <span class="rli-num">${i + 1}</span>
                <div><div class="rli-nombre">${esc(g.compradorNombre)}</div><div class="rli-dir">${esc(g.compradorDireccion || 'Sin dirección')}</div></div>
              </div>`).join('') : '<p style="color:var(--color-text-soft); text-align:center; padding:20px;">Ninguna entrega pendiente tiene ubicación guardada todavía.</p>'}
          </div>
        </div>
      </div>`;
    document.body.appendChild(overlay);

    let map = null, repMarker = null, line = null, watchId = null;
    let ultimoCalculo = 0;
    let fitAutoPendiente = true;
    let followMode = true;
    const REFRESH_MS = 15000;

    function cerrar() {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      map = null;
      overlay.remove();
    }
    document.getElementById('route-modal-close').addEventListener('click', cerrar);
    overlay.addEventListener('click', e => { if (e.target === overlay) cerrar(); });

    // Toggle del bottom-sheet
    const sheet = document.getElementById('route-sheet');
    const sheetTitle = sheet.querySelector('.sheet-title');
    document.getElementById('sheet-handle').addEventListener('click', () => {
      sheet.classList.toggle('collapsed');
      const colapsado = sheet.classList.contains('collapsed');
      sheetTitle.textContent = `${puntos.length} parada${puntos.length === 1 ? '' : 's'} · toca para ${colapsado ? 'expandir' : 'ocultar'}`;
      // Espera a que termine la animación del sheet (.3s) y re-centra si sigues en modo seguir
      setTimeout(() => { if (map && followMode && repMarker) map.panTo(desplazarCentro(repMarker.getLatLng()), { animate: true, duration: 0.4 }); }, 320);
    });

    if (!puntos.length || typeof L === 'undefined') return;

    function calcularPadding() {
      const sheetH = sheet.offsetHeight || (sheet.classList.contains('collapsed') ? 70 : Math.min(window.innerHeight * 0.55, 380));
      return {
        paddingTopLeft: [30, 100],
        paddingBottomRight: [30, sheetH + 20]
      };
    }

    // El bottom-sheet (y el encabezado) tapan parte del mapa: el "centro" de lo que
    // realmente se ve NO es el centro del contenedor. setView/panTo a secas dejaban
    // tu punto justo debajo del sheet; aquí se desplaza el centro para que tu punto
    // quede en medio de la zona visible.
    function desplazarCentro(latlng, zoom) {
      const z = zoom != null ? zoom : map.getZoom();
      const pad = calcularPadding();
      const dy = (pad.paddingBottomRight[1] - pad.paddingTopLeft[1]) / 2;
      return map.unproject(map.project(latlng, z).add([0, dy]), z);
    }
    function centrarEn(latlng, zoom, animate) {
      const z = zoom != null ? zoom : map.getZoom();
      map.setView(desplazarCentro(latlng, z), z, { animate });
    }

    function recalcular(repLatLng) {
      const paradas = puntos.map(g => [g.lat, g.lng]);
      const todos = repLatLng ? [repLatLng, ...paradas] : paradas;
      trazarRutaCalles(todos).then(ruta => {
        if (!map) return;
        line.setLatLngs(ruta || todos);
        line.setStyle({ dashArray: ruta ? null : '6 6' });
        if (fitAutoPendiente) {
          map.fitBounds(ruta || todos, calcularPadding());
          if (repLatLng) fitAutoPendiente = false;
        }
        const note = document.getElementById('route-note');
        if (note) {
          note.style.display = ruta ? 'none' : 'block';
          note.textContent = 'No se pudo calcular la ruta por calles — se muestra la línea directa.';
        }
      });
    }

    function mostrarBotonRecentrar() {
      const Control = L.Control.extend({
        onAdd: function() {
          const btn = L.DomUtil.create('button', '');
          btn.innerHTML = '◎';
          btn.title = 'Centrar y reactivar seguimiento';
          Object.assign(btn.style, {
            width: '38px', height: '38px', fontSize: '18px',
            background: 'var(--color-surface-2, #1e2128)',
            color: 'var(--color-text-primary, #fff)',
            border: '1px solid var(--color-border-subtle, #333)',
            borderRadius: '8px', cursor: 'pointer'
          });
          L.DomEvent.disableClickPropagation(btn);
          btn.onclick = () => {
            followMode = true;
            if (repMarker) {
              // Al reactivar seguimiento, subimos el zoom a nivel calle
              // (mínimo 15) para que realmente se vea el punto morado, no
              // una vista de ciudad entera donde el punto es una mota.
              centrarEn(repMarker.getLatLng(), Math.max(map.getZoom(), 15), true);
            } else if (line) {
              map.fitBounds(line.getBounds(), calcularPadding());
            }
          };
          return btn;
        },
        onRemove: function() {}
      });
      new Control({ position: 'topright' }).addTo(map);
    }

    setTimeout(() => {
      map = L.map('route-map', { zoomControl: false });
      L.control.zoom({ position: 'topleft' }).addTo(map);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap', maxZoom: 19 }).addTo(map);

      const latlngs = puntos.map(g => [g.lat, g.lng]);
      latlngs.forEach((ll, i) => L.marker(ll, { icon: L.divIcon({ className: '', html: `<div class="num-pin">${i + 1}</div>`, iconSize: [26, 26], iconAnchor: [13, 13] }) }).addTo(map).bindPopup(`${i + 1}. ${puntos[i].compradorNombre}`));
      line = L.polyline(latlngs, { color: '#ec4899', weight: 3, dashArray: '6 6' }).addTo(map);

      // invalidateSize antes del primer fitBounds — el contenedor acaba de
      // pasar a pantalla completa y Leaflet puede tener medidas cacheadas.
      map.invalidateSize();
      map.fitBounds(latlngs, calcularPadding());
      mostrarBotonRecentrar();
      map.on('dragstart', () => { followMode = false; });
      recalcular(null);

      const gpsNote = document.getElementById('route-gps-note');
      if (!navigator.geolocation) { if (gpsNote) gpsNote.textContent = 'Tu navegador no soporta geolocalización.'; return; }
      const repIcon = L.divIcon({
        className: '', html: '<div style="width:14px;height:14px;border-radius:50%;background:#c084fc;border:2px solid #fff;box-shadow:0 0 0 2px #c084fc;"></div>',
        iconSize: [14, 14], iconAnchor: [7, 7]
      });

      watchId = navigator.geolocation.watchPosition((pos) => {
        if (!map) return;
        const repLatLng = [pos.coords.latitude, pos.coords.longitude];
        const primeraVez = !repMarker;

        if (primeraVez) repMarker = L.marker(repLatLng, { icon: repIcon }).addTo(map).bindPopup('Tú');
        else repMarker.setLatLng(repLatLng);

        if (followMode) {
          if (primeraVez) {
            // Primera lectura GPS: centra en el repartidor con zoom de calle.
            // Apago fitAutoPendiente AQUÍ (antes de que OSRM responda) para
            // que el fitBounds de recalcular() no vuelva a alejar la vista.
            fitAutoPendiente = false;
            centrarEn(repLatLng, 15, true);
          } else {
            map.panTo(desplazarCentro(repLatLng), { animate: true, duration: 0.5 });
          }
        }
        if (primeraVez && gpsNote) gpsNote.textContent = 'Tu punto morado se mueve solo · recalcula cada 15s';

        const ahora = Date.now();
        if (ahora - ultimoCalculo < REFRESH_MS) return;
        ultimoCalculo = ahora;
        recalcular(repLatLng);
      }, (err) => {
        // Antes el error se tragaba en silencio y el mapa se quedaba sin centrar sin explicar por qué.
        if (gpsNote && err && err.code === 1) gpsNote.textContent = 'Activa el permiso de ubicación del navegador para ver tu punto en el mapa.';
      }, { enableHighAccuracy: true, maximumAge: 5000 });
    }, 50);
  }

  const activos = new Set(); // compradorKeys que reciben mi ubicación (un solo GPS para todos)
  let watchId = null, wakeLock = null, ultimo = { t: 0, pos: null };
  const trackKey = () => 'zr_tracking_' + liveId;
  const metros = (a, b) => Math.hypot((b[0] - a[0]) * 110540, (b[1] - a[1]) * 111320 * Math.cos(a[0] * Math.PI / 180));
  const waNum = t => { const d = String(t).replace(/\D/g, ''); return d.length === 10 ? '52' + d : d.replace(/^521(?=\d{10}$)/, '52'); };
  const linkSeguimiento = key => `${location.origin}/seguimiento-entrega.html?live=${encodeURIComponent(liveId)}&key=${encodeURIComponent(key)}`;
  const waLink = g => `https://wa.me/${waNum(g.compradorTelefono)}?text=${encodeURIComponent('¡Tu pedido va en camino! Sigue la ubicación del repartidor aquí: ' + linkSeguimiento(g.compradorKey))}`;
  const pantalla = async on => { try { if (on) wakeLock = await navigator.wakeLock.request('screen'); else { await wakeLock?.release(); wakeLock = null; } } catch (e) {} };

  function seguir(key) {
    if (!navigator.geolocation) return;
    activos.add(key); localStorage.setItem(trackKey(), JSON.stringify([...activos]));
    if (watchId !== null) return;
    pantalla(true);
    watchId = navigator.geolocation.watchPosition(onPos, err => {
      if (err.code === 1) { toast('Activa el permiso de ubicación para compartir tu ruta.'); [...activos].forEach(dejar); }
    }, { enableHighAccuracy: true, maximumAge: 5000 });
  }

  function dejar(key) {
    activos.delete(key); localStorage.setItem(trackKey(), JSON.stringify([...activos]));
    if (activos.size || watchId === null) return;
    navigator.geolocation.clearWatch(watchId); watchId = null; pantalla(false);
  }

  // Envía solo si te moviste >20 m (mín. 5 s) o como latido cada 30 s
  function onPos({ coords: { latitude: lat, longitude: lng } }) {
    const ahora = Date.now(), p = [lat, lng], dt = ahora - ultimo.t;
    if (ultimo.pos && dt < 30000 && !(dt > 5000 && metros(ultimo.pos, p) > 20)) return;
    ultimo = { t: ahora, pos: p };
    activos.forEach(key => apiFetch({ action: 'actualizarUbicacionRepartidor', liveId, compradorKey: key, lat, lng }, 'POST')
      .then(resp => { const g = grupoDe(key); if (resp.ok && resp.estado && g && resp.estado !== g.estado) { g.estado = resp.estado; render(); } })
      .catch(() => enqueue('actualizarUbicacionRepartidor', { compradorKey: key, lat, lng }, key + ':ubi')));
  }

  async function toggleRuta(key) {
    if (activos.has(key)) { dejar(key); return toggleEstado(key, 'pendiente'); }
    if (!navigator.geolocation) { toast('Tu navegador no soporta geolocalización.'); return; }
    expandedKeys.add(key);
    seguir(key);
    await toggleEstado(key, 'en-ruta');
    if (!['en-ruta', 'cerca'].includes(grupoDe(key)?.estado)) dejar(key);
  }

  async function avisarLlegada(key, btn) {
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = Icon('clock') + ' Enviando...';
    try {
      const resp = await apiFetch({
        action: 'notificarLlegadaEntrega',
        liveId,
        compradorKey: key
      }, 'POST');
      if (!resp.ok) throw new Error(resp.error || 'No se pudo enviar el aviso');
      if (resp.enviados > 0) {
        btn.innerHTML = Icon('check') + ' Avisado';
      } else {
        btn.innerHTML = Icon('error') + ' Sin notificaciones';
        alert('Este cliente no tiene notificaciones activadas. Contáctalo por WhatsApp o llamada.');
      }
    } catch (err) {
      btn.innerHTML = Icon('x') + ' Error';
      alert('No se pudo avisar al cliente: ' + err.message);
    } finally {
      setTimeout(() => { btn.innerHTML = original; btn.disabled = false; }, 2500);
    }
  }

  // --- Modo offline: cache del último listado + cola de cambios pendientes ---
  const cacheKey = () => 'zr_entregas_cache_' + liveId;
  const queueKey = () => 'zr_entregas_queue_' + liveId;
  const loadQueue = () => { try { return JSON.parse(localStorage.getItem(queueKey())) || []; } catch (e) { return []; } };
  const saveQueue = (q) => localStorage.setItem(queueKey(), JSON.stringify(q));
  function enqueue(action, extra, dedupeKey) {
    const q = loadQueue().filter(x => x.dedupeKey !== dedupeKey);
    q.push({ action, extra, dedupeKey });
    saveQueue(q);
    headerSubtitle.textContent = `Sin conexión — ${q.length} cambio${q.length !== 1 ? 's' : ''} pendiente${q.length !== 1 ? 's' : ''}`;
    navigator.serviceWorker?.ready.then(reg => reg.sync?.register('sync-entregas')).catch(() => {});
  }
  navigator.serviceWorker?.addEventListener('message', e => { if (e.data?.type === 'SYNC_ENTREGAS') sync(); });
  async function sync() {
    if (!navigator.onLine) return;
    let q = loadQueue();
    if (!q.length) return;
    for (const item of q.slice()) {
      try {
        const resp = await apiFetch({ action: item.action, liveId, ...item.extra }, 'POST');
        q = q.filter(x => x !== item); saveQueue(q); // el server respondió (aunque rechace): no reintentar
      } catch (err) { break; }
    }
    if (!loadQueue().length) cargar();
  }
  window.addEventListener('online', sync);

  // Guarda en servidor; si el server rechaza, revierte. Solo se encola ante errores de red.
  async function toggleEstado(key, nuevo) {
    const g = grupoDe(key);
    if (!g || g.estado === nuevo) return;
    const prev = g.estado; g.estado = nuevo; render();
    let resp;
    try { resp = await apiFetch({ action: 'actualizarEstadoEntrega', liveId, compradorKey: key, estado: nuevo }, 'POST'); }
    catch (err) { enqueue('actualizarEstadoEntrega', { compradorKey: key, estado: nuevo }, key + ':estado'); return; }
    if (!resp.ok) { g.estado = prev; render(); toast(resp.error || 'No se pudo guardar el cambio.'); }
  }

  // Entregado: es terminal, así que se confirma 5 s después y mientras tanto se puede deshacer
  function entregar(key) {
    const g = grupoDe(key), prev = g.estado;
    dejar(key); g.estado = 'entregado'; render();
    toast(`Entregado a ${g.compradorNombre}`, {
      undo: () => { g.estado = prev; if (['en-ruta', 'cerca'].includes(prev)) seguir(key); render(); },
      commit: () => { g.estado = prev; toggleEstado(key, 'entregado'); }
    });
  }

  let toastEnd = null, toastT;
  function toast(msg, { undo, commit, ms = 5000 } = {}) {
    toastEnd?.(); // confirma el aviso anterior antes de mostrar otro
    const el = document.getElementById('toast');
    el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button>Deshacer</button>' : ''}`;
    el.classList.add('show');
    const fin = run => { clearTimeout(toastT); toastEnd = null; el.classList.remove('show'); run?.(); };
    toastEnd = () => fin(commit);
    toastT = setTimeout(toastEnd, ms);
    el.querySelector('button')?.addEventListener('click', () => fin(undo));
  }

  let reanudado = false;
  async function cargar(silent) {
    silent = silent === true;
    if (!liveId) { renderInvalido('Este link no trae identificador de transmisión.'); return; }
    if (silent && (toastEnd || loadQueue().length || document.activeElement?.tagName === 'SELECT')) return;
    if (!silent) wrap.innerHTML = '<div class="loading-spinner"></div>';
    try {
      const resp = await apiFetch({ action: 'obtenerEntregasLive', liveId });
      if (resp.requiereCodigo) { // link sin código o código cambiado: no se enseña ni lo guardado sin conexión
        localStorage.removeItem(cacheKey()); localStorage.removeItem(tokKey);
        renderInvalido(resp.error); return;
      }
      if (!resp.ok) { if (!silent) renderInvalido(resp.error || 'Error al cargar los datos'); return; }
      const txt = JSON.stringify(resp), igual = txt === localStorage.getItem(cacheKey());
      localStorage.setItem(cacheKey(), txt);
      if (!(silent && igual && entrega)) { entrega = resp; render(); }
      if (!reanudado) { // retoma el GPS si recargaron la página en plena ruta
        reanudado = true;
        JSON.parse(localStorage.getItem(trackKey()) || '[]').forEach(k => ['en-ruta', 'cerca'].includes(grupoDe(k)?.estado) && seguir(k));
      }
      sync();
    } catch (err) {
      if (silent && entrega) return;
      const cached = localStorage.getItem(cacheKey());
      if (!cached) { renderInvalido('Hubo un problema de conexión.'); return; }
      entrega = JSON.parse(cached);
      render();
      const pendientes = loadQueue().length;
      headerSubtitle.textContent = pendientes ? `Sin conexión — ${pendientes} cambio(s) pendiente(s)` : 'Sin conexión — mostrando datos guardados';
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { toastEnd?.(); return; }
    if (activos.size && (!wakeLock || wakeLock.released)) pantalla(true);
    cargar(true);
  });
  setInterval(() => !document.hidden && cargar(true), 30000);
  cargar();
})();
</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js', { scope: '/' });</script>
