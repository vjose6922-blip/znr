<script>
/* Diálogos ZNR (reemplazan alert/confirm nativos: "znrcommunity.com says").
   alert() y confirm() devuelven Promesa -> usar `await confirm(...)`. Usan los estilos .custom-alert-* de styles.css */
(function () {
  if (window.__znrDialogs) return;
  window.__znrDialogs = true;
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function abrir(titulo, mensaje, botones) {
    return new Promise((resolve) => {
      const m = document.createElement('div');
      m.className = 'custom-alert-modal';
      m.setAttribute('role', 'dialog');
      m.setAttribute('aria-modal', 'true');
      m.innerHTML = '<div class="custom-alert-content">' +
        '<div class="custom-alert-header"><h3>' + esc(titulo) + '</h3></div>' +
        '<div class="custom-alert-body"><p style="white-space:pre-line;margin:0">' + esc(mensaje) + '</p></div>' +
        '<div class="custom-alert-footer">' +
        botones.map((b) => '<button type="button" class="custom-alert-btn ' + b.cls + '">' + esc(b.txt) + '</button>').join('') +
        '</div></div>';
      document.body.appendChild(m);
      let cerrado = false;
      const salida = botones.length > 1 ? false : undefined;
      const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); cerrar(salida); } };
      const cerrar = (valor) => {
        if (cerrado) return;
        cerrado = true;
        document.removeEventListener('keydown', onKey, true);
        m.classList.add('closing');
        setTimeout(() => { m.remove(); resolve(valor); }, 150);
      };
      document.addEventListener('keydown', onKey, true);
      botones.forEach((b) => m.querySelector('.custom-alert-btn.' + b.cls).addEventListener('click', () => cerrar(b.valor)));
      m.addEventListener('click', (e) => { if (e.target === m) cerrar(salida); });
      const ok = m.querySelector('.custom-alert-btn.confirm');
      if (ok) setTimeout(() => ok.focus(), 50);
    });
  }
  window.alert = (msg) => abrir('Aviso', msg, [{ cls: 'confirm', txt: 'Aceptar', valor: undefined }]);
  window.confirm = (msg) => abrir('Confirmar', msg, [{ cls: 'cancel', txt: 'Cancelar', valor: false }, { cls: 'confirm', txt: 'Aceptar', valor: true }]);
})();
</script>

    const total = '$' + Number(g.total || 0).toLocaleString();
    const lleva = (g.items || []).map(it => `${esc(it.nombre)} (${'$' + Number(it.precio || 0).toLocaleString()})`).join(', ');
    return `
    <div class="entrega-card ${entregado ? 'is-entregado' : ''} ${abierta ? 'expanded' : ''} ${hero ? 'hero' : ''}" data-key="${esc(key)}">
      <div class="card-header" data-action="toggle-card">
        ${!enCamino && !entregado ? `<input type="checkbox" class="sel-ruta" ${seleccion.has(key) ? 'checked' : ''} aria-label="Llevar en la ruta">` : ''}
        ${entregado ? `<span class="orden-num">${idx + 1}</span>` : `<span class="mover"><button data-mv="-1" aria-label="Subir">▲</button><button data-mv="1" aria-label="Bajar">▼</button></span>`}
        <div class="ch-info"><h2>${esc(g.compradorNombre)}</h2><span class="ch-total">${total}</span></div>
        <span class="estado-pill ${estado}">${label}</span>
        <span class="chevron"></span>
      </div>
      <div class="card-body" style="${abierta ? '' : 'display:none;'}">
        ${entregado ? `<p class="entrega-detail"><b>Llevó:</b> ${lleva}</p>` : `
        <div class="cobro"><span>Cobrar en efectivo</span><span>${total}</span></div>
        ${g.compradorDireccion ? `<p class="entrega-detail"><b>Dirección:</b> ${esc(g.compradorDireccion)}<button class="mini-copy" data-copy="${esc(g.compradorDireccion)}">Copiar</button></p>` : ''}
        ${g.compradorHorario ? `<p class="entrega-detail"><b>Horario:</b> ${esc(g.compradorHorario)}</p>` : ''}
        ${g.compradorNota ? `<p class="entrega-detail nota"><b>Entregar en otra ubicación:</b> ${esc(g.compradorNota)}</p>` : ''}
        <p class="entrega-detail"><b>Lleva:</b> ${lleva}</p>
        <div class="contacto">
          ${tel ? `<a href="tel:${esc(tel)}">${Icon('phone-call')} Llamar</a><a href="https://wa.me/${waNum(tel)}" target="_blank" rel="noopener">${Icon('whatsapp')} WhatsApp</a>` : ''}
          ${url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${Icon('map-pin')} Mapa</a>` : ''}
        </div>
        ${g.pideCodigo ? `<input class="cod-input" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="Código del cliente" aria-label="Código de entrega del cliente">` : ''}
        <div class="estado-actions"><button class="btn-entregado" data-action="entregado">${Icon('check')} Entregado</button></div>
        ${contactando.has(key) ? `<div class="fallo"><p>Antes, intenta contactar al cliente con Llamar o WhatsApp.</p>
          <button class="btn-avisar" data-action="confirmar-fallo">Confirmar: no se pudo entregar</button></div>` : ''}
        <details class="mas" ${masAbiertas.has(key) ? 'open' : ''}><summary>Más opciones</summary><div class="mas-btns">
          <button class="btn-avisar" data-action="avisar">${Icon('map-pin')} Avisar llegada</button>
          ${enCamino ? `<button class="btn-avisar" data-action="fallo">${Icon('x')} No se pudo entregar</button>
          <button class="btn-tracking" data-action="toggle-ruta">${Icon('clock')} Quitar de la ruta</button>
          ${tel ? `<a class="btn-tracking" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="${waLink(g)}" target="_blank" rel="noopener">Enviar link de seguimiento</a>` : ''}` : `
          <select class="btn-tracking" data-action="set-estado-manual">
            <option value="pendiente" ${estado === 'pendiente' ? 'selected' : ''}>⏳ Pendiente</option>
            <option value="preparando" ${estado === 'preparando' ? 'selected' : ''}>📦 Preparando</option>
          </select>`}
        </div></details>`}
      </div>
    </div>`;
  }

  function gruposOrdenados() {
    const fin = g => ({ 'no-entregado': 1, entregado: 2 })[g.estado] || 0; // fuera de la ruta: al final
    return entrega.grupos.slice().sort((a, b) => fin(a) - fin(b) || (a.orden ?? 999) - (b.orden ?? 999));
  }
  const grupoDe = k => entrega?.grupos.find(g => String(g.compradorKey) === String(k));

  const expandedKeys = new Set(), seleccion = new Set(), contactando = new Set(), masAbiertas = new Set();

  function render() {
    let primera = true; // igual que el servidor: la primera parada en ruta es la "siguiente"
    gruposOrdenados().forEach(g => { if (EN_CAMINO.includes(g.estado)) { g.estado = primera ? 'siguiente' : 'en-ruta'; primera = false; } });
    headerTitle.textContent = entrega.liveTitulo ? `Entregas — ${entrega.liveTitulo}` : 'Entregas';
    headerSubtitle.textContent = entrega.vendedorNombre ? `De ${entrega.vendedorNombre}` : 'Coordinación de entregas';

    wrap.innerHTML = renderResumen() +
      gruposOrdenados().map((g, i) => renderGrupo(g, i)).join('') +
      `<p class="local-note">Lo que marques aquí lo va a ver el vendedor desde su panel.</p>`;

    const on = (id, fn) => document.getElementById(id)?.addEventListener('click', fn);
    on('btn-refrescar', () => cargar(true).then(() => toast('Actualizado')));
    on('btn-iniciar-ruta', iniciarRuta);
    on('btn-optimizar-ruta', optimizarRuta);
    on('btn-marcar-todos', () => { entrega.grupos.filter(g => !EN_CAMINO.includes(g.estado) && g.estado !== 'entregado').forEach(g => seleccion.add(g.compradorKey)); render(); });

    wrap.querySelectorAll('.entrega-card').forEach(card => {
      const key = card.dataset.key, alternar = set => { set.has(key) ? set.delete(key) : set.add(key); render(); };
      const acciones = {
        'toggle-card': () => alternar(expandedKeys),
        fallo: () => alternar(contactando),
        avisar: btn => avisarLlegada(key, btn),
        'toggle-ruta': () => { dejar(key); toggleEstado(key, 'pendiente'); }, // quitar de la ruta
        'confirmar-fallo': () => { contactando.delete(key); dejar(key); toggleEstado(key, 'no-entregado'); },
        entregado: () => {
          const inp = card.querySelector('.cod-input');
          if (!inp) return entregar(key);
          if (!/^\d{4}$/.test(inp.value)) { toast('Pídele al cliente su código de 4 dígitos.'); inp.focus(); return; }
          entregar(key, inp.value);
        },
      };
      card.querySelectorAll('[data-action]').forEach(el => acciones[el.dataset.action] && el.addEventListener('click', () => acciones[el.dataset.action](el)));
      card.querySelectorAll('[data-mv]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); mover(key, +b.dataset.mv); }));
      const sel = card.querySelector('.sel-ruta');
      sel?.addEventListener('click', e => e.stopPropagation());
      sel?.addEventListener('change', () => { sel.checked ? seleccion.add(key) : seleccion.delete(key); render(); });
      card.querySelector('[data-copy]')?.addEventListener('click', e => { navigator.clipboard?.writeText(e.currentTarget.dataset.copy).then(() => toast('Dirección copiada')); });
      card.querySelector('details.mas')?.addEventListener('toggle', e => { e.target.open ? masAbiertas.add(key) : masAbiertas.delete(key); });
      const select = card.querySelector('[data-action="set-estado-manual"]');
      select?.addEventListener('change', () => toggleEstado(key, select.value));
    });
  }

  function mover(key, d) {
    const l = gruposOrdenados(), n = l.filter(g => g.estado !== 'entregado').length;
    const i = l.findIndex(g => g.compradorKey === key), j = i + d;
    if (j < 0 || j >= n) return;
    [l[i], l[j]] = [l[j], l[i]];
    l.forEach((g, k) => { g.orden = k; });
    render(); persistirOrden();
  }

  async function persistirOrden() {
    const ordenes = JSON.stringify(gruposOrdenados().map((g, i) => ({ compradorKey: g.compradorKey, orden: i })));
    try { await apiFetch({ action: 'guardarOrdenEntregas', liveId, ordenes }, 'POST'); }
    catch (err) { enqueue('guardarOrdenEntregas', { ordenes }, 'orden'); }
  }

  async function optimizarRuta() {
    const todos = gruposOrdenados(), previo = todos.map(g => g.orden);
    const pend = todos.filter(g => g.estado !== 'entregado'), resto = pend.filter(tieneGeo), orden = [];
    if (resto.length < 2) { toast('No hay suficientes entregas con ubicación para reordenar.'); return; }
    let p = await new Promise(r => navigator.geolocation ? navigator.geolocation.getCurrentPosition(x => r([x.coords.latitude, x.coords.longitude]), () => r(null), { enableHighAccuracy: true, timeout: 5000 }) : r(null));
    for (p = p || [resto[0].lat, resto[0].lng]; resto.length; p = [orden.at(-1).lat, orden.at(-1).lng]) {
      const d = g => metros(p, [g.lat, g.lng]);
      orden.push(resto.splice(resto.reduce((m, g, i) => d(g) < d(resto[m]) ? i : m, 0), 1)[0]);
    }
    [...orden, ...pend.filter(g => !tieneGeo(g)), ...todos.filter(g => g.estado === 'entregado')].forEach((g, i) => { g.orden = i; });
    render(); persistirOrden();
    toast('Ruta reordenada', { undo: () => { todos.forEach((g, i) => { g.orden = previo[i]; }); render(); persistirOrden(); } });
  }

  async function iniciarRuta() {
    const keys = [...seleccion];
    if (!keys.length) { toast('Marca con la casilla los pedidos que vas a llevar.'); return; }
    if (!navigator.geolocation) { toast('Tu navegador no soporta geolocalización.'); return; }
    keys.forEach(k => { grupoDe(k).estado = 'en-ruta'; seguir(k); }); seleccion.clear(); render();
    const compradorKeys = JSON.stringify(keys);
    try { const r = await apiFetch({ action: 'iniciarRutaEntregas', liveId, compradorKeys }, 'POST'); if (!r.ok) toast(r.error || 'No se pudo iniciar la ruta.'); cargar(true); }
    catch (err) { enqueue('iniciarRutaEntregas', { compradorKeys }, 'iniciar:' + compradorKeys); }
  }

  const activos = new Set(); // compradorKeys que reciben mi ubicación (un solo GPS para todos)
  let watchId = null, wakeLock = null, ultimo = { t: 0, pos: null };
  const trackKey = () => 'zr_tracking_' + liveId;
  const metros = (a, b) => Math.hypot((b[0] - a[0]) * 110540, (b[1] - a[1]) * 111320 * Math.cos(a[0] * Math.PI / 180));
  const waNum = t => { const d = String(t).replace(/\D/g, ''); return d.length === 10 ? '52' + d : d.replace(/^521(?=\d{10}$)/, '52'); };
  const linkSeguimiento = key => `${location.origin}/seguimiento-entrega.html?live=${encodeURIComponent(liveId)}&key=${encodeURIComponent(key)}`;
  const waLink = g => `https://wa.me/${waNum(g.compradorTelefono)}?text=${encodeURIComponent('¡Tu pedido va en camino! Síguelo aquí: ' + linkSeguimiento(g.compradorKey))}`;
  const pantalla = async on => { try { if (on) wakeLock = await navigator.wakeLock.request('screen'); else { await wakeLock?.release(); wakeLock = null; } } catch (e) {} };

  function seguir(key) {
    if (!navigator.geolocation) return;
    activos.add(key); localStorage.setItem(trackKey(), JSON.stringify([...activos]));
    if (watchId !== null) return;
    pantalla(true);
    watchId = navigator.geolocation.watchPosition(onPos, err => {
      if (err.code === 1) { toast('Activa el permiso de ubicación para compartir tu ruta.'); [...activos].forEach(dejar); }
    }, { enableHighAccuracy: true, maximumAge: 5000 });
  }

  function dejar(key) {
    activos.delete(key); localStorage.setItem(trackKey(), JSON.stringify([...activos]));
    if (activos.size || watchId === null) return;
    navigator.geolocation.clearWatch(watchId); watchId = null; pantalla(false);
  }

  // Envía solo si te moviste >20 m (mín. 15 s) o como latido cada 30 s, y solo con ruta activa
  function onPos({ coords: { latitude: lat, longitude: lng } }) {
    const ahora = Date.now(), p = [lat, lng], dt = ahora - ultimo.t;
    if (ultimo.pos && dt < 30000 && !(dt > 15000 && metros(ultimo.pos, p) > 20)) return;
    ultimo = { t: ahora, pos: p };
    if (!activos.size) return;
    apiFetch({ action: 'actualizarUbicacionRepartidor', liveId, lat, lng }, 'POST')
      .catch(() => enqueue('actualizarUbicacionRepartidor', { lat, lng }, 'ubi'));
  }

  async function avisarLlegada(key, btn) {
    const original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = Icon('clock') + ' Enviando...';
    try {
      const resp = await apiFetch({
        action: 'notificarLlegadaEntrega',
        liveId,
        compradorKey: key
      }, 'POST');
      if (!resp.ok) throw new Error(resp.error || 'No se pudo enviar el aviso');
      if (resp.enviados > 0) {
        btn.innerHTML = Icon('check') + ' Avisado';
      } else {
        btn.innerHTML = Icon('error') + ' Sin notificaciones';
        alert('Este cliente no tiene notificaciones activadas. Contáctalo por WhatsApp o llamada.');
      }
    } catch (err) {
      btn.innerHTML = Icon('x') + ' Error';
      alert('No se pudo avisar al cliente: ' + err.message);
    } finally {
      setTimeout(() => { btn.innerHTML = original; btn.disabled = false; }, 2500);
    }
  }

  // --- Modo offline: cache del último listado + cola de cambios pendientes ---
  const cacheKey = () => 'zr_entregas_cache_' + liveId;
  const queueKey = () => 'zr_entregas_queue_' + liveId;
  const loadQueue = () => { try { return JSON.parse(localStorage.getItem(queueKey())) || []; } catch (e) { return []; } };
  const saveQueue = (q) => localStorage.setItem(queueKey(), JSON.stringify(q));
  function enqueue(action, extra, dedupeKey) {
    const q = loadQueue().filter(x => x.dedupeKey !== dedupeKey);
    q.push({ action, extra, dedupeKey });
    saveQueue(q);
    headerSubtitle.textContent = `Sin conexión — ${q.length} cambio${q.length !== 1 ? 's' : ''} pendiente${q.length !== 1 ? 's' : ''}`;
    navigator.serviceWorker?.ready.then(reg => reg.sync?.register('sync-entregas')).catch(() => {});
  }
  navigator.serviceWorker?.addEventListener('message', e => { if (e.data?.type === 'SYNC_ENTREGAS') sync(); });
  async function sync() {
    if (!navigator.onLine) return;
    let q = loadQueue();
    if (!q.length) return;
    for (const item of q.slice()) {
      try {
        const resp = await apiFetch({ action: item.action, liveId, ...item.extra }, 'POST');
        q = q.filter(x => x !== item); saveQueue(q); // el server respondió (aunque rechace): no reintentar
      } catch (err) { break; }
    }
    if (!loadQueue().length) cargar();
  }
  window.addEventListener('online', sync);

  // Guarda en servidor; si el server rechaza, revierte. Solo se encola ante errores de red.
  async function toggleEstado(key, nuevo, codigo) {
    const g = grupoDe(key);
    if (!g || g.estado === nuevo) return;
    const prev = g.estado; g.estado = nuevo; render();
    let resp;
    try { resp = await apiFetch({ action: 'actualizarEstadoEntrega', liveId, compradorKey: key, estado: nuevo, codigo }, 'POST'); }
    catch (err) { enqueue('actualizarEstadoEntrega', { compradorKey: key, estado: nuevo, codigo }, key + ':estado'); return; }
    if (!resp.ok) { g.estado = prev; render(); toast(resp.error || 'No se pudo guardar el cambio.'); }
  }

  // Entregado: es terminal, así que se confirma 5 s después y mientras tanto se puede deshacer
  async function entregar(key, codigo) {
    const g = grupoDe(key), prev = g.estado;
    if (codigo !== undefined) { // el código del cliente ya es la confirmación: sin espera ni deshacer
      await toggleEstado(key, 'entregado', codigo);
      if (grupoDe(key).estado === 'entregado') dejar(key);
      return;
    }
    dejar(key); g.estado = 'entregado'; render();
    toast(`Entregado a ${g.compradorNombre}`, {
      undo: () => { g.estado = prev; if (EN_CAMINO.includes(prev)) seguir(key); render(); },
      commit: () => { g.estado = prev; toggleEstado(key, 'entregado'); }
    });
  }

  let toastEnd = null, toastT;
  function toast(msg, { undo, commit, ms = 5000 } = {}) {
    toastEnd?.(); // confirma el aviso anterior antes de mostrar otro
    const el = document.getElementById('toast');
    el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button>Deshacer</button>' : ''}`;
    el.classList.add('show');
    const fin = run => { clearTimeout(toastT); toastEnd = null; el.classList.remove('show'); run?.(); };
    toastEnd = () => fin(commit);
    toastT = setTimeout(toastEnd, ms);
    el.querySelector('button')?.addEventListener('click', () => fin(undo));
  }

  let reanudado = false;
  async function cargar(silent) {
    silent = silent === true;
    if (!liveId) { renderInvalido('Este link no trae identificador de transmisión.'); return; }
    if (silent && (toastEnd || loadQueue().length || ['SELECT', 'INPUT'].includes(document.activeElement?.tagName))) return;
    if (!silent) wrap.innerHTML = '<div class="loading-spinner"></div>';
    try {
      const resp = await apiFetch({ action: 'obtenerEntregasLive', liveId });
      if (resp.requiereCodigo) { // link sin código o código cambiado: no se enseña ni lo guardado sin conexión
        localStorage.removeItem(cacheKey()); localStorage.removeItem(tokKey);
        renderInvalido(resp.error); return;
      }
      if (!resp.ok) { if (!silent) renderInvalido(resp.error || 'Error al cargar los datos'); return; }
      const txt = JSON.stringify(resp), igual = txt === localStorage.getItem(cacheKey());
      localStorage.setItem(cacheKey(), txt);
      if (!(silent && igual && entrega)) { entrega = resp; render(); }
      if (!reanudado) { // retoma el GPS si recargaron la página en plena ruta
        reanudado = true;
        JSON.parse(localStorage.getItem(trackKey()) || '[]').forEach(k => EN_CAMINO.includes(grupoDe(k)?.estado) && seguir(k));
      }
      sync();
    } catch (err) {
      if (silent && entrega) return;
      const cached = localStorage.getItem(cacheKey());
      if (!cached) { renderInvalido('Hubo un problema de conexión.'); return; }
      entrega = JSON.parse(cached);
      render();
      const pendientes = loadQueue().length;
      headerSubtitle.textContent = pendientes ? `Sin conexión — ${pendientes} cambio(s) pendiente(s)` : 'Sin conexión — mostrando datos guardados';
    }
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { toastEnd?.(); return; }
    if (activos.size && (!wakeLock || wakeLock.released)) pantalla(true);
    cargar(true);
  });
  setInterval(() => !document.hidden && cargar(true), 30000);
  cargar();
})();
</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js', { scope: '/' });</script>
</body>
</html>
