<title>Entregas — Z&R</title>
<meta name="theme-color" content="#1e2128">
<link rel="preload" href="styles.css" as="style">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="api-config.js"></script>
<script src="icons.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" defer></script>
<style>
  .entregas-wrap { max-width: 640px; margin: 0 auto; padding: 16px; padding-bottom: 80px; }

  .resumen-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .resumen-chip {
    text-align: center; padding: 8px 4px;
    border-radius: var(--radius-md); background: var(--color-surface);
    border: 1px solid var(--color-border-subtle);
  }
  .resumen-chip .num { font-size: 16px; font-weight: 800; color: var(--color-text-primary); display: block; }
  .resumen-chip .lbl { font-size: 9.5px; color: var(--color-text-soft); text-transform: uppercase; letter-spacing: .03em; }
  .resumen-chip.ok .num { color: #4ade80; }
  .resumen-chip.pend .num { color: #fbbf24; }
  .resumen-chip.ruta .num { color: #60a5fa; }

  .ruta-actions { display: flex; gap: 8px; margin-bottom: 14px; }
  .btn-ruta-accion {
    flex: 1; border: none; border-radius: var(--radius-md); cursor: pointer;
    background: var(--color-surface-2); color: var(--color-text-primary);
    border: 1px solid var(--color-border-subtle);
    padding: 10px 6px; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }

  .btn-refrescar {
    display: block; width: 100%; text-align: center; margin-bottom: 14px;
    background: var(--color-surface-2); color: var(--color-text-primary);
    border: 1px solid var(--color-border-subtle); border-radius: var(--radius-md);
    padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer;
  }

  .entrega-card {
    background: var(--color-surface); border: 1px solid var(--color-border-subtle);
    border-radius: var(--radius-lg); margin-bottom: 10px; overflow: hidden;
    transition: opacity .2s ease;
  }
  .entrega-card.is-entregado { opacity: .55; }

  .card-header {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer;
  }
  .card-header .ch-info { flex: 1; min-width: 0; }
  .card-header h2 { margin: 0; font-size: 14.5px; color: var(--color-text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-header .ch-total { font-size: 12px; color: var(--color-text-soft); }
  .card-header .chevron { color: var(--color-text-soft); transition: transform .2s ease; flex-shrink: 0; }
  .entrega-card.expanded .chevron { transform: rotate(180deg); }

  .card-body { padding: 0 14px 14px; }

  .entrega-card .tel-link { font-size: 13px; color: var(--color-accent); text-decoration: none; }

  .estado-pill {
    font-size: 9.5px; font-weight: 700; letter-spacing: .02em;
    padding: 4px 9px; border-radius: var(--radius-pill); white-space: nowrap; flex-shrink: 0;
  }
  .estado-pill.pendiente { background: rgba(251,191,36,.15); color: #fbbf24; }
  .estado-pill.preparando { background: rgba(251,146,60,.15); color: #fb923c; }
  .estado-pill.en-ruta { background: rgba(96,165,250,.15); color: #60a5fa; }
  .estado-pill.cerca { background: rgba(192,132,252,.15); color: #c084fc; }
  .estado-pill.entregado { background: rgba(74,222,128,.15); color: #4ade80; }

  .entrega-detail { font-size: 13px; color: var(--color-text-soft); margin: 2px 0; line-height: 1.4; }
  .entrega-detail b { color: var(--color-text-primary); font-weight: 600; }

  .items-list { margin: 10px 0; padding: 10px 12px; background: var(--color-surface-2); border-radius: var(--radius-md); }
  .items-list .item-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--color-text-primary); padding: 3px 0; }
  .items-list .item-row span:last-child { color: var(--color-text-soft); }
  .total-row { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--color-border-subtle); color: var(--color-text-primary); }

  .btn-maps {
    display: block; text-align: center; text-decoration: none;
    background: var(--color-surface-2); color: var(--color-text-primary);
    border: 1px solid var(--color-border-subtle); border-radius: var(--radius-md);
    padding: 10px; font-size: 13px; font-weight: 600; margin: 10px 0;
  }
  .btn-maps:active { opacity: .8; }

  .estado-actions { display: flex; gap: 8px; margin-top: 10px; }
  .estado-actions button {
    flex: 1; border: none; border-radius: var(--radius-pill);
    padding: 11px; font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .estado-actions button:disabled { opacity: .5; cursor: default; }
  .btn-entregado { background: rgba(74,222,128,.15); color: #4ade80; }
  .btn-entregado.active { background: #4ade80; color: #0a2e1a; }
  .btn-pendiente { background: rgba(251,191,36,.15); color: #fbbf24; }
  .btn-pendiente.active { background: #fbbf24; color: #3a2a04; }
  .btn-avisar { background: rgba(59,130,246,.15); color: #60a5fa; }
  .btn-avisar:disabled { opacity: .6; }

  .btn-tracking {
    border: none; border-radius: var(--radius-md); cursor: pointer;
    background: rgba(168,85,247,.15); color: #c084fc;
    padding: 10px; font-size: 12.5px; font-weight: 700;
  }
  .btn-tracking.active { background: #c084fc; color: #2a0a3a; }

  .drag-handle {
    cursor: grab; color: var(--color-text-soft); padding: 4px 6px;
    touch-action: none; user-select: none; font-size: 16px; line-height: 1; flex-shrink: 0;
  }
  .entrega-card.dragging { opacity: .4; }
  .orden-num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 50%; background: var(--color-surface-2);
    color: var(--color-text-soft); font-size: 10.5px; font-weight: 700; flex-shrink: 0;
  }

  .route-modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 200;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .route-modal {
    background: var(--color-surface); width: 100%; max-width: 640px;
    border-radius: 18px 18px 0 0; max-height: 92vh; display: flex; flex-direction: column;
    overflow: hidden;
  }
  .route-modal-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px; border-bottom: 1px solid var(--color-border-subtle);
  }
  .route-modal-header h3 { margin: 0; font-size: 15px; color: var(--color-text-primary); }
  .route-note { margin: 0; padding: 8px 16px; font-size: 12px; color: #fbbf24; background: rgba(251,191,36,.1); }
  .route-note-info { color: var(--color-text-soft); background: transparent; padding-top: 0; }
  .route-modal-close { background: none; border: none; color: var(--color-text-soft); font-size: 20px; cursor: pointer; }
  #route-map { width: 100%; height: 55vh; }
  .route-list { overflow-y: auto; padding: 10px 16px 20px; max-height: 30vh; }
  .route-list-item { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--color-border-subtle); }
  .route-list-item:last-child { border-bottom: none; }
  .route-list-item .rli-num {
    width: 22px; height: 22px; border-radius: 50%; background: var(--color-accent-solid, #ec4899);
    color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;
  }
  .route-list-item .rli-nombre { font-size: 13.5px; color: var(--color-text-primary); font-weight: 600; }
  .route-list-item .rli-dir { font-size: 12px; color: var(--color-text-soft); }
  .route-list-item .rli-estado { font-size: 10px; color: var(--color-text-soft); margin-top: 2px; }
  .route-list-item .rli-estado.entregado { color: #4ade80; }
  .route-list-item .rli-estado.en-ruta { color: #60a5fa; }

  .center-card { max-width: 480px; margin: 60px auto; padding: 0 20px; text-align: center; }
  .center-card .icon { font-size: 44px; margin-bottom: 12px; }
  .center-card h2 { color: var(--color-text-primary); margin: 0 0 8px; }
  .center-card p { color: var(--color-text-soft); font-size: 14px; line-height: 1.5; }

  .loading-spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid var(--color-border-subtle); border-top-color: var(--color-accent-solid);
    animation: spin 0.8s linear infinite; margin: 60px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .local-note {
    font-size: 11px; color: var(--color-text-soft); text-align: center;
    margin: 18px 0 4px; line-height: 1.5;
  }

  .repartidor-pos-indicator {
    background: rgba(192,132,252,.2); border: 1px solid #c084fc;
    border-radius: var(--radius-md); padding: 4px 10px; font-size: 11px;
    color: #c084fc; display: inline-flex; align-items: center; gap: 6px;
    margin-bottom: 8px;
  }
  .repartidor-pos-indicator .dot {
    width: 8px; height: 8px; border-radius: 50%; background: #c084fc;
    animation: pulse-dot 1.5s infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .5; transform: scale(0.8); }
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <div class="header-text">
      <h1 class="app-title" id="header-title">Entregas</h1>
      <p class="app-subtitle" id="header-subtitle">Cargando…</p>
    </div>
  </div>
</header>

<main class="entregas-wrap" id="entregas-wrap"><div class="loading-spinner"></div></main>

<script src="znr-devconsole.js"></script>

<script>
(function() {
  'use strict';

  // Icon helper
  function Icon(name, opts) {
    opts = opts || {};
    const size = opts.size || 16;
    return '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><use href="#ic-' + name + '"/></svg>';
  }

  async function apiFetch(data, method) {
    method = method || 'GET';
    const API_BASE = "https://live-api-1038143238323.us-central1.run.app";
    const params = new URLSearchParams();
    for (var k in data) {
      if (data.hasOwnProperty(k) && data[k] !== undefined && data[k] !== null) {
        params.append(k, data[k]);
      }
    }
    var res;
    if (method === 'GET') {
      res = await fetch(API_BASE + '?' + params.toString(), { method: 'GET' });
    } else {
      res = await fetch(API_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params.toString()
      });
    }
    return JSON.parse(await res.text());
  }

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  var wrap = document.getElementById('entregas-wrap');
  var headerTitle = document.getElementById('header-title');
  var headerSubtitle = document.getElementById('header-subtitle');
  var params = new URLSearchParams(location.search);
  var liveId = params.get('id');

  var entrega = null;
  var repartidorPos = null;
  var watchId = null;
  var routeModalInstance = null;
  var routeUpdateInterval = null;
  var expandedKeys = new Set();
  var watchers = {};
  var dragKey = null;

  function renderInvalido(msg) {
    headerSubtitle.textContent = 'Enlace inválido';
    wrap.innerHTML = 
      '<div class="center-card">' +
        '<div class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" aria-hidden="true"><use href="#ic-link"/></svg></div>' +
        '<h2>No pudimos cargar esta entrega</h2>' +
        '<p>' + esc(msg || 'Pide al vendedor que te comparta el link de nuevo.') + '</p>' +
      '</div>';
  }

  function mapsUrl(g) {
    if (typeof g.lat === 'number' && typeof g.lng === 'number') {
      return 'https://www.google.com/maps/dir/?api=1&destination=' + g.lat + ',' + g.lng + '&travelmode=driving';
    }
    if (g.compradorDireccion) {
      return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(g.compradorDireccion) + '&travelmode=driving';
    }
    return null;
  }

  function renderResumen() {
    var total = entrega.grupos.length;
    var entregados = 0;
    var enRuta = 0;
    for (var i = 0; i < entrega.grupos.length; i++) {
      var g = entrega.grupos[i];
      if (g.estado === 'entregado') entregados++;
      else if (g.estado === 'en-ruta' || g.estado === 'cerca') enRuta++;
    }
    var pendientes = total - entregados - enRuta;
    var posHtml = repartidorPos 
      ? '<span class="repartidor-pos-indicator"><span class="dot"></span> Ubicación activa</span>'
      : '';
    return posHtml +
      '<button class="btn-refrescar" id="btn-refrescar">' + Icon('refresh') + ' Actualizar</button>' +
      '<div class="resumen-bar">' +
        '<div class="resumen-chip"><span class="num">' + total + '</span><span class="lbl">Total</span></div>' +
        '<div class="resumen-chip ruta"><span class="num">' + enRuta + '</span><span class="lbl">En ruta</span></div>' +
        '<div class="resumen-chip ok"><span class="num">' + entregados + '</span><span class="lbl">Entregados</span></div>' +
        '<div class="resumen-chip pend"><span class="num">' + pendientes + '</span><span class="lbl">Pendientes</span></div>' +
      '</div>' +
      '<div class="ruta-actions">' +
        '<button class="btn-ruta-accion" id="btn-ver-ruta">' + Icon('map-pin') + ' Ver ruta completa</button>' +
        '<button class="btn-ruta-accion" id="btn-optimizar-ruta">' + Icon('refresh') + ' Reordenar (más eficiente)</button>' +
      '</div>';
  }

  var ESTADOS_CONOCIDOS = ['pendiente', 'preparando', 'en-ruta', 'cerca', 'entregado'];
  var ESTADO_ICONS = {
    pendiente: 'clock',
    preparando: 'box',
    'en-ruta': 'map-pin',
    cerca: 'map-pin',
    entregado: 'check'
  };

  function renderGrupo(g, idx) {
    var estado = ESTADOS_CONOCIDOS.indexOf(g.estado) !== -1 ? g.estado : 'pendiente';
    var url = mapsUrl(g);
    var compartiendo = !!watchers[g.compradorKey];
    var puedeEditar = estado !== 'entregado';
    var ico = ESTADO_ICONS[estado] || 'clock';
    var label = estado.toUpperCase();
    var abierta = expandedKeys.has(g.compradorKey);
    var itemsHtml = '';
    if (g.items) {
      for (var i = 0; i < g.items.length; i++) {
        var it = g.items[i];
        itemsHtml += '<div class="item-row"><span>' + esc(it.nombre) + '</span><span>$' + Number(it.precio || 0).toLocaleString() + '</span></div>';
      }
    }
    var telHtml = '';
    if (g.compradorTelefono) {
      var tel = String(g.compradorTelefono);
      telHtml = 
        '<div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px;">' +
          '<a class="tel-link" href="tel:' + tel + '">' + Icon('phone-call') + ' ' + esc(tel) + '</a>' +
          '<a class="tel-link" href="https://wa.me/' + encodeURIComponent(tel.replace(/[\s()-]/g, '')) + '" target="_blank" rel="noopener">' + Icon('whatsapp') + ' WhatsApp</a>' +
        '</div>';
    }
    var dirHtml = g.compradorDireccion ? '<p class="entrega-detail"><b>Dirección:</b> ' + esc(g.compradorDireccion) + '</p>' : '';
    var horarioHtml = g.compradorHorario ? '<p class="entrega-detail"><b>Horario:</b> ' + esc(g.compradorHorario) + '</p>' : '';
    var notaHtml = g.compradorNota ? '<p class="entrega-detail"><b>📝 Entregar en otra ubicación:</b> ' + esc(g.compradorNota) + '</p>' : '';
    var mapsHtml = url ? '<a class="btn-maps" href="' + esc(url) + '" target="_blank" rel="noopener">' + Icon('map-pin') + ' Iniciar navegación (Google Maps)</a>' : '';
    
    var selectHtml = '';
    var trackingHtml = '';
    if (puedeEditar) {
      var selectStyle = (estado === 'en-ruta' || estado === 'cerca') ? 'display:none;' : '';
      selectHtml = 
        '<div style="display:flex; gap:8px; margin-top:8px;">' +
          '<select class="btn-tracking" data-action="set-estado-manual" style="flex:1; ' + selectStyle + '">' +
            '<option value="pendiente" ' + (estado === 'pendiente' ? 'selected' : '') + '>⏳ Pendiente</option>' +
            '<option value="preparando" ' + (estado === 'preparando' ? 'selected' : '') + '>📦 Preparando</option>' +
          '</select>' +
        '</div>';
      trackingHtml = 
        '<div class="tracking-row" style="display:flex; gap:8px; margin-top:8px;">' +
          '<button class="btn-tracking ' + (compartiendo ? 'active' : '') + '" data-action="toggle-ruta" style="flex:1;">' + 
            (compartiendo ? Icon('clock') + ' Detener ruta' : Icon('map-pin') + ' Iniciar ruta / compartir ubicación') +
          '</button>' +
        '</div>';
    }

    var btnEntregadoDisabled = estado === 'entregado' ? 'disabled' : '';
    var btnEntregadoClass = 'btn-entregado' + (estado === 'entregado' ? ' active' : '');
    var dragHandle = estado !== 'entregado' ? '<span class="drag-handle" title="Arrastra para reordenar">⠿</span>' : '<span class="orden-num">' + (idx + 1) + '</span>';
    var draggable = estado === 'entregado' ? 'false' : 'true';

    return '<div class="entrega-card ' + (estado === 'entregado' ? 'is-entregado' : '') + ' ' + (abierta ? 'expanded' : '') + '" data-key="' + esc(g.compradorKey) + '" draggable="' + draggable + '">' +
      '<div class="card-header" data-action="toggle-card">' +
        dragHandle +
        '<div class="ch-info">' +
          '<h2>' + esc(g.compradorNombre) + '</h2>' +
          '<span class="ch-total">$' + Number(g.total || 0).toLocaleString() + '</span>' +
        '</div>' +
        '<span class="estado-pill ' + estado + '">' + Icon(ico, { size: 10 }) + ' ' + label + '</span>' +
        '<span class="chevron">' + Icon('arrow-up-down', { size: 14 }) + '</span>' +
      '</div>' +
      '<div class="card-body" style="' + (abierta ? '' : 'display:none;') + '">' +
        telHtml +
        dirHtml +
        horarioHtml +
        notaHtml +
        '<div class="items-list">' +
          itemsHtml +
          '<div class="total-row"><span>Total</span><span>$' + Number(g.total || 0).toLocaleString() + '</span></div>' +
        '</div>' +
        mapsHtml +
        selectHtml +
        trackingHtml +
        '<div class="estado-actions">' +
          '<button class="' + btnEntregadoClass + '" data-action="entregado" ' + btnEntregadoDisabled + '>' + Icon('check') + ' Entregado</button>' +
          '<button class="btn-avisar" data-action="avisar">' + Icon('map-pin') + ' Avisar llegada</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function gruposOrdenados() {
    var arr = entrega.grupos.slice();
    arr.sort(function(a, b) {
      return (a.orden || 999) - (b.orden || 999);
    });
    return arr;
  }

  function render() {
    headerTitle.textContent = entrega.liveTitulo ? 'Entregas — ' + entrega.liveTitulo : 'Entregas';
    headerSubtitle.textContent = entrega.vendedorNombre ? 'De ' + entrega.vendedorNombre : 'Coordinación de entregas';

    var grupos = gruposOrdenados();
    var html = renderResumen();
    for (var i = 0; i < grupos.length; i++) {
      html += renderGrupo(grupos[i], i);
    }
    html += '<p class="local-note">Lo que marques aquí lo va a ver el vendedor desde su panel.</p>';
    wrap.innerHTML = html;

    document.getElementById('btn-refrescar').addEventListener('click', cargar);
    document.getElementById('btn-ver-ruta').addEventListener('click', abrirMapaRuta);
    document.getElementById('btn-optimizar-ruta').addEventListener('click', optimizarRuta);

    var cards = wrap.querySelectorAll('.entrega-card');
    for (var i = 0; i < cards.length; i++) {
      var card = cards[i];
      var key = card.dataset.key;
      var header = card.querySelector('[data-action="toggle-card"]');
      header.addEventListener('click', function(k) {
        return function() {
          if (expandedKeys.has(k)) expandedKeys.delete(k);
          else expandedKeys.add(k);
          render();
        };
      }(key));

      var actions = card.querySelectorAll('.estado-actions button');
      for (var j = 0; j < actions.length; j++) {
        var btn = actions[j];
        if (btn.dataset.action === 'avisar') {
          btn.addEventListener('click', function(k, b) {
            return function() { avisarLlegada(k, b); };
          }(key, btn));
        } else if (btn.dataset.action === 'entregado') {
          btn.addEventListener('click', function(k) {
            return function() { toggleEstado(k, 'entregado'); };
          }(key));
        }
      }

      var select = card.querySelector('[data-action="set-estado-manual"]');
      if (select) {
        select.addEventListener('change', function(k, sel) {
          return function() { toggleEstado(k, sel.value); };
        }(key, select));
      }

      var btnRuta = card.querySelector('[data-action="toggle-ruta"]');
      if (btnRuta) {
        btnRuta.addEventListener('click', function(k, b) {
          return function() { toggleRuta(k, b); };
        }(key, btnRuta));
      }

      if (card.getAttribute('draggable') === 'true') {
        card.addEventListener('dragstart', function(k, c) {
          return function(e) {
            if (e.target.closest('.card-body')) { e.preventDefault(); return; }
            c.classList.add('dragging');
            dragKey = k;
          };
        }(key, card));
        card.addEventListener('dragend', function(c) {
          return function() {
            c.classList.remove('dragging');
            dragKey = null;
            persistirOrden();
          };
        }(card));
      }
    }

    wrap.addEventListener('dragover', onDragOver);
  }

  function onDragOver(e) {
    e.preventDefault();
    var dragging = wrap.querySelector('.entrega-card.dragging');
    if (!dragging) return;
    var siblings = wrap.querySelectorAll('.entrega-card:not(.dragging)');
    var after = null;
    for (var i = 0; i < siblings.length; i++) {
      var sib = siblings[i];
      var box = sib.getBoundingClientRect();
      if (e.clientY < box.top + box.height / 2) {
        after = sib;
        break;
      }
    }
    if (after) wrap.insertBefore(dragging, after);
    else wrap.appendChild(dragging);
  }

  async function persistirOrden() {
    var cards = wrap.querySelectorAll('.entrega-card');
    var keys = [];
    for (var i = 0; i < cards.length; i++) {
      keys.push(cards[i].dataset.key);
    }
    for (var i = 0; i < keys.length; i++) {
      var key = keys[i];
      for (var j = 0; j < entrega.grupos.length; j++) {
        if (String(entrega.grupos[j].compradorKey) === String(key)) {
          entrega.grupos[j].orden = i;
          break;
        }
      }
    }
    var ordenes = JSON.stringify(keys.map(function(k, i) { return { compradorKey: k, orden: i }; }));
    try {
      await apiFetch({ action: 'guardarOrdenEntregas', liveId: liveId, ordenes: ordenes }, 'POST');
    } catch (err) {
      enqueue('guardarOrdenEntregas', { ordenes: ordenes }, 'orden');
    }
  }

  function distanciaMetros(lat1, lng1, lat2, lng2) {
    var R = 6371000;
    var toRad = function(d) { return d * Math.PI / 180; };
    var dLat = toRad(lat2 - lat1);
    var dLng = toRad(lng2 - lng1);
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  function ordenarPorVecinoMasCercano(pendientes, origenLat, origenLng) {
    var conCoords = [];
    var sinCoords = [];
    for (var i = 0; i < pendientes.length; i++) {
      var g = pendientes[i];
      if (typeof g.lat === 'number' && typeof g.lng === 'number') {
        conCoords.push(g);
      } else {
        sinCoords.push(g);
      }
    }
    var restantes = conCoords.slice();
    var ruta = [];
    var curLat = origenLat;
    var curLng = origenLng;
    if (curLat == null && restantes.length) {
      var primero = restantes.shift();
      ruta.push(primero);
      curLat = primero.lat;
      curLng = primero.lng;
    }
    while (restantes.length) {
      var idxMasCercano = 0;
      var distMinima = Infinity;
      for (var i = 0; i < restantes.length; i++) {
        var g = restantes[i];
        var d = distanciaMetros(curLat, curLng, g.lat, g.lng);
        if (d < distMinima) {
          distMinima = d;
          idxMasCercano = i;
        }
      }
      var siguiente = restantes.splice(idxMasCercano, 1)[0];
      ruta.push(siguiente);
      curLat = siguiente.lat;
      curLng = siguiente.lng;
    }
    return ruta.concat(sinCoords);
  }

  function optimizarRuta() {
    var btn = document.getElementById('btn-optimizar-ruta');
    var pendientes = [];
    var entregados = [];
    for (var i = 0; i < entrega.grupos.length; i++) {
      var g = entrega.grupos[i];
      if (g.estado !== 'entregado') pendientes.push(g);
      else entregados.push(g);
    }
    if (pendientes.length < 2) {
      alert('No hay suficientes entregas pendientes para reordenar.');
      return;
    }

    var aplicar = function(lat, lng) {
      var ordenados = ordenarPorVecinoMasCercano(pendientes, lat, lng);
      var todos = ordenados.concat(entregados);
      for (var i = 0; i < todos.length; i++) {
        todos[i].orden = i;
      }
      render();
      persistirOrden();
    };

    if (!('geolocation' in navigator)) {
      aplicar(null, null);
      return;
    }
    btn.innerHTML = Icon('clock') + ' Calculando…';
    navigator.geolocation.getCurrentPosition(
      function(pos) {
        aplicar(pos.coords.latitude, pos.coords.longitude);
      },
      function() {
        aplicar(null, null);
      },
      { enableHighAccuracy: true, timeout: 5000 }
    );
  }

  async function trazarRutaCalles(latlngs) {
    if (latlngs.length < 2) return null;
    var CHUNK = 25;
    var tramosCoords = [];
    for (var i = 0; i < latlngs.length - 1; i += CHUNK - 1) {
      tramosCoords.push(latlngs.slice(i, i + CHUNK));
    }
    try {
      var tramosPromises = tramosCoords.map(function(tramo) {
        var coordsStr = tramo.map(function(ll) { return ll[1] + ',' + ll[0]; }).join(';');
        return fetch('https://router.project-osrm.org/route/v1/driving/' + coordsStr + '?overview=full&geometries=geojson')
          .then(function(r) { return r.json(); })
          .then(function(data) {
            if (data.code !== 'Ok') throw new Error(data.message || 'OSRM error');
            return data.routes[0].geometry.coordinates.map(function(coord) {
              return [coord[1], coord[0]];
            });
          });
      });
      var tramos = await Promise.all(tramosPromises);
      var resultado = tramos[0] || [];
      for (var i = 1; i < tramos.length; i++) {
        resultado = resultado.concat(tramos[i].slice(1));
      }
      return resultado;
    } catch (err) {
      return null;
    }
  }

  function abrirMapaRuta() {
    if (routeModalInstance) {
      cerrarMapaRuta();
      return;
    }

    var puntos = [];
    var grupos = gruposOrdenados();
    for (var i = 0; i < grupos.length; i++) {
      var g = grupos[i];
      if (typeof g.lat === 'number' && typeof g.lng === 'number') {
        puntos.push(g);
      }
    }

    var overlay = document.createElement('div');
    overlay.className = 'route-modal-overlay';
    overlay.id = 'route-modal-overlay';
    var listHtml = '';
    if (puntos.length) {
      for (var i = 0; i < puntos.length; i++) {
        var g = puntos[i];
        var estado = g.estado || 'pendiente';
        var estadoLabel = estado === 'entregado' ? '✅ Entregado' : estado === 'en-ruta' ? '🟣 En ruta' : estado === 'cerca' ? '🟡 Cerca' : '⏳ Pendiente';
        listHtml += 
          '<div class="route-list-item" data-key="' + esc(g.compradorKey) + '">' +
            '<span class="rli-num">' + (i + 1) + '</span>' +
            '<div>' +
              '<div class="rli-nombre">' + esc(g.compradorNombre) + '</div>' +
              '<div class="rli-dir">' + esc(g.compradorDireccion || 'Sin dirección') + '</div>' +
              '<div class="rli-estado ' + estado + '">' + estadoLabel + '</div>' +
            '</div>' +
          '</div>';
      }
    } else {
      listHtml = '<p style="color:var(--color-text-soft); text-align:center; padding:20px;">Ninguna entrega tiene ubicación guardada todavía.</p>';
    }

    overlay.innerHTML = 
      '<div class="route-modal">' +
        '<div class="route-modal-header">' +
          '<h3>' + Icon('map-pin') + ' Ruta completa (' + puntos.length + ' paradas)</h3>' +
          '<button class="route-modal-close" id="route-modal-close">&times;</button>' +
        '</div>' +
        '<p class="route-note route-note-info">🟣 Tu ubicación se actualiza automáticamente cada 10 segundos</p>' +
        '<p class="route-note" id="route-note" style="display:none;"></p>' +
        '<div id="route-map"></div>' +
        '<div class="route-list">' + listHtml + '</div>' +
      '</div>';
    document.body.appendChild(overlay);
    routeModalInstance = overlay;

    document.getElementById('route-modal-close').addEventListener('click', cerrarMapaRuta);
    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) cerrarMapaRuta();
    });

    if (puntos.length && typeof L !== 'undefined') {
      setTimeout(function() {
        var map = L.map('route-map', { zoomControl: true });
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
          attribution: '&copy; OpenStreetMap', 
          maxZoom: 19 
        }).addTo(map);

        var latlngs = puntos.map(function(g) { return [g.lat, g.lng]; });

        // Marcar cada destino
        for (var i = 0; i < latlngs.length; i++) {
          var ll = latlngs[i];
          var marker = L.marker(ll, {
            icon: L.divIcon({
              className: 'route-marker',
              html: '<div style="background:#ec4899;color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.3);">' + (i + 1) + '</div>',
              iconSize: [28, 28],
              iconAnchor: [14, 14]
            })
          }).addTo(map);
          marker.bindPopup('<strong>' + (i + 1) + '. ' + puntos[i].compradorNombre + '</strong><br>' + (puntos[i].compradorDireccion || ''));
        }

        // Calcular ruta por calles
        trazarRutaCalles(latlngs).then(function(rutaCalles) {
          var routeLine = L.polyline(rutaCalles || latlngs, { 
            color: '#ec4899', 
            weight: 3, 
            dashArray: rutaCalles ? null : '6 6',
            opacity: 0.8
          }).addTo(map);
          if (!rutaCalles && latlngs.length > 1) {
            var note = document.getElementById('route-note');
            note.style.display = 'block';
            note.textContent = 'No se pudo calcular la ruta por calles ahora mismo — se muestra la línea directa entre paradas.';
          }
        });

        // Marcador del repartidor
        var repMarker = null;
        var repCircle = null;

        var repIcon = L.divIcon({
          className: 'repartidor-icon',
          html: '<div style="width:32px;height:32px;border-radius:50%;background:#c084fc;border:3px solid #fff;box-shadow:0 2px 12px rgba(192,132,252,0.6);display:flex;align-items:center;justify-content:center;font-size:16px;">🚗</div>',
          iconSize: [32, 32],
          iconAnchor: [16, 16]
        });

        function actualizarPosicionRepartidor(lat, lng) {
          if (!repMarker) {
            repMarker = L.marker([lat, lng], { icon: repIcon }).addTo(map);
            repCircle = L.circle([lat, lng], { radius: 15, color: '#c084fc', fillColor: '#c084fc', fillOpacity: 0.2 }).addTo(map);
          } else {
            repMarker.setLatLng([lat, lng]);
            repCircle.setLatLng([lat, lng]);
          }
          repartidorPos = { lat: lat, lng: lng };
          map.panTo([lat, lng], { animate: true, duration: 0.5 });
        }

        // Intentar obtener ubicación inicial
        if ('geolocation' in navigator) {
          navigator.geolocation.getCurrentPosition(
            function(pos) {
              actualizarPosicionRepartidor(pos.coords.latitude, pos.coords.longitude);
              var allPoints = latlngs.slice();
              allPoints.push([pos.coords.latitude, pos.coords.longitude]);
              map.fitBounds(allPoints, { padding: [30, 30] });
            },
            function() {
              map.fitBounds(latlngs, { padding: [30, 30] });
            },
            { enableHighAccuracy: true, timeout: 5000 }
          );
        } else {
          map.fitBounds(latlngs, { padding: [30, 30] });
        }

        // Actualizar cada 10 segundos
        if (routeUpdateInterval) clearInterval(routeUpdateInterval);
        routeUpdateInterval = setInterval(function() {
          if (!routeModalInstance) {
            clearInterval(routeUpdateInterval);
            routeUpdateInterval = null;
            return;
          }
          if ('geolocation' in navigator) {
            navigator.geolocation.getCurrentPosition(
              function(pos) {
                actualizarPosicionRepartidor(pos.coords.latitude, pos.coords.longitude);
              },
              function() {},
              { enableHighAccuracy: true, maximumAge: 10000 }
            );
          }
        }, 10000);

        routeModalInstance._map = map;

        // Si ya tenemos posición previa
        if (repartidorPos) {
          setTimeout(function() {
            actualizarPosicionRepartidor(repartidorPos.lat, repartidorPos.lng);
          }, 100);
        }

      }, 50);
    }
  }

  function cerrarMapaRuta() {
    if (routeUpdateInterval) {
      clearInterval(routeUpdateInterval);
      routeUpdateInterval = null;
    }
    if (routeModalInstance) {
      if (routeModalInstance._map) {
        routeModalInstance._map.remove();
      }
      routeModalInstance.remove();
      routeModalInstance = null;
    }
  }

  function linkSeguimiento(key) {
    return location.origin + '/znr/seguimiento-entrega.html?live=' + encodeURIComponent(liveId) + '&key=' + encodeURIComponent(key);
  }

  function enviarLinkSeguimiento(key) {
    var trackUrl = linkSeguimiento(key);
    var g = null;
    for (var i = 0; i < entrega.grupos.length; i++) {
      if (entrega.grupos[i].compradorKey === key) {
        g = entrega.grupos[i];
        break;
      }
    }
    var tel = g && g.compradorTelefono ? String(g.compradorTelefono).replace(/\D/g, '') : '';
    var texto = '¡Tu pedido va en camino! Sigue la ubicación del repartidor aquí: ' + trackUrl;
    if (tel) {
      window.open('https://wa.me/' + tel + '?text=' + encodeURIComponent(texto), '_blank', 'noopener');
    } else if (navigator.share) {
      navigator.share({ text: texto, url: trackUrl }).catch(function() {});
    }
  }

  async function toggleRuta(key, btn) {
    if (watchers[key]) {
      navigator.geolocation.clearWatch(watchers[key]);
      delete watchers[key];
      repartidorPos = null;
      await toggleEstado(key, 'pendiente');
      if (routeModalInstance) {
        cerrarMapaRuta();
        abrirMapaRuta();
      }
      return;
    }
    if (!('geolocation' in navigator)) {
      alert('Tu navegador no soporta geolocalización.');
      return;
    }
    expandedKeys.add(key);
    await toggleEstado(key, 'en-ruta');
    enviarLinkSeguimiento(key);

    var ultimoEnvio = 0;
    watchers[key] = navigator.geolocation.watchPosition(
      function(pos) {
        repartidorPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        
        if (routeModalInstance && routeModalInstance._map) {
          // Actualizar marcador en el modal si está abierto
          var markers = routeModalInstance._map._layers;
          for (var id in markers) {
            var layer = markers[id];
            if (layer.options && layer.options.icon && layer.options.icon.className === 'repartidor-icon') {
              layer.setLatLng([pos.coords.latitude, pos.coords.longitude]);
              break;
            }
          }
        }

        var ahora = Date.now();
        if (ahora - ultimoEnvio < 5000) return;
        ultimoEnvio = ahora;
        apiFetch({
          action: 'actualizarUbicacionRepartidor',
          liveId: liveId,
          compradorKey: key,
          lat: pos.coords.latitude,
          lng: pos.coords.longitude
        }, 'POST').then(function(resp) {
          if (resp.ok && resp.estado) {
            var grupo = null;
            for (var i = 0; i < entrega.grupos.length; i++) {
              if (entrega.grupos[i].compradorKey === key) {
                grupo = entrega.grupos[i];
                break;
              }
            }
            if (grupo && resp.estado !== grupo.estado) {
              grupo.estado = resp.estado;
              render();
            }
          }
        }).catch(function() {
          enqueue('actualizarUbicacionRepartidor', { compradorKey: key, lat: pos.coords.latitude, lng: pos.coords.longitude }, key + ':ubi');
        });
      },
      function(err) {
        console.error('Geolocalización falló:', err);
        alert('No se pudo obtener tu ubicación. Revisa que le diste permiso de ubicación a la página.');
        if (watchers[key]) {
          navigator.geolocation.clearWatch(watchers[key]);
          delete watchers[key];
        }
      },
      { enableHighAccuracy: true, maximumAge: 5000 }
    );
  }

  async function avisarLlegada(key, btn) {
    var original = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = Icon('clock') + ' Enviando...';
    try {
      var resp = await apiFetch({
        action: 'notificarLlegadaEntrega',
        liveId: liveId,
        compradorKey: key
      }, 'POST');
      if (!resp.ok) throw new Error(resp.error || 'No se pudo enviar el aviso');
      if (resp.enviados > 0) {
        btn.innerHTML = Icon('check') + ' Avisado';
      } else {
        btn.innerHTML = Icon('error') + ' Sin notificaciones';
        alert('Este cliente no tiene notificaciones activadas. Contáctalo por WhatsApp o llamada.');
      }
    } catch (err) {
      btn.innerHTML = Icon('x') + ' Error';
      alert('No se pudo avisar al cliente: ' + err.message);
    } finally {
      setTimeout(function() {
        btn.innerHTML = original;
        btn.disabled = false;
      }, 2500);
    }
  }

  function cacheKey() { return 'zr_entregas_cache_' + liveId; }
  function queueKey() { return 'zr_entregas_queue_' + liveId; }
  function loadQueue() {
    try { return JSON.parse(localStorage.getItem(queueKey())) || []; }
    catch (e) { return []; }
  }
  function saveQueue(q) { localStorage.setItem(queueKey(), JSON.stringify(q)); }

  function enqueue(action, extra, dedupeKey) {
    var q = loadQueue().filter(function(x) { return x.dedupeKey !== dedupeKey; });
    q.push({ action: action, extra: extra, dedupeKey: dedupeKey });
    saveQueue(q);
    headerSubtitle.textContent = 'Sin conexión — ' + q.length + ' cambio' + (q.length !== 1 ? 's' : '') + ' pendiente' + (q.length !== 1 ? 's' : '');
    if (navigator.serviceWorker) {
      navigator.serviceWorker.ready.then(function(reg) {
        if (reg.sync) reg.sync.register('sync-entregas');
      }).catch(function() {});
    }
  }

  if (navigator.serviceWorker) {
    navigator.serviceWorker.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'SYNC_ENTREGAS') sync();
    });
  }

  async function sync() {
    if (!navigator.onLine) return;
    var q = loadQueue();
    if (!q.length) return;
    for (var i = 0; i < q.length; i++) {
      var item = q[i];
      try {
        var resp = await apiFetch({ action: item.action, liveId: liveId, ...item.extra }, 'POST');
        if (resp.ok) {
          q = q.filter(function(x) { return x !== item; });
          saveQueue(q);
        }
      } catch (err) {
        break;
      }
    }
    if (!loadQueue().length) cargar();
  }

  window.addEventListener('online', sync);

  async function toggleEstado(key, nuevoEstado) {
    var grupo = null;
    for (var i = 0; i < entrega.grupos.length; i++) {
      if (String(entrega.grupos[i].compradorKey) === String(key)) {
        grupo = entrega.grupos[i];
        break;
      }
    }
    if (!grupo || grupo.estado === nuevoEstado) return;

    grupo.estado = nuevoEstado;
    render();

    try {
      var resp = await apiFetch({
        action: 'actualizarEstadoEntrega',
        liveId: liveId,
        compradorKey: key,
        estado: nuevoEstado
      }, 'POST');
      if (!resp.ok) throw new Error(resp.error || 'No se pudo guardar');
    } catch (err) {
      enqueue('actualizarEstadoEntrega', { compradorKey: key, estado: nuevoEstado }, key + ':estado');
    }
  }

  async function cargar() {
    if (!liveId) {
      renderInvalido('Este link no trae identificador de transmisión.');
      return;
    }
    wrap.innerHTML = '<div class="loading-spinner"></div>';
    try {
      var resp = await apiFetch({ action: 'obtenerEntregasLive', liveId: liveId });
      if (!resp.ok) {
        renderInvalido(resp.error || 'Error al cargar los datos');
        return;
      }
      entrega = resp;
      localStorage.setItem(cacheKey(), JSON.stringify(resp));
      render();
      sync();
    } catch (err) {
      var cached = localStorage.getItem(cacheKey());
      if (!cached) {
        renderInvalido('Hubo un problema de conexión.');
        return;
      }
      entrega = JSON.parse(cached);
      render();
      var pendientes = loadQueue().length;
      headerSubtitle.textContent = pendientes ? 'Sin conexión — ' + pendientes + ' cambio(s) pendiente(s)' : 'Sin conexión — mostrando datos guardados';
    }
  }

  window.addEventListener('beforeunload', function() {
    if (routeUpdateInterval) clearInterval(routeUpdateInterval);
    if (routeModalInstance) {
      routeModalInstance.remove();
      routeModalInstance = null;
    }
  });

  cargar();
})();
</script>
