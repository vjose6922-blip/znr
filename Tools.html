<script src="error-bootstrap.js"></script>
<title>Herramientas - Z&R Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>document.documentElement.dataset.theme = localStorage.getItem('theme') || 'light';</script>
<link rel="stylesheet" href="styles.css" />
<style>
#tools-content { animation: toolsFadeIn .18s ease; }
@keyframes toolsFadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
.tools-loading { text-align:center; padding:60px 20px; color:#999; }
</style>
</head>
<body class="admin-body">
<div id="global-loader" class="global-loader hidden">
  <div class="loader-spinner"></div>
  <div class="loader-text">Cargando...</div>
</div>
<header class="app-header admin-header">
  <div class="header-left">
    <div class="logo-touch-area" onclick="location.href='admin.html'" style="cursor:pointer;">
      <span class="logo-mark">Z&R</span>
    </div>
    <div class="header-text">
      <h1 class="app-title">Herramientas</h1>
      <p class="app-subtitle">Panel Admin</p>
    </div>
  </div>
  <div class="header-right">
    <a href="admin.html" class="icon-button" style="text-decoration:none;display:inline-flex;align-items:center;" title="Volver al panel">
      <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" aria-hidden="true"><use href="#ic-home"/></svg>
    </a>
  </div>
</header>

<main class="admin-main">
  <section class="admin-section" id="tools-menu">
    <div class="admin-section-header"><h2>Herramientas</h2></div>
    <div class="admin-cards-grid">
      <button type="button" class="admin-mini-card" data-tool="inspector"><span class="amc-label">Modo Inspector (Comunidad)</span></button>
      <button type="button" class="admin-mini-card" data-tool="confiable"><span class="amc-label">Sugerencias: Vendedor confiable</span></button>
      <button type="button" class="admin-mini-card" data-tool="vendorstats"><span class="amc-label">Estadísticas de Vendedores</span></button>
      <button type="button" class="admin-mini-card" data-tool="analytics"><span class="amc-label">Gráficas y Estadísticas</span></button>
      <button type="button" class="admin-mini-card" data-tool="donaciones"><span class="amc-label">Estadísticas de Donaciones</span></button>
      <button type="button" class="admin-mini-card" data-tool="planplus"><span class="amc-label">Resumen Plan Plus (MRR)</span></button>
      <button type="button" class="admin-mini-card" data-tool="errores"><span class="amc-label">Monitor de Errores</span></button>
      <button type="button" class="admin-mini-card" data-tool="reentrenar"><span class="amc-label">Reentrenar modelo IA</span></button>
      <button type="button" class="admin-mini-card" data-tool="syncvendedor"><span class="amc-label">Sincronizar productos de vendedor</span></button>
      <button type="button" class="admin-mini-card" data-tool="algolia"><span class="amc-label">Resincronizar Comunidad con Algolia</span></button>
    </div>
  </section>
  <button type="button" id="tools-back" hidden style="margin-bottom:14px;background:none;border:none;color:inherit;opacity:.7;cursor:pointer;font-size:14px;">&larr; Volver a herramientas</button>
  <div id="tools-content"></div>
</main>

<script src="api-config.js"></script>
<script src="icons.js" defer></script>
<script src="common.js" defer></script>
<script src="admin-tools.js" defer></script>
<script>
// Guard: sin token de admin, de vuelta al login.
if (!sessionStorage.getItem('admin_token')) location.href = 'admin.html';

// Modales que las funciones de admin-tools.js crean; los "desmontamos" para que
// vivan como contenido de la página en vez de overlay flotante.
const EMBED_TOOLS = {
  confiable: ['modal-sugerencias-confiable', window.openSugerenciasConfiableModal],
  vendorstats: ['global-vendor-stats-modal', window.openVendorStatsGlobal],
  analytics: ['modal-analytics', window.openAnalyticsModal],
  donaciones: ['modal-donaciones-stats', window.openDonacionesStatsModal],
  planplus: ['modal-plan-plus-resumen', window.openPlanPlusResumenModal],
  errores: ['modal-error-monitor', window.openErrorMonitorModal],
  syncvendedor: ['sync-vendedor-modal', window.openSyncVendedorModal]
};
// Acciones que no dejan contenido embebido (pestaña nueva o confirm/alert flotante).
const ACTION_TOOLS = {
  inspector: window.openInspectorMode,
  reentrenar: window.reentrenarModeloIA,
  algolia: window.resincronizarComunidadAlgoliaBtn
};

function closeAllTools() {
  Object.values(EMBED_TOOLS).forEach(([id]) => document.getElementById(id)?.remove());
  document.getElementById('tools-content').innerHTML = '';
}

// Saca el "modal" del body, le quita el overlay/backdrop y su botón de cerrar,
// y lo mete dentro del contenedor de la página.
function claimModal(id, tries = 60) {
  const el = document.getElementById(id);
  if (!el) { if (tries > 0) requestAnimationFrame(() => claimModal(id, tries - 1)); return; }
  el.style.cssText = 'position:static;display:block;';
  const card = el.firstElementChild;
  if (card) Object.assign(card.style, { maxWidth: 'none', width: '100%', boxShadow: 'none', margin: '0' });
  el.querySelectorAll('button').forEach(b => {
    if ((b.id || '').startsWith('btn-close') || (b.getAttribute('onclick') || '').includes("display='none'")) b.remove();
  });
  document.getElementById('tools-content').appendChild(el);
}

function runTool(name, push = true) {
  closeAllTools();
  if (push) history.pushState({ tool: name }, '', name ? `Tools.html?tool=${name}` : 'Tools.html');
  document.getElementById('tools-menu').hidden = !!EMBED_TOOLS[name];
  document.getElementById('tools-back').hidden = !EMBED_TOOLS[name];

  if (EMBED_TOOLS[name]) {
    const [modalId, fn] = EMBED_TOOLS[name];
    fn();
    claimModal(modalId);
  } else if (ACTION_TOOLS[name]) {
    ACTION_TOOLS[name]();
  }
}

document.getElementById('tools-menu').addEventListener('click', e => {
  const name = e.target.closest('[data-tool]')?.dataset.tool;
  if (name) runTool(name);
});
document.getElementById('tools-back').addEventListener('click', () => runTool(''));

window.addEventListener('popstate', e => runTool(e.state?.tool || new URLSearchParams(location.search).get('tool') || '', false));

document.addEventListener('DOMContentLoaded', () => {
  const initial = new URLSearchParams(location.search).get('tool');
  if (initial) runTool(initial, false);
});
</script>
</body>
</html>
