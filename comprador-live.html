<script type="module">

const auth = getAuth(fbApp);

// puedan verificar auth != null y auth.uid en presencia/chats. ──
let authUid = null;

const authReady = new Promise((resolve) => { authReadyResolve = resolve; });

const CATALOGO_API_URL_CLIVE = "https://catalogo-api-1038143238323.us-central1.run.app";
const LIVE_API_URL_CLIVE = "https://live-api-1038143238323.us-central1.run.app"; // TODO: pegar la URL real tras el deploy
const AUTH_API_URL_CLIVE = "https://auth-api-1038143238323.us-central1.run.app";
const VENDEDORES_API_URL_CLIVE = "https://vendedores-api-1038143238323.us-central1.run.app";
const AUTH_ACTIONS_CLIVE = ['leerPerfilComprador', 'guardarPerfilComprador'];
const VENDEDORES_ACTIONS_CLIVE = ['verificarSesionVendedor'];
async function apiFetch(data, method = 'GET') {
  const API_BASE = AUTH_ACTIONS_CLIVE.includes(data && data.action) ? AUTH_API_URL_CLIVE
    : VENDEDORES_ACTIONS_CLIVE.includes(data && data.action) ? VENDEDORES_API_URL_CLIVE
    : (data && data.action === 'productosPorVendedor') ? CATALOGO_API_URL_CLIVE : LIVE_API_URL_CLIVE;
  const params = new URLSearchParams();
  Object.entries(data || {}).forEach(([k, v]) => {
    if (v !== undefined && v !== null) params.append(k, v);
  });
  const res = method === 'GET'
    ? await fetch(`${API_BASE}?${params.toString()}`, { method: 'GET' })
    : await fetch(API_BASE, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: params.toString() });
  return JSON.parse(await res.text());
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

const wrap = document.getElementById('live-wrap');
const params = new URLSearchParams(location.search);
const liveId = params.get('id');
let sesion = null;
let productosMap = {};
let identity = null;
let pollTimer = null;
let viewerId = null;
let presenceRef = null;
let presenceCountUnsub = null;
let stickyObserver = null;
let stickySentinel = null;
let stickyResizeHandler = null;

// ── Reproductor de Facebook Video/Live ──
// Nota: a diferencia de YouTube, el SDK de Facebook no expone una API
// de JS para leer/forzar la posición de reproducción (seekTo,
// getCurrentTime, getDuration). Por eso el modo "grabado" ya NO se
// sincroniza entre compradores: cada quien ve el video desde el
// inicio en el momento que entra. El modo "vivo real" no se ve
// afectado (todos ven la misma transmisión en curso).
const FB_APP_ID = '1587883199599777';

let fbSdkPromise = null;
function loadFacebookSDK() {
  if (fbSdkPromise) return fbSdkPromise;
  fbSdkPromise = new Promise((resolve) => {
    if (window.FB) { resolve(window.FB); return; }
    const prevInit = window.fbAsyncInit;
    window.fbAsyncInit = function () {
      if (typeof prevInit === 'function') prevInit();
      window.FB.init({ appId: FB_APP_ID, xfbml: false, version: 'v21.0' });
      resolve(window.FB);
    };
    if (!document.querySelector('script[src*="connect.facebook.net"]')) {
      const tag = document.createElement('script');
      tag.src = 'https://connect.facebook.net/es_LA/sdk.js';
      tag.async = true; tag.defer = true; tag.crossOrigin = 'anonymous';
      document.body.appendChild(tag);
    }
  });
  return fbSdkPromise;
}

// TODO: quitar el soporte de YouTube y volver a exigir solo Facebook
// cuando FB ya no le pida seguidores al vendedor de prueba (agregado
// temporalmente para poder probar lives sin depender de esa
// restricción de FB).
function _youtubeVideoId(url) {
  const m = String(url || '').match(/(?:youtube\.com\/(?:watch\?v=|live\/|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{6,})/);
  return m ? m[1] : null;
}

async function renderFacebookVideo(containerId, facebookUrl) {
  const container = document.getElementById(containerId);
  if (!container || !facebookUrl) return;
  const ytId = _youtubeVideoId(facebookUrl);
  if (ytId) {
    container.innerHTML = `<iframe width="100%" height="100%" style="aspect-ratio:16/9;border:0;" src="https://www.youtube.com/embed/${ytId}?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
    return;
  }
  container.innerHTML = `<div class="fb-video" data-href="${esc(facebookUrl)}" data-width="auto" data-show-text="false" data-autoplay="true" data-allowfullscreen="true"></div>`;
  const FB = await loadFacebookSDK();
  FB.XFBML.parse(container);
}

function detenerStickyVideo() {
  if (stickyObserver) { stickyObserver.disconnect(); stickyObserver = null; }
  if (stickySentinel && stickySentinel.parentNode) { stickySentinel.parentNode.removeChild(stickySentinel); }
  stickySentinel = null;
  if (stickyResizeHandler) { window.removeEventListener('resize', stickyResizeHandler); stickyResizeHandler = null; }
}

// El video se "pega" arriba con JS en vez de confiar en CSS
// position:sticky. Si algún estilo global (por ejemplo
// overflow-x:hidden en html/body) rompe el sticky nativo, esto sigue
// funcionando: un sentinel de 0px justo antes del video se observa
// con IntersectionObserver; cuando sale del viewport por arriba, el
// video pasa a position:fixed (clase .stuck).
//
// CLAVE: el ancla (.video-anchor) congela su altura real por JS
// (medida antes de que el video se vuelva fixed) y se la pasa también
// al propio video. Así, cuando el video sale del flujo normal al
// volverse fixed, el ancla NUNCA se colapsa a 0 — sigue reservando
// exactamente el mismo espacio, así que nada salta ni se regresa.
function setupStickyVideo() {
  detenerStickyVideo();
  const anchor = document.getElementById('video-anchor');
  const videoBox = document.getElementById('video-box-el');
  if (!anchor || !videoBox) return;

  const congelarAltura = () => {
    if (videoBox.classList.contains('stuck')) return; // ya está fija, no recalcular a ciegas
    anchor.style.height = '';
    videoBox.style.height = '';
    const h = anchor.getBoundingClientRect().height;
    if (h > 0) {
      anchor.style.height = h + 'px';
      videoBox.style.height = h + 'px';
    }
  };

  requestAnimationFrame(congelarAltura);

  stickyResizeHandler = () => requestAnimationFrame(congelarAltura);
  window.addEventListener('resize', stickyResizeHandler);

  stickySentinel = document.createElement('div');
  stickySentinel.style.cssText = 'position:relative; height:0; width:100%;';
  anchor.parentNode.insertBefore(stickySentinel, anchor);

  stickyObserver = new IntersectionObserver(([entry]) => {
    videoBox.classList.toggle('stuck', !entry.isIntersecting);
  }, { threshold: [0] });
  stickyObserver.observe(stickySentinel);
}

function detenerPlayerSincronizado() {
  // El plugin de Facebook no expone un objeto "player" para destruir;
  // basta con que el contenedor se reemplace al renderizar otro estado.
}

// ── Presencia (contador de espectadores en vivo) ──
// El viewerId AHORA es el uid de Firebase Auth (anónimo), porque las
// reglas de RTDB exigen que auth.uid === $viewerId. Ya no se genera
// un id aleatorio propio: se usa el que asigna Firebase.
function getViewerId() {
  return authUid;
}

function registrarPresencia() {
  if (!liveId) return;
  viewerId = getViewerId();
  presenceRef = ref(db, `presencia/${liveId}/${viewerId}`);
  const nombre = (identity && identity.nombre) ? identity.nombre : 'Invitado';
  set(presenceRef, { nombre, ts: Date.now() }).catch(err => console.error('registrarPresencia falló (revisa las reglas de Firebase):', err));
  onDisconnect(presenceRef).remove().catch(() => {});
}

function actualizarPresenciaNombre() {
  if (!presenceRef) return;
  const nombre = (identity && identity.nombre) ? identity.nombre : 'Invitado';
  set(presenceRef, { nombre, ts: Date.now() }).catch(err => console.error('actualizarPresenciaNombre falló:', err));
}

function quitarPresencia() {
  if (presenceCountUnsub) { presenceCountUnsub(); presenceCountUnsub = null; }
  if (presenceRef) { remove(presenceRef).catch(() => {}); presenceRef = null; }
}

function setupContadorEspectadores() {
  if (!liveId) return;
  const countEl = document.getElementById('viewer-count');
  presenceCountUnsub = onValue(ref(db, `presencia/${liveId}`), (snap) => {
    const data = snap.val() || {};
    if (countEl) countEl.textContent = Object.keys(data).length;
  }, (err) => console.error('setupContadorEspectadores falló (revisa las reglas de Firebase):', err));
}

// ── Reportar transmisión ──
function mostrarReporte() {
  const overlay = document.createElement('div');
  overlay.className = 'identity-overlay';
  overlay.innerHTML = `
    <div class="identity-sheet">
      <h2><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" aria-hidden="true"><use href="#ic-flag"/></svg> Reportar esta transmisión</h2>
      <p>Cuéntanos qué está pasando. Un administrador va a revisarlo. Esto no cancela nada que hayas apartado ni te saca del chat.</p>
      <label for="rep-motivo">¿Qué está pasando?</label>
      <textarea id="rep-motivo" maxlength="300" placeholder="Ej. contenido inapropiado, producto engañoso, lenguaje ofensivo…"></textarea>
      <button id="rep-btn">Enviar reporte</button>
      <button type="button" id="rep-cancel" style="background:var(--color-surface-2); color:var(--color-text-primary); border:1px solid var(--color-border-subtle); margin-top:8px;">Cancelar</button>
    </div>`;
  document.body.appendChild(overlay);

  document.getElementById('rep-cancel').addEventListener('click', () => document.body.removeChild(overlay));

  document.getElementById('rep-btn').addEventListener('click', async () => {
    const motivo = document.getElementById('rep-motivo').value.trim();
    if (!motivo) { alert('Cuéntanos brevemente qué está pasando.'); return; }
    const btn = document.getElementById('rep-btn');
    btn.disabled = true;
    btn.textContent = 'Enviando…';
    try {
      const resp = await apiFetch({
        action: 'reportarSesionLive',
        liveId: liveId,
        liveTitulo: sesion.titulo || '',
        vendedor_uid: sesion.vendedor_id || '',
        vendedor_nombre: sesion.vendedor_nombre || '',
        facebookLink: sesion.facebook_link || '',
        motivo,
        telefonoUsuario: identity ? (identity.telefono || '') : ''
      }, 'POST');
      if (resp.ok) {
        alert('Gracias, tu reporte fue enviado.');
        document.body.removeChild(overlay);
      } else {
        alert('No se pudo enviar el reporte: ' + (resp.error || 'error desconocido'));
        btn.disabled = false;
        btn.textContent = 'Enviar reporte';
      }
    } catch (err) {
      alert('Error de conexión al enviar el reporte.');
      btn.disabled = false;
      btn.textContent = 'Enviar reporte';
    }
  });
}

// ── Identidad del comprador (nombre + teléfono, se guarda local) ──
function getIdentity() {
  try {
    const raw = localStorage.getItem('znr_chat_identity');
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

const DIAS_SEMANA = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const HORAS_DIA = ['7:00 AM','8:00 AM','9:00 AM','10:00 AM','11:00 AM','12:00 PM',
  '1:00 PM','2:00 PM','3:00 PM','4:00 PM','5:00 PM','6:00 PM','7:00 PM','8:00 PM','9:00 PM'];
function horaOpts(sel) {
  return HORAS_DIA.map(h => `<option value="${h}"${sel === h ? ' selected' : ''}>${h}</option>`).join('');
}

function askIdentity(onDone) {
  const prev = identity || {};
  const prevDias = prev.dias || [];
  let gpsCoords = null; // el GPS SIEMPRE se exige fresco en esta sesión, nunca se acepta solo el guardado
  let perfilUbicacionPrevia = null; // {lat,lng} que ya tenía guardado el perfil, solo para decidir si preguntar al actualizar
  let actualizarUbicacionPerfil = false;

  const gpsIconSvg = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" aria-hidden="true"><use href="#ic-map-pin"/></svg>';

  const overlay = document.createElement('div');
  overlay.className = 'identity-overlay';
  overlay.innerHTML = `
    <div class="identity-sheet">
      <div class="identity-sheet-header">
        <div>
          <h2>Únete al chat</h2>
          <p>Para comentar y apartar productos necesitamos tu ubicación, para poder llegar a entregarte. Dinos también quién eres y en qué horario.</p>
        </div>
        <button type="button" class="btn-close" id="idn-close-btn" aria-label="Cerrar">✕</button>
      </div>
      <label for="idn-nombre">Tu nombre</label>
      <input type="text" id="idn-nombre" placeholder="Nombre y apellido" maxlength="40" value="${esc(prev.nombre || '')}">
      <label for="idn-tel">Tu teléfono</label>
      <input type="tel" id="idn-tel" placeholder="10 dígitos" maxlength="10" value="${esc(prev.telefono || '')}">
      <button type="button" class="btn-gps" id="idn-gps-btn">${gpsIconSvg} Obtener mi ubicación (obligatorio)</button>
      <p class="gps-status" id="idn-gps-status">Necesitamos tu ubicación GPS para poder entregarte — toca el botón y acepta el permiso.</p>
      <label>Días disponibles</label>
      <div class="day-row" id="idn-dias-row">
        ${DIAS_SEMANA.map(d => `<button type="button" class="day-btn${prevDias.includes(d) ? ' active' : ''}" data-day="${d}">${d}</button>`).join('')}
      </div>
      <label for="idn-hora-desde">Horario para entrega</label>
      <div class="hour-row">
        <select id="idn-hora-desde"><option value="">Desde</option>${horaOpts(prev.horaDesde)}</select>
        <span>a</span>
        <select id="idn-hora-hasta"><option value="">Hasta</option>${horaOpts(prev.horaHasta)}</select>
      </div>
      <label for="idn-dir">Entregar en otra ubicación (opcional)</label>
      <textarea id="idn-dir" placeholder="Solo si quieres dejar instrucciones o pedir que se entregue en un lugar distinto a tu ubicación GPS…" maxlength="200">${esc(prev.nota || '')}</textarea>
      <button id="idn-btn">Entrar al chat</button>
    </div>`;
  document.body.appendChild(overlay);

  document.getElementById('idn-close-btn').addEventListener('click', () => {
    window.location.href = 'lives.html';
  });

  const diasSeleccionados = new Set(prevDias);
  overlay.querySelectorAll('.day-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const d = btn.dataset.day;
      if (diasSeleccionados.has(d)) diasSeleccionados.delete(d); else diasSeleccionados.add(d);
      btn.classList.toggle('active');
    });
  });

  // Si el teléfono ya tiene 10 dígitos guardados/perfil en otro
  // dispositivo, precarga días/horario/nota para no volver a pedirlos —
  // pero el nombre y el GPS siempre los da la persona en esta sesión,
  // nunca se autocompletan (así alguien que solo teclea un teléfono
  // ajeno no puede enviar el formulario sin estar ahí físicamente).
  async function aplicarPerfilGuardado(tel) {
    if (tel.length !== 10) return;
    const resp = await apiFetch({ action: 'leerPerfilComprador', telefono: tel }, 'GET').catch(() => null);
    const perfil = resp && resp.ok ? resp.perfil : null;
    if (!perfil) return;
    if (Array.isArray(perfil.dias)) {
      diasSeleccionados.clear();
      perfil.dias.forEach(d => diasSeleccionados.add(d));
      overlay.querySelectorAll('.day-btn').forEach(b => b.classList.toggle('active', diasSeleccionados.has(b.dataset.day)));
    }
    if (perfil.horaDesde) document.getElementById('idn-hora-desde').value = perfil.horaDesde;
    if (perfil.horaHasta) document.getElementById('idn-hora-hasta').value = perfil.horaHasta;
    if (perfil.nota) document.getElementById('idn-dir').value = perfil.nota;
    if (typeof perfil.lat === 'number' && typeof perfil.lng === 'number' && !gpsCoords) {
      perfilUbicacionPrevia = { lat: perfil.lat, lng: perfil.lng };
      document.getElementById('idn-gps-status').textContent = 'Ya tenemos una ubicación guardada — toca el botón para confirmarla.';
    }
  }
  if (prev.telefono) aplicarPerfilGuardado(prev.telefono.replace(/\D/g, ''));
  document.getElementById('idn-tel').addEventListener('input', (e) => {
    aplicarPerfilGuardado(e.target.value.replace(/\D/g, ''));
  });

  document.getElementById('idn-gps-btn').addEventListener('click', () => {
    const statusEl = document.getElementById('idn-gps-status');
    if (!navigator.geolocation) {
      statusEl.className = 'gps-status error';
      statusEl.textContent = 'Tu navegador no soporta ubicación por GPS. No podemos continuar sin ella — intenta desde otro navegador o dispositivo.';
      return;
    }
    statusEl.className = 'gps-status';
    statusEl.textContent = 'Obteniendo tu ubicación…';
    navigator.geolocation.getCurrentPosition((pos) => {
      gpsCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      actualizarUbicacionPerfil = !perfilUbicacionPrevia || confirm('¿Quieres actualizar tu ubicación guardada para futuras compras?');
      statusEl.className = 'gps-status ok';
      statusEl.innerHTML = Icon('check') + ' Ubicación capturada. El vendedor podrá verla en el mapa.';
      document.getElementById('idn-gps-btn').innerHTML = `${gpsIconSvg} Actualizar mi ubicación`;
    }, (err) => {
      gpsCoords = null;
      statusEl.className = 'gps-status error';
      statusEl.textContent = 'No se pudo obtener tu ubicación. Revisa que tu navegador tenga permiso de ubicación activado para este sitio y vuelve a intentar — es necesaria para poder entregarte.';
    }, { enableHighAccuracy: true, timeout: 10000 });
  });

  document.getElementById('idn-btn').addEventListener('click', () => {
    const nombre = document.getElementById('idn-nombre').value.trim();
    const tel = document.getElementById('idn-tel').value.replace(/\D/g, '');
    const dias = DIAS_SEMANA.filter(d => diasSeleccionados.has(d));
    const horaDesde = document.getElementById('idn-hora-desde').value;
    const horaHasta = document.getElementById('idn-hora-hasta').value;
    const nota = document.getElementById('idn-dir').value.trim();
    if (!nombre || tel.length !== 10) {
      alert('Escribe tu nombre y un teléfono válido de 10 dígitos.');
      return;
    }
    if (!dias.length || !horaDesde || !horaHasta) {
      alert('Selecciona al menos un día y el rango de horario en que podemos entregarte.');
      return;
    }
    if (!gpsCoords) {
      alert('Necesitamos tu ubicación para continuar — toca "Obtener mi ubicación" y acepta el permiso de tu navegador.');
      return;
    }
    const horario = `${dias.join(', ')} · ${horaDesde} a ${horaHasta}`;
    identity = {
      nombre, telefono: tel, horario, dias, horaDesde, horaHasta, nota,
      lat: gpsCoords.lat,
      lng: gpsCoords.lng
    };
    localStorage.setItem('znr_chat_identity', JSON.stringify(identity));
    guardarContacto(identity);
    guardarPerfilRemoto(identity, actualizarUbicacionPerfil);
    actualizarPresenciaNombre();
    document.body.removeChild(overlay);
    onDone();
  });
}

// Perfil por teléfono en auth-api (compradores/{telefono}), separado de
// registrarContactoLive: ese es el contacto de ESTA transmisión, esto es
// lo que se reutiliza la próxima vez que compre, en cualquier dispositivo.
function guardarPerfilRemoto(idn, actualizarUbicacion) {
  const payload = {
    action: 'guardarPerfilComprador',
    telefono: idn.telefono,
    dias: idn.dias.join(','),
    horaDesde: idn.horaDesde,
    horaHasta: idn.horaHasta,
    nota: idn.nota || ''
  };
  if (actualizarUbicacion) { payload.lat = idn.lat; payload.lng = idn.lng; }
  apiFetch(payload, 'POST').catch(err => console.error('guardarPerfilComprador falló:', err));
}

// Manda el teléfono/dirección/horario/GPS UNA sola vez a
// registrarContactoLive — nunca dentro de cada mensaje de chat.
// Solo el vendedor dueño del live puede leerlo (vía Cloud Function,
// con su vendorToken), al cerrar la transmisión.
async function guardarContacto(idn) {
  await authReady;
  if (!liveId || !authUid) return;
  const payload = {
    action: 'registrarContactoLive',
    liveId,
    viewerUid: authUid,
    telefono: idn.telefono || '',
    nota: idn.nota || '',
    horario: idn.horario || ''
  };
  if (typeof idn.lat === 'number' && typeof idn.lng === 'number') {
    payload.lat = idn.lat;
    payload.lng = idn.lng;
  }
  apiFetch(payload, 'POST').catch(err => {
    console.error('guardarContacto falló:', err);
  });
}

function renderLive() {
  document.body.classList.add('live-active');
  const esVertical = sesion.orientacion === 'vertical';

  const chatMarkup = `
    <div class="chat-messages" id="chat-messages"><div class="chat-empty">Sé el primero en comentar 👋</div></div>
    <div class="chat-input-row">
      <input type="text" id="chat-input" placeholder="Escribe un comentario…" maxlength="300">
      <button id="chat-send"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" aria-hidden="true"><use href="#ic-arrow-right"/></svg></button>
    </div>`;

  const videoMarkup = `<div class="video-slot-inner" id="video-slot"></div>`;

  if (esVertical) {
    // Estilo YouTube: el video se queda fijo arriba; todo lo demás
    // (título, producto, chat) es contenido normal que se desplaza
    // por debajo. Nada se sobrepone al video.
    wrap.innerHTML = `
      <div class="video-anchor vertical" id="video-anchor">
        <div class="video-box" id="video-box-el">${videoMarkup}</div>
      </div>
      <div class="live-info-compact">
        <span class="status-dot"></span>
        <strong>${esc(sesion.titulo)}</strong>
        <span class="viewer-badge">${Icon('eye')} <span id="viewer-count">0</span></span>
      </div>
      <div id="producto-slot"></div>
      <div class="chat-section">
        <div class="chat-panel">${chatMarkup}</div>
      </div>
    `;
  } else {
    wrap.innerHTML = `
      <div class="video-anchor" id="video-anchor">
        <div class="video-box" id="video-box-el">${videoMarkup}</div>
      </div>
      <div class="live-info">
        <span class="status-badge live"><span class="status-dot"></span> EN VIVO</span>
        <span class="viewer-badge">${Icon('eye')} <span id="viewer-count">0</span></span>
        <h1>${esc(sesion.titulo)}</h1>
        <p class="vendor">Por ${esc(sesion.vendedor_nombre)}</p>
      </div>
      <div id="producto-slot"></div>
      <div class="chat-section">
        <div class="chat-panel">${chatMarkup}</div>
      </div>
    `;
  }

  setupStickyVideo();
  renderProductoActual();
  setupChat();
  registrarPresencia();
  setupContadorEspectadores();

  document.getElementById('chat-send').addEventListener('click', () => enviarMensaje());
  document.getElementById('chat-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') enviarMensaje(); });

  renderFacebookVideo('video-slot', sesion.facebook_link);
}

function renderProductoActual() {
  const slot = document.getElementById('producto-slot');
  if (!slot) return;
  const p = productosMap[sesion.producto_actual_id];
  if (!p) { slot.innerHTML = ''; return; }
  const palabra = (p.nombre || '').trim().split(/\s+/)[0].toUpperCase();
  slot.innerHTML = `
    <div class="producto-actual">
      <img src="${esc(p.imagen1 || 'https://placehold.co/100x100')}" alt="${esc(p.nombre)}">
      <div class="info">
        <p class="nombre">${esc(p.nombre)}</p>
        <p class="precio">$${Number(p.precio || 0).toLocaleString()}</p>
      </div>
      <button class="btn-apartar" id="btn-apartar">🙋 Comentar "${esc(palabra)}"</button>
    </div>`;
  document.getElementById('btn-apartar').addEventListener('click', (e) => {
    const btn = e.currentTarget;
    if (!identity) { askIdentity(() => enviarMensaje(palabra)); return; }
    enviarMensaje(palabra);
    const textoOriginal = btn.textContent;
    btn.innerHTML = Icon('check') + ' Enviado';
    btn.disabled = true;
    setTimeout(() => { btn.textContent = textoOriginal; btn.disabled = false; }, 1200);
  });
}

function enviarMensaje(textoDirecto) {
  const input = document.getElementById('chat-input');
  const text = textoDirecto != null ? textoDirecto.trim() : input.value.trim();
  if (!text || !identity) return;
  if (textoDirecto == null) input.value = '';
  if (!authUid) { alert('Un momento, tu sesión aún se está preparando — intenta de nuevo.'); return; }
  const payload = {
    uid: authUid,
    author: identity.nombre,
    text, isVendor: false, ts: Date.now(),
    producto_id: String(sesion.producto_actual_id || '')
  };
  push(ref(db, `chats/${liveId}/messages`), payload).catch(err => {
    alert('No se pudo enviar tu comentario: ' + err.message);
    if (textoDirecto == null) input.value = text;
  });
}

function setupChat() {
  const messagesEl = document.getElementById('chat-messages');
  onValue(ref(db, `chats/${liveId}/messages`), (snapshot) => {
    const data = snapshot.val();
    if (!data) { messagesEl.innerHTML = '<div class="chat-empty">Sé el primero en comentar 👋</div>'; return; }
    const msgs = Object.values(data).sort((a, b) => (a.ts || 0) - (b.ts || 0)).slice(-100);
    messagesEl.innerHTML = msgs.map(m => `
      <div class="chat-msg ${identity && m.author === identity.nombre ? 'mine' : ''}">
        <span class="author">${esc(m.author)}${m.isVendor ? ' ' + Icon('shopping-bag') : ''}:</span>
        <span class="text">${esc(m.text)}</span>
        ${m.vendido ? '<span class="vendido-tag">' + Icon('check') + ' Vendido</span>' : ''}
      </div>
    `).join('');
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }, (err) => {
    messagesEl.innerHTML = `<div class="chat-empty">No se pudo cargar el chat: ${esc(err.message)}</div>`;
  });
}

// ── Polling ligero para detectar cambios de estado / producto actual ──
function startPolling() {
  pollTimer = setInterval(async () => {
    try {
      const resp = await apiFetch({ action: 'obtenerSesionLivePorId', id: liveId });
      if (!resp.ok) return;
      const nueva = resp.sesion;
      if (nueva.estado === 'terminado') {
        clearInterval(pollTimer);
        sesion = nueva;
        renderEnded();
        return;
      }
      if (nueva.producto_actual_id !== sesion.producto_actual_id) {
        sesion.producto_actual_id = nueva.producto_actual_id;
        renderProductoActual();
      }
    } catch (e) { /* silencioso, reintenta en el siguiente ciclo */ }
  }, 6000);
}

async function init() {
  if (!liveId) { renderNoId(); return; }

  const vendorToken = (() => {
    try { return (JSON.parse(localStorage.getItem('vendor_session') || 'null') || {}).token || null; }
    catch (e) { return null; }
  })();
  if (!vendorToken) { renderRequiereVendedor(); return; }
  let vendorNombre = '', vendorTelefono = '';
  try {
    const sesionVendedor = await apiFetch({ action: 'verificarSesionVendedor', vendorToken }, 'POST');
    if (!sesionVendedor.ok) { renderRequiereVendedor(); return; }
    vendorNombre = sesionVendedor.nombre || '';
    vendorTelefono = sesionVendedor.telefono || '';
  } catch (err) {
    renderRequiereVendedor();
    return;
  }

  identity = getIdentity();
  // Ya verificamos que es una cuenta real — si todavía no había llenado el
  // sheet de "Únete al chat" en este navegador, le ahorramos escribir de
  // nuevo lo que ya sabemos de su cuenta de vendedor.
  if (!identity) identity = {};
  if (!identity.nombre && vendorNombre) identity.nombre = vendorNombre;
  if (!identity.telefono && vendorTelefono) identity.telefono = vendorTelefono;
  await authReady; // esperar a que Firebase asigne el uid anónimo antes de leer/escribir RTDB

  try {
    const resp = await apiFetch({ action: 'obtenerSesionLivePorId', id: liveId });
    if (!resp.ok) { renderNotFound(); return; }
    sesion = resp.sesion;

    const btnReportar = document.getElementById('btn-reportar');
    btnReportar.style.display = 'flex';
    btnReportar.addEventListener('click', mostrarReporte);

    const prodResp = await apiFetch({ action: 'productosPorVendedor', vendedor_uid: sesion.vendedor_id, limit: 50 }, 'GET');
    if (prodResp.ok && prodResp.products) {
      prodResp.products.forEach(p => { productosMap[p.id] = p; });
    }

    if (sesion.estado === 'terminado') { renderEnded(); return; }
    if (sesion.estado === 'programado') { renderScheduledWait(); return; }

    renderLive();
    startPolling();

    if (!identity || typeof identity.lat !== 'number' || typeof identity.lng !== 'number' || !identity.horario) {
      askIdentity(() => {});
    }
  } catch (err) {
    renderNotFound();
  }
}

init();
</script>
