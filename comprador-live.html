const CATALOGO_API_URL_CLIVE = "https://catalogo-api-1038143238323.us-central1.run.app";
const LIVE_API_URL_CLIVE = "https://live-api-1038143238323.us-central1.run.app"; // TODO: pegar la URL real tras el deploy

const AUTH_ACTIONS_CLIVE = ['leerPerfilComprador', 'guardarPerfilComprador'];
const VENDEDORES_ACTIONS_CLIVE = ['verificarSesionVendedor', 'registrarComprador', 'loginComprador', 'verificarSesionComprador', 'sesionCompradorDesdeVendedor', 'solicitarResetComprador'];

let vendorTokenCLive = '';

async function apiFetch(data, method = 'GET') {
  const API_BASE = AUTH_ACTIONS_CLIVE.includes(data && data.action) ? AUTH_API_URL_CLIVE
    : VENDEDORES_ACTIONS_CLIVE.includes(data && data.action) ? VENDEDORES_API_URL_CLIVE
    : (data && ['productosPorVendedor', 'obtenerProductosPorIds'].includes(data.action)) ? CATALOGO_API_URL_CLIVE : LIVE_API_URL_CLIVE;
  const params = new URLSearchParams();
  Object.entries(data || {}).forEach(([k, v]) => {
    if (v !== undefined && v !== null) params.append(k, v);
  });
  const res = method === 'GET'
    ? await fetch(`${API_BASE}?${params.toString()}`, { method: 'GET' })
    : await fetch(API_BASE, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: params.toString() });
  return JSON.parse(await res.text());
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

const wrap = document.getElementById('live-wrap');
const params = new URLSearchParams(location.search);
const liveId = params.get('id');
let sesion = null;
let productosMap = {};
let viaRtdb = false; // si ya llegó el producto por RTDB, el polling no lo pisa

let pollTimer = null;
let viewerId = null;

// ── Reproductor WHEP (Cloudflare Stream) ──
// El vendedor publica por WHIP desde vendedor-live.html; aquí se recibe
// el mismo video por WHEP (WebRTC, latencia menor a 1 s). Si todavía no
// hay señal, o el vendedor se reconecta, se reintenta solo.
let whepPC = null;
let whepActivo = false;
let whepUrlActual = '';
let whepConectando = false;
let whepReintento = 0;
let whepReintentoTimer = null;
let whepWatchdog = null;
let whepUltimoT = -1;
let whepCongelado = 0;
let sonidoActivado = false;

function estadoVideo(msg) {
  const el = document.getElementById('video-estado');
  if (!el) return;
  if (!msg) { el.style.display = 'none'; return; }
  el.textContent = msg;
  el.style.display = 'flex';
}

function actualizarBotonSonido() {
  const b = document.getElementById('btn-sonido');
  const v = document.getElementById('live-video');
  if (!b || !v) return;
  b.style.display = v.muted ? 'block' : 'none';
}

// Los navegadores solo dejan reproducir con sonido si ya hubo un toque en
// la página; si no, arranca en silencio y aparece "Activar sonido".
function reproducirVideo(video) {
  const yaInteractuo = !!(navigator.userActivation && navigator.userActivation.hasBeenActive);
  video.muted = !(sonidoActivado || yaInteractuo);
  const p = video.play();
  if (p && p.catch) {
    p.catch(() => { video.muted = true; video.play().catch(() => {}); actualizarBotonSonido(); });
  }
  actualizarBotonSonido();
}

function esperarIceWHEP(pc, ms) {
  return new Promise((resolve) => {
    if (pc.iceGatheringState === 'complete') { resolve(); return; }
    const fin = () => { clearTimeout(t); pc.removeEventListener('icegatheringstatechange', check); resolve(); };
    const check = () => { if (pc.iceGatheringState === 'complete') fin(); };
    const t = setTimeout(fin, ms);
    pc.addEventListener('icegatheringstatechange', check);
  });
}

function cerrarWHEP() {
  if (!whepPC) return;
  try { whepPC.ontrack = null; whepPC.onconnectionstatechange = null; whepPC.close(); } catch (e) { /* ya estaba cerrada */ }
  whepPC = null;
}

// forzar=false: solo reconecta si la conexión actual no está sana.
function reintentarWHEP(forzar) {
  if (!whepActivo) return;
  if (!forzar && whepPC && whepPC.connectionState === 'connected') return;
  conectarWHEP();
}

function programarReintentoWHEP(ms) {
  if (!whepActivo) return;
  clearTimeout(whepReintentoTimer);
  const espera = ms != null ? ms : Math.min(2000 + whepReintento * 1000, 6000);
  whepReintentoTimer = setTimeout(() => reintentarWHEP(false), espera);
}

async function conectarWHEP() {
  if (!whepActivo || whepConectando) return;
  if (!whepUrlActual) {
    estadoVideo('Esperando la señal del vendedor…');
    programarReintentoWHEP(3000);
    return;
  }
  const video = document.getElementById('live-video');
  if (!video) return;
  whepConectando = true;
  cerrarWHEP();

  const pc = new RTCPeerConnection({
    iceServers: [{ urls: 'stun:stun.cloudflare.com:3478' }],
    bundlePolicy: 'max-bundle'
  });
  whepPC = pc;
  pc.addTransceiver('video', { direction: 'recvonly' });
  pc.addTransceiver('audio', { direction: 'recvonly' });

  const entrante = new MediaStream();
  pc.ontrack = (ev) => {
    entrante.addTrack(ev.track);
    if (video.srcObject !== entrante) video.srcObject = entrante;
    reproducirVideo(video);
  };
  pc.onconnectionstatechange = () => {
    if (pc !== whepPC || !whepActivo) return;
    const st = pc.connectionState;
    if (st === 'connected') whepReintento = 0;
    else if (st === 'failed') { estadoVideo('Reconectando video…'); programarReintentoWHEP(500); }
    else if (st === 'disconnected') { estadoVideo('Reconectando video…'); programarReintentoWHEP(3000); }
  };

  try {
    await pc.setLocalDescription(await pc.createOffer());
    await esperarIceWHEP(pc, 3000);
    const res = await fetch(whepUrlActual, {
      method: 'POST',
      headers: { 'Content-Type': 'application/sdp' },
      body: pc.localDescription.sdp
    });
    if (!res.ok) throw new Error('WHEP ' + res.status); // sin transmisión activa todavía, o el vendedor se está reconectando
    await pc.setRemoteDescription({ type: 'answer', sdp: await res.text() });
    whepReintento = 0;
  } catch (err) {
    if (pc === whepPC) cerrarWHEP();
    whepReintento++;
    estadoVideo(whepReintento > 1 ? 'Esperando la señal del vendedor…' : 'Conectando video…');
    whepConectando = false;
    programarReintentoWHEP();
    return;
  }
  whepConectando = false;
}

// Si el video se congela (el vendedor perdió conexión, o la red del
// comprador se cayó sin avisar), a los ~12 s se vuelve a conectar.
function vigilarVideo() {
  clearInterval(whepWatchdog);
  whepUltimoT = -1;
  whepCongelado = 0;
  whepWatchdog = setInterval(() => {
    const v = document.getElementById('live-video');
    if (!v || !whepActivo || whepConectando || !v.srcObject) return;
    // En pausa (autoplay bloqueado o pestaña oculta) no es un corte de red: solo se intenta reanudar.
    if (v.paused) { v.play().catch(() => {}); return; }
    if (v.currentTime === whepUltimoT) {
      whepCongelado++;
      if (whepCongelado >= 3) {
        whepCongelado = 0;
        estadoVideo('Reconectando video…');
        reintentarWHEP(true);
      }
    } else {
      whepUltimoT = v.currentTime;
      whepCongelado = 0;
    }
  }, 4000);
}

function iniciarReproductorWHEP(containerId, whepUrl) {
  const container = document.getElementById(containerId);
  if (!container) return;
  detenerReproductor();
  whepActivo = true;
  whepUrlActual = whepUrl || '';
  whepReintento = 0;
  container.innerHTML = `
    <video id="live-video" autoplay playsinline muted></video>
    <div class="video-estado" id="video-estado">Conectando video…</div>
    <button type="button" class="btn-sonido" id="btn-sonido">🔇 Activar sonido</button>`;
  const video = document.getElementById('live-video');
  video.onplaying = () => estadoVideo(null);
  video.onvolumechange = actualizarBotonSonido;
  document.getElementById('btn-sonido').addEventListener('click', () => {
    sonidoActivado = true;
    video.muted = false;
    video.play().catch(() => {});
  });
  if (!window.RTCPeerConnection) {
    whepActivo = false;
    estadoVideo('Tu navegador no puede reproducir esta transmisión. Actualízalo o prueba con Chrome.');
    return;
  }
  vigilarVideo();
  conectarWHEP();
}

function detenerReproductor() {
  whepActivo = false;
  whepConectando = false;
  clearTimeout(whepReintentoTimer);
  clearInterval(whepWatchdog);
  cerrarWHEP();
  const v = document.getElementById('live-video');
  if (v) v.srcObject = null;
}

window.addEventListener('pagehide', detenerReproductor);

function detenerStickyVideo() {
  if (stickyObserver) { stickyObserver.disconnect(); stickyObserver = null; }
  if (stickySentinel && stickySentinel.parentNode) { stickySentinel.parentNode.removeChild(stickySentinel); }
  stickySentinel = null;
  if (stickyResizeHandler) { window.removeEventListener('resize', stickyResizeHandler); stickyResizeHandler = null; }
}

// El video se "pega" arriba con JS en vez de confiar en CSS
// position:sticky. Si algún estilo global (por ejemplo
// overflow-x:hidden en html/body) rompe el sticky nativo, esto sigue
// funcionando: un sentinel de 0px justo antes del video se observa
// con IntersectionObserver; cuando sale del viewport por arriba, el
// video pasa a position:fixed (clase .stuck).
//
// CLAVE: el ancla (.video-anchor) congela su altura real por JS
// (medida antes de que el video se vuelva fixed) y se la pasa también
// al propio video. Así, cuando el video sale del flujo normal al
// volverse fixed, el ancla NUNCA se colapsa a 0 — sigue reservando
// exactamente el mismo espacio, así que nada salta ni se regresa.
function setupStickyVideo() {
  detenerStickyVideo();
  const anchor = document.getElementById('video-anchor');
  const videoBox = document.getElementById('video-box-el');
  if (!anchor || !videoBox) return;

  const congelarAltura = () => {
    if (videoBox.classList.contains('stuck')) return; // ya está fija, no recalcular a ciegas
    anchor.style.height = '';
    videoBox.style.height = '';
    const h = anchor.getBoundingClientRect().height;
    if (h > 0) {
      anchor.style.height = h + 'px';
      videoBox.style.height = h + 'px';
    }
  };

  requestAnimationFrame(congelarAltura);

  stickyResizeHandler = () => requestAnimationFrame(congelarAltura);
  window.addEventListener('resize', stickyResizeHandler);

  stickySentinel = document.createElement('div');
  stickySentinel.style.cssText = 'position:relative; height:0; width:100%;';
  anchor.parentNode.insertBefore(stickySentinel, anchor);

  stickyObserver = new IntersectionObserver(([entry]) => {
    videoBox.classList.toggle('stuck', !entry.isIntersecting);
  }, { threshold: [0] });
  stickyObserver.observe(stickySentinel);
}

// ── Presencia (contador de espectadores en vivo) ──
// El viewerId AHORA es el uid de Firebase Auth (anónimo), porque las
// reglas de RTDB exigen que auth.uid === $viewerId. Ya no se genera
// un id aleatorio propio: se usa el que asigna Firebase.
function getViewerId() {
  return authUid;
}

function registrarPresencia() {
  if (!liveId) return;

  const nombre = (identity && identity.nombre) ? identity.nombre : 'Invitado';
  set(presenceRef, { nombre, ts: Date.now() }).catch(err => console.error('registrarPresencia falló (revisa las reglas de Firebase):', err));
  onDisconnect(presenceRef).remove().catch(() => {});
}

function actualizarPresenciaNombre() {
  if (!presenceRef) return;
  const nombre = (identity && identity.nombre) ? identity.nombre : 'Invitado';
  set(presenceRef, { nombre, ts: Date.now() }).catch(err => console.error('actualizarPresenciaNombre falló:', err));
}

function quitarPresencia() {
  if (presenceCountUnsub) { presenceCountUnsub(); presenceCountUnsub = null; }
  if (presenceRef) { remove(presenceRef).catch(() => {}); presenceRef = null; }
}

function setupContadorEspectadores() {
  if (!liveId) return;
  if (presenceCountUnsub) presenceCountUnsub();
  presenceCountUnsub = onValue(ref(db, `presencia/${liveId}`), (snap) => {
    const el = document.getElementById('viewer-count');
    if (el) el.textContent = Object.keys(snap.val() || {}).length;
  }, (err) => console.error('setupContadorEspectadores falló (revisa las reglas de Firebase):', err));
}

const DIAS_SEMANA = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const HORAS_DIA = ['7:00 AM','8:00 AM','9:00 AM','10:00 AM','11:00 AM','12:00 PM',

function askIdentity(onDone, motivo) {
  const prev = identity || {};
  const prevDias = prev.dias || [];
  let gpsCoords = null; // el GPS SIEMPRE se exige fresco en esta sesión, nunca se acepta solo el guardado
  let perfilUbicacionPrevia = null; // {lat,lng} que ya tenía guardado el perfil, solo para decidir si preguntar al actualizar

      <div id="idn-pw-wrap">
        <label for="idn-pw">Contraseña</label>
        <p class="idn-pw-note" id="idn-pw-note"></p>
        <input type="password" id="idn-pw" autocomplete="current-password">
        <input type="password" id="idn-pw2" placeholder="Repite la contraseña" autocomplete="new-password">

      <div class="day-row" id="idn-dias-row">
        ${DIAS_SEMANA.map(d => `<button type="button" class="day-btn${prevDias.includes(d) ? ' active' : ''}" data-day="${d}">${d}</button>`).join('')}
      </div>
      <label for="idn-hora-desde">Horario para entrega</label>
      <div class="hour-row">
        <select id="idn-hora-desde"><option value="">Desde</option>${horaOpts(prev.horaDesde)}</select>
        <span>a</span>
        <select id="idn-hora-hasta"><option value="">Hasta</option>${horaOpts(prev.horaHasta)}</select>
      </div>
      <label for="idn-dir">Entregar en otra ubicación (opcional)</label>
      <textarea id="idn-dir" placeholder="Solo si quieres dejar instrucciones o pedir que se entregue en un lugar distinto a tu ubicación GPS…" maxlength="200">${esc(prev.nota || '')}</textarea>
      <p class="idn-err" id="idn-err"></p>
      <button id="idn-btn">Entrar al chat</button>
    </div>`;
  document.body.appendChild(overlay);

  document.getElementById('idn-close-btn').addEventListener('click', () => {
    window.location.href = 'lives.html';
  });

  // ── Sesión de comprador (teléfono + contraseña), igual que el comprador
  // normal de Comunidad: sin esto las notificaciones de este pedido (stock
  // confirmado, en camino, entregado) no le llegan a nadie. ──
  let modoNuevo = true;   // true = crear contraseña, false = iniciar sesión
  let forzarPw = false;   // la sesión guardada expiró: pedir contraseña sí o sí
  const elTel = document.getElementById('idn-tel');
  const elPwWrap = document.getElementById('idn-pw-wrap');
  const elPw = document.getElementById('idn-pw');
  const elPw2 = document.getElementById('idn-pw2');
  const elErr = document.getElementById('idn-err');
  const telDigitos = () => elTel.value.replace(/\D/g, '');
  const sesionLocalPara = (t) => (localStorage.getItem('client_phone') || '').replace(/\D/g, '') === t && !!localStorage.getItem('comprador_token');
  const esTelDelVendedor = (t) => !!vendorTokenCLive && !!vendorTelCLive && t === vendorTelCLive;

  function pintarPw() {
    const t = telDigitos();
    const sinPw = !forzarPw && t.length === 10 && (sesionLocalPara(t) || esTelDelVendedor(t));
    elPwWrap.style.display = sinPw ? 'none' : '';
    elPw2.style.display = modoNuevo ? '' : 'none';
    document.getElementById('idn-pw-olv').style.display = modoNuevo ? 'none' : '';
    document.getElementById('idn-pw-note').textContent = modoNuevo
      ? 'Crea una contraseña (mín. 6): protege tus notificaciones y pagos.'
      : 'Escribe la contraseña de tu cuenta (si eres vendedor, la de tu cuenta de vendedor).';
    elPw.placeholder = modoNuevo ? 'Crea una contraseña' : 'Tu contraseña';
    document.getElementById('idn-pw-sw').textContent = modoNuevo ? '¿Ya tienes cuenta? Inicia sesión' : '¿Primera vez? Crea tu contraseña';
  }
  document.getElementById('idn-pw-sw').addEventListener('click', () => { modoNuevo = !modoNuevo; elErr.textContent = ''; pintarPw(); });
  document.getElementById('idn-pw-olv').addEventListener('click', async () => {
    const t = telDigitos();
    if (t.length !== 10) { elErr.textContent = 'Escribe primero tu teléfono de 10 dígitos.'; return; }
    await apiFetch({ action: 'solicitarResetComprador', telefono: t }, 'POST').catch(() => {});
    elErr.style.color = '#4ade80';
    elErr.textContent = 'Listo. El administrador te contactará por WhatsApp con un código nuevo.';
  });
  elTel.addEventListener('input', () => { forzarPw = false; pintarPw(); });
  pintarPw();

  // Devuelve { token } o { error }.
  async function conseguirSesion(tel) {
    if (!forzarPw && sesionLocalPara(tel)) {
      const guardado = localStorage.getItem('comprador_token');
      const v = await apiFetch({ action: 'verificarSesionComprador', telefono: tel, compradorToken: guardado }, 'POST').catch(() => null);
      if (!v) return { error: 'Sin conexión. Intenta de nuevo.' };
      if (v.ok) return { token: guardado };
      localStorage.removeItem('comprador_token');
      forzarPw = true; pintarPw();
      return { error: 'Tu sesión expiró. Escribe tu contraseña.' };
    }
    if (!forzarPw && esTelDelVendedor(tel)) {
      const r = await apiFetch({ action: 'sesionCompradorDesdeVendedor', vendorToken: vendorTokenCLive }, 'POST').catch(() => null);
      if (r && r.ok && r.token) return { token: r.token };
      return { error: (r && r.error) || 'No se pudo abrir tu sesión. Intenta de nuevo.' };
    }
    const pw = elPw.value;
    if (!pw) return { error: 'Escribe tu contraseña.' };
    if (modoNuevo && pw !== elPw2.value) return { error: 'Las contraseñas no coinciden.' };
    const r = await apiFetch({ action: modoNuevo ? 'registrarComprador' : 'loginComprador', telefono: tel, password: pw }, 'POST')
      .catch(() => ({ error: 'Sin conexión. Intenta de nuevo.' }));
    if (r.ok && r.token) return { token: r.token };
    if (r.existe) { modoNuevo = false; pintarPw(); }
    return { error: r.error || 'No se pudo continuar. Intenta de nuevo.' };
  }

  const diasSeleccionados = new Set(prevDias);
  overlay.querySelectorAll('.day-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const d = btn.dataset.day;
      if (diasSeleccionados.has(d)) diasSeleccionados.delete(d); else diasSeleccionados.add(d);
      btn.classList.toggle('active');
    });
  });

  // Si el teléfono ya tiene 10 dígitos guardados/perfil en otro
  // dispositivo, precarga días/horario/nota para no volver a pedirlos —
  // pero el nombre y el GPS siempre los da la persona en esta sesión,
  // nunca se autocompletan (así alguien que solo teclea un teléfono
  // ajeno no puede enviar el formulario sin estar ahí físicamente).
  async function aplicarPerfilGuardado(tel) {
    if (tel.length !== 10) return;
    const resp = await apiFetch({ action: 'leerPerfilComprador', telefono: tel, compradorToken: localStorage.getItem('comprador_token') || '' }, 'GET').catch(() => null);
    const perfil = resp && resp.ok ? resp.perfil : null;
    if (!perfil) return;
    if (Array.isArray(perfil.dias)) {
      diasSeleccionados.clear();
      perfil.dias.forEach(d => diasSeleccionados.add(d));
      overlay.querySelectorAll('.day-btn').forEach(b => b.classList.toggle('active', diasSeleccionados.has(b.dataset.day)));
    }
    if (perfil.horaDesde) document.getElementById('idn-hora-desde').value = perfil.horaDesde;
    if (perfil.horaHasta) document.getElementById('idn-hora-hasta').value = perfil.horaHasta;
    if (perfil.nota) document.getElementById('idn-dir').value = perfil.nota;
    if (typeof perfil.lat === 'number' && typeof perfil.lng === 'number' && !gpsCoords) {
      perfilUbicacionPrevia = { lat: perfil.lat, lng: perfil.lng };
      document.getElementById('idn-gps-status').textContent = 'Ya tenemos una ubicación guardada — toca el botón para confirmarla.';
    }
  }
  if (prev.telefono) aplicarPerfilGuardado(prev.telefono.replace(/\D/g, ''));
  document.getElementById('idn-tel').addEventListener('input', (e) => {
    aplicarPerfilGuardado(e.target.value.replace(/\D/g, ''));
  });

  document.getElementById('idn-gps-btn').addEventListener('click', () => {
    const statusEl = document.getElementById('idn-gps-status');
    if (!navigator.geolocation) {
      statusEl.className = 'gps-status error';
      statusEl.textContent = 'Tu navegador no soporta ubicación por GPS. No podemos continuar sin ella — intenta desde otro navegador o dispositivo.';
      return;
    }
    statusEl.className = 'gps-status';
    statusEl.textContent = 'Obteniendo tu ubicación…';
    navigator.geolocation.getCurrentPosition((pos) => {
      gpsCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      actualizarUbicacionPerfil = !perfilUbicacionPrevia || confirm('¿Quieres actualizar tu ubicación guardada para futuras compras?');
      statusEl.className = 'gps-status ok';
      statusEl.innerHTML = Icon('check') + ' Ubicación capturada. El vendedor podrá verla en el mapa.';
      document.getElementById('idn-gps-btn').innerHTML = `${gpsIconSvg} Actualizar mi ubicación`;
    }, (err) => {
      gpsCoords = null;
      statusEl.className = 'gps-status error';
      statusEl.textContent = 'No se pudo obtener tu ubicación. Revisa que tu navegador tenga permiso de ubicación activado para este sitio y vuelve a intentar — es necesaria para poder entregarte.';
    }, { enableHighAccuracy: true, timeout: 10000 });
  });

  document.getElementById('idn-btn').addEventListener('click', async () => {
    elErr.style.color = '';
    elErr.textContent = '';
    const nombre = document.getElementById('idn-nombre').value.trim();
    const tel = document.getElementById('idn-tel').value.replace(/\D/g, '');
    const dias = DIAS_SEMANA.filter(d => diasSeleccionados.has(d));
    const horaDesde = document.getElementById('idn-hora-desde').value;
    const horaHasta = document.getElementById('idn-hora-hasta').value;
    const nota = document.getElementById('idn-dir').value.trim();
    if (!nombre || tel.length !== 10) {
      alert('Escribe tu nombre y un teléfono válido de 10 dígitos.');
      return;
    }
    if (!dias.length || !horaDesde || !horaHasta) {
      alert('Selecciona al menos un día y el rango de horario en que podemos entregarte.');
      return;
    }
    if (!gpsCoords) {
      alert('Necesitamos tu ubicación para continuar — toca "Obtener mi ubicación" y acepta el permiso de tu navegador.');
      return;
    }
    const btnEntrar = document.getElementById('idn-btn');
    const textoBtn = btnEntrar.textContent;
    btnEntrar.disabled = true; btnEntrar.textContent = 'Verificando…';
    const sesion = await conseguirSesion(tel);
    btnEntrar.disabled = false; btnEntrar.textContent = textoBtn;
    if (sesion.error) { elErr.textContent = sesion.error; return; }
    // Mismas llaves que el comprador normal (common.js), así la cuenta,
    // la campanita y el push funcionan igual en todo el sitio.
    localStorage.setItem('client_phone', tel);
    localStorage.setItem('comprador_token', sesion.token);

    const horario = `${dias.join(', ')} · ${horaDesde} a ${horaHasta}`;
    identity = {
      nombre, telefono: tel, horario, dias, horaDesde, horaHasta, nota,
      lat: gpsCoords.lat,
      lng: gpsCoords.lng
    };
    localStorage.setItem('znr_chat_identity', JSON.stringify(identity));
    guardarContacto(identity);
    guardarPerfilRemoto(identity, actualizarUbicacionPerfil);
    actualizarPresenciaNombre();
    document.body.removeChild(overlay);
    // Registra este dispositivo para recibir push de su pedido (stock
    // confirmado, en camino, entregado). Si ya dio permiso, solo registra el token.
    if (typeof window.solicitarPermisoNotificacionesSiFalta === 'function') {
      window.solicitarPermisoNotificacionesSiFalta('cliente', tel);
    }
    onDone();
  });
}

// Perfil por teléfono en auth-api (compradores/{telefono}), separado de
// registrarContactoLive: ese es el contacto de ESTA transmisión, esto es
// lo que se reutiliza la próxima vez que compre, en cualquier dispositivo.
function guardarPerfilRemoto(idn, actualizarUbicacion) {
  const payload = {
    action: 'guardarPerfilComprador',
    telefono: idn.telefono,
    compradorToken: localStorage.getItem('comprador_token') || '',
    dias: idn.dias.join(','),
    horaDesde: idn.horaDesde,
    horaHasta: idn.horaHasta,
    nota: idn.nota || ''
  };
  if (actualizarUbicacion) { payload.lat = idn.lat; payload.lng = idn.lng; }
  apiFetch(payload, 'POST').catch(err => console.error('guardarPerfilComprador falló:', err));
}

// Manda el teléfono/dirección/horario/GPS UNA sola vez a
// registrarContactoLive — nunca dentro de cada mensaje de chat.
// Solo el vendedor dueño del live puede leerlo (vía Cloud Function,
// con su vendorToken), al cerrar la transmisión.
async function guardarContacto(idn) {
  await authReady;
  if (!liveId || !authUid) return false;
  const payload = {
    action: 'registrarContactoLive',
    liveId,
    viewerUid: authUid,
    telefono: idn.telefono || '',
    nota: idn.nota || '',
    horario: idn.horario || ''
  };
  if (typeof idn.lat === 'number' && typeof idn.lng === 'number') {
    payload.lat = idn.lat;
    payload.lng = idn.lng;
  }
  // Hasta 4 intentos con pausa creciente: antes era un solo envío que, si fallaba por mala
  // conexión, dejaba a este comprador sin contacto en el live sin avisar a nadie.
  const pausas = [0, 1500, 4000, 9000];
  for (let i = 0; i < pausas.length; i++) {
    if (pausas[i]) await new Promise(r => setTimeout(r, pausas[i]));
    try {
      const resp = await apiFetch(payload, 'POST');
      if (resp && resp.ok) {
        // Marca "este dispositivo ya dejó su contacto en ESTE live" (para no volver a preguntar al recargar)
        try { localStorage.setItem('znr_contacto_live_' + liveId, '1'); } catch (e) { /* sin storage */ }
        return true;
      }
    } catch (err) {
      console.error(`guardarContacto: intento ${i + 1} falló:`, err);
    }
  }
  // Sin éxito tras los reintentos: un último intento cuando el teléfono recupere la conexión.
  if (!esperandoConexionContacto) {
    esperandoConexionContacto = true;
    window.addEventListener('online', () => { esperandoConexionContacto = false; guardarContacto(idn); }, { once: true });
  }
  return false;
}
let esperandoConexionContacto = false;

// ── Autocorrección: si al comprador le marcan algo como "Vendido" y su contacto NO quedó
// registrado en este live, se arregla en ese momento (mientras sigue conectado). ──
let asegurandoContacto = false;
let ultimoIntentoContacto = 0;
async function asegurarContactoLive() {
  if (asegurandoContacto || !liveId) return;
  if (localStorage.getItem('znr_contacto_live_' + liveId) === '1') return; // ya está registrado
  if (document.querySelector('.identity-overlay')) return;                  // ya hay un aviso/formulario abierto
  if (Date.now() - ultimoIntentoContacto < 20000) return;                   // no insistir en bucle si falla
  asegurandoContacto = true;
  ultimoIntentoContacto = Date.now();
  try {
    const idn = getIdentity() || identity;
    const tel = String((idn && idn.telefono) || '').replace(/\D/g, '');
    const completo = idn && typeof idn.lat === 'number' && typeof idn.lng === 'number' && idn.horario;
    const sesionOk = tel.length === 10
      && (localStorage.getItem('client_phone') || '').replace(/\D/g, '') === tel
      && !!localStorage.getItem('comprador_token');
    if (completo && sesionOk) {
      identity = idn;
      await guardarContacto(identity); // con reintentos; si no se logra, vuelve a intentarlo en el siguiente cambio del chat
      return;
    }
    // Faltan datos o sesión: formulario completo, explicando por qué aparece
    askIdentity(() => {}, 'compra');
  } finally {
    asegurandoContacto = false;
  }
}

// ── Comprador que regresa con sus datos guardados ──
// En vez del formulario completo, una pregunta corta: "¿siguen igual tus datos?".
// Sí → se abre el modal completo. "Por ahora no" → se sigue con lo guardado y se
// registra su contacto en este live. Se pregunta UNA vez por live en este dispositivo.
async function gestionarDatosGuardados() {
  if (localStorage.getItem('znr_contacto_live_' + liveId) === '1') return; // ya quedó registrado en este live (p. ej. recargó)
  identity = await datosGuardadosVigentes();
  const quiereActualizar = await preguntarActualizarDatos(identity);
  if (quiereActualizar) { askIdentity(() => {}); return; } // el modal completo registra el contacto al enviarse
  try { localStorage.setItem('znr_chat_identity', JSON.stringify(identity)); } catch (e) { /* sin storage */ }
  guardarContacto(identity);
}

// Los datos más recientes: el perfil del comprador en el servidor (lo actualiza
// cualquier compra desde cualquier dispositivo) y, si no hay perfil o tarda, la copia local.
async function datosGuardadosVigentes() {
  const base = { ...identity };
  const tel = String(base.telefono || '').replace(/\D/g, '');
  if (tel.length !== 10) return base;
  try {
    const resp = await Promise.race([
      apiFetch({ action: 'leerPerfilComprador', telefono: tel, compradorToken: localStorage.getItem('comprador_token') || '' }, 'GET'),
      new Promise(r => setTimeout(() => r(null), 4000))
    ]);
    const p = resp && resp.ok ? resp.perfil : null;
    if (p) {
      if (typeof p.lat === 'number' && typeof p.lng === 'number') { base.lat = p.lat; base.lng = p.lng; }
      if (Array.isArray(p.dias) && p.dias.length) base.dias = p.dias;
      if (p.horaDesde) base.horaDesde = p.horaDesde;
      if (p.horaHasta) base.horaHasta = p.horaHasta;
      if (typeof p.nota === 'string') base.nota = p.nota;
      if ((base.dias || []).length && base.horaDesde && base.horaHasta) {
        base.horario = `${base.dias.join(', ')} · ${base.horaDesde} a ${base.horaHasta}`;
      }
    }
  } catch (e) { /* sin perfil: se usan los datos locales */ }
  return base;
}

// true = quiere actualizar algún dato (abrir el modal completo); false = seguir con lo guardado.
function preguntarActualizarDatos(idn) {
  return new Promise((resolve) => {
    const tel = String(idn.telefono || '').replace(/\D/g, '');
    const ov = document.createElement('div');
    ov.className = 'identity-overlay';
    ov.innerHTML = `
      <div class="identity-sheet">
        <h2>¿Tus datos de entrega siguen igual?</h2>
        <p>Usaremos los que ya tienes guardados:<br>
          <b>${esc(idn.nombre || '')}</b> · tel. ***${esc(tel.slice(-4))}<br>
          ${esc(idn.horario || '')}<br>
          Ubicación: la que guardaste la última vez.</p>
        <button type="button" id="dg-actualizar">Actualizar mis datos</button>
        <div style="height:8px;"></div>
        <button type="button" class="btn-gps" id="dg-seguir">Por ahora no, seguir con estos</button>
      </div>`;
    document.body.appendChild(ov);
    const fin = (v) => { ov.remove(); resolve(v); };
    ov.querySelector('#dg-actualizar').addEventListener('click', () => fin(true));
    ov.querySelector('#dg-seguir').addEventListener('click', () => fin(false));
  });
}

function renderLive() {
  document.body.classList.add('live-active');
  const esVertical = sesion.orientacion === 'vertical';

  const faqLista = Array.isArray(sesion.faq) ? sesion.faq : [];
  const faqMarkup = faqLista.length
    ? `<div class="faq-row" id="faq-row">${faqLista.map(f => `<button type="button" class="faq-chip" data-id="${esc(f.id)}">${esc(f.pregunta)}</button>`).join('')}</div>`
    : '';

  const chatMarkup = `
    <div class="chat-messages" id="chat-messages"><div class="chat-empty">Sé el primero en comentar 👋</div></div>
    ${faqMarkup}
    <div class="chat-input-row">
      <input type="text" id="chat-input" placeholder="Escribe un comentario…" maxlength="300">
      <button id="chat-send"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" aria-hidden="true"><use href="#ic-arrow-right"/></svg></button>
    </div>`;

  const videoMarkup = `<div class="video-slot-inner" id="video-slot"></div>`;

  if (esVertical) {
    // Estilo YouTube: el video se queda fijo arriba; todo lo demás
    // (título, producto, chat) es contenido normal que se desplaza
    // por debajo. Nada se sobrepone al video.
    wrap.innerHTML = `
      <div class="video-anchor vertical" id="video-anchor">
        <div class="video-box" id="video-box-el">${videoMarkup}</div>
      </div>
      <div class="live-info-compact">
        <span class="status-dot"></span>
        <strong>${esc(sesion.titulo)}</strong>
        <span class="viewer-badge">${Icon('eye')} <span id="viewer-count">0</span></span>
      </div>
      <div id="producto-slot"></div>
      <div class="chat-section">
        <div class="chat-panel">${chatMarkup}</div>
      </div>
    `;
  } else {
    wrap.innerHTML = `
      <div class="video-anchor" id="video-anchor">
        <div class="video-box" id="video-box-el">${videoMarkup}</div>
      </div>
      <div class="live-info">
        <span class="status-badge live"><span class="status-dot"></span> EN VIVO</span>
        <span class="viewer-badge">${Icon('eye')} <span id="viewer-count">0</span></span>
        <h1>${esc(sesion.titulo)}</h1>
        <p class="vendor">Por ${esc(sesion.vendedor_nombre)}</p>
      </div>
      <div id="producto-slot"></div>
      <div class="chat-section">
        <div class="chat-panel">${chatMarkup}</div>
      </div>
    `;
  }

  setupStickyVideo();
  renderProductoActual();
  setupChat();
  setupProductoEnVivo();
  registrarPresencia();
  setupContadorEspectadores();

  document.getElementById('chat-send').addEventListener('click', () => enviarMensaje());
  document.querySelectorAll('.faq-chip').forEach(btn => btn.addEventListener('click', () => preguntarFaq(btn)));
  document.getElementById('chat-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') enviarMensaje(); });

  if (!sesion.playbackUrl && sesion.facebook_link && sesion.fuente !== 'znr') {
    // Live creado con el formato anterior (link de Facebook/YouTube): ya no se puede mostrar.
    document.getElementById('video-slot').innerHTML = '<div class="video-estado">Esta transmisión se creó con el formato anterior y ya no se puede ver aquí.</div>';
  } else {
    iniciarReproductorWHEP('video-slot', sesion.playbackUrl);
  }
}

// Pide por id el producto destacado si no vino en la lista general (esa lista se corta en 50).
async function asegurarProducto(id) {
  if (!id || productosMap[id]) return;
  try {
    const r = await apiFetch({ action: 'obtenerProductosPorIds', ids: JSON.stringify([id]) }, 'GET');
    if (r.productos && r.productos[0]) productosMap[id] = r.productos[0];
  } catch (e) { /* se reintenta en el siguiente ciclo */ }
}

function renderProductoActual() {
  const slot = document.getElementById('producto-slot');
  if (!slot) return;
  const p = productosMap[sesion.producto_actual_id];
  if (!p) { slot.innerHTML = sesion.producto_actual_id ? `<p class="chat-empty">Producto ${esc(sesion.producto_actual_id)} no encontrado</p>` : ''; return; }
  const palabra = (p.nombre || '').trim().split(/\s+/)[0].toUpperCase();
  slot.innerHTML = `
    <div class="producto-actual">
      <img src="${esc(p.imagen1 || 'https://placehold.co/100x100')}" alt="${esc(p.nombre)}">
      <div class="info">
        <p class="nombre">${esc(p.nombre)}</p>
        <p class="precio">$${Number(p.precio || 0).toLocaleString()}</p>
      </div>
      <button class="btn-apartar" id="btn-apartar">🙋 Comentar "${esc(palabra)}"</button>
    </div>`;
  document.getElementById('btn-apartar').addEventListener('click', (e) => {
    const btn = e.currentTarget;
    if (!identity) { askIdentity(() => enviarMensaje(palabra)); return; }
    enviarMensaje(palabra);
    const textoOriginal = btn.textContent;
    btn.innerHTML = Icon('check') + ' Enviado';
    btn.disabled = true;
    setTimeout(() => { btn.textContent = textoOriginal; btn.disabled = false; }, 1200);
  });
}

function enviarMensaje(textoDirecto) {
  const input = document.getElementById('chat-input');
  const text = textoDirecto != null ? textoDirecto.trim() : input.value.trim();
  if (!text || !identity) return;
  if (textoDirecto == null) input.value = '';
  if (!authUid) { alert('Un momento, tu sesión aún se está preparando — intenta de nuevo.'); return; }
  const payload = {
    uid: authUid,
    author: identity.nombre,
    text, isVendor: false, ts: Date.now(),
    producto_id: String(sesion.producto_actual_id || '')
  };
  push(ref(db, `chats/${liveId}/messages`), payload).catch(err => {
    alert('No se pudo enviar tu comentario: ' + err.message);
    if (textoDirecto == null) input.value = text;
  });
}

// Pregunta frecuente: el servidor publica en el chat la pregunta (a tu nombre)
// y la respuesta del vendedor, para que todos la vean.
async function preguntarFaq(btn) {
  const faqId = btn.dataset.id;
  if (!faqId || btn.disabled) return;
  if (!identity || !identity.nombre) { askIdentity(() => preguntarFaq(btn)); return; }
  if (!authUid) { alert('Un momento, tu sesión aún se está preparando — intenta de nuevo.'); return; }
  btn.disabled = true;
  try {
    const resp = await apiFetch({
      action: 'preguntarFaqLive', liveId, faqId, uid: authUid, author: identity.nombre
    }, 'POST');
    if (!resp.ok) alert(resp.error || 'No se pudo enviar la pregunta.');
  } catch (err) {
    alert('No se pudo enviar la pregunta. Revisa tu conexión e intenta de nuevo.');
  }
  setTimeout(() => { btn.disabled = false; }, 3000);
}

function setupProductoEnVivo() {
  onValue(ref(db, `live_producto/${liveId}`), (snap) => {
    const p = snap.val();
    if (!p || !p.id) return;
    viaRtdb = true;
    productosMap[p.id] = { ...productosMap[p.id], ...p };
    if (String(sesion.producto_actual_id) === String(p.id)) return;
    sesion.producto_actual_id = p.id;
    renderProductoActual();
  });
}

function setupChat() {
  const messagesEl = document.getElementById('chat-messages');
  onValue(ref(db, `chats/${liveId}/messages`), (snapshot) => {
    const data = snapshot.val();
    if (!data) { messagesEl.innerHTML = '<div class="chat-empty">Sé el primero en comentar 👋</div>'; return; }
    // Revisa TODOS los mensajes (no solo los últimos 100): si alguno mío está "Vendido", se asegura mi contacto.
    if (Object.values(data).some(m => m.vendido && m.uid && m.uid === authUid)) asegurarContactoLive();
    const msgs = Object.values(data).sort((a, b) => (a.ts || 0) - (b.ts || 0)).slice(-100);
    messagesEl.innerHTML = msgs.map(m => `
      <div class="chat-msg ${identity && m.author === identity.nombre ? 'mine' : ''}${m.faq ? ' faq' : ''}">
        <span class="author">${esc(m.author)}${m.isVendor ? ' ' + Icon('shopping-bag') : ''}:</span>
        <span class="text">${esc(m.text)}</span>
        ${m.vendido ? '<span class="vendido-tag">' + Icon('check') + ' Vendido</span>' : ''}
      </div>
    `).join('');
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }, (err) => {
    messagesEl.innerHTML = `<div class="chat-empty">No se pudo cargar el chat: ${esc(err.message)}</div>`;
  });
}

// ── Polling ligero para detectar cambios de estado / producto actual ──
function startPolling() {
  pollTimer = setInterval(async () => {
    try {
      const resp = await apiFetch({ action: 'obtenerSesionLivePorId', id: liveId });
      if (!resp.ok) return;
      const nueva = resp.sesion;
      if (nueva.estado === 'terminado') {
        clearInterval(pollTimer);
        sesion = nueva;
        renderEnded();
        return;
      }
      if (!viaRtdb && nueva.producto_actual_id !== sesion.producto_actual_id) {
        sesion.producto_actual_id = nueva.producto_actual_id;
        await asegurarProducto(sesion.producto_actual_id);
        renderProductoActual();
      }
      // Si el vendedor re-publicó con otra URL (o la nuestra venía vacía), reconectar con la nueva.
      if (nueva.playbackUrl && nueva.playbackUrl !== whepUrlActual) {
        sesion.playbackUrl = nueva.playbackUrl;
        whepUrlActual = nueva.playbackUrl;
        reintentarWHEP(true);
      }
    } catch (e) { /* silencioso, reintenta en el siguiente ciclo */ }
  }, 6000);
}

async function init() {
  if (!liveId) { renderNoId(); return; }

  const vendorToken = (() => {
    try { return (JSON.parse(localStorage.getItem('vendor_session') || 'null') || {}).token || null; }
    catch (e) { return null; }
  })();
  if (!vendorToken) { renderRequiereVendedor(); return; }
  let vendorNombre = '', vendorTelefono = '';
  try {
    const sesionVendedor = await apiFetch({ action: 'verificarSesionVendedor', vendorToken }, 'POST');
    if (!sesionVendedor.ok) { renderRequiereVendedor(); return; }
    vendorNombre = sesionVendedor.nombre || '';
    vendorTelefono = sesionVendedor.telefono || '';
    vendorTokenCLive = vendorToken;
    vendorTelCLive = String(vendorTelefono).replace(/\D/g, '');
  } catch (err) {
    renderRequiereVendedor();
    return;
  }

  identity = getIdentity();
  // Ya verificamos que es una cuenta real — si todavía no había llenado el
  // sheet de "Únete al chat" en este navegador, le ahorramos escribir de
  // nuevo lo que ya sabemos de su cuenta de vendedor.
  if (!identity) identity = {};
  if (!identity.nombre && vendorNombre) identity.nombre = vendorNombre;
  if (!identity.telefono && vendorTelefono) identity.telefono = vendorTelefono;
  await authReady; // esperar a que Firebase asigne el uid anónimo antes de leer/escribir RTDB

  try {
    const resp = await apiFetch({ action: 'obtenerSesionLivePorId', id: liveId });
    if (!resp.ok) { renderNotFound(); return; }
    sesion = resp.sesion;

    const btnReportar = document.getElementById('btn-reportar');
    btnReportar.style.display = 'flex';
    btnReportar.addEventListener('click', mostrarReporte);

    if (sesion.estado === 'terminado') { renderEnded(); return; }
    if (sesion.estado === 'programado') { renderScheduledWait(); return; }

    await asegurarProducto(sesion.producto_actual_id);
    renderLive();
    startPolling();

    // Además de nombre/GPS/horario, hace falta sesión de comprador para ese
    // teléfono (contraseña): sin ella no llegarían las notificaciones.
    const telIdentidad = String((identity && identity.telefono) || '').replace(/\D/g, '');
    const sesionCompradorOk = telIdentidad.length === 10
      && (localStorage.getItem('client_phone') || '').replace(/\D/g, '') === telIdentidad
      && !!localStorage.getItem('comprador_token');
    if (!identity || typeof identity.lat !== 'number' || typeof identity.lng !== 'number' || !identity.horario || !sesionCompradorOk) {
      askIdentity(() => {});
    } else {
      // Comprador que regresa (datos ya guardados en este dispositivo): el contacto se
      // registra POR LIVE (lives_contactos/{liveId}); si no se registra aquí, este live se
      // queda sin su teléfono/ubicación y no podrá recibir notificaciones ni seguimiento.
      gestionarDatosGuardados();
    }
  } catch (err) {
    renderNotFound();
  }
}

init();
</script>
