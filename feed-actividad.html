<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="
 default-src 'self';
 script-src 'self' 'unsafe-inline' https://www.gstatic.com;
 style-src 'self' 'unsafe-inline';
 img-src 'self' data: blob: https://lh3.googleusercontent.com https://drive.google.com https://placehold.co https://via.placeholder.com;
 connect-src 'self' https://script.google.com https://script.googleusercontent.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://wttr.in https://www.gstatic.com https://firebaseinstallations.googleapis.com https://fcmregistrations.googleapis.com https://firebase.googleapis.com https://znr-live-default-rtdb.firebaseio.com https://nominatim.openstreetmap.org;
 font-src 'self';
 frame-src 'none';
 frame-ancestors 'none';
 object-src 'none';
 base-uri 'self';
 worker-src 'self' blob:;
 child-src 'self' blob:;
">
 <script src="error-bootstrap.js"></script>

  <title>Z&R · Actividad reciente</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e2128">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32x32.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152x152.png">

  <style>
    body { margin: 0; background: #f4f3fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .fa-header {
      position: sticky; top: 0; z-index: 10;
      background: linear-gradient(135deg,#7c3aed,#a78bfa);
      display: flex; align-items: center; gap: 10px;
      padding: 16px 16px 14px;
    }
    .fa-header h1 { font-size: 1.08rem; margin: 0; font-weight: 800; color: #fff; }
    .fa-back { background: rgba(255,255,255,.2); border: none; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; flex-shrink: 0; }
    .fa-subtitle { padding: 14px 16px 6px; font-size: .78rem; color: #8b85a3; font-weight: 600; }
    .fa-list { padding: 6px 16px 40px; display: flex; flex-direction: column; gap: 12px; }
    .fa-card {
      position: relative; overflow: hidden;
      display: flex; align-items: center; gap: 14px;
      background: #fff; border-radius: 18px;
      padding: 12px 14px 12px 16px;
      box-shadow: 0 2px 10px rgba(124,58,237,.07);
      animation: fa-fade-in .35s ease backwards;
    }
    .fa-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
      background: linear-gradient(180deg,#7c3aed,#ff4f81);
    }
    .fa-card img { width: 64px; height: 64px; border-radius: 14px; object-fit: cover; background: #f0f0f5; flex-shrink: 0; }
    .fa-card-text { flex: 1; min-width: 0; }
    .fa-card-vendor { font-size: .92rem; font-weight: 800; color: #1a1a2e; margin: 0 0 2px; }
    .fa-card-product { font-size: .82rem; color: #666; margin: 0; line-height: 1.3; }
    .fa-card-footer { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .fa-card-time { font-size: .7rem; color: #aaa; }
    .fa-badge-fresh {
      display: inline-flex; align-items: center; gap: 3px;
      font-size: .65rem; font-weight: 800; color: #fff;
      background: linear-gradient(135deg,#ff4f81,#ff7a4f);
      padding: 3px 8px; border-radius: 20px;
      animation: fa-pulse 1.8s ease infinite;
    }
    .fa-badge-stock {
      display: inline-flex; align-items: center;
      font-size: .65rem; font-weight: 800; color: #b45309;
      background: #fef3c7; padding: 3px 8px; border-radius: 20px;
    }
    .fa-badge-stock-out { color: #991b1b; background: #fee2e2; }
    
    .fa-empty, .fa-error { text-align: center; color: #999; padding: 60px 24px; font-size: .85rem; }
    .fa-skeleton { position: relative; overflow: hidden; background: #fff; border-radius: 18px; padding: 12px 14px; display: flex; gap: 14px; align-items: center; box-shadow: 0 2px 10px rgba(124,58,237,.05); }
    .fa-skeleton .sk-img, .fa-skeleton .sk-line { background: linear-gradient(90deg,#eee 25%,#f5f5f5 37%,#eee 63%); background-size: 400% 100%; animation: sk-shimmer 1.4s ease infinite; border-radius: 10px; }
    .fa-skeleton .sk-img { width: 64px; height: 64px; flex-shrink: 0; }
    .fa-skeleton .sk-line { height: 12px; width: 70%; }
    @keyframes sk-shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
    @keyframes fa-fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fa-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .6; } }
  </style>
</head>
<body>

  <div class="fa-header">
    <button class="fa-back" id="fa-back-btn" aria-label="Volver">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
    </button>
    <h1>🛍️ Actividad reciente</h1>
  </div>
  <p class="fa-subtitle">Ventas confirmadas en Comunidad, últimos 7 días</p>

  <div class="fa-list" id="fa-list">
    <div class="fa-skeleton"><div class="sk-img"></div><div class="sk-line"></div></div>
    <div class="fa-skeleton"><div class="sk-img"></div><div class="sk-line"></div></div>
    <div class="fa-skeleton"><div class="sk-img"></div><div class="sk-line"></div></div>
  </div>

  <script src="api-config.js" defer></script>
  <script>
    document.getElementById('fa-back-btn').addEventListener('click', () => {
      if (document.referrer && document.referrer.includes(location.host)) history.back();
      else window.location.href = 'vendedor.html';
    });

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function tiempoRelativo(isoFecha) {
      const ahora = Date.now();
      const fecha = new Date(isoFecha).getTime();
      const diffMin = Math.max(0, Math.floor((ahora - fecha) / 60000));
      if (diffMin < 1) return 'justo ahora';
      if (diffMin < 60) return 'hace ' + diffMin + ' min';
      const diffH = Math.floor(diffMin / 60);
      if (diffH < 24) return 'hace ' + diffH + (diffH === 1 ? ' hora' : ' horas');
      const diffD = Math.floor(diffH / 24);
      return 'hace ' + diffD + (diffD === 1 ? ' día' : ' días');
    }

    function renderFeed(items) {
      const list = document.getElementById('fa-list');
      if (!items.length) {
        list.innerHTML = '<div class="fa-empty">🕊️ Todavía no hay ventas recientes que mostrar.</div>';
        return;
      }
      const ahora = Date.now();
      list.innerHTML = items.map((it, i) => {
        const minutos = Math.floor((ahora - new Date(it.fecha).getTime()) / 60000);
        const esReciente = minutos < 10;
        return `
        <div class="fa-card" style="animation-delay:${Math.min(i, 8) * 0.05}s">
          <img src="${it.imagen ? esc(it.imagen) : 'https://placehold.co/120x120?text=%F0%9F%9B%8D%EF%B8%8F'}" alt="" loading="lazy" onerror="this.src='https://placehold.co/120x120?text=%F0%9F%9B%8D%EF%B8%8F'">
          <div class="fa-card-text">
            <p class="fa-card-vendor">${esc(it.vendedor || 'Un vendedor')}</p>
            <p class="fa-card-product">vendió ${esc(it.producto || 'un producto')}</p>
            <div class="fa-card-footer">
              <span class="fa-card-time">${tiempoRelativo(it.fecha)}</span>
              ${esReciente ? '<span class="fa-badge-fresh">🔥 Recién vendido</span>' : ''}
              ${it.stockRestante === 0 ? '<span class="fa-badge-stock fa-badge-stock-out">Se agotó</span>' : ''}
              ${it.stockRestante !== null && it.stockRestante > 0 && it.stockRestante <= 5 ? `<span class="fa-badge-stock">¡Solo quedan ${it.stockRestante}!</span>` : ''}
            </div>
          </div>
        </div>`;
      }).join('');
    }

    async function cargarFeed() {
      try {
        if (!window.API_URL) throw new Error('API_URL no está disponible');
        const res = await fetch(window.API_URL + '?' + new URLSearchParams({ action: 'obtenerFeedActividad' }));
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || 'Error del servidor');
        renderFeed(data.items || []);
      } catch (err) {
        console.error('Error cargando feed de actividad:', err);
        document.getElementById('fa-list').innerHTML = '<div class="fa-error">No se pudo cargar la actividad reciente. Intenta de nuevo más tarde.</div>';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      cargarFeed();
      // Se siente "vivo": refresca sola cada minuto, sin que el usuario tenga que jalar/recargar.
      setInterval(cargarFeed, 60000);
    });
  </script>
</body>
</html>
