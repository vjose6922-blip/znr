  <style>
    body { margin: 0; background: var(--page-bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; padding-bottom: 70px; }

    .fa-subtitle-bar { padding: 14px 16px 6px; font-size: .78rem; color: var(--color-text-soft); font-weight: 600; }
    .fa-list { padding: 6px 16px 40px; display: flex; flex-direction: column; gap: 12px; }

    .fa-card {
      position: relative; overflow: hidden;
      display: flex; align-items: center; gap: 14px;
      background: var(--color-surface); border-radius: var(--radius-lg);
      padding: 12px 14px 12px 16px;
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--color-border-subtle);
      animation: fa-fade-in .35s ease backwards;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .fa-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.08); }
    .fa-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
      background: var(--gradient-accent);
    }
    .fa-card img { width: 64px; height: 64px; border-radius: var(--radius-md); object-fit: cover; background: var(--color-bg); flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
    .fa-card-thumb-fallback {
      width: 64px; height: 64px; border-radius: var(--radius-md); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--color-bg); color: var(--color-text-soft);
    }
    .fa-card-text { flex: 1; min-width: 0; }
    .fa-card-vendor {
      font-size: .92rem; font-weight: 800; color: var(--color-text-primary); margin: 0 0 2px;
      display: inline-flex; align-items: center; gap: 4px; cursor: pointer; width: fit-content;
      text-decoration: none; transition: opacity .15s ease;
    }
    .fa-card-vendor:hover { opacity: .8; }
    .fa-card-vendor svg { opacity: .55; flex-shrink: 0; }
    .fa-card-product { font-size: .82rem; color: var(--color-text-muted); margin: 0; line-height: 1.3; }
    .fa-card-footer { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .fa-card-time { font-size: .7rem; color: var(--color-text-soft); }

    .fa-badge-fresh {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: .65rem; font-weight: 800; color: #fff;
      background: var(--gradient-accent);

    .fa-badge-stock {
      display: inline-flex; align-items: center;

      background: var(--color-warning-bg); padding: 3px 9px; border-radius: var(--radius-pill);

    .fa-reco-wrap { padding: 14px 16px 2px; }

    .fa-skeleton {

    @keyframes sk-shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

    /* ── Historias (24 h) ── */

    .fa-story-item, .fa-story-crear { position: relative; flex-shrink: 0; width: 108px; height: 184px; padding: 0; border: none; border-radius: 14px; overflow: hidden; cursor: pointer; background: var(--color-surface); box-shadow: 0 2px 10px rgba(0,0,0,.14); font-family: inherit; text-align: left; -webkit-tap-highlight-color: transparent; }
    .fa-story-item::after { content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none; background: linear-gradient(rgba(0,0,0,.28) 0%, transparent 32%, transparent 55%, rgba(0,0,0,.72) 100%); }

    .fa-story-ring { position: absolute; top: 8px; left: 8px; z-index: 2; width: 38px; height: 38px; padding: 2.5px; border-radius: 50%; box-sizing: border-box; background: var(--gradient-accent); }
    .fa-story-item.visto .fa-story-ring { background: rgba(255,255,255,.75); }
    .fa-story-avatar { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; border: 2px solid #fff; background: #fff; color: var(--color-accent-solid); font-weight: 800; font-size: .9rem; box-sizing: border-box; }
    .fa-story-avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .fa-story-play { position: absolute; top: 12px; right: 8px; z-index: 2; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,.5); color: #fff; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .fa-story-name { position: absolute; left: 9px; right: 9px; bottom: 9px; z-index: 2; color: #fff; font-size: .76rem; font-weight: 800; line-height: 1.2; text-shadow: 0 1px 4px rgba(0,0,0,.6); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

    /* Tarjeta "Subir historia" (solo vendedores con sesión) */
    .fa-story-crear { background: var(--color-surface); }

    .fa-story-crear-top img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .fa-story-crear-plus { position: absolute; left: 50%; top: 66%; transform: translate(-50%, -50%); z-index: 2; width: 34px; height: 34px; border-radius: 50%; background: var(--gradient-accent); color: #fff; border: 3px solid var(--color-surface); display: flex; align-items: center; justify-content: center; }
    .fa-story-crear-txt { position: absolute; left: 6px; right: 6px; bottom: 9px; z-index: 2; text-align: center; color: var(--color-text-primary); font-size: .72rem; font-weight: 800; line-height: 1.15; }

    /* ── Secciones nuevas: En vivo / Próximos, Resumen del día, Últimas piezas, píldora de ventas nuevas ── */
    .fa-sec { padding: 14px 16px 2px; }

    .fa-live-top { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 1; display: flex; justify-content: space-between; align-items: center; }
    .fa-live-badge { background: #ef4444; font-size: .68rem; font-weight: 800; padding: 3px 9px; border-radius: 999px; letter-spacing: .4px; animation: fa-pulse 1.6s ease infinite; }
    .fa-live-viendo { background: rgba(0,0,0,.45); font-size: .7rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
    .fa-live-info { position: absolute; left: 12px; right: 12px; bottom: 10px; z-index: 1; display: flex; align-items: flex-end; gap: 10px; }
    .fa-live-info div { flex: 1; min-width: 0; }
    .fa-live-info b { display: block; font-size: .95rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fa-live-info small { display: block; font-size: .75rem; opacity: .9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fa-live-entrar { flex-shrink: 0; background: #fff; color: #ef4444; font-weight: 800; font-size: .78rem; padding: 7px 14px; border-radius: 999px; }

    .fa-prox { flex-shrink: 0; width: 210px; display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: var(--radius-lg); background: var(--color-surface); border: 1px solid var(--color-border-subtle); box-shadow: var(--shadow-soft); }
    .fa-prox img, .fa-prox .fa-prox-ph { width: 54px; height: 54px; border-radius: var(--radius-md); object-fit: cover; flex-shrink: 0; background: var(--gradient-accent); }
    .fa-prox div { min-width: 0; flex: 1; }
    .fa-prox b { display: block; font-size: .8rem; color: var(--color-text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fa-prox small { display: block; font-size: .7rem; color: var(--color-accent-solid); font-weight: 700; margin: 2px 0 5px; }
    .fa-prox .bell-live { font-size: .7rem; padding: 4px 9px; }

    .fa-resumen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .fa-resumen div { text-align: center; padding: 10px 4px; border-radius: var(--radius-lg); background: var(--color-surface); border: 1px solid var(--color-border-subtle); }
    .fa-resumen b { display: block; font-size: 1.25rem; color: var(--color-accent-solid); }

    .fa-pieza { flex-shrink: 0; width: 128px; text-decoration: none; color: inherit; border-radius: var(--radius-lg); overflow: hidden; background: var(--color-surface); border: 1px solid var(--color-border-subtle); box-shadow: var(--shadow-soft); }

    .fa-pieza span { font-size: .8rem; font-weight: 800; color: var(--color-accent-solid); }
    .fa-pieza .fa-badge-stock { margin-top: 4px; }

    a.fa-card { text-decoration: none; color: inherit; }
    .fa-card-precio { font-size: .9rem; font-weight: 800; color: var(--color-accent-solid); margin-left: auto; flex-shrink: 0; }
    .fa-pill { position: sticky; top: 8px; z-index: 5; display: none; margin: 0 auto 4px; width: fit-content; border: none; cursor: pointer; padding: 7px 16px; border-radius: 999px; background: var(--gradient-accent); color: #fff; font-weight: 800; font-size: .78rem; box-shadow: 0 6px 16px rgba(0,0,0,.18); }
  </style>

  <script>
    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function tiempoRelativo(isoFecha) {
      const ahora = Date.now();
      const fecha = new Date(isoFecha).getTime();
      const diffMin = Math.max(0, Math.floor((ahora - fecha) / 60000));
      if (diffMin < 1) return 'justo ahora';
      if (diffMin < 60) return 'hace ' + diffMin + ' min';
      const diffH = Math.floor(diffMin / 60);
      if (diffH < 24) return 'hace ' + diffH + (diffH === 1 ? ' hora' : ' horas');
      const diffD = Math.floor(diffH / 24);
      return 'hace ' + diffD + (diffD === 1 ? ' día' : ' días');
    }

    // ════════════════════════════════════════════════════════════
    //  Actividad de MI ciudad: En vivo / Próximos, Resumen del día, Últimas piezas y lo que se está vendiendo
    // ════════════════════════════════════════════════════════════
    const LIVE_API = 'https://live-api-1038143238323.us-central1.run.app';
    const RTDB = 'https://znr-live-default-rtdb.firebaseio.com/';
    const rtdb = (ruta) => fetch(RTDB + ruta + '.json').then(r => r.ok ? r.json() : null).catch(() => null);
    const claveCiudad = (c) => String(c || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
    const miniatura = (url) => String(url || '').replace(/_m(\.\w+\?alt=media)$/, '_t$1');
    const precio = (n) => '$' + Number(n || 0).toLocaleString('es-MX');
    const hoy = (iso) => iso && new Date(iso).toDateString() === new Date().toDateString();
    const urlProducto = (uid, id) => `perfil-vendedor.html?vendedor=${encodeURIComponent(uid)}${id ? '#producto-' + encodeURIComponent(id) : ''}`;
    const fallbackImg = (icono) => `this.outerHTML='<div class=&quot;fa-card-thumb-fallback&quot;>${Icon(icono, { size: 26 }).replace(/"/g, '&quot;')}</div>'`;
    let ciudad = null, lives = { activos: [], programados: [], terminados: [] }, ventas = [], mostradas = new Set();

    // Las ventas anteriores a este cambio no traen ciudad: se toma la del perfil público del vendedor (una vez por vendedor).
    const ciudadVendedor = {};
    async function conCiudad(items) {
      const faltan = [...new Set(items.filter(it => !it.ciudad && it.vendedorUid && !(it.vendedorUid in ciudadVendedor)).map(it => it.vendedorUid))];
      await Promise.all(faltan.map(async uid => { ciudadVendedor[uid] = (await rtdb('perfiles/' + encodeURIComponent(uid) + '/ciudad')) || ''; }));
      return items.map(it => ({ ...it, ciudad: it.ciudad || ciudadVendedor[it.vendedorUid] || '' }));
    }

    // ── 🔴 En vivo ahora y próximos lives (con "Avísame") ──
    async function cargarLives() {
      const r = await fetch(`${LIVE_API}?${new URLSearchParams({ action: 'obtenerLivesPublicos' })}`).then(x => x.json()).catch(() => ({}));
      const mia = (l) => l.ciudad === ciudad;
      lives = { activos: (r.activos || []).filter(mia), programados: (r.programados || []).filter(mia), terminados: (r.terminados || []).filter(mia) };
      const viendo = await Promise.all(lives.activos.map(l => rtdb('live_espectadores/' + encodeURIComponent(l.id))));
      const cuando = (iso) => { const m = Math.round((new Date(iso) - Date.now()) / 60000);
        return m <= 0 ? 'Por empezar' : m < 60 ? `Empieza en ${m} min` : hoy(iso) ? `Hoy ${new Date(iso).toLocaleTimeString('es-MX', { hour: 'numeric', minute: '2-digit' })}`
          : new Date(iso).toLocaleDateString('es-MX', { weekday: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }); };
      const vivo = lives.activos.map((l, i) => `
        <a class="fa-live" href="comprador-live.html?id=${esc(l.id)}">
          ${l.miniatura_url ? `<img src="${esc(l.miniatura_url)}" alt="" loading="lazy" onerror="this.remove()">` : ''}
          <span class="fa-live-top"><span class="fa-live-badge">● EN VIVO</span>${viendo[i] ? `<span class="fa-live-viendo">${Icon('eye', { size: 12 })} ${viendo[i]} viendo</span>` : ''}</span>
          <span class="fa-live-info"><div><b>${esc(l.vendedor_nombre || 'Vendedor')}</b><small>${esc(l.titulo || 'Transmisión en vivo')}</small></div><span class="fa-live-entrar">Entrar</span></span>
        </a>`).join('');
      const prox = lives.programados.map(l => `
        <div class="fa-prox">
          ${l.miniatura_url ? `<img src="${esc(l.miniatura_url)}" alt="" loading="lazy" onerror="this.outerHTML='<span class=&quot;fa-prox-ph&quot;></span>'">` : '<span class="fa-prox-ph"></span>'}
          <div><b>${esc(l.vendedor_nombre || 'Vendedor')}</b><b style="font-weight:600;color:var(--color-text-muted)">${esc(l.titulo || '')}</b>
            <small>${cuando(l.fecha_programada)}</small>${window.znrLiveNotif ? znrLiveNotif.boton('live', l.id, 'Avísame') : ''}</div>
        </div>`).join('');
      document.getElementById('fa-live-wrap').innerHTML =
        (vivo ? `<div class="fa-sec"><p class="fa-sec-title">${Icon('signal', { size: 14 })} En vivo ahora</p><div class="fa-scroll">${vivo}</div></div>` : '')
        + (prox ? `<div class="fa-sec"><p class="fa-sec-title">${Icon('calendar', { size: 14 })} Próximos lives</p><div class="fa-scroll">${prox}</div></div>` : '');
    }

    // ── 📊 Resumen del día ──
    function renderResumen() {
      const v = ventas.filter(it => hoy(it.fecha));
      const nLives = [...lives.activos, ...lives.terminados.filter(l => hoy(l.fecha_fin)), ...lives.programados.filter(l => hoy(l.fecha_programada))].length;
      const vendedores = new Set([...v.map(it => it.vendedorUid), ...lives.activos.map(l => l.vendedor_id)]).size;
      const dato = (n, t) => `<div><b>${n}</b><span>${t}</span></div>`;
      document.getElementById('fa-resumen').innerHTML = !ciudad ? '' : `<div class="fa-sec"><p class="fa-sec-title">${Icon('stats', { size: 14 })} Hoy en ${esc(ciudad.split(',')[0])}</p>
        <div class="fa-resumen">${dato(v.length, v.length === 1 ? 'venta' : 'ventas')}${dato(nLives, nLives === 1 ? 'live' : 'lives')}${dato(vendedores, vendedores === 1 ? 'vendedor activo' : 'vendedores activos')}</div></div>`;
    }

    // ── 🔥 Últimas piezas: productos de mi ciudad con 5 o menos (catálogo de la ciudad + stock en vivo) ──
    async function cargarUltimas() {
      const k = claveCiudad(ciudad);
      if (!k) return;
      const [snap, stock] = await Promise.all([rtdb('catalogo/snapshot_ciudad/' + k + '/products'), rtdb('catalogo/stock/' + k)]);
      const piezas = Object.values(snap || {}).filter(p => p && !p.es_znr && p.vendedor_uid)
        .map(p => ({ ...p, stock: stock && p.id in stock ? stock[p.id] : Number(p.stock) }))
        .filter(p => p.stock >= 1 && p.stock <= 5).sort((a, b) => a.stock - b.stock).slice(0, 12);
      document.getElementById('fa-ultimas').innerHTML = !piezas.length ? '' : `<div class="fa-sec"><p class="fa-sec-title">${Icon('fire', { size: 14 })} Últimas piezas</p><div class="fa-scroll">
        ${piezas.map(p => `<a class="fa-pieza" href="${urlProducto(p.vendedor_uid, p.id)}">
          <img src="${esc(miniatura(p.imagen1))}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
          <div><b>${esc(p.nombre)}</b><span>${precio(p.precio)}</span><br><span class="fa-badge-stock">${p.stock === 1 ? '¡Última pieza!' : `Solo quedan ${p.stock}`}</span></div></a>`).join('')}
      </div></div>`;
    }

    // ── 🛍️ Se está vendiendo (y lives que ya terminaron) ──
    function duracion(ini, fin) {
      const m = Math.max(1, Math.round((new Date(fin) - new Date(ini)) / 60000));
      return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : '');
    }
    function itemsFeed() {
      const terminados = lives.terminados.map(l => ({ id: 'live_' + l.id, tipo: 'live', vendedor: l.vendedor_nombre, vendedorUid: l.vendedor_id, producto: l.titulo, imagen: l.miniatura_url, inicio: l.fecha_inicio, fecha: l.fecha_fin }));
      return [...ventas, ...terminados].sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
    }
    function renderFeed() {
      const items = itemsFeed(), list = document.getElementById('fa-list');
      mostradas = new Set(items.map(it => it.id));
      document.getElementById('fa-pill').style.display = 'none';
      if (!items.length) {
        list.innerHTML = `<div class="fa-empty">${Icon('box', { size: 34 })}<span>Todavía no hay ventas recientes en tu ciudad.<br>¡Sé de los primeros en comprar en Comunidad!</span></div>`;
        return;
      }
      const ahora = Date.now();
      list.innerHTML = items.map((it, i) => {
        const live = it.tipo === 'live', agotado = it.stockRestante === 0;
        const img = it.imagen ? `<img src="${esc(miniatura(it.imagen))}" alt="" loading="lazy" onerror="${fallbackImg(live ? 'tv' : 'shopping-bag')}">`
          : `<div class="fa-card-thumb-fallback">${Icon(live ? 'tv' : 'shopping-bag', { size: 26 })}</div>`;
        const badges = live
          ? `<span class="fa-badge-stock">${Icon('tv', { size: 11 })} Live · ${duracion(it.inicio, it.fecha)}</span>`
          : ((ahora - new Date(it.fecha).getTime()) / 60000 < 10 ? `<span class="fa-badge-fresh">${Icon('fire', { size: 11 })}Recién vendido</span>` : '')
            + (agotado ? '<span class="fa-badge-stock fa-badge-stock-out">Se agotó · ver más de la tienda</span>' : '')
            + (it.stockRestante > 0 && it.stockRestante <= 5 ? `<span class="fa-badge-stock">Solo quedan ${it.stockRestante}</span>` : '');
        const href = it.vendedorUid ? urlProducto(it.vendedorUid, !live && !agotado ? it.productId : '') : '';
        return `
        <${href ? `a href="${href}"` : 'div'} class="fa-card" style="animation-delay:${Math.min(i, 8) * 0.05}s">
          ${img}
          <div class="fa-card-text">
            <p class="fa-card-product" style="color:var(--color-text-primary);font-weight:800;font-size:.9rem">${live ? `Live: ${esc(it.producto || '')}` : esc(it.producto || 'Un producto')}</p>
            <p class="fa-card-product">${live ? 'transmitió' : 'vendido por'} <b>${esc(it.vendedor || 'un vendedor')}</b></p>
            <div class="fa-card-footer"><span class="fa-card-time">${tiempoRelativo(it.fecha)}</span>${badges}</div>
          </div>
          ${!live && it.precio ? `<span class="fa-card-precio">${precio(it.precio)}</span>` : ''}
        </${href ? 'a' : 'div'}>`;
      }).join('');
    }

    // Al refrescar no se mueve la lista: si llegaron ventas nuevas aparece la píldora "↑ N ventas nuevas".
    async function cargarFeed(inicial) {
      try {
        const data = window.znrFirestore ? await window.znrFirestore.getFeedActividad() : { ok: false };
        if (!data.ok) throw new Error(data.error || 'Error del servidor');
        ventas = (await conCiudad(data.items || [])).filter(it => it.ciudad === ciudad);
        renderResumen();
        const nuevas = itemsFeed().filter(it => !mostradas.has(it.id)).length;
        if (inicial || !mostradas.size) return renderFeed();
        const pill = document.getElementById('fa-pill');
        pill.textContent = `↑ ${nuevas} ${nuevas === 1 ? 'novedad' : 'novedades'}`;
        pill.style.display = nuevas ? 'block' : 'none';
      } catch (err) {
        console.error('Error cargando feed de actividad:', err);
        if (inicial) document.getElementById('fa-list').innerHTML =
          `<div class="fa-error">${Icon('error', { size: 30 })}<span>No se pudo cargar la actividad reciente. Intenta de nuevo más tarde.</span></div>`;
      }
    }

    const BENEFICIARIOS_API = 'https://beneficiarios-api-1038143238323.us-central1.run.app';

    function renderRankingDonadores(ranking) {
      const wrap = document.getElementById('fa-reco-wrap');
      if (!ranking || !ranking.length) { wrap.innerHTML = ''; return; }
      const medallas = ['🥇', '🥈', '🥉'];
      wrap.innerHTML = `
        <div class="fa-reco-wrap">
          <p class="fa-reco-title">${Icon('heart-fill', { size: 14 })} Reconocimiento ZNR · Vendedores solidarios</p>
          <div class="fa-reco-scroll">
            ${ranking.map((r, i) => `
              <a class="fa-reco-card" href="perfil-vendedor.html?vendedor=${esc(r.vendor_uid)}">
                <div class="fa-reco-rank">${medallas[i] || '💜'}</div>
                <div class="fa-reco-name">${esc(r.nombre)}</div>
                <div class="fa-reco-count">${r.donaciones} donación${r.donaciones === 1 ? '' : 'es'}</div>
              </a>`).join('')}
          </div>
        </div>`;
    }

    async function cargarRankingDonadores() {
      try {
        const res  = await fetch(`${BENEFICIARIOS_API}?${new URLSearchParams({ action: 'obtenerRankingDonadores' })}`);
        const data = await res.json();
        if (data.ok) renderRankingDonadores(data.ranking);
      } catch (err) {
        console.warn('No se pudo cargar el ranking de donadores:', err);
      }
    }

    // ════════════════════════════════════════════════════════════
    //  Historias de vendedores (duran 24 h, las borra historias-api)
    // ════════════════════════════════════════════════════════════
    const HISTORIAS_API = 'https://historias-api-1038143238323.us-central1.run.app';
    const VISTAS_KEY = 'znr_historias_vistas';

    let gruposHistorias = [];
    let viendo = false; // con el visor abierto no se reacomodan los grupos

    function leerSet(key) { try { return new Set(JSON.parse(localStorage.getItem(key)) || []); } catch { return new Set(); } }

    function avatarHtml(g, cls) {
      const inicial = esc((g.nombre || '?').trim().charAt(0).toUpperCase());
      return g.logo
        ? `${inicial}<img src="${esc(g.logo)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`
        : inicial;
    }

    // Fondo de la tarjeta: la historia más reciente del vendedor (foto, o primer
    // cuadro si es video). Si no carga, queda el degradado de la marca.
    function previewHistoria(g) {
      const h = g.historias[g.historias.length - 1];
      if (!h) return '<span class="fa-story-media"></span>';
      return h.tipo === 'video'
        ? `<span class="fa-story-media"><video src="${esc(h.url)}#t=0.1" muted playsinline preload="${window.znrAhorroDatos?.() ? 'none' : 'metadata'}" tabindex="-1" onerror="this.remove()"></video></span><span class="fa-story-play">${Icon('play', { size: 10 })}</span>`
        : `<span class="fa-story-media"><img src="${esc(h.url)}" alt="" loading="lazy" onerror="this.remove()"></span>`;
    }

    function agruparHistorias(lista) {
      const mapa = new Map();
      lista.forEach(h => {
        if (!mapa.has(h.vendedorUid)) mapa.set(h.vendedorUid, { uid: h.vendedorUid, nombre: h.vendedor, logo: h.logo, plus: h.plus, historias: [] });
        mapa.get(h.vendedorUid).historias.push(h);
      });
      // La lista llega de la más nueva a la más vieja: los grupos quedan por actividad reciente
      // y dentro de cada vendedor las historias se ven en orden cronológico.
      return [...mapa.values()].map(g => (g.historias.reverse(), g));
    }

    function renderHistorias() {
      const wrap = document.getElementById('fa-stories-wrap');
      const ses = sesionVendedor();
      if (!gruposHistorias.length && !ses) { wrap.innerHTML = ''; return; }
      const vistas = leerSet(VISTAS_KEY);
      const inicialPropia = esc(((ses && ses.nombre) || '?').trim().charAt(0).toUpperCase());
      const tarjetaCrear = !ses ? '' : `
              <button type="button" class="fa-story-crear" id="btn-crear-historia">
                <span class="fa-story-crear-top">${inicialPropia}${ses.logo ? `<img src="${esc(ses.logo)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}</span>
                <span class="fa-story-crear-plus">${Icon('plus', { size: 18 })}</span>
                <span class="fa-story-crear-txt">Subir historia</span>
              </button>`;
      wrap.innerHTML = `
        <div class="fa-stories-wrap">
          <p class="fa-stories-title">${Icon('camera', { size: 14 })} Historias · duran 24 horas</p>
          <div class="fa-stories-scroll">
            ${tarjetaCrear}
            ${gruposHistorias.map((g, idx) => `
              <button type="button" class="fa-story-item${g.historias.every(h => vistas.has(h.id)) ? ' visto' : ''}" data-grupo="${idx}">
                ${previewHistoria(g)}
                <span class="fa-story-ring"><span class="fa-story-avatar">${avatarHtml(g)}</span></span>
                <span class="fa-story-name">${esc(g.nombre || 'Vendedor')}</span>
              </button>`).join('')}
          </div>
        </div>`;
    }

    async function cargarHistorias() {
      if (viendo) return;
      try {
        const ciudad = typeof obtenerCiudadComprador === 'function' ? await obtenerCiudadComprador() : null;
        const r = await (await fetch(`${HISTORIAS_API}?${new URLSearchParams({ action: 'obtenerHistorias' })}`)).json();
        if (!r.ok) throw new Error(r.error || 'Error');
        const ses = sesionVendedor();
        const lista = (r.historias || []).filter(h => !ciudad || !h.ciudad || h.ciudad === ciudad || (ses && h.vendedorUid === ses.uid));
        gruposHistorias = agruparHistorias(lista);
      } catch (e) {
        console.warn('No se pudieron cargar las historias:', e);
        gruposHistorias = [];
      }
      renderHistorias();
    }

    // ── Visor (historias-visor.js): un grupo por vendedor; al terminar uno sigue con el próximo ──
    function abrirVisor(g, alFinal) {
      const grupo = gruposHistorias[g];
      if (!grupo || !window.znrHistoriasVisor) return false;
      viendo = true;
      window.znrHistoriasVisor.abrir(grupo.historias, {
        indice: alFinal ? grupo.historias.length - 1 : 0, nombre: grupo.nombre, logo: grupo.logo,
        perfilUrl: 'perfil-vendedor.html?vendedor=' + encodeURIComponent(grupo.uid),
        pie: grupo.plus && window.znrLiveNotif ? znrLiveNotif.boton('vendedor', grupo.uid, 'Avisarme cuando transmita') : '',
        alTerminar: (dir) => abrirVisor(g + dir, dir < 0),
        onCerrar: () => { viendo = false; cargarHistorias(); }
      });
      return true;
    }

    // ── Subir mi historia: el mismo modal y editor del panel de vendedor (historias-vendedor.js) ──
    function sesionVendedor() {
      try {
        const raw = localStorage.getItem('vendor_session') || sessionStorage.getItem('vendor_session');
        const s = raw ? JSON.parse(raw) : null;
        return s && s.uid && s.token ? s : null;
      } catch { return null; }
    }

    document.addEventListener('click', (e) => {
      if (e.target.closest('#btn-crear-historia')) window.vendorSession = window.vendorSession || sesionVendedor(); // antes de que historias-vendedor.js abra su modal
    });
    window.addEventListener('znr-historias-cambio', () => cargarHistorias());

    document.addEventListener('click', (e) => {
      const b = e.target.closest('.fa-story-item');
      if (b) abrirVisor(Number(b.dataset.grupo));
    });

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('fa-back-btn').innerHTML = Icon('arrow-left');
      document.getElementById('fa-back-btn').addEventListener('click', () => {
        if (document.referrer && document.referrer.includes(location.host)) history.back();
        else window.location.href = 'vendedor.html';
      });

      document.getElementById('fa-vendiendo-title').insertAdjacentHTML('afterbegin', Icon('shopping-bag', { size: 14 }));
      document.getElementById('fa-pill').addEventListener('click', () => { renderFeed(); document.getElementById('fa-vendiendo-title').scrollIntoView({ behavior: 'smooth' }); });
      cargarHistorias();
      cargarRankingDonadores();
      // Todo es de la ciudad del comprador: primero se resuelve la ciudad y los lives (el resumen y la lista los usan).
      (async () => {
        ciudad = typeof obtenerCiudadComprador === 'function' ? await obtenerCiudadComprador() : null;
        await cargarLives();
        cargarFeed(true);
        cargarUltimas();
        // Se siente "vivo": refresca sola cada minuto. Con la pestaña oculta no se consulta; al volver se actualiza.
        const refrescar = () => { if (!document.hidden) { cargarLives().then(() => cargarFeed()); cargarHistorias(); } };
        setInterval(refrescar, 60000);
        document.addEventListener('visibilitychange', refrescar);
      })();
    });
  </script>
