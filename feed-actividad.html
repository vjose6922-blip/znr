<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="
 default-src 'self';
 script-src 'self' 'unsafe-inline' https://www.gstatic.com;
 style-src 'self' 'unsafe-inline';
 img-src 'self' data: blob: https://lh3.googleusercontent.com https://drive.google.com https://placehold.co https://via.placeholder.com;
 connect-src 'self' https://script.google.com https://script.googleusercontent.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://wttr.in https://www.gstatic.com https://firebaseinstallations.googleapis.com https://fcmregistrations.googleapis.com https://firebase.googleapis.com https://znr-live-default-rtdb.firebaseio.com https://nominatim.openstreetmap.org;
 font-src 'self';
 frame-src 'none';
 frame-ancestors 'none';
 object-src 'none';
 base-uri 'self';
 worker-src 'self' blob:;
 child-src 'self' blob:;
">
 <script src="error-bootstrap.js"></script>

  <title>Z&R · Actividad reciente</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
  <link rel="stylesheet" href="styles.css" />
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e2128">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32x32.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152x152.png">

  <style>
    body { margin: 0; background: #f7f7fb; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .fa-header {
      position: sticky; top: 0; z-index: 10; background: #fff;
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px; border-bottom: 1px solid #eee;
    }
    .fa-header h1 { font-size: 1.05rem; margin: 0; font-weight: 800; color: #1a1a2e; }
    .fa-back { background: #f0f0f5; border: none; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #444; }
    .fa-subtitle { padding: 12px 16px 4px; font-size: .78rem; color: #999; }
    .fa-list { padding: 6px 16px 40px; display: flex; flex-direction: column; gap: 10px; }
    .fa-card {
      display: flex; align-items: center; gap: 12px;
      background: #fff; border: 1px solid #eee; border-radius: 16px;
      padding: 10px; animation: fa-fade-in .3s ease;
    }
    .fa-card img { width: 52px; height: 52px; border-radius: 12px; object-fit: cover; background: #f0f0f5; flex-shrink: 0; }
    .fa-card-text { flex: 1; min-width: 0; }
    .fa-card-text p { margin: 0; font-size: .84rem; color: #333; line-height: 1.35; }
    .fa-card-text strong { color: #7c3aed; }
    .fa-card-time { font-size: .7rem; color: #aaa; margin-top: 2px; display: block; }
    .fa-empty, .fa-error { text-align: center; color: #999; padding: 50px 20px; font-size: .85rem; }
    .fa-skeleton { background: #fff; border: 1px solid #eee; border-radius: 16px; padding: 10px; display: flex; gap: 12px; align-items: center; }
    .fa-skeleton .sk-img, .fa-skeleton .sk-line { background: linear-gradient(90deg,#eee 25%,#f5f5f5 37%,#eee 63%); background-size: 400% 100%; animation: sk-shimmer 1.4s ease infinite; border-radius: 10px; }
    .fa-skeleton .sk-img { width: 52px; height: 52px; flex-shrink: 0; }
    .fa-skeleton .sk-line { height: 12px; width: 70%; }
    @keyframes sk-shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
    @keyframes fa-fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <div class="fa-header">
    <button class="fa-back" id="fa-back-btn" aria-label="Volver">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
    </button>
    <h1>🛍️ Actividad reciente</h1>
  </div>
  <p class="fa-subtitle">Ventas confirmadas en Comunidad, últimos 7 días</p>

  <div class="fa-list" id="fa-list">
    <div class="fa-skeleton"><div class="sk-img"></div><div class="sk-line"></div></div>
    <div class="fa-skeleton"><div class="sk-img"></div><div class="sk-line"></div></div>
    <div class="fa-skeleton"><div class="sk-img"></div><div class="sk-line"></div></div>
  </div>

  <script src="api-config.js" defer></script>
  <script>
    document.getElementById('fa-back-btn').addEventListener('click', () => {
      if (document.referrer && document.referrer.includes(location.host)) history.back();
      else window.location.href = 'vendedor.html';
    });

    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function tiempoRelativo(isoFecha) {
      const ahora = Date.now();
      const fecha = new Date(isoFecha).getTime();
      const diffMin = Math.max(0, Math.floor((ahora - fecha) / 60000));
      if (diffMin < 1) return 'justo ahora';
      if (diffMin < 60) return 'hace ' + diffMin + ' min';
      const diffH = Math.floor(diffMin / 60);
      if (diffH < 24) return 'hace ' + diffH + (diffH === 1 ? ' hora' : ' horas');
      const diffD = Math.floor(diffH / 24);
      return 'hace ' + diffD + (diffD === 1 ? ' día' : ' días');
    }

    function renderFeed(items) {
      const list = document.getElementById('fa-list');
      if (!items.length) {
        list.innerHTML = '<div class="fa-empty">Todavía no hay ventas recientes que mostrar.</div>';
        return;
      }
      list.innerHTML = items.map(it => `
        <div class="fa-card">
          <img src="${it.imagen ? esc(it.imagen) : 'https://placehold.co/100x100?text=%F0%9F%9B%8D%EF%B8%8F'}" alt="" loading="lazy" onerror="this.src='https://placehold.co/100x100?text=%F0%9F%9B%8D%EF%B8%8F'">
          <div class="fa-card-text">
            <p><strong>${esc(it.vendedor || 'Un vendedor')}</strong> vendió ${esc(it.producto || 'un producto')}</p>
            <span class="fa-card-time">${tiempoRelativo(it.fecha)}</span>
          </div>
        </div>
      `).join('');
    }

    async function cargarFeed() {
      try {
        if (!window.API_URL) throw new Error('API_URL no está disponible');
        const res = await fetch(window.API_URL + '?' + new URLSearchParams({ action: 'obtenerFeedActividad' }));
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || 'Error del servidor');
        renderFeed(data.items || []);
      } catch (err) {
        console.error('Error cargando feed de actividad:', err);
        document.getElementById('fa-list').innerHTML = '<div class="fa-error">No se pudo cargar la actividad reciente. Intenta de nuevo más tarde.</div>';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      cargarFeed();
      // Se siente "vivo": refresca sola cada minuto, sin que el usuario tenga que jalar/recargar.
      setInterval(cargarFeed, 60000);
    });
  </script>
</body>
</html>
