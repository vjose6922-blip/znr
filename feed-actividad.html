  <script>
    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function tiempoRelativo(isoFecha) {
      const ahora = Date.now();
      const fecha = new Date(isoFecha).getTime();
      const diffMin = Math.max(0, Math.floor((ahora - fecha) / 60000));
      if (diffMin < 1) return 'justo ahora';
      if (diffMin < 60) return 'hace ' + diffMin + ' min';
      const diffH = Math.floor(diffMin / 60);
      if (diffH < 24) return 'hace ' + diffH + (diffH === 1 ? ' hora' : ' horas');
      const diffD = Math.floor(diffH / 24);
      return 'hace ' + diffD + (diffD === 1 ? ' día' : ' días');
    }

    function duracion(ini, fin) {
      const m = Math.max(1, Math.round((new Date(fin) - new Date(ini)) / 60000));
      return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : '');
    }

    function renderFeed(items) {
      const list = document.getElementById('fa-list');
      if (!items.length) {
        list.innerHTML = `<div class="fa-empty">${Icon('box', { size: 34 })}<span>Todavía no hay actividad reciente que mostrar.</span></div>`;
        return;
      }
      const ahora = Date.now();
      list.innerHTML = items.map((it, i) => {
        const live = it.tipo === 'live';
        const fallback = Icon(live ? 'tv' : 'shopping-bag', { size: 26 });
        const imagenHtml = it.imagen
          ? `<img src="${esc(it.imagen)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=&quot;fa-card-thumb-fallback&quot;>${fallback.replace(/"/g, '&quot;')}</div>'">`
          : `<div class="fa-card-thumb-fallback">${fallback}</div>`;
        const badges = live
          ? `<span class="fa-badge-stock">${Icon('tv', { size: 11 })} Live · ${duracion(it.inicio, it.fecha)}</span>`
          : (Math.floor((ahora - new Date(it.fecha).getTime()) / 60000) < 10 ? `<span class="fa-badge-fresh">${Icon('fire', { size: 11 })}Recién vendido</span>` : '')
            + (it.stockRestante === 0 ? '<span class="fa-badge-stock fa-badge-stock-out">Se agotó</span>' : '')
            + (it.stockRestante > 0 && it.stockRestante <= 5 ? `<span class="fa-badge-stock">Solo quedan ${it.stockRestante}</span>` : '');
        return `
        <div class="fa-card" style="animation-delay:${Math.min(i, 8) * 0.05}s">
          ${imagenHtml}
          <div class="fa-card-text">
            ${it.vendedorUid
              ? `<a href="perfil-vendedor.html?vendedor=${esc(it.vendedorUid)}" class="fa-card-vendor">${esc(it.vendedor || 'Un vendedor')}</a>`
              : `<p class="fa-card-vendor" style="cursor:default;">${esc(it.vendedor || 'Un vendedor')}</p>`}
            <p class="fa-card-product">${live ? `terminó su live «${esc(it.producto)}»` : `vendió ${esc(it.producto || 'un producto')}`}</p>
            <div class="fa-card-footer">
              <span class="fa-card-time">${tiempoRelativo(it.fecha)}</span>${badges}
            </div>
          </div>
        </div>`;
      }).join('');
    }

    const LIVE_API = 'https://live-api-1038143238323.us-central1.run.app';

    // Lives terminados en las últimas 48 h: solo informativos, no se puede entrar a ellos.
    async function cargarLivesTerminados() {
      try {
        const r = await (await fetch(`${LIVE_API}?${new URLSearchParams({ action: 'obtenerLivesPublicos' })}`)).json();
        const ciudad = typeof obtenerCiudadComprador === 'function' ? await obtenerCiudadComprador() : null;
        return (r.terminados || []).filter(l => !ciudad || l.ciudad === ciudad).map(l => ({
          tipo: 'live', vendedor: l.vendedor_nombre, vendedorUid: l.vendedor_id, producto: l.titulo,
          imagen: l.miniatura_url, inicio: l.fecha_inicio, fecha: l.fecha_fin
        }));
      } catch (e) { return []; }
    }

    const BENEFICIARIOS_API = 'https://beneficiarios-api-1038143238323.us-central1.run.app';

    function renderRankingDonadores(ranking) {
      const wrap = document.getElementById('fa-reco-wrap');
      if (!ranking || !ranking.length) { wrap.innerHTML = ''; return; }
      const medallas = ['🥇', '🥈', '🥉'];
      wrap.innerHTML = `
        <div class="fa-reco-wrap">
          <p class="fa-reco-title">${Icon('heart-fill', { size: 14 })} Reconocimiento ZNR · Vendedores solidarios</p>
          <div class="fa-reco-scroll">
            ${ranking.map((r, i) => `
              <a class="fa-reco-card" href="perfil-vendedor.html?vendedor=${esc(r.vendor_uid)}">
                <div class="fa-reco-rank">${medallas[i] || '💜'}</div>
                <div class="fa-reco-name">${esc(r.nombre)}</div>
                <div class="fa-reco-count">${r.donaciones} donación${r.donaciones === 1 ? '' : 'es'}</div>
              </a>`).join('')}
          </div>
        </div>`;
    }

    async function cargarRankingDonadores() {
      try {
        const res  = await fetch(`${BENEFICIARIOS_API}?${new URLSearchParams({ action: 'obtenerRankingDonadores' })}`);
        const data = await res.json();
        if (data.ok) renderRankingDonadores(data.ranking);
      } catch (err) {
        console.warn('No se pudo cargar el ranking de donadores:', err);
      }
    }

    async function cargarFeed() {
      try {
        const [data, lives] = await Promise.all([
          window.znrFirestore ? window.znrFirestore.getFeedActividad() : { ok: false },
          cargarLivesTerminados()
        ]);
        if (!data.ok) throw new Error(data.error || 'Error del servidor');
        renderFeed([...(data.items || []), ...lives].sort((a, b) => new Date(b.fecha) - new Date(a.fecha)));
      } catch (err) {
        console.error('Error cargando feed de actividad:', err);
        document.getElementById('fa-list').innerHTML =
          `<div class="fa-error">${Icon('error', { size: 30 })}<span>No se pudo cargar la actividad reciente. Intenta de nuevo más tarde.</span></div>`;
      }
    }


    // ════════════════════════════════════════════════════════════
    //  Historias de vendedores (duran 24 h, las borra historias-api)
    // ════════════════════════════════════════════════════════════
    const HISTORIAS_API = 'https://historias-api-1038143238323.us-central1.run.app';
    const VISTAS_KEY = 'znr_historias_vistas';
    const REPORTADAS_KEY = 'znr_historias_reportadas';
    const SEGUNDOS_IMAGEN = 5;
    const MOTIVOS_REPORTE = ['Contenido inapropiado', 'Violencia o desnudez', 'Spam o publicidad engañosa', 'Posible estafa', 'Otro motivo'];

    let gruposHistorias = [];
    const sv = { abierto: false, g: 0, i: 0, raf: 0, last: 0, elapsed: 0, dur: SEGUNDOS_IMAGEN * 1000, video: null, pausado: false };

    function leerSet(key) { try { return new Set(JSON.parse(localStorage.getItem(key)) || []); } catch { return new Set(); } }
    function guardarSet(key, set) { try { localStorage.setItem(key, JSON.stringify([...set].slice(-300))); } catch {} }

    function avatarHtml(g, cls) {
      const inicial = esc((g.nombre || '?').trim().charAt(0).toUpperCase());
      return g.logo
        ? `${inicial}<img src="${esc(g.logo)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`
        : inicial;
    }

    // Fondo de la tarjeta: la historia más reciente del vendedor (foto, o primer
    // cuadro si es video). Si no carga, queda el degradado de la marca.
    function previewHistoria(g) {
      const h = g.historias[g.historias.length - 1];
      if (!h) return '<span class="fa-story-media"></span>';
      return h.tipo === 'video'
        ? `<span class="fa-story-media"><video src="${esc(h.url)}#t=0.1" muted playsinline preload="metadata" tabindex="-1" onerror="this.remove()"></video></span><span class="fa-story-play">${Icon('play', { size: 10 })}</span>`
        : `<span class="fa-story-media"><img src="${esc(h.url)}" alt="" loading="lazy" onerror="this.remove()"></span>`;
    }

    function agruparHistorias(lista) {
      const mapa = new Map();
      lista.forEach(h => {
        if (!mapa.has(h.vendedorUid)) mapa.set(h.vendedorUid, { uid: h.vendedorUid, nombre: h.vendedor, logo: h.logo, plus: h.plus, historias: [] });
        mapa.get(h.vendedorUid).historias.push(h);
      });
      // La lista llega de la más nueva a la más vieja: los grupos quedan por actividad reciente
      // y dentro de cada vendedor las historias se ven en orden cronológico.
      return [...mapa.values()].map(g => (g.historias.reverse(), g));
    }

    function renderHistorias() {
      const wrap = document.getElementById('fa-stories-wrap');
      const ses = sesionVendedor();
      if (!gruposHistorias.length && !ses) { wrap.innerHTML = ''; return; }
      const vistas = leerSet(VISTAS_KEY);
      const inicialPropia = esc(((ses && ses.nombre) || '?').trim().charAt(0).toUpperCase());
      const tarjetaCrear = !ses ? '' : `
              <button type="button" class="fa-story-crear" id="fa-story-crear"${subiendoHistoria ? ' disabled' : ''}>
                <span class="fa-story-crear-top">${inicialPropia}${ses.logo ? `<img src="${esc(ses.logo)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}</span>
                <span class="fa-story-crear-plus">${Icon('plus', { size: 18 })}</span>
                <span class="fa-story-crear-txt">${subiendoHistoria ? 'Subiendo…' : 'Subir historia'}</span>
              </button>`;
      wrap.innerHTML = `
        <div class="fa-stories-wrap">
          <p class="fa-stories-title">${Icon('camera', { size: 14 })} Historias · duran 24 horas</p>
          <div class="fa-stories-scroll">
            ${tarjetaCrear}
            ${gruposHistorias.map((g, idx) => `
              <button type="button" class="fa-story-item${g.historias.every(h => vistas.has(h.id)) ? ' visto' : ''}" data-grupo="${idx}">
                ${previewHistoria(g)}
                <span class="fa-story-ring"><span class="fa-story-avatar">${avatarHtml(g)}</span></span>
                <span class="fa-story-name">${esc(g.nombre || 'Vendedor')}</span>
              </button>`).join('')}
          </div>
        </div>`;
    }

    async function cargarHistorias() {
      if (sv.abierto) return; // no movemos los grupos mientras alguien las está viendo
      try {
        const ciudad = typeof obtenerCiudadComprador === 'function' ? await obtenerCiudadComprador() : null;
        const r = await (await fetch(`${HISTORIAS_API}?${new URLSearchParams({ action: 'obtenerHistorias' })}`)).json();
        if (!r.ok) throw new Error(r.error || 'Error');
        const ses = sesionVendedor();
        const lista = (r.historias || []).filter(h => !ciudad || !h.ciudad || h.ciudad === ciudad || (ses && h.vendedorUid === ses.uid));
        gruposHistorias = agruparHistorias(lista);
      } catch (e) {
        console.warn('No se pudieron cargar las historias:', e);
        gruposHistorias = [];
      }
      renderHistorias();
    }

    // ── Visor ────────────────────────────────────────────────────
    function crearVisor() {
      if (document.getElementById('fa-sv')) return;
      const el = document.createElement('div');
      el.className = 'fa-sv'; el.id = 'fa-sv'; el.hidden = true;
      el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
      el.innerHTML = `
        <div class="fa-sv-box">
          <div class="fa-sv-bars" id="fa-sv-bars"></div>
          <div class="fa-sv-media" id="fa-sv-media"></div>
          <button type="button" class="fa-sv-nav prev" id="fa-sv-prev" aria-label="Anterior"></button>
          <button type="button" class="fa-sv-nav next" id="fa-sv-next" aria-label="Siguiente"></button>
          <div class="fa-sv-head">
            <a class="fa-sv-user" id="fa-sv-user" href="#"><span class="fa-sv-av" id="fa-sv-av"></span><span style="min-width:0"><b id="fa-sv-name"></b><small id="fa-sv-time"></small></span></a>
            <button type="button" class="fa-sv-btn" id="fa-sv-report" aria-label="Reportar historia">${Icon('flag', { size: 18 })}</button>
            <button type="button" class="fa-sv-btn" id="fa-sv-close" aria-label="Cerrar">${Icon('x', { size: 18 })}</button>
          </div>
          <div class="fa-sv-foot" id="fa-sv-foot"></div>
          <div class="fa-sv-sheet" id="fa-sv-sheet" hidden></div>
        </div>`;
      document.body.appendChild(el);
      document.getElementById('fa-sv-next').addEventListener('click', siguienteHistoria);
      document.getElementById('fa-sv-prev').addEventListener('click', anteriorHistoria);
      document.getElementById('fa-sv-close').addEventListener('click', cerrarVisor);
      document.getElementById('fa-sv-report').addEventListener('click', abrirReporte);
      el.addEventListener('click', (e) => { if (e.target === el) cerrarVisor(); });
      document.addEventListener('keydown', (e) => {
        if (!sv.abierto) return;
        if (e.key === 'Escape') cerrarVisor();
        else if (e.key === 'ArrowRight') siguienteHistoria();
        else if (e.key === 'ArrowLeft') anteriorHistoria();
      });
      document.addEventListener('visibilitychange', () => { document.hidden ? pausarHistoria() : reanudarHistoria(); });
    }

    function abrirVisor(idxGrupo) {
      if (!gruposHistorias[idxGrupo]) return;
      crearVisor();
      sv.abierto = true; sv.g = idxGrupo; sv.i = 0;
      document.getElementById('fa-sv').hidden = false;
      document.body.style.overflow = 'hidden';
      pintarPie();
      mostrarHistoria();
    }

    function cerrarVisor() {
      detenerReloj();
      sv.abierto = false;
      const el = document.getElementById('fa-sv');
      if (el) el.hidden = true;
      document.getElementById('fa-sv-media').innerHTML = '';
      document.getElementById('fa-sv-sheet').hidden = true;
      document.body.style.overflow = '';
      renderHistorias(); // refresca los anillos (vistas) y recoge historias nuevas
      cargarHistorias();
    }

    function detenerReloj() {
      cancelAnimationFrame(sv.raf);
      if (sv.video) { sv.video.pause(); sv.video = null; }
    }

    function pintarPie() {
      const g = gruposHistorias[sv.g];
      const foot = document.getElementById('fa-sv-foot');
      // Mismo botón de aviso de live que en perfil-vendedor.html (solo vendedores Plus transmiten)
      foot.innerHTML = g.plus && window.znrLiveNotif ? znrLiveNotif.boton('vendedor', g.uid, 'Avisarme cuando transmita') : '';
      foot.style.display = foot.innerHTML ? 'flex' : 'none';
      const user = document.getElementById('fa-sv-user');
      user.href = 'perfil-vendedor.html?vendedor=' + encodeURIComponent(g.uid);
      document.getElementById('fa-sv-av').innerHTML = avatarHtml(g);
      document.getElementById('fa-sv-name').textContent = g.nombre || 'Vendedor';
    }

    function mostrarHistoria() {
      detenerReloj();
      const g = gruposHistorias[sv.g];
      const h = g.historias[sv.i];
      document.getElementById('fa-sv-sheet').hidden = true;

      const vistas = leerSet(VISTAS_KEY); vistas.add(h.id); guardarSet(VISTAS_KEY, vistas);

      document.getElementById('fa-sv-bars').innerHTML = g.historias.map((_, n) =>
        `<span class="fa-sv-bar"><i style="width:${n < sv.i ? 100 : 0}%"></i></span>`).join('');
      document.getElementById('fa-sv-time').textContent = tiempoRelativo(h.fecha);

      const media = document.getElementById('fa-sv-media');
      sv.elapsed = 0; sv.pausado = false; sv.last = 0; sv.dur = SEGUNDOS_IMAGEN * 1000;
      if (h.tipo === 'video') {
        media.innerHTML = '<video playsinline autoplay preload="auto"></video>';
        const v = media.firstChild;
        sv.video = v;
        v.src = h.url;
        v.addEventListener('ended', siguienteHistoria);
        v.play().catch(() => { v.muted = true; v.play().catch(() => {}); });
      } else {
        media.innerHTML = `<img src="${esc(h.url)}" alt="">`;
      }
      sv.raf = requestAnimationFrame(tick);
    }

    function tick(ts) {
      if (!sv.abierto) return;
      if (!sv.last) sv.last = ts;
      let p;
      if (sv.video) {
        p = sv.video.duration ? sv.video.currentTime / sv.video.duration : 0;
      } else {
        if (!sv.pausado) sv.elapsed += ts - sv.last;
        p = Math.min(1, sv.elapsed / sv.dur);
      }
      sv.last = ts;
      const bar = document.querySelectorAll('#fa-sv-bars .fa-sv-bar > i')[sv.i];
      if (bar) bar.style.width = (p * 100) + '%';
      if (!sv.video && p >= 1) return siguienteHistoria();
      sv.raf = requestAnimationFrame(tick);
    }

    function pausarHistoria() { sv.pausado = true; if (sv.video) sv.video.pause(); }
    function reanudarHistoria() {
      if (!sv.abierto) return;
      if (document.getElementById('fa-sv-sheet').hidden === false) return; // el reporte sigue abierto
      sv.pausado = false; if (sv.video) sv.video.play().catch(() => {});
    }

    function siguienteHistoria() {
      const g = gruposHistorias[sv.g];
      if (sv.i < g.historias.length - 1) { sv.i++; return mostrarHistoria(); }
      if (sv.g < gruposHistorias.length - 1) { sv.g++; sv.i = 0; pintarPie(); return mostrarHistoria(); }
      cerrarVisor();
    }

    function anteriorHistoria() {
      if (sv.i > 0) { sv.i--; return mostrarHistoria(); }
      if (sv.g > 0) { sv.g--; sv.i = 0; pintarPie(); return mostrarHistoria(); }
      mostrarHistoria();
    }

    // ── Reportar ─────────────────────────────────────────────────
    function abrirReporte() {
      const h = gruposHistorias[sv.g].historias[sv.i];
      const sheet = document.getElementById('fa-sv-sheet');
      pausarHistoria();
      sheet.hidden = false;
      if (leerSet(REPORTADAS_KEY).has(h.id)) {
        sheet.innerHTML = `<p class="fa-sv-aviso">Ya reportaste esta historia. Gracias.</p><button type="button" class="cancelar" id="fa-sv-cancel">Cerrar</button>`;
      } else {
        sheet.innerHTML = `
          <h3>Reportar historia</h3>
          <p>¿Qué pasa con esta historia? Revisamos cada reporte.</p>
          ${MOTIVOS_REPORTE.map(m => `<button type="button" class="motivo" data-motivo="${esc(m)}">${esc(m)}</button>`).join('')}
          <button type="button" class="cancelar" id="fa-sv-cancel">Cancelar</button>`;
      }
      sheet.querySelector('#fa-sv-cancel').addEventListener('click', () => { sheet.hidden = true; reanudarHistoria(); });
      sheet.querySelectorAll('.motivo').forEach(b => b.addEventListener('click', () => enviarReporte(h, b.dataset.motivo)));
    }

    async function enviarReporte(h, motivo) {
      const sheet = document.getElementById('fa-sv-sheet');
      sheet.querySelectorAll('button').forEach(b => b.disabled = true);
      try {
        const r = await (await fetch(HISTORIAS_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'reportarHistoria', historiaId: h.id, motivo })
        })).json();
        if (!r.ok) throw new Error(r.error || 'No se pudo enviar el reporte.');
        const rep = leerSet(REPORTADAS_KEY); rep.add(h.id); guardarSet(REPORTADAS_KEY, rep);
        sheet.innerHTML = `<p class="fa-sv-aviso">Gracias, revisaremos esta historia.</p>`;
        setTimeout(() => { sheet.hidden = true; reanudarHistoria(); }, 1400);
      } catch (e) {
        sheet.innerHTML = `<p class="fa-sv-aviso" style="color:var(--color-error,#dc2626)">${esc(e.message)}</p><button type="button" class="cancelar" id="fa-sv-cancel">Cerrar</button>`;
        sheet.querySelector('#fa-sv-cancel').addEventListener('click', () => { sheet.hidden = true; reanudarHistoria(); });
      }
    }


    // ── Subir mi historia (solo vendedores con sesión iniciada) ──
    const MAX_VIDEO_SEG = 5;                  // "~4 segundos" + margen
    const MAX_VIDEO_BYTES = 6 * 1024 * 1024;  // mismo tope que historias-api
    const IMG_LADO_MAX = 1080;
    let subiendoHistoria = false;
    let toastTimer = 0;

    function sesionVendedor() {
      try {
        const raw = localStorage.getItem('vendor_session') || sessionStorage.getItem('vendor_session');
        const s = raw ? JSON.parse(raw) : null;
        return s && s.uid && s.token ? s : null;
      } catch { return null; }
    }

    function aviso(texto, tipo, ms) {
      let t = document.getElementById('fa-toast');
      if (!t) { t = document.createElement('div'); t.id = 'fa-toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
      clearTimeout(toastTimer);
      t.className = tipo || '';
      t.textContent = texto;
      t.hidden = false;
      if (ms !== 0) toastTimer = setTimeout(() => { t.hidden = true; }, ms || 4500);
    }

    function aBase64(blob) {
      return new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onload = () => resolve(String(fr.result).split(',')[1]);
        fr.onerror = reject;
        fr.readAsDataURL(blob);
      });
    }

    function comprimirImagen(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          URL.revokeObjectURL(url);
          let { width: w, height: h } = img;
          const k = Math.min(1, IMG_LADO_MAX / Math.max(w, h));
          w = Math.round(w * k); h = Math.round(h * k);
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          const mime = c.toDataURL('image/webp').startsWith('data:image/webp') ? 'image/webp' : 'image/jpeg';
          c.toBlob(b => b ? resolve(b) : reject(new Error('No se pudo procesar la imagen.')), mime, 0.85);
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('No se pudo leer la imagen.')); };
        img.src = url;
      });
    }

    function duracionVideo(file) {
      return new Promise((resolve, reject) => {
        const v = document.createElement('video');
        const url = URL.createObjectURL(file);
        v.preload = 'metadata';
        v.onloadedmetadata = () => { URL.revokeObjectURL(url); resolve(v.duration); };
        v.onerror = () => { URL.revokeObjectURL(url); reject(new Error('No se pudo leer el video.')); };
        v.src = url;
      });
    }

    function selectorArchivoHistoria() {
      let inp = document.getElementById('fa-historia-file');
      if (inp) return inp;
      inp = document.createElement('input');
      inp.type = 'file'; inp.id = 'fa-historia-file';
      inp.accept = 'image/*,video/mp4,video/quicktime,video/webm';
      inp.style.display = 'none';
      inp.addEventListener('change', () => { const f = inp.files && inp.files[0]; inp.value = ''; if (f) subirMiHistoria(f); });
      document.body.appendChild(inp);
      return inp;
    }

    async function subirMiHistoria(file) {
      const ses = sesionVendedor();
      if (!ses || subiendoHistoria) return;
      const esVideo = file.type.startsWith('video/');
      if (!esVideo && !file.type.startsWith('image/')) { aviso('Elige una foto o un video corto.', 'error'); return; }

      subiendoHistoria = true; renderHistorias();
      try {
        let blob = file;
        if (esVideo) {
          const seg = await duracionVideo(file);
          if (!isFinite(seg) || seg > MAX_VIDEO_SEG) throw new Error(`El video debe durar unos 4 segundos (máx. ${MAX_VIDEO_SEG} s).`);
          if (file.size > MAX_VIDEO_BYTES) throw new Error('El video pesa más de 6 MB. Graba uno de ~4 segundos en calidad 720p.');
        } else {
          aviso('Procesando imagen…', '', 0);
          blob = await comprimirImagen(file);
        }
        aviso('Subiendo tu historia…', '', 0);
        const idToken = window.znrFirestore && window.znrFirestore.getIdToken
          ? await window.znrFirestore.getIdToken('vendedor', ses.uid, ses.token) : null;
        if (!idToken) throw new Error('No se pudo verificar tu sesión. Entra a tu panel de vendedor e inicia sesión de nuevo.');
        const r = await (await fetch(HISTORIAS_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'subirHistoria', idToken, data: await aBase64(blob) })
        })).json();
        if (!r.ok) throw new Error(r.error || 'No se pudo publicar la historia.');
        aviso('Historia publicada. Se verá 24 horas.', 'ok');
      } catch (e) {
        aviso(e.message || 'No se pudo publicar la historia.', 'error', 6000);
      } finally {
        subiendoHistoria = false;
        await cargarHistorias();
      }
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('#fa-story-crear') || subiendoHistoria) return;
      selectorArchivoHistoria().click(); // directo, dentro del toque (Safari bloquea el selector si hay un await antes)
    });

    document.addEventListener('click', (e) => {
      const b = e.target.closest('.fa-story-item');
      if (b) abrirVisor(Number(b.dataset.grupo));
    });

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('fa-back-btn').innerHTML = Icon('arrow-left');
      document.getElementById('fa-back-btn').addEventListener('click', () => {
        if (document.referrer && document.referrer.includes(location.host)) history.back();
        else window.location.href = 'vendedor.html';
      });

      cargarHistorias();
      cargarFeed();
      cargarRankingDonadores();
      // Se siente "vivo": refresca sola cada minuto, sin que el usuario tenga que jalar/recargar.
      setInterval(cargarFeed, 60000);
      setInterval(cargarHistorias, 60000);
    });
  </script>
