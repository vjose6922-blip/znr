  <style>
    body { margin: 0; background: var(--page-bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; padding-bottom: 70px; }

    .fa-subtitle-bar { padding: 14px 16px 6px; font-size: .78rem; color: var(--color-text-soft); font-weight: 600; }
    .fa-list { padding: 6px 16px 40px; display: flex; flex-direction: column; gap: 12px; }

    .fa-card {
      position: relative; overflow: hidden;
      display: flex; align-items: center; gap: 14px;
      background: var(--color-surface); border-radius: var(--radius-lg);
      padding: 12px 14px 12px 16px;
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--color-border-subtle);
      animation: fa-fade-in .35s ease backwards;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .fa-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.08); }
    .fa-card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
      background: var(--gradient-accent);
    }
    .fa-card img { width: 64px; height: 64px; border-radius: var(--radius-md); object-fit: cover; background: var(--color-bg); flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
    .fa-card-thumb-fallback {
      width: 64px; height: 64px; border-radius: var(--radius-md); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--color-bg); color: var(--color-text-soft);
    }
    .fa-card-text { flex: 1; min-width: 0; }
    .fa-card-vendor {
      font-size: .92rem; font-weight: 800; color: var(--color-text-primary); margin: 0 0 2px;
      display: inline-flex; align-items: center; gap: 4px; cursor: pointer; width: fit-content;
      text-decoration: none; transition: opacity .15s ease;
    }
    .fa-card-vendor:hover { opacity: .8; }
    .fa-card-vendor svg { opacity: .55; flex-shrink: 0; }
    .fa-card-product { font-size: .82rem; color: var(--color-text-muted); margin: 0; line-height: 1.3; }
    .fa-card-footer { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
    .fa-card-time { font-size: .7rem; color: var(--color-text-soft); }

    .fa-badge-fresh {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: .65rem; font-weight: 800; color: #fff;
      background: var(--gradient-accent);
      padding: 3px 9px 3px 7px; border-radius: var(--radius-pill);
      animation: fa-pulse 1.8s ease infinite;
    }
    .fa-badge-stock {
      display: inline-flex; align-items: center;
      font-size: .65rem; font-weight: 800; color: var(--color-warning);
      background: var(--color-warning-bg); padding: 3px 9px; border-radius: var(--radius-pill);
    }
    .fa-badge-stock-out { color: var(--color-error); background: var(--color-error-bg); }

    .fa-reco-wrap { padding: 14px 16px 2px; }
    .fa-reco-title { font-size: .78rem; font-weight: 700; color: var(--color-text-soft); margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
    .fa-reco-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
    .fa-reco-card {
      flex-shrink: 0; width: 132px; text-decoration: none; text-align: center;
      background: linear-gradient(160deg, #fdf2f8, #f5f3ff); border: 1px solid #f0d9ec;
      border-radius: var(--radius-lg); padding: 14px 10px 12px; transition: transform .15s ease;
    }
    .fa-reco-card:hover { transform: translateY(-2px); }
    .fa-reco-rank { font-size: 1.15rem; margin-bottom: 4px; }
    .fa-reco-name { font-size: .78rem; font-weight: 800; color: #1f1235; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fa-reco-count { font-size: .68rem; color: #9d174d; font-weight: 700; margin-top: 2px; }

    .fa-empty, .fa-error {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      text-align: center; color: var(--color-text-soft); padding: 60px 24px; font-size: .85rem;
    }
    .fa-empty svg, .fa-error svg { color: var(--color-text-soft); opacity: .6; }
    .fa-error { color: var(--color-error); }
    .fa-error svg { color: var(--color-error); }

    .fa-skeleton {
      position: relative; overflow: hidden; background: var(--color-surface);
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-lg); padding: 12px 14px; display: flex; gap: 14px; align-items: center;
    }
    .fa-skeleton .sk-img, .fa-skeleton .sk-line {
      background: linear-gradient(90deg, var(--color-bg) 25%, var(--color-border-subtle) 37%, var(--color-bg) 63%);
      background-size: 400% 100%; animation: sk-shimmer 1.4s ease infinite; border-radius: var(--radius-md);
    }
    .fa-skeleton .sk-img { width: 64px; height: 64px; flex-shrink: 0; }
    .fa-skeleton .sk-line { height: 12px; width: 70%; }

    @keyframes sk-shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
    @keyframes fa-fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fa-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .6; } }

    /* ── Historias (24 h) ── */
    .fa-stories-wrap { padding: 14px 16px 2px; }
    .fa-stories-title { font-size: .78rem; font-weight: 700; color: var(--color-text-soft); margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
    .fa-stories-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
    .fa-stories-scroll::-webkit-scrollbar { display: none; }
    .fa-story-item, .fa-story-crear { position: relative; flex-shrink: 0; width: 108px; height: 184px; padding: 0; border: none; border-radius: 14px; overflow: hidden; cursor: pointer; background: var(--color-surface); box-shadow: 0 2px 10px rgba(0,0,0,.14); font-family: inherit; text-align: left; -webkit-tap-highlight-color: transparent; }
    .fa-story-item::after { content: ''; position: absolute; inset: 0; z-index: 1; pointer-events: none; background: linear-gradient(rgba(0,0,0,.28) 0%, transparent 32%, transparent 55%, rgba(0,0,0,.72) 100%); }
    .fa-story-media { position: absolute; inset: 0; background: var(--gradient-accent); }
    .fa-story-media img, .fa-story-media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .fa-story-ring { position: absolute; top: 8px; left: 8px; z-index: 2; width: 38px; height: 38px; padding: 2.5px; border-radius: 50%; box-sizing: border-box; background: var(--gradient-accent); }
    .fa-story-item.visto .fa-story-ring { background: rgba(255,255,255,.75); }
    .fa-story-avatar { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; border-radius: 50%; overflow: hidden; border: 2px solid #fff; background: #fff; color: var(--color-accent-solid); font-weight: 800; font-size: .9rem; box-sizing: border-box; }
    .fa-story-avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .fa-story-play { position: absolute; top: 12px; right: 8px; z-index: 2; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,.5); color: #fff; display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .fa-story-name { position: absolute; left: 9px; right: 9px; bottom: 9px; z-index: 2; color: #fff; font-size: .76rem; font-weight: 800; line-height: 1.2; text-shadow: 0 1px 4px rgba(0,0,0,.6); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

    /* Tarjeta "Subir historia" (solo vendedores con sesión) */
    .fa-story-crear { background: var(--color-surface); }
    .fa-story-crear:disabled { opacity: .7; cursor: default; }
    .fa-story-crear-top { position: absolute; left: 0; right: 0; top: 0; height: 66%; display: flex; align-items: center; justify-content: center; background: var(--gradient-accent); color: #fff; font-weight: 800; font-size: 2rem; overflow: hidden; }
    .fa-story-crear-top img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
    .fa-story-crear-plus { position: absolute; left: 50%; top: 66%; transform: translate(-50%, -50%); z-index: 2; width: 34px; height: 34px; border-radius: 50%; background: var(--gradient-accent); color: #fff; border: 3px solid var(--color-surface); display: flex; align-items: center; justify-content: center; }
    .fa-story-crear-txt { position: absolute; left: 6px; right: 6px; bottom: 9px; z-index: 2; text-align: center; color: var(--color-text-primary); font-size: .72rem; font-weight: 800; line-height: 1.15; }


  </style>

  <script>
    function esc(s) {
      return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function tiempoRelativo(isoFecha) {
      const ahora = Date.now();
      const fecha = new Date(isoFecha).getTime();
      const diffMin = Math.max(0, Math.floor((ahora - fecha) / 60000));
      if (diffMin < 1) return 'justo ahora';
      if (diffMin < 60) return 'hace ' + diffMin + ' min';
      const diffH = Math.floor(diffMin / 60);
      if (diffH < 24) return 'hace ' + diffH + (diffH === 1 ? ' hora' : ' horas');
      const diffD = Math.floor(diffH / 24);
      return 'hace ' + diffD + (diffD === 1 ? ' día' : ' días');
    }

    function duracion(ini, fin) {
      const m = Math.max(1, Math.round((new Date(fin) - new Date(ini)) / 60000));
      return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : '');
    }

    function renderFeed(items) {
      const list = document.getElementById('fa-list');
      if (!items.length) {
        list.innerHTML = `<div class="fa-empty">${Icon('box', { size: 34 })}<span>Todavía no hay actividad reciente que mostrar.</span></div>`;
        return;
      }
      const ahora = Date.now();
      list.innerHTML = items.map((it, i) => {
        const live = it.tipo === 'live';
        const fallback = Icon(live ? 'tv' : 'shopping-bag', { size: 26 });
        const imagenHtml = it.imagen
          ? `<img src="${esc(it.imagen)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=&quot;fa-card-thumb-fallback&quot;>${fallback.replace(/"/g, '&quot;')}</div>'">`
          : `<div class="fa-card-thumb-fallback">${fallback}</div>`;
        const badges = live
          ? `<span class="fa-badge-stock">${Icon('tv', { size: 11 })} Live · ${duracion(it.inicio, it.fecha)}</span>`
          : (Math.floor((ahora - new Date(it.fecha).getTime()) / 60000) < 10 ? `<span class="fa-badge-fresh">${Icon('fire', { size: 11 })}Recién vendido</span>` : '')
            + (it.stockRestante === 0 ? '<span class="fa-badge-stock fa-badge-stock-out">Se agotó</span>' : '')
            + (it.stockRestante > 0 && it.stockRestante <= 5 ? `<span class="fa-badge-stock">Solo quedan ${it.stockRestante}</span>` : '');
        return `
        <div class="fa-card" style="animation-delay:${Math.min(i, 8) * 0.05}s">
          ${imagenHtml}
          <div class="fa-card-text">
            ${it.vendedorUid
              ? `<a href="perfil-vendedor.html?vendedor=${esc(it.vendedorUid)}" class="fa-card-vendor">${esc(it.vendedor || 'Un vendedor')}</a>`
              : `<p class="fa-card-vendor" style="cursor:default;">${esc(it.vendedor || 'Un vendedor')}</p>`}
            <p class="fa-card-product">${live ? `terminó su live «${esc(it.producto)}»` : `vendió ${esc(it.producto || 'un producto')}`}</p>
            <div class="fa-card-footer">
              <span class="fa-card-time">${tiempoRelativo(it.fecha)}</span>${badges}
            </div>
          </div>
        </div>`;
      }).join('');
    }

    const LIVE_API = 'https://live-api-1038143238323.us-central1.run.app';

    // Lives terminados en las últimas 48 h: solo informativos, no se puede entrar a ellos.
    async function cargarLivesTerminados() {
      try {
        const r = await (await fetch(`${LIVE_API}?${new URLSearchParams({ action: 'obtenerLivesPublicos' })}`)).json();
        const ciudad = typeof obtenerCiudadComprador === 'function' ? await obtenerCiudadComprador() : null;
        return (r.terminados || []).filter(l => !ciudad || l.ciudad === ciudad).map(l => ({
          tipo: 'live', vendedor: l.vendedor_nombre, vendedorUid: l.vendedor_id, producto: l.titulo,
          imagen: l.miniatura_url, inicio: l.fecha_inicio, fecha: l.fecha_fin
        }));
      } catch (e) { return []; }
    }

    const BENEFICIARIOS_API = 'https://beneficiarios-api-1038143238323.us-central1.run.app';

    function renderRankingDonadores(ranking) {
      const wrap = document.getElementById('fa-reco-wrap');
      if (!ranking || !ranking.length) { wrap.innerHTML = ''; return; }
      const medallas = ['🥇', '🥈', '🥉'];
      wrap.innerHTML = `
        <div class="fa-reco-wrap">
          <p class="fa-reco-title">${Icon('heart-fill', { size: 14 })} Reconocimiento ZNR · Vendedores solidarios</p>
          <div class="fa-reco-scroll">
            ${ranking.map((r, i) => `
              <a class="fa-reco-card" href="perfil-vendedor.html?vendedor=${esc(r.vendor_uid)}">
                <div class="fa-reco-rank">${medallas[i] || '💜'}</div>
                <div class="fa-reco-name">${esc(r.nombre)}</div>
                <div class="fa-reco-count">${r.donaciones} donación${r.donaciones === 1 ? '' : 'es'}</div>
              </a>`).join('')}
          </div>
        </div>`;
    }

    async function cargarRankingDonadores() {
      try {
        const res  = await fetch(`${BENEFICIARIOS_API}?${new URLSearchParams({ action: 'obtenerRankingDonadores' })}`);
        const data = await res.json();
        if (data.ok) renderRankingDonadores(data.ranking);
      } catch (err) {
        console.warn('No se pudo cargar el ranking de donadores:', err);
      }
    }

    async function cargarFeed() {
      try {
        const [data, lives] = await Promise.all([
          window.znrFirestore ? window.znrFirestore.getFeedActividad() : { ok: false },
          cargarLivesTerminados()
        ]);
        if (!data.ok) throw new Error(data.error || 'Error del servidor');
        renderFeed([...(data.items || []), ...lives].sort((a, b) => new Date(b.fecha) - new Date(a.fecha)));
      } catch (err) {
        console.error('Error cargando feed de actividad:', err);
        document.getElementById('fa-list').innerHTML =
          `<div class="fa-error">${Icon('error', { size: 30 })}<span>No se pudo cargar la actividad reciente. Intenta de nuevo más tarde.</span></div>`;
      }
    }


    // ════════════════════════════════════════════════════════════
    //  Historias de vendedores (duran 24 h, las borra historias-api)
    // ════════════════════════════════════════════════════════════
    const HISTORIAS_API = 'https://historias-api-1038143238323.us-central1.run.app';
    const VISTAS_KEY = 'znr_historias_vistas';

    let gruposHistorias = [];
    let viendo = false; // con el visor abierto no se reacomodan los grupos

    function leerSet(key) { try { return new Set(JSON.parse(localStorage.getItem(key)) || []); } catch { return new Set(); } }

    function avatarHtml(g, cls) {
      const inicial = esc((g.nombre || '?').trim().charAt(0).toUpperCase());
      return g.logo
        ? `${inicial}<img src="${esc(g.logo)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`
        : inicial;
    }

    // Fondo de la tarjeta: la historia más reciente del vendedor (foto, o primer
    // cuadro si es video). Si no carga, queda el degradado de la marca.
    function previewHistoria(g) {
      const h = g.historias[g.historias.length - 1];
      if (!h) return '<span class="fa-story-media"></span>';
      return h.tipo === 'video'
        ? `<span class="fa-story-media"><video src="${esc(h.url)}#t=0.1" muted playsinline preload="${window.znrAhorroDatos?.() ? 'none' : 'metadata'}" tabindex="-1" onerror="this.remove()"></video></span><span class="fa-story-play">${Icon('play', { size: 10 })}</span>`
        : `<span class="fa-story-media"><img src="${esc(h.url)}" alt="" loading="lazy" onerror="this.remove()"></span>`;
    }

    function agruparHistorias(lista) {
      const mapa = new Map();
      lista.forEach(h => {
        if (!mapa.has(h.vendedorUid)) mapa.set(h.vendedorUid, { uid: h.vendedorUid, nombre: h.vendedor, logo: h.logo, plus: h.plus, historias: [] });
        mapa.get(h.vendedorUid).historias.push(h);
      });
      // La lista llega de la más nueva a la más vieja: los grupos quedan por actividad reciente
      // y dentro de cada vendedor las historias se ven en orden cronológico.
      return [...mapa.values()].map(g => (g.historias.reverse(), g));
    }

    function renderHistorias() {
      const wrap = document.getElementById('fa-stories-wrap');
      const ses = sesionVendedor();
      if (!gruposHistorias.length && !ses) { wrap.innerHTML = ''; return; }
      const vistas = leerSet(VISTAS_KEY);
      const inicialPropia = esc(((ses && ses.nombre) || '?').trim().charAt(0).toUpperCase());
      const tarjetaCrear = !ses ? '' : `
              <button type="button" class="fa-story-crear" id="btn-crear-historia">
                <span class="fa-story-crear-top">${inicialPropia}${ses.logo ? `<img src="${esc(ses.logo)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}</span>
                <span class="fa-story-crear-plus">${Icon('plus', { size: 18 })}</span>
                <span class="fa-story-crear-txt">Subir historia</span>
              </button>`;
      wrap.innerHTML = `
        <div class="fa-stories-wrap">
          <p class="fa-stories-title">${Icon('camera', { size: 14 })} Historias · duran 24 horas</p>
          <div class="fa-stories-scroll">
            ${tarjetaCrear}
            ${gruposHistorias.map((g, idx) => `
              <button type="button" class="fa-story-item${g.historias.every(h => vistas.has(h.id)) ? ' visto' : ''}" data-grupo="${idx}">
                ${previewHistoria(g)}
                <span class="fa-story-ring"><span class="fa-story-avatar">${avatarHtml(g)}</span></span>
                <span class="fa-story-name">${esc(g.nombre || 'Vendedor')}</span>
              </button>`).join('')}
          </div>
        </div>`;
    }

    async function cargarHistorias() {
      if (viendo) return;
      try {
        const ciudad = typeof obtenerCiudadComprador === 'function' ? await obtenerCiudadComprador() : null;
        const r = await (await fetch(`${HISTORIAS_API}?${new URLSearchParams({ action: 'obtenerHistorias' })}`)).json();
        if (!r.ok) throw new Error(r.error || 'Error');
        const ses = sesionVendedor();
        const lista = (r.historias || []).filter(h => !ciudad || !h.ciudad || h.ciudad === ciudad || (ses && h.vendedorUid === ses.uid));
        gruposHistorias = agruparHistorias(lista);
      } catch (e) {
        console.warn('No se pudieron cargar las historias:', e);
        gruposHistorias = [];
      }
      renderHistorias();
    }

    // ── Visor (historias-visor.js): un grupo por vendedor; al terminar uno sigue con el próximo ──
    function abrirVisor(g, alFinal) {
      const grupo = gruposHistorias[g];
      if (!grupo || !window.znrHistoriasVisor) return false;
      viendo = true;
      window.znrHistoriasVisor.abrir(grupo.historias, {
        indice: alFinal ? grupo.historias.length - 1 : 0, nombre: grupo.nombre, logo: grupo.logo,
        perfilUrl: 'perfil-vendedor.html?vendedor=' + encodeURIComponent(grupo.uid),
        pie: grupo.plus && window.znrLiveNotif ? znrLiveNotif.boton('vendedor', grupo.uid, 'Avisarme cuando transmita') : '',
        alTerminar: (dir) => abrirVisor(g + dir, dir < 0),
        onCerrar: () => { viendo = false; cargarHistorias(); }
      });
      return true;
    }

    // ── Subir mi historia: el mismo modal y editor del panel de vendedor (historias-vendedor.js) ──
    function sesionVendedor() {
      try {
        const raw = localStorage.getItem('vendor_session') || sessionStorage.getItem('vendor_session');
        const s = raw ? JSON.parse(raw) : null;
        return s && s.uid && s.token ? s : null;
      } catch { return null; }
    }

    document.addEventListener('click', (e) => {
      if (e.target.closest('#btn-crear-historia')) window.vendorSession = window.vendorSession || sesionVendedor(); // antes de que historias-vendedor.js abra su modal
    });
    window.addEventListener('znr-historias-cambio', () => cargarHistorias());

    document.addEventListener('click', (e) => {
      const b = e.target.closest('.fa-story-item');
      if (b) abrirVisor(Number(b.dataset.grupo));
    });

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('fa-back-btn').innerHTML = Icon('arrow-left');
      document.getElementById('fa-back-btn').addEventListener('click', () => {
        if (document.referrer && document.referrer.includes(location.host)) history.back();
        else window.location.href = 'vendedor.html';
      });

      cargarHistorias();
      cargarFeed();
      cargarRankingDonadores();
      // Se siente "vivo": refresca sola cada minuto, sin que el usuario tenga que jalar/recargar.
      // Con la pestaña oculta no se consulta; al volver se actualiza al instante.
      const refrescar = () => { if (!document.hidden) { cargarFeed(); cargarHistorias(); } };
      setInterval(refrescar, 60000);
      document.addEventListener('visibilitychange', refrescar);
    });
  </script>
