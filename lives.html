<style>
  .lives-wrap { max-width: 640px; margin: 0 auto; padding: 16px; padding-bottom: 100px; }

  .lives-grid { display: flex; flex-direction: column; gap: 14px; }

  .live-card {
    display: block; text-decoration: none;
    background: var(--color-surface); border: 1px solid var(--color-border-subtle);
    border-radius: var(--radius-lg); overflow: hidden;
  }
  .live-card .thumb-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; }
  .live-card .thumb-wrap img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .live-card .thumb-placeholder {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1a1d24, #23262f);
  }
  .live-card .thumb-placeholder svg { opacity: .35; }

  .status-badge {
    position: absolute; top: 10px; left: 10px;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 11px; border-radius: var(--radius-pill);
    font-size: 11px; font-weight: 700; letter-spacing: .03em;
    background: rgba(239,68,68,.9); color: #fff;
  }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: pulse-dot 1.4s infinite; }
  @keyframes pulse-dot { 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .viewer-mini {
    position: absolute; top: 10px; right: 10px;
    background: rgba(0,0,0,.6); color: #fff;
    font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: var(--radius-pill);
  }

  .live-card .info { padding: 12px 14px; }
  .live-card .info h2 { margin: 0 0 4px; font-size: 15px; color: var(--color-text-primary); }
  .live-card .info .vendor { margin: 0; font-size: 13px; color: var(--color-text-soft); }
  .live-card .info .when { margin: 6px 0 0; font-size: 12px; font-weight: 700; color: var(--color-text-primary); }
  .status-badge.prog { background: rgba(79,70,229,.9); }
  .sec-title { margin: 6px 2px 0; font-size: 13px; font-weight: 800; color: var(--color-text-soft); }

  .empty-state { text-align: center; padding: 70px 20px; color: var(--color-text-soft); }
  .empty-state .icon { font-size: 46px; margin-bottom: 14px; }
  .empty-state h2 { color: var(--color-text-primary); margin: 0 0 8px; font-size: 17px; }
  .empty-state p { margin: 0; font-size: 13px; line-height: 1.5; }

  .loading-spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid var(--color-border-subtle); border-top-color: var(--color-accent-solid);
    animation: spin 0.8s linear infinite; margin: 60px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <a href="comunidad.html" class="logo-touch-area" style="text-decoration:none;">
      <span class="logo-mark"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" aria-hidden="true"><use href="#ic-arrow-left"/></svg></span>
    </a>
    <div class="header-text">
      <h1 class="app-title">En vivo ahora</h1>
      <p class="app-subtitle" id="header-subtitle">Vendedores transmitiendo</p>
    </div>
  </div>
</header>

<main class="lives-wrap" id="lives-wrap">
  <div class="loading-spinner"></div>
</main>
<script src="znr-devconsole.js" defer></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

const fbApp = initializeApp({
  apiKey: "AIzaSyAaOe_lxLdQtTFCtw2BDR8KZRSafEMkkes",
  authDomain: "znr-live.firebaseapp.com",
  databaseURL: "https://znr-live-default-rtdb.firebaseio.com",
  projectId: "znr-live",
  storageBucket: "znr-live.firebasestorage.app",
  messagingSenderId: "1038143238323",
  appId: "1:1038143238323:web:5171b9dd8823628086c0c6"
});
const db = getDatabase(fbApp);
// Las reglas de RTDB piden auth != null para leer presencia (igual que comprador-live.html).
const authReady = signInAnonymously(getAuth(fbApp)).catch(() => {});
const contar = (id) => authReady.then(() => get(ref(db, `presencia/${id}`))).then(s => Object.keys(s.val() || {}).length).catch(() => 0);

const API_BASE = "https://live-api-1038143238323.us-central1.run.app";
const wrap = document.getElementById('lives-wrap');
const subtitle = document.getElementById('header-subtitle');
const conteos = {};

const esc = (s) => { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; };
const cuando = (iso) => new Date(iso).toLocaleString('es-MX', { weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
const plural = (n, a, b) => `${n} ${n === 1 ? a : b}`;

const thumb = (l, extra) => `<div class="thumb-wrap"><div class="thumb-placeholder">${Icon('tv', { size: 36 })}</div>${l.miniatura_url ? `<img src="${esc(l.miniatura_url)}" alt="" loading="lazy" onerror="this.remove()">` : ''}${extra}</div>`;
const info = (l, extra = '') => `<div class="info"><h2>${esc(l.titulo)}</h2><p class="vendor">Por ${esc(l.vendedor_nombre)}</p>${extra}</div>`;

const cardVivo = (l) => `<a class="live-card" href="comprador-live.html?id=${esc(l.id)}">${thumb(l,
  `<span class="status-badge"><span class="status-dot"></span> EN VIVO</span><span class="viewer-mini" data-viewers="${esc(l.id)}">${Icon('eye', { size: 14 })} <span class="n">${conteos[l.id] || 0}</span></span>`)}${info(l)}</a>`;

const cardProg = (l) => `<div class="live-card">${thumb(l, `<span class="status-badge prog">${Icon('calendar', { size: 12 })} PROGRAMADO</span>`)}${info(l,
  `<p class="when">${cuando(l.fecha_programada)}</p>${znrLiveNotif.boton('live', l.id, 'Avisarme cuando comience')}`)}</div>`;

function renderEmpty() {
  subtitle.textContent = 'Vendedores transmitiendo';
  wrap.innerHTML = `
    <div class="empty-state">
      <div class="icon">${Icon('tv', { size: 40 })}</div>
      <h2>Nadie está transmitiendo ahora mismo</h2>
      <p>Cuando un vendedor Plan Plus inicie o programe una transmisión en vivo, va a aparecer aquí. Vuelve a checar en un rato.</p>
    </div>`;
}

async function cargar() {
  try {
    const params = new URLSearchParams({ action: 'obtenerLivesPublicos' });
    const r = JSON.parse(await (await fetch(`${API_BASE}?${params}`)).text());
    if (!r.ok) throw new Error(r.error);
    const miCiudad = await obtenerCiudadComprador();
    const activos = r.activos.filter(l => l.ciudad === miCiudad);
    const prog = r.programados.filter(l => l.ciudad === miCiudad);
    if (!activos.length && !prog.length) return renderEmpty();

    subtitle.textContent = [activos.length && plural(activos.length, 'en vivo', 'en vivo'), prog.length && plural(prog.length, 'programada', 'programadas')].filter(Boolean).join(' · ');
    wrap.innerHTML = `<div class="lives-grid">
      ${activos.length ? `<h3 class="sec-title">En vivo ahora</h3>${activos.map(cardVivo).join('')}` : ''}
      ${prog.length ? `<h3 class="sec-title">Próximas transmisiones</h3>${prog.map(cardProg).join('')}` : ''}
    </div>`;

    // Contadores aparte: la lista sale al instante y los números se rellenan cuando llegan.
    activos.forEach(async (l) => {
      conteos[l.id] = await contar(l.id);
      const n = wrap.querySelector(`[data-viewers="${CSS.escape(l.id)}"] .n`);
      if (n) n.textContent = conteos[l.id];
    });
  } catch (err) {
    renderEmpty();
  }
}

cargar();
setInterval(cargar, 20000);
</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js', { scope: '/' });</script>
</body>
